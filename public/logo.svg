<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#7CF5D0" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#7CF5D0" stop-opacity="0"/>
</radialGradient>
</defs>
<style>
.mark{fill:#E88FB5}
.markline{fill:none;stroke:#B4658C;stroke-width:1.2;stroke-linecap:round}
