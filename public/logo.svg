<svg xmlns="http://www.w3.org/2000/svg" width="380" height="260" viewBox="0 0 380 260" role="img"><title>Bioluma Labs</title><desc>A stylized axolotl head with glowing bioluminescent gill fronds, with the wordmark Bioluma Labs beneath it.</desc>
