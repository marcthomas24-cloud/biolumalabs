.eye{fill:#1B3A33}
.wordmain{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:26px;font-weight:500;fill:#EAFBF5}
.wordsub{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;letter-spacing:3px;fill:#7CF5D0}
</style>
<circle cx="190" cy="90" r="80" fill="url(#glow)"/>
