:root{
  --abyss:#03101a;
  --deep:#072433;
  --glow:#22c7de;
  --glow-dim:#0d5f72;
  --shrimp:#ffe4a8;
  --worm:#ff4d5e;
  --axo:#ffc3de;
  --gill:#ff4f8b;
  --ink:#bfeaf3;
  --ink-dim:#5f93a3;
}
*{box-sizing:border-box}
html,body{height:100%; overscroll-behavior:none}
@supports (height:100dvh){ html,body{height:100dvh} }
body{
  margin:0;
  background:
    radial-gradient(120% 80% at 50% -10%, #0d3a4d 0%, transparent 60%),
    radial-gradient(90% 60% at 50% 110%, #0a2a3a 0%, transparent 65%),
    var(--abyss);
  color:var(--ink);
  font-family:"Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.shell{
  width:100%; max-width:690px; height:100%;
  display:flex; flex-direction:column; gap:10px;
  align-items:center; justify-content:center;
}
header{text-align:center; line-height:1; flex:0 0 auto}
h1{
  font-family:"Lilita One", "Fredoka", sans-serif; font-weight:400;
  font-size:clamp(26px,7vw,40px);
  letter-spacing:.04em; margin:0 0 6px 1px;
  color:#ff8fcb;
  -webkit-text-stroke:1.5px #6a1745; paint-order:stroke fill;
  text-shadow:0 3px 0 #6a1745, 0 0 22px rgba(255,79,160,.55);
}
.sub{
  margin:0; font-size:12px; font-weight:300; letter-spacing:.06em;
  color:var(--ink-dim);
}
.hud{
  flex:0 0 auto; width:100%; display:flex; align-items:flex-end; justify-content:space-between;
  gap:10px; padding:0 4px;
}
.stat{display:flex; flex-direction:column; gap:2px}
.stat .k{font-size:11px; letter-spacing:.14em; color:var(--ink-dim); text-transform:uppercase}
.stat .v{font-family:"Fredoka", sans-serif; font-weight:700; font-size:19px; color:#ffffff; letter-spacing:.01em}
.stat.best .v{color:var(--glow)}
.lives{display:flex; gap:5px; align-items:center; min-height:18px}
.lives svg{filter:drop-shadow(0 0 6px rgba(255,79,139,.6))}

.stage{
  flex:1 1 0; min-height:0; width:100%;
  display:flex; align-items:center; justify-content:center;
}
/* the tank is sized in JS (fitTank) so it always keeps its 21:23 shape */
.tankwrap{position:relative; display:flex; max-height:100%; max-width:100%}
canvas{
  display:block; width:100%; height:100%; border-radius:14px;
  background:#03121c;
  box-shadow:
    0 0 0 1px rgba(34,199,222,.22),
    0 0 44px rgba(13,95,114,.35),
    inset 0 0 60px rgba(0,0,0,.6);
  touch-action:none;
}
.overlay{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:safe center; gap:8px; overflow-y:auto;
  background:rgba(3,16,26,.72); backdrop-filter:blur(2px);
  border-radius:14px; text-align:center; padding:20px;
  opacity:0; pointer-events:none; transition:opacity .18s ease;
}
.overlay.on{opacity:1; pointer-events:auto}
.overlay h2{
  font-family:"Lilita One", "Fredoka", sans-serif; font-weight:400; font-size:clamp(22px,6vw,30px);
  margin:0; letter-spacing:.04em; color:#ff8fcb;
  text-shadow:0 0 16px rgba(255,79,139,.5);
}
.overlay p{margin:0; font-size:13px; font-weight:300; color:var(--ink-dim); max-width:32ch; line-height:1.5}
.roster{list-style:none; margin:2px 0 4px; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; text-align:left}
.roster li{font-size:12px; line-height:1.25; color:var(--ink-dim)}
.roster b{display:block; font-family:"Fredoka",sans-serif; font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase}
.roster:empty{display:none}
.overlay .cta{
  margin-top:6px; font-family:"Fredoka",sans-serif; font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase;
  background:transparent; color:var(--glow); border:1px solid rgba(34,199,222,.5);
  padding:10px 18px; border-radius:999px; cursor:pointer;
}
.overlay .cta:hover{background:rgba(34,199,222,.12)}
.overlay .cta.primary{background:linear-gradient(#cf3d85,#ad286a); color:#ffffff; border-color:#ffb3da; text-shadow:0 1px 2px rgba(80,0,40,.6);
  box-shadow:0 3px 0 #7a1c4e, 0 0 18px rgba(255,79,160,.35)}
.overlay .cta.primary:hover{background:linear-gradient(#d84a8e,#b83073)}
.overlay .cta small{display:block; font-family:"Fredoka",sans-serif; font-size:11px; letter-spacing:.02em; color:var(--ink-dim); margin-top:3px; text-transform:none}
.actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:2px}
.actions .cta{margin-top:0}
.toast{min-height:1em; font-size:12px !important; color:var(--glow) !important}
.toast:empty{display:none}
#ov-extra:empty, #ov-after:empty{display:none}
.tabs{display:flex; gap:6px; justify-content:center; margin-bottom:6px}
.tabs button{font-family:"Fredoka",sans-serif; font-weight:600; font-size:12px; letter-spacing:.04em; padding:6px 10px; border-radius:999px;
  background:transparent; color:var(--ink-dim); border:1px solid rgba(34,199,222,.25); cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink); background:rgba(34,199,222,.16); border-color:rgba(34,199,222,.55)}
table.scores{border-collapse:collapse; font-size:13px; min-width:250px; color:var(--ink)}
table.scores td{padding:3px 8px; text-align:left; border-bottom:1px solid rgba(34,199,222,.1)}
table.scores td.n{color:var(--ink-dim); width:2ch; text-align:right}
table.scores td.s{font-family:"Fredoka",sans-serif; font-weight:700; font-size:14px; text-align:right}
table.scores td.t{color:var(--ink-dim); font-size:11px}
table.scores tr.me td{color:var(--axo); background:rgba(255,79,139,.1)}
.empty{font-size:12px; color:var(--ink-dim); margin:8px 0}
.namebox{display:flex; gap:8px; justify-content:center; align-items:center}
.namebox input{font:500 15px "Fredoka",sans-serif; color:var(--ink); background:rgba(3,16,26,.8); width:12ch;
  border:1px solid rgba(255,154,196,.55); border-radius:10px; padding:8px 10px; text-align:center}
.namebox input:focus{outline:2px solid var(--axo); outline-offset:2px}
.rule{font-size:12px; color:var(--shrimp); margin:0}
.chips{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:0 0 4px}
.chips button{font:600 12px "Fredoka",sans-serif; padding:5px 11px; border-radius:999px; cursor:pointer;
  background:transparent; color:var(--ink-dim); border:1px solid rgba(34,199,222,.25)}
.chips button[aria-checked="true"]{color:#3a2100; background:#ffd34d; border-color:#ffe68f}
table.statgrid{border-collapse:collapse; font-size:13px; min-width:270px; color:var(--ink)}
table.statgrid th, table.statgrid td{padding:4px 8px; border-bottom:1px solid rgba(34,199,222,.1)}
table.statgrid tbody th{text-align:left; font-weight:400; color:var(--ink-dim)}
table.statgrid thead th{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:#ff8fcb; text-align:right}
table.statgrid td{text-align:right; font-weight:700}
.axogrid{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; width:100%; max-width:470px}
.axocard{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 4px 8px; border-radius:14px; cursor:pointer;
  background:rgba(9,44,60,.55); border:1px solid rgba(34,199,222,.22); color:var(--ink); font-family:"Fredoka",sans-serif}
.axocard canvas{width:96px; max-width:100%; height:auto}
.axocard b{font-weight:700; font-size:13px; letter-spacing:.02em}
.axocard span{font-size:11.5px; line-height:1.25; color:var(--ink-dim)}
.axocard.sel{border-color:#ff8fcb; box-shadow:0 0 0 2px rgba(255,143,203,.5), 0 0 16px rgba(255,79,160,.35)}
.axocard.sel span{color:#ff8fcb}
.axocard.locked{cursor:default; opacity:.85}
.unlocked{font-size:13px; color:#ffd34d; margin:0}
.overlay h2:empty{display:none}
.tagline{display:none}
@media (min-height:900px){ .overlay.is-title .tagline{display:block; font-size:14px; color:var(--ink); margin:-2px 0 2px} }
.overlay.is-title .actions{gap:6px}
.overlay .cta.big{font-family:"Lilita One","Fredoka",sans-serif; font-weight:400; font-size:28px; letter-spacing:.08em;
  padding:10px 0 12px; flex:0 0 260px; margin:0 calc(50% - 130px)}
.overlay .cta.small{padding:7px 12px; font-size:12px}
.overlay .cta.small small{display:inline; margin:0 0 0 4px}
canvas.art{background:transparent; box-shadow:none; border-radius:0}
.hero{display:flex; justify-content:center; margin:-4px 0 -6px}
.hero canvas{width:240px; height:96px}
.steps{list-style:none; margin:4px 0 2px; padding:0; display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; width:100%; max-width:470px}
.steps li{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 6px; border-radius:14px; text-align:center;
  background:rgba(9,44,60,.6); border:1px solid rgba(34,199,222,.25)}
.steps b{font-family:"Lilita One","Fredoka",sans-serif; font-weight:400; font-size:15px; line-height:1.1; color:#ffffff; letter-spacing:.02em; text-transform:uppercase}
.steps canvas{width:120px; max-width:100%; height:auto}
.steps small{font-size:11.5px; line-height:1.25; color:var(--ink-dim)}
.chain{display:flex; align-items:center; justify-content:center; gap:3px; flex-wrap:nowrap; margin:2px 0; max-width:100%}
.chain span{display:flex; flex-direction:column; align-items:center; font-family:"Lilita One","Fredoka",sans-serif; font-size:16px; color:#fff;
  padding:3px 7px; border-radius:11px; background:rgba(3,16,26,.6); border:1px solid rgba(255,255,255,.12); min-width:0}
.chain em{font-style:normal; font-size:12px; background:linear-gradient(var(--a), var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent}
.chain i{font-style:normal; color:var(--ink-dim)}
.tip{font-size:12px !important; color:var(--ink) !important; max-width:44ch !important}
.overlay.is-howto{gap:5px; padding-top:10px; padding-bottom:10px}
.overlay.is-howto h2{font-size:24px}
@media (max-width:480px){
  .steps{gap:5px} .steps li{padding:6px 3px} .steps b{font-size:12.5px} .steps small{font-size:11px}
  .chain span{font-size:13px; padding:2px 5px} .chain em{font-size:9.5px} .chain i{font-size:11px}
  .overlay.is-howto h2{font-size:20px} .tip{font-size:11px !important}
  .overlay .cta.big{font-size:24px; padding:8px 0 10px; flex-basis:220px; margin:0 calc(50% - 110px)}
  .hero canvas{width:200px; height:80px}
}
.daily{width:100%; max-width:400px; margin-top:6px; padding:12px 14px; border-radius:16px; text-align:left;
  background:linear-gradient(160deg, rgba(255,143,203,.16), rgba(34,120,170,.18)); border:1px solid rgba(255,179,218,.45);
  box-shadow:0 0 24px rgba(255,79,160,.15)}
.dhead{display:flex; justify-content:space-between; align-items:baseline}
.dtag{font-family:"Lilita One","Fredoka",sans-serif; font-size:18px; letter-spacing:.04em; color:#ff8fcb; text-transform:uppercase}
.ddate{font-size:12px; color:var(--ink-dim)}
.drule{display:flex; gap:10px; align-items:center; margin:8px 0}
.drule b{display:block; font-family:"Lilita One","Fredoka",sans-serif; font-weight:400; font-size:19px; color:#ffd34d; letter-spacing:.02em}
.drule span{display:block; font-size:13px; line-height:1.35; color:var(--ink)}
.drule.small b{font-size:15px}
.drule.small span{font-size:12px}
.ricon{flex:0 0 auto; width:34px; height:34px; padding:6px; border-radius:10px; color:#ffd34d; background:rgba(255,211,77,.14)}
.dstats{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:6px 0 8px}
.dstats div{background:rgba(3,16,26,.45); border-radius:10px; padding:6px 8px}
.dstats dt{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim)}
.dstats dd{margin:2px 0 0; font-weight:700; font-size:16px; color:#ffffff}
.overlay .daily .cta.dplay{width:100%; margin-top:2px; background:linear-gradient(#ffe07a,#ffad33); color:#3a2100; border-color:#fff0b3;
  box-shadow:0 3px 0 #a8641a, 0 0 18px rgba(255,190,60,.3)}
.overlay .daily .cta.dplay:hover{background:linear-gradient(#ffe68f,#ffb84a)}
.dnote{font-size:11px !important; color:var(--ink-dim) !important; margin:6px 0 0 !important; max-width:none !important; text-align:center}
.dscore{font-family:"Lilita One","Fredoka",sans-serif; font-size:44px; line-height:1; color:#ffffff; margin-top:6px}
.dscore small{font-family:"Fredoka",sans-serif; font-size:13px; color:var(--ink-dim); margin-left:6px}
.dwhere{font-size:13px !important; color:var(--ink) !important; margin:2px 0 4px !important; max-width:none !important}
#ov-after{width:100%; display:flex; flex-direction:column; align-items:center}
@media (max-width:480px){ .daily{padding:10px} .dstats dd{font-size:14px} .drule b{font-size:17px} .dscore{font-size:38px} }
@media (max-width:480px), (max-height:560px){
  .overlay.is-title{gap:6px; padding-top:10px; padding-bottom:10px}
  .overlay.is-title #ov-body{display:none}
  .overlay.is-title .actions .cta:not(.primary){padding:7px 12px; font-size:12px}
  .overlay.is-title .actions .cta small{display:inline; margin:0 0 0 4px}
  .overlay.is-title .daily{margin-top:2px}
  .overlay.is-title .drule{margin:4px 0}
  .overlay.is-title .drule span{font-size:12px}
  .overlay.is-title .dstats{margin:4px 0 6px}
  .overlay.is-title .dstats div{padding:4px 6px}
}
@media (max-width:520px){ .axogrid{grid-template-columns:repeat(2, minmax(0, 1fr))} }
@media (max-width:480px){ .overlay{padding:12px; gap:6px} .overlay p{font-size:12px} table.scores{font-size:12px; min-width:0} .roster{gap:4px 10px} }
.overlay .cta:focus-visible, button:focus-visible{outline:2px solid var(--axo); outline-offset:3px}

.controls{flex:0 0 auto; width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px}
.pad{display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(2,44px); gap:5px}
.pad button{
  border:1px solid rgba(34,199,222,.28); background:rgba(9,44,60,.55);
  color:var(--glow); border-radius:11px; font-size:17px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; touch-action:none;
}
.pad button:active{background:rgba(34,199,222,.22)}
.pad .up{grid-column:2; grid-row:1}
.pad .left{grid-column:1; grid-row:2}
.pad .down{grid-column:2; grid-row:2}
.pad .right{grid-column:3; grid-row:2}
.side{display:flex; flex-direction:column; gap:6px; align-items:flex-end}
.side button{
  border:1px solid rgba(34,199,222,.28); background:rgba(9,44,60,.45);
  color:var(--ink); border-radius:999px; padding:8px 14px; cursor:pointer;
  font-family:"Fredoka",sans-serif; font-weight:600; font-size:12px; letter-spacing:.06em; text-transform:uppercase; min-width:96px;
}
.side button:active{background:rgba(34,199,222,.18)}
.keys{flex:0 0 auto; margin:0; font-size:11px; font-weight:300; color:var(--ink-dim); text-align:center; letter-spacing:.03em}
@media (max-height:720px){ .sub{display:none} h1{font-size:22px} }
@media (max-width:480px){ .sub{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
button{touch-action:manipulation}
.sr-only{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.stage{touch-action:none}
/* long menus keep their buttons in reach */
.overlay #ov-actions{position:sticky; bottom:-20px; z-index:2; padding:8px 0; margin:0 -8px;
  background:linear-gradient(rgba(3,16,26,0), rgba(3,16,26,.92) 30%)}
.overlay.is-title #ov-actions, .overlay.is-howto #ov-actions{position:static; background:none; padding:0; margin:0}
@media (pointer: coarse){
  .pad{grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,52px); gap:6px}
  .pad button{font-size:20px}
  .side button{min-height:44px; padding:10px 16px; font-size:12.5px}
  .side{gap:8px}
  .overlay .cta{min-height:42px}
  .tabs button, .chips button{min-height:36px}
}
@media (max-width:520px){
  .stat .k{font-size:11px; letter-spacing:.1em}
  .stat .v{font-size:20px}
  .lives svg{width:22px; height:17px}
}
/* small screens: menus may use the whole play area, not just the tank */
@media (max-width:520px), (max-height:600px){
  .stage{position:relative}
  .tankwrap{position:static}
  .overlay{border-radius:16px}
}
@media (max-height:520px){
  .overlay.is-title .hero{display:none}
  .overlay.is-title .dnote{display:none}
}
@media (max-height:640px){
  .hero canvas{width:150px; height:60px}
  .overlay.is-title .dnote{display:none}
  .overlay.is-title .cta.big{font-size:22px; padding:6px 0 8px}
}

function buildGraph(a){
  const limiter = a.createDynamicsCompressor();
  limiter.threshold.value = -12; limiter.knee.value = 10; limiter.ratio.value = 6;

  const ambLevel = a.createGain(); ambLevel.gain.value = 0.5;   // the habitat's sounds sit under everything else

function voice(o){
  const a = audio(); if(!a) return;
  const t = a.currentTime + 0.005 + (o.delay || 0);
  const dur = o.dur || 0.1;

  if(o.noise){
    src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  } else {
    src = a.createOscillator(); src.type = o.type || 'triangle';
    src.frequency.setValueAtTime(o.freq, t);
    if(o.to) src.frequency.exponentialRampToValueAtTime(o.to, t + (o.bend || dur));
    if(o.detune) src.detune.value = o.detune;
    if(o.vib){                                     // a little wobble

      l.frequency.value = o.vib; lg.gain.value = o.vibDepth || 8;
      l.connect(lg); lg.connect(src.frequency); l.start(t); l.stop(t + dur + 0.05);
    }

  if(o.filter){
    const f = a.createBiquadFilter(); f.type = o.filter; f.Q.value = o.q || 0.8;
    f.frequency.setValueAtTime(o.cutoff || 1200, t);
    if(o.cutTo) f.frequency.exponentialRampToValueAtTime(o.cutTo, t + dur);
    node.connect(f); node = f;
  }
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.vol || 0.05, t + (o.attack || 0.008));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  node.connect(g); g.connect(bus[o.bus || 'sfx']);
  if(o.noise) src.start(t, Math.random() * 0.5); else src.start(t);
  src.stop(t + dur + 0.05);
}

/* a little tune: notes are [freq, beats], 0 = rest.

function tune(notes, beat, type, vol, opts){
  let t = 0.02;
  for(const [f, b] of notes){
    const len = b * beat;
    if(f){
      voice({freq:f, dur:len * 0.95, type:type || 'triangle', vol:vol || 0.045, delay:t});
      if(opts && opts.layer) voice({freq:f * (opts.octave || 0.5), dur:len * 0.95, type:opts.layer, vol:opts.layerVol || 0.015, delay:t});
    }
    t += len;
  }
}

  const lift = Math.pow(2, Math.min(7, Math.floor((streak || 0) / 4)) / 12) * (1 + (Math.random() - .5) * 0.03);
  const f = (chompFlip ? 660 : 554) * lift;
  voice({freq:f*0.8, to:f*1.35, bend:0.05, dur:0.075, type:'sine', vol:0.075});
  voice({freq:f*2, dur:0.035, type:'triangle', vol:0.012, delay:0.012});
}

/* a catch: a gulp and a pop that climb with each fish in the chain;
   the fourth is a fanfare */

/* background pulse: a soft two-note throb that quickens as the tank empties,
   and a gentler warble while the fish are frightened that hurries as the
   bloodworm wears off */
let loopClock = 0, loopFlip = false;
function stepLoop(dt){
  if(!soundOn || !actx || state !== 'playing') return;
  loopClock -= dt;
  if(loopClock > 0) return;
  loopFlip = !loopFlip;
  if(frightTimer > 0){
    loopClock = frightTimer < 2 ? 0.08 : 0.13;
    voice({freq:loopFlip ? 392 : 330, dur:0.09, type:'triangle', vol:0.017, bus:'pulse'});
  } else {
    const left = pelletsLeft / Math.max(1, totalPellets);
    loopClock = 0.22 + left * 0.26;              // 0.48s gap when full, 0.22s near the end
    const f = (loopFlip ? 98 : 82) * (1 + (1 - left) * 0.5);
    voice({freq:f, dur:0.16, type:'triangle', vol:0.032, bus:'pulse', filter:'lowpass', cutoff:600});
  }
}

/* habitat ambience: one looping, filtered noise bed per habitat that
   breathes slowly, plus the occasional sound of the place. It only plays
   during a tank and fades on pauses and menus. */
const AMBIENCE = {
  canal:{filter:'lowpass',  cutoff:480,  q:0.7, vol:0.016, lfo:0.12, events:'bubbles', every:[1.5, 4]},
  pond: {filter:'bandpass', cutoff:2400, q:0.6, vol:0.006, lfo:0.2,  events:'plops',   every:[2, 5]},
  reef: {filter:'bandpass', cutoff:5200, q:0.9, vol:0.006, lfo:0.25, events:'chimes',  every:[3, 7]},
  cave: {filter:'lowpass',  cutoff:170,  q:3,   vol:0.026, lfo:0.07, events:'drips',   every:[2, 6]}
};
const AMB_EVENT = {
  bubbles(){ const n = 3 + ((Math.random()*3) | 0);
    for(let i = 0; i < n; i++){ const f = 300 + Math.random()*300; voice({freq:f, to:f*2.2, dur:0.06, type:'sine', vol:0.03, delay:i*(0.06 + Math.random()*0.08), bus:'amb'}); } },
  plops(){ voice({freq:240, to:110, dur:0.12, type:'sine', vol:0.05, bus:'amb'});
    voice({noise:true, dur:0.05, vol:0.012, filter:'bandpass', cutoff:1800, bus:'amb', delay:0.01}); },
  chimes(){ for(let i = 0; i < 2 + ((Math.random()*2) | 0); i++)
    voice({freq:PENTA[3 + ((Math.random()*5) | 0)], dur:0.9, type:'sine', vol:0.014, delay:i*0.18, attack:0.02, bus:'amb'}); },
  drips(){ const f = 1100 + Math.random()*500;
    [0, 0.28, 0.56].forEach((d, i) => voice({freq:f, to:f*0.55, dur:0.07, type:'sine', vol:0.04 / (1 + i*1.8), delay:d, bus:'amb'})); }
};
let amb = null, ambKey = '', ambWant = -1, ambNext = 2;
function stepAmbience(dt){
  if(!actx || !bus || !soundOn) return;
  const want = state === 'playing' || state === 'ready' || state === 'dying' || state === 'cleared' ? 1 : 0;
  if(!amb){
    const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = actx.createBiquadFilter(), g = actx.createGain();
    const lfo = actx.createOscillator(), lg = actx.createGain();
    g.gain.value = 0; lg.gain.value = 0;
    lfo.connect(lg); lg.connect(g.gain);
    src.connect(f); f.connect(g); g.connect(bus.amb);
    src.start(); lfo.start();
    amb = {src, f, g, lfo, lg};
  }
  if(ambKey !== hab.key){                          // retune for a new habitat
    const c = AMBIENCE[hab.key], now = actx.currentTime;
    amb.f.type = c.filter; amb.f.Q.value = c.q;
    amb.f.frequency.setTargetAtTime(c.cutoff, now, 0.4);
    amb.g.gain.setTargetAtTime(c.vol, now, 0.4);
    amb.lfo.frequency.value = c.lfo; amb.lg.gain.value = c.vol * 0.5;
    ambKey = hab.key;
  }
  if(want !== ambWant){ bus.amb.gain.setTargetAtTime(want, actx.currentTime, 0.4); ambWant = want; }
  if(!want) return;
  ambNext -= dt;
  if(ambNext <= 0){
    const c = AMBIENCE[hab.key];
    ambNext = c.every[0] + Math.random() * (c.every[1] - c.every[0]);
    AMB_EVENT[c.events]();
  }
}
function silenceAmbience(){
  if(actx && bus){ bus.amb.gain.cancelScheduledValues(actx.currentTime); bus.amb.gain.setValueAtTime(0, actx.currentTime); ambWant = 0; }
}

/* -------------------------- maze render ------------------------ */
const mazeLayer = document.createElement('canvas');
const mctx = mazeLayer.getContext('2d');

function roundRect(c, x, y, w, h, r){
  const rr = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+rr, y);
  c.arcTo(x+w, y, x+w, y+h, rr);
  c.arcTo(x+w, y+h, x, y+h, rr);
  c.arcTo(x, y+h, x, y, rr);
  c.arcTo(x, y, x+w, y, rr);
  c.closePath();
  c.fill();
}
function paintWalls(c, inset, radius, colour){
  c.fillStyle = colour;
  for(let y = 0; y < ROWS; y++){
    for(let x = 0; x < COLS; x++){
      if(MAZE[y][x] !== '#') continue;
      const px = x*TILE, py = y*TILE;
      roundRect(c, px+inset, py+inset, TILE-inset*2, TILE-inset*2, radius);
      // bridge centre-to-centre into neighbouring wall tiles so walls read as solid shapes
      if(x+1 < COLS && MAZE[y][x+1] === '#')
        c.fillRect(px+TILE/2, py+inset, TILE, TILE-inset*2);
      if(y+1 < ROWS && MAZE[y+1][x] === '#')
        c.fillRect(px+inset, py+TILE/2, TILE-inset*2, TILE);
      // fill the centre of 2x2 wall blocks
      if(x+1 < COLS && y+1 < ROWS && MAZE[y][x+1] === '#' && MAZE[y+1][x] === '#' && MAZE[y+1][x+1] === '#')
        c.fillRect(px+TILE/2, py+TILE/2, TILE, TILE);
    }
  }
}
let mazeBuiltFor = null;

/* --------------------------- habitat art ---------------------------
   Baked once per habitat:
     bgLayer   the water behind the maze
     mazeLayer the walls, their texture and decorations, all clipped to the
               walls so the swimming lanes stay clean
   A few small things animate each frame (drawAmbientBack / drawAmbientFront,
   anemones, and the glows that show through the Deep Cave's dark).
   Presentation only: nothing here is read by movement, AI or scoring. */
const bgLayer = document.createElement('canvas');
const bctx = bgLayer.getContext('2d');
let caveGlows = [], anemones = [];
function isWall(x, y){ return y >= 0 && y < ROWS && x >= 0 && x < COLS && MAZE[y][x] === '#'; }
function inDen(x, y){ return y >= 8 && y <= 12 && x >= 5 && x <= 15; }
function pick(r, list){ return list[(r() * list.length) | 0]; }

/* soft round glow sprites, one per colour, reused everywhere instead of
   making radial gradients every frame */
const glowSprites = new Map();
function glowSprite(colour){
  let s = glowSprites.get(colour);
  if(!s){
    s = document.createElement('canvas'); s.width = s.height = 64;
    const g = s.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, colour); r.addColorStop(0.35, colour.replace(/[\d.]+\)$/, '.35)')); r.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = r; g.fillRect(0, 0, 64, 64);
    glowSprites.set(colour, s);
  }
  return s;
}
function blob(c, x, y, r, colour){
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, colour); g.addColorStop(1, colour.replace(/[\d.]+\)$/, '0)'));
  c.fillStyle = g; c.fillRect(x - r, y - r, r*2, r*2);
}

const ART = {
  // water (lanes), the stones the walls are built from, the mortar between
  // them, the lit top edge, and what grows along the top of the walls
  canal:{top:'#23797a', bottom:'#0c3d44', stones:['#6c7c67', '#7e8e74', '#5d6c5d', '#8b9b81'], mortar:'#24312a',
         rim:'rgba(225,245,205,.5)', band:'moss', moss:'#4f8f35', mossLight:'#a3d65c'},
  pond: {top:'#3c6a2e', bottom:'#183316', stones:['#78825f', '#8b956a', '#67714f', '#9ca677'], mortar:'#2b3220',
         rim:'rgba(240,250,200,.5)', band:'moss', moss:'#5aa034', mossLight:'#b8e066'},
  reef: {top:'#1e70c6', bottom:'#0a2f6c', stones:['#4f6694', '#5d77a8', '#435883', '#6d87b9'], mortar:'#1c2846',
         rim:'rgba(200,225,255,.45)', band:'coral'},
  cave: {top:'#2a2070', bottom:'#0d0a2c', stones:['#3d3866', '#48427a', '#332f58', '#56508c'], mortar:'#141129',
         rim:'rgba(180,160,255,.4)', band:'crystal'}
};
const WALL_INSET = 5;                       // visual only: collisions use the grid
function layerCanvas(){
  const c = document.createElement('canvas');
  c.width = mazeLayer.width; c.height = mazeLayer.height;
  const g = c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  return {c, g};
}
/* the wall mask, optionally shifted, in a colour */
function wallShape(g, colour, dx, dy){
  g.save(); g.translate(dx || 0, dy || 0); paintWalls(g, WALL_INSET, 11, colour); g.restore();
}
/* a band: the walls shifted by a, minus the walls shifted by b */
function band(colour, a, b){
  const L = layerCanvas();
  wallShape(L.g, colour, a[0], a[1]);
  L.g.globalCompositeOperation = 'destination-out';
  wallShape(L.g, '#000', b[0], b[1]);
  L.g.globalCompositeOperation = 'source-over';
  return L;
}
function stone(c, x, y, rad, colour, mortar, r){
  c.fillStyle = colour;
  c.beginPath();
  const n = 6 + ((r()*3) | 0);
  for(let i = 0; i < n; i++){
    const a = i / n * Math.PI*2, rr = rad * (0.75 + r()*0.3);
    c.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr*0.85);
  }
  c.closePath(); c.fill();
  c.strokeStyle = mortar; c.lineWidth = 1.4; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.08)';                       // a little light on each stone
  c.beginPath(); c.ellipse(x - rad*0.2, y - rad*0.3, rad*0.45, rad*0.22, 0, 0, Math.PI*2); c.fill();
}

/* one seamless tile of cobbles per habitat, used as a pattern: a few dozen
   stones instead of thousands keeps building a tank quick on phones */
function cobblePattern(g, art, r){
  const P = 128, t = document.createElement('canvas');
  t.width = t.height = Math.round(P * dpr);
  const c = t.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle = art.mortar; c.fillRect(0, 0, P, P);
  for(let y = 0; y < P; y += 9){
    for(let x = (y / 9) % 2 ? 4 : 0; x < P; x += 10){
      const sx = x + (r() - .5)*3, sy = y + (r() - .5)*3, rad = 6 + r()*2.5, col = pick(r, art.stones);
      const seed = (r()*1e9) | 0;
      // draw near the edges again on the far side so the tile wraps seamlessly
      for(const ox of [-P, 0, P]) for(const oy of [-P, 0, P]){
        if(Math.abs(sx + ox - P/2) > P/2 + 10 || Math.abs(sy + oy - P/2) > P/2 + 10) continue;
        stone(c, sx + ox, sy + oy, rad, col, art.mortar, mulberry32(seed));
      }
    }
  }
  const pat = g.createPattern(t, 'repeat');
  if(pat && pat.setTransform && window.DOMMatrix) pat.setTransform(new DOMMatrix().scale(1 / dpr));
  return pat;
}
function buildMazeLayer(){
  mazeBuiltFor = hab;
  const art = ART[hab.key];
  const r = mulberry32(hashStr('art:' + hab.key));      // the same tank looks the same every visit
  // the reef keeps its water on a separate layer so the little schools of fish
  // can swim between the water and the walls; elsewhere one layer does both
  bgSeparate = hab.key === 'reef';
  mazeLayer.width = Math.round(W*dpr); mazeLayer.height = Math.round(H*dpr);
  bgLayer.width = bgSeparate ? mazeLayer.width : 1; bgLayer.height = bgSeparate ? mazeLayer.height : 1;
  bctx.setTransform(dpr,0,0,dpr,0,0);
  mctx.setTransform(dpr,0,0,dpr,0,0);
  mctx.clearRect(0,0,W,H);
  paintBackdrop(bgSeparate ? bctx : mctx, art, r);

  // the cave the fish hatch from: a deeper pool
  mctx.fillStyle = 'rgba(0,0,0,.28)';
  roundRect(mctx, 5.6*TILE, 8.6*TILE, 9.8*TILE, 3.8*TILE, 16);

  // 1. the walls: mortar, then cobbles, texture and small decorations, all inside the wall shape
  const S = layerCanvas();
  wallShape(S.g, art.mortar);
  S.g.globalCompositeOperation = 'source-atop';
  S.g.fillStyle = cobblePattern(S.g, art, r);
  S.g.fillRect(0, 0, W, H);
  paintTexture(S.g, r);
  caveGlows = []; anemones = [];
  paintDeco(S.g, r);
  // bevel: a lit top edge and a shaded bottom edge
  const lit = band(art.rim, [0, 0], [0, 3]);
  const shade = band('rgba(0,0,0,.45)', [0, 0], [0, -4]);
  S.g.drawImage(lit.c, 0, 0, W, H);
  S.g.drawImage(shade.c, 0, 0, W, H);

  // 2. a soft shadow cast onto the water, then the walls on top
  // (two offset copies of the wall shape: far cheaper than a blurred shadow)
  wallShape(mctx, 'rgba(0,0,0,.18)', 3, 8);
  wallShape(mctx, 'rgba(0,0,0,.28)', 2, 4);
  mctx.drawImage(S.c, 0, 0, W, H);
  // a thin dark outline keeps every wall edge crisp
  const edge = layerCanvas();
  for(const [dx, dy] of [[-1.2, 0], [1.2, 0], [0, -1.2], [0, 1.2]]) wallShape(edge.g, 'rgba(0,0,0,.55)', dx, dy);
  edge.g.globalCompositeOperation = 'destination-out'; wallShape(edge.g, '#000');
  mctx.drawImage(edge.c, 0, 0, W, H);

  // 3. what grows along the top of the walls, spilling a little over the edge
  const top = band('#fff', [0, -2], [0, 6]);
  top.g.globalCompositeOperation = 'source-in';
  if(art.band === 'moss'){
    top.g.fillStyle = art.moss; top.g.fillRect(0, 0, W, H);
    top.g.globalCompositeOperation = 'source-atop';
    top.g.fillStyle = art.mossLight;
    for(let i = 0; i < 900; i++){ top.g.beginPath(); top.g.arc(r()*W, r()*H, 0.8 + r()*1.4, 0, Math.PI*2); top.g.fill(); }
  } else if(art.band === 'coral'){
    top.g.fillStyle = 'rgba(255,140,190,.55)'; top.g.fillRect(0, 0, W, H);
    top.g.globalCompositeOperation = 'source-atop';
    for(let i = 0; i < 900; i++){
      top.g.fillStyle = pick(r, ['#ff8a5c', '#ff6fa8', '#ffd36b', '#c78bff', '#7ff0d0']);
      top.g.beginPath(); top.g.arc(r()*W, r()*H, 1 + r()*1.6, 0, Math.PI*2); top.g.fill();
    }
  } else {
    top.g.fillStyle = 'rgba(150,130,255,.35)'; top.g.fillRect(0, 0, W, H);
  }
  mctx.drawImage(top.c, 0, 0, W, H);

  // 4. bigger plants, flowers, coral and crystals perched on the wall edges
  paintOverhang(mctx, r);

  // cave mouth
  mctx.fillStyle = 'rgba(255,195,222,.8)';
  mctx.fillRect(DOOR.x*TILE + 4, DOOR.y*TILE + TILE/2 - 2, TILE - 8, 4);
}

/* ---------- things perched on wall edges, overhanging the water a little ---------- */
function lilyPad(c, x, y, rad, a, shade){
  c.fillStyle = shade;
  c.beginPath(); c.moveTo(x, y); c.arc(x, y, rad, a + 0.3, a + Math.PI*2 - 0.3); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(20,70,30,.6)'; c.lineWidth = 1; c.stroke();
  c.strokeStyle = 'rgba(20,80,40,.4)'; c.lineWidth = 0.8;
  c.beginPath();
  for(let k = 1; k < 6; k++){ const b = a + 0.3 + k*(Math.PI*2 - 0.6)/6; c.moveTo(x, y); c.lineTo(x + Math.cos(b)*rad*0.85, y + Math.sin(b)*rad*0.85); }
  c.stroke();
  c.strokeStyle = 'rgba(200,250,170,.45)'; c.lineWidth = 1.2;
  c.beginPath(); c.arc(x, y, rad - 1, a + 0.5, a + 2.3); c.stroke();
}
function lotus(c, x, y, s){
  for(const [n, len, w, col, off] of [[8, 7, 2.6, '#ff8fc6', 0], [6, 5, 2.2, '#ffc2e0', 0.4]]){
    c.fillStyle = col;
    for(let k = 0; k < n; k++){
      const a = off + k*Math.PI*2/n;
      c.beginPath(); c.ellipse(x + Math.cos(a)*len*s*0.55, y + Math.sin(a)*len*s*0.55, len*s*0.6, w*s, a, 0, Math.PI*2); c.fill();
    }
  }
  c.fillStyle = '#ffd84a'; c.beginPath(); c.arc(x, y, 1.8*s, 0, Math.PI*2); c.fill();
}
function crystal(c, x, y, a, len, w, lit, dark){
  const tx = x + Math.cos(a)*len, ty = y + Math.sin(a)*len;
  const px = Math.cos(a + Math.PI/2)*w, py = Math.sin(a + Math.PI/2)*w;
  const sx = x + Math.cos(a)*len*0.72, sy = y + Math.sin(a)*len*0.72;
  c.fillStyle = dark;
  c.beginPath(); c.moveTo(x, y); c.lineTo(x + px, y + py); c.lineTo(sx + px, sy + py); c.lineTo(tx, ty); c.lineTo(sx, sy); c.closePath(); c.fill();
  c.fillStyle = lit;
  c.beginPath(); c.moveTo(x, y); c.lineTo(x - px, y - py); c.lineTo(sx - px, sy - py); c.lineTo(tx, ty); c.lineTo(sx, sy); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 0.8;
  c.beginPath(); c.moveTo(x, y); c.lineTo(sx, sy); c.lineTo(tx, ty); c.stroke();
}
function paintOverhang(c, r){
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';
  for(let y = 0; y < ROWS; y++){
    for(let x = 0; x < COLS; x++){
      if(!isWall(x, y) || inDen(x, y)) continue;
      // which side faces open water?
      const sides = [[0, -1], [1, 0], [0, 1], [-1, 0]].filter(([dx, dy]) => {
        const nx = x + dx, ny = y + dy;
        return ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS && MAZE[ny][nx] !== '#';
      });
      if(!sides.length || r() > OVERHANG_DENSITY[hab.key]) continue;
      const [dx, dy] = pick(r, sides);
      const ex = centre(x) + dx*(TILE/2 - WALL_INSET - 1) + (dy ? (r() - .5)*12 : 0);
      const ey = centre(y) + dy*(TILE/2 - WALL_INSET - 1) + (dx ? (r() - .5)*12 : 0);

const OVERHANG_DENSITY = {canal:0.32, pond:0.4, reef:0.6, cave:0.4};
const OVERHANG = {
  canal(c, r, x, y){
    if(r() < 0.6){ lilyPad(c, x, y, 7 + r()*4, r()*6, pick(r, ['#3f9a4c', '#4fae55', '#378a44'])); if(r() < 0.5) lotus(c, x + (r() - .5)*4, y + (r() - .5)*4, 0.95); }
    else {                                                            // a clump of reeds
      for(let k = 0; k < 4; k++){
        const bx = x + (k - 1.5)*3, h = 12 + r()*8;
        c.strokeStyle = pick(r, ['#5fae5a', '#7cc35e', '#4f9a50']); c.lineWidth = 1.8;

      }
    }
  },
  pond(c, r, x, y){
    const roll = r();
    if(roll < 0.65){ lilyPad(c, x, y, 7 + r()*4, r()*6, pick(r, ['#4caf50', '#5cbf55', '#3e9a45'])); if(r() < 0.45) lotus(c, x, y, 0.9 + r()*0.3); }
    else {                                                            // a fallen leaf
      c.fillStyle = pick(r, ['#e08a2c', '#d36a24', '#c9a23a']);
      c.save(); c.translate(x, y); c.rotate(r()*6);
      c.beginPath(); c.moveTo(-6, 0); c.quadraticCurveTo(0, -4, 6, 0); c.quadraticCurveTo(0, 4, -6, 0); c.fill();
      c.strokeStyle = 'rgba(90,40,10,.6)'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(-6, 0); c.lineTo(6, 0); c.stroke();
      c.restore();
    }
  },
  reef(c, r, x, y, dx, dy){
    const col = pick(r, ['#ff8a5c', '#ff6fa8', '#c78bff', '#ffd36b', '#ff5a7a']);
    const roll = r();
    if(roll < 0.4){                                                   // branching coral
      c.strokeStyle = col; c.lineWidth = 2.4;
      const branch = (bx, by, a, len, d) => {
        const ex = bx + Math.cos(a)*len, ey = by + Math.sin(a)*len;
        c.beginPath(); c.moveTo(bx, by); c.lineTo(ex, ey); c.stroke();
        if(d > 0){ branch(ex, ey, a - 0.55, len*0.7, d - 1); branch(ex, ey, a + 0.55, len*0.7, d - 1); }
        else { c.fillStyle = col; c.beginPath(); c.arc(ex, ey, 1.6, 0, Math.PI*2); c.fill(); }
      };
      branch(x, y, -Math.PI/2 + (r() - .5)*0.8, 6, 2);

      c.fillStyle = pick(r, ['#ff9a3c', '#ff6a4a', '#ffcf4a']); c.beginPath();

      c.closePath(); c.fill();
      c.strokeStyle = 'rgba(120,40,10,.6)'; c.lineWidth = 0.8; c.stroke();
    } else {                                                          // a puff of soft coral
      for(let k = 0; k < 5; k++){ c.fillStyle = col; c.beginPath(); c.arc(x + (r() - .5)*9, y + (r() - .5)*7, 2.2 + r()*1.8, 0, Math.PI*2); c.fill(); }
    }
  },
  cave(c, r, x, y, dx, dy){

    }
  }
};

/* ------------------------- ambient life ------------------------- */
/* positions come from the clock, so there is nothing to step or store */
function drift(i, speed, span){ return ((i*197.3 + clock*speed) % span + span) % span; }
let raysGrad = null;
function drawAmbientBack(){
  if(hab.key === 'reef' && !reduceMotion){
    // two little schools of fish passing far in the background
    ctx.save();
    ctx.fillStyle = 'rgba(190,160,255,.13)';
    for(let s = 0; s < 2; s++){
      const dir = s ? -1 : 1, x0 = drift(s*3 + 1, 22 + s*6, W + 260) - 130;
      const bx = dir > 0 ? x0 : W - x0, by = (s ? 0.68 : 0.3) * H + Math.sin(clock*0.4 + s)*14;
      for(let k = 0; k < 6; k++){
        const fx = bx - dir*(k % 3)*12 - dir*(k > 2 ? 6 : 0), fy = by + (k > 2 ? 9 : 0) + Math.sin(clock*2 + k)*1.5;
        ctx.beginPath(); ctx.ellipse(fx, fy, 4, 1.8, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(fx - dir*3.5, fy); ctx.lineTo(fx - dir*6.5, fy - 2); ctx.lineTo(fx - dir*6.5, fy + 2); ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }
}
function drawAnemones(){
  if(!anemones.length) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineWidth = 1.6;
  const amp = reduceMotion ? 0.3 : 1;
  for(const a of anemones){
    ctx.strokeStyle = a.colour;
    ctx.beginPath();
    for(let k = 0; k < 7; k++){
      const base = -Math.PI/2 + (k - 3)*0.32;
      const sway = Math.sin(clock*1.6 + a.phase + k*0.5)*0.25*amp;
      const len = 7 + (k % 2)*2;
      ctx.moveTo(a.x + (k - 3)*1.2, a.y);
      ctx.quadraticCurveTo(a.x + Math.cos(base)*len*0.6, a.y + Math.sin(base)*len*0.6,
                           a.x + Math.cos(base + sway)*len, a.y + Math.sin(base + sway)*len);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function drawAmbientFront(){
  ctx.save();
  if(hab.key === 'canal'){
    // light rays slanting down from the surface
    if(!raysGrad){
      raysGrad = ctx.createLinearGradient(0, 0, 0, H*0.85);
      raysGrad.addColorStop(0, 'rgba(210,250,255,1)'); raysGrad.addColorStop(1, 'rgba(210,250,255,0)');
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = raysGrad;
    for(let i = 0; i < 4; i++){
      const x = W*(0.12 + i*0.26) + Math.sin(clock*0.25 + i*2)*14, w = 22 + (i % 2)*16;
      ctx.globalAlpha = 0.045 + Math.sin(clock*0.5 + i*1.3)*0.02;
      ctx.beginPath(); ctx.moveTo(x - w/2, 0); ctx.lineTo(x + w/2, 0); ctx.lineTo(x + w*1.6 + 90, H*0.85); ctx.lineTo(x + 90 - w*0.6, H*0.85); ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    // drifting leaves and twigs
    ctx.globalAlpha = 0.5;
    for(let i = 0; i < 6; i++){
      const x = drift(i, 7 + i % 3 * 3, W + 40) - 20, y = (0.1 + i*0.16)*H + Math.sin(clock*0.35 + i)*10;
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(clock*0.3 + i*1.7)*1.2);
      ctx.fillStyle = i % 2 ? 'rgba(170,180,90,1)' : 'rgba(120,150,80,1)';
      if(i % 3 === 2){ ctx.fillRect(-5, -0.6, 10, 1.2); }
      else { ctx.beginPath(); ctx.ellipse(0, 0, 4, 1.7, 0, 0, Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
  } else if(hab.key === 'pond'){
    // soft rippling reflections of the sky
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(220,255,230,.07)'; ctx.lineWidth = 2.5;
    for(let i = 0; i < 3; i++){
      const y0 = (0.22 + i*0.28)*H + Math.sin(clock*0.2 + i)*30;
      ctx.beginPath();
      for(let x = 0; x <= W; x += 24) ctx.lineTo(x, y0 + Math.sin(x*0.03 + clock*0.8 + i*2)*4);
      ctx.stroke();
    }
    // pollen and seeds floating about
    ctx.fillStyle = 'rgba(255,240,180,.55)';
    for(let i = 0; i < 14; i++){
      const x = drift(i, 5 + i % 4, W), y = drift(i*7 + 3, 2 + i % 3, H) + Math.sin(clock*0.7 + i)*6;
      ctx.beginPath(); ctx.arc(x, y, 0.9 + (i % 3)*0.3, 0, Math.PI*2); ctx.fill();
    }
  } else if(hab.key === 'reef'){
    // plankton drifting in the light
    const cols = ['rgba(255,200,230,.5)', 'rgba(190,240,255,.5)', 'rgba(255,240,170,.45)'];
    for(let i = 0; i < 18; i++){
      ctx.fillStyle = cols[i % 3];
      const x = drift(i, 4 + i % 5, W) + Math.sin(clock*0.5 + i)*5, y = drift(i*5 + 2, -(3 + i % 4), H);
      ctx.beginPath(); ctx.arc(x, y, 0.8 + (i % 2)*0.5, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}
/* Deep Cave: things that glow on their own, drawn after the darkness */
let caveFlash = 0;
function drawCaveGlows(dt){
  if(hab.key !== 'cave') return;
  caveFlash = Math.max(0, caveFlash - dt*1.1);
  const boost = frightTimer > 0 ? 1.7 : 1;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const g of caveGlows){
    ctx.globalAlpha = Math.min(1, (0.42 + Math.sin(clock*1.3 + g.phase)*0.14) * boost + caveFlash*0.6);
    const s = g.size * (1 + caveFlash*0.6);
    ctx.drawImage(glowSprite(g.colour), g.x - s/2, g.y - s/2, s, s);
  }
  // tiny creatures drifting through the dark
  for(let i = 0; i < 14; i++){
    const x = drift(i, 3 + i % 4, W) + Math.sin(clock*0.6 + i*1.9)*10;
    const y = drift(i*3 + 1, -(2 + i % 3), H) + Math.cos(clock*0.5 + i)*8;
    ctx.globalAlpha = 0.35 + Math.max(0, Math.sin(clock*(0.8 + i % 3*0.4) + i))*0.55;
    const s = 6 + (i % 3)*3;
    ctx.drawImage(glowSprite(i % 2 ? 'rgba(120,240,255,.95)' : 'rgba(190,160,255,.95)'), x - s/2, y - s/2, s, s);
  }
  ctx.restore();
}

/* ------------------------- juice: particles & shake ------------------------- */
const MAX_PARTICLES = 300;
function burst(x, y, n, colour, speed, life, shape){
  if(reduceMotion) n = Math.ceil(n / 3);
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = speed * (0.35 + Math.random() * 0.65);
    particles.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:life*(0.6+Math.random()*0.4), life, colour,
                    r: 1.2 + Math.random()*2.2, star: shape === 'star'});
  }
  if(particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
}
function stepParticles(dt){
  if(particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);   // trails and glitter add directly
  for(let i = particles.length - 1; i >= 0; i--){
    const q = particles[i];
    q.t -= dt;
    if(q.t <= 0){ particles[i] = particles[particles.length - 1]; particles.pop(); continue; }   // order doesn't matter
    q.x += q.vx*dt; q.y += q.vy*dt;
    q.vx *= 1 - 3*dt; q.vy = q.vy*(1 - 3*dt) - 18*dt;   // water drag, bubbles drift up
  }
}
function drawParticles(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const q of particles){
    ctx.globalAlpha = Math.max(0, q.t / q.life);
    if(q.ring){
      ctx.strokeStyle = q.colour; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI*2); ctx.stroke();
    } else if(q.star){                                   // a four-point twinkle
      const r = q.r * 2;
      ctx.fillStyle = q.colour;
      ctx.beginPath(); ctx.moveTo(q.x, q.y - r); ctx.lineTo(q.x + r*0.3, q.y); ctx.lineTo(q.x, q.y + r); ctx.lineTo(q.x - r*0.3, q.y); ctx.closePath();
      ctx.moveTo(q.x - r, q.y); ctx.lineTo(q.x, q.y + r*0.3); ctx.lineTo(q.x + r, q.y); ctx.lineTo(q.x, q.y - r*0.3); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = q.colour;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}
function addShake(n){ if(!reduceMotion) shake = Math.max(shake, n); }

/* --------------------------- bubbles --------------------------- */
const bubbles = [];
for(let i = 0; i < (reduceMotion ? 10 : 26); i++){
  bubbles.push({
    x: Math.random()*W, y: Math.random()*H,
    r: 0.8 + Math.random()*2.4,
    v: 6 + Math.random()*20,
    w: Math.random()*Math.PI*2
  });
}
function stepBubbles(dt){
  for(const b of bubbles){
    b.y -= b.v*dt; b.w += dt*1.6;
    if(b.y < -6){ b.y = H + 6; b.x = Math.random()*W; }
  }
}
function drawBubbles(){
  ctx.fillStyle = 'rgba(150,225,245,.10)';
  for(const b of bubbles){
    ctx.beginPath();
    ctx.arc(b.x + Math.sin(b.w)*4, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
  }
}

/* -------------------------- level setup ------------------------ */
function resetGrid(){
  const h = habitatFor(level);
  if(h !== hab || mazeBuiltFor !== h){ hab = h; MAZE = hab.maze; buildMazeLayer(); }
  _bfsCache.clear();                        // cached routes home belong to the old maze
  grid = MAZE.map(row => row.split(''));
  pelletsLeft = 0;
  for(let y = 0; y < ROWS; y++)
    for(let x = 0; x < COLS; x++)
      if(grid[y][x] === '.' || grid[y][x] === 'o') pelletsLeft++;
  pelletsEaten = 0; totalPellets = pelletsLeft;
}
function placeActors(){
  player.tx = PLAYER_START.x; player.ty = PLAYER_START.y;
  player.off = 0; player.dir = 'left'; player.next = 'left';
  player.moving = false; player.mouth = 0;

  fish.length = 0;
  FISH_SPEC.forEach((spec, i) => {
    fish.push({
      idx: i, name: spec.name, colour: spec.colour, scatter: spec.scatter,
      tx: spec.start.x, ty: spec.start.y, off: 0,
      dir: i === 0 ? 'left' : 'up',
      state: spec.inDen ? 'den' : 'hunt',
      denTimer: spec.release / speedScale(),
      bob: Math.random()*Math.PI*2, wag: Math.random()*Math.PI*2,
      hs: i % 2 ? 1 : -1, lastH: i % 2 ? 1 : -1, pitch: 0
    });
    snapVisual(fish[i]);
  });
  snapVisual(player); player.happy = player.pop = player.danger = 0;
  fx.length = 0;
  modeIndex = 0; modeTimer = MODE_PLAN[0].t; frightTimer = 0; frightCombo = 0; wormPrey = [];
  bonus = null; bonusShown = 0;
}
const SPEEDS = [
  {key:'easy',   name:'Easy',   label:'Speed: easy',   mul:0.50},
  {key:'calm',   name:'Calm',   label:'Speed: calm',   mul:0.72},
  {key:'normal', name:'Normal', label:'Speed: normal', mul:0.92},
  {key:'quick',  name:'Quick',  label:'Speed: quick',  mul:1.15}
];
/* a classic run is filed under the slowest speed it used, so switching to
   Easy for the hard part can't bank a Normal score */
let runSpeed = 2;
let speedChoice = 2;   // normal by default; players can slow it down
try{
  const s = parseInt(localStorage.getItem('axolotl-chase:speed'), 10);
  if(s >= 0 && s < SPEEDS.length) speedChoice = s;
}catch(e){}
function speedScale(){ return Math.min(1 + (level-1)*0.04, 1.24); }
function speedMul(){ return mode === 'daily' ? SPEEDS[2].mul : SPEEDS[speedChoice].mul; }   // daily runs are always Normal, so scores are comparable
function playerSpeed(){ return TILE * 5.6 * speedScale() * speedMul(); }
function fishSpeed(f){
  const base = playerSpeed();
  if(f.state === 'eaten') return base * 2.3;
  if(f.state === 'leaving' || f.state === 'den') return base * 0.7;
  if(frightTimer > 0) return base * 0.60;
  return base * Math.min(0.84 + (level-1)*0.015, 0.95) * (rule('turbo') ? 1.1 : 1);
}
/* Coral Reef currents: faster swimming with the flow, slower against it */
function currentMul(e){
  const cur = tankCurrents();
  if(!cur || e.state === 'eaten') return 1;
  for(const c of cur){
    if(c.row !== e.ty) continue;
    if(e.dir === c.dir) return e === player ? 1.55 : 1.25;   // you win races in the currents; fish ride them less well
    if(e.dir === OPPOSITE[c.dir]) return 0.7;
  }
  return 1;
}
function drawCurrents(){
  const cur = tankCurrents();
  if(!cur) return;
  ctx.save();
  ctx.lineCap = 'round';
  for(const c of cur){
    const s = c.dir === 'right' ? 1 : -1;
    const y = centre(c.row), row = MAZE[c.row];
    // a faint lane shows where the water is flowing
    ctx.fillStyle = 'rgba(150,225,255,.04)';
    for(let x = 0; x < COLS; x++) if(row[x] !== '#') ctx.fillRect(x*TILE, y - TILE*0.4, TILE, TILE*0.8);
    // streaks racing along with the flow
    ctx.strokeStyle = 'rgba(200,245,255,.3)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for(let i = 0; i < 10; i++){
      const len = 12 + (i*7) % 18;
      const x = drift(i, 95 + (i % 3)*25, W + 60) - 30;
      const xx = s > 0 ? x : W - x, yy = y + ((i*5) % 3 - 1)*8;
      const col = Math.floor(xx / TILE);
      if(col < 0 || col >= COLS || row[col] === '#') continue;
      ctx.moveTo(xx, yy); ctx.lineTo(xx - s*len, yy);
    }
    ctx.stroke();
    // chevrons pointing the way
    ctx.strokeStyle = 'rgba(170,235,255,.38)'; ctx.lineWidth = 2;
    const shift = ((clock * 48) % TILE) * s;
    ctx.beginPath();
    for(let x = 1; x < COLS - 1; x++){
      if(row[x] === '#') continue;
      const cx = x*TILE + TILE/2 + shift - s*TILE*0.25;
      ctx.moveTo(cx - s*4, y - 6); ctx.lineTo(cx + s*2, y - 1);
      ctx.moveTo(cx - s*4, y + 6); ctx.lineTo(cx + s*2, y + 1);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function frightDuration(){ return Math.max(2.5, 8 - (level-1)*0.5) * (rule('quickworm') ? 0.6 : 1); }

/* ------------------------- skill bonuses -------------------------
   Small extras for skilled play. They scale gently with the tank so the
   main score (shrimp, survival, fish combos) always matters most. */
const BONUS = {
  perfect:  {name:'PERFECT TANK',   per:200, about:'Clear a tank without losing a life'},
  clean:    {name:'CLEAN SWIM',     per:300, about:'Perfect tank without eating a single fish'},
  prawns:   {name:'SHRIMP MASTER',  per:150, about:'Catch both bonus prawns in a tank'},
  predator: {name:'PREDATOR FEAST', flat:300, about:'Eat every fish that was out when you took the bloodworm'},
  mega:     {name:'MEGA FEAST',     flat:1000, about:'Eat all four fish on one bloodworm'}
};
function bonusValue(k){ return BONUS[k].flat || BONUS[k].per * level; }
let tankDeaths = 0, tankFishEaten = 0, tankPrawns = 0;
let runBestCombo = 0, runPerfects = 0;        // for the share card
let wormPrey = [];                        // fish that were out when the bloodworm was eaten
let clearBonuses = [];                    // [{name, value}] shown on the tank-cleared card

function addScore(n){
  score += n;
  if(score >= nextLifeAt){
    nextLifeAt += lifeStep;
    if(lives < 5){ lives++; drawLives(); }
    sfxExtraLife();
    const p = posOf(player);
    popups.push({x:p.x, y:p.y - 18, text:'EXTRA AXOLOTL!', t:1.8, big:true, colour:'#ff9ac4'});
  }
  updateHud();
}
function startGame(m){
  mode = m || mode;
  daily = dailyFor(todayKey());                 // pick up a new day if the page was left open
  rng = mode === 'daily' ? mulberry32(daily.seed) : Math.random;
  const last = rule('lastaxo');
  score = 0; level = 1; lives = last ? 1 : 3;
  runSpeed = mode === 'daily' ? 2 : speedChoice;
  lifeStep = last ? 5000 : 10000; nextLifeAt = 5000;      // the first extra life comes early, then every lifeStep
  resetGrid(); placeActors(); particles.length = 0; popups.length = 0;
  tankDeaths = tankFishEaten = tankPrawns = 0;
  runUnlocks = []; runBestCombo = 0; runPerfects = 0;
  setState('ready', 3.2);
  announce('Tank 1: ' + hab.name + '. ' + hab.hint + (mode === 'daily' ? ' Daily rule: ' + daily.rule.name + '. ' + daily.rule.desc : ''));
  refreshSpeedBtn();
  drawLives();
  updateHud();
  sfxStart();
}
function nextLevel(){
  irisOpen = 0.5;
  setTimeout(() => announce('Tank ' + level + ': ' + hab.name + '. ' + hab.hint), 0);
  level++;
  if(level > stats.bestTank){ stats.bestTank = level; saveStats(); checkUnlocks(true); } resetGrid(); placeActors(); particles.length = 0;
  tankDeaths = tankFishEaten = tankPrawns = 0;
  setState('ready', 3.0);
  updateHud();
  sfxNextTank();
}
function loseLife(){
  lives--; drawLives(); tankDeaths++;
  if(lives > 0) announce('Caught! ' + lives + (lives === 1 ? ' axolotl' : ' axolotls') + ' left.');
  if(lives <= 0){
    endGame();
  } else {
    placeActors();
    setState('ready', 1.6);
  }
}
function setState(s, t){
  state = s; stateTimer = t || 0; stateTotal = t || 0;
  if(pauseBtn) pauseBtn.textContent = s === 'paused' ? 'Resume' : s === 'title' || s === 'over' ? 'Play' : 'Pause';
  if(s === 'playing' || s === 'ready') hideOverlay();
}

/* today's daily, as stored: today's best, the streak (if still alive) and the all-time best */
function dailyInfo(){
  const d = store.get('daily', {});
  const today = d.date === daily.key ? (d.best || 0) : 0;
  const alive = d.last === daily.key || d.last === yesterdayKey();
  return {today, played: d.date === daily.key && d.last === daily.key, streak: alive ? (d.streak || 0) : 0,
          allBest: Math.max(d.allBest || 0, d.best || 0), longest: d.longest || d.streak || 0};
}
function dailySub(){
  const i = dailyInfo();
  return daily.rule.name + (i.played ? ' · today: ' + i.today.toLocaleString('en-GB') : '') +
         (i.streak > 1 ? ' · ' + i.streak + '-day streak' : '');
}
function untilTomorrow(){
  const now = new Date(), next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
  const m = Math.max(1, Math.round((next - now) / 60000));
  return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm';
}
function dailyCard(withButton){

    '<dl class="dstats">' +

      '<div><dt>Streak</dt><dd>' + (i.streak ? i.streak + (i.streak === 1 ? ' day' : ' days') : '–') + '</dd></div>' +
      '<div><dt>Best</dt><dd>' + n(i.allBest) + '</dd></div>' +

    (withButton ? '<button class="cta primary dplay" id="dailyPlay"' + (withButton === 'default' ? ' data-default' : '') + '>' +

/* ----------------------- menu illustrations -----------------------
   Small live canvases drawn with the game's own art, animated only while
   their menu is on screen. */
let menuArt = [], menuArtRunning = false;
function artCanvas(w, h, draw){
  const c = document.createElement('canvas'), d = Math.min(window.devicePixelRatio || 1, 2);
  c.width = w*d; c.height = h*d; c.className = 'art';
  const g = c.getContext('2d');
  if(!g || !g.setTransform) return c;
  menuArt.push({c, g, w, h, d, draw});
  if(!menuArtRunning && typeof requestAnimationFrame === 'function'){ menuArtRunning = true; requestAnimationFrame(tickMenuArt); }
  return c;
}
function tickMenuArt(){
  menuArt = menuArt.filter(a => a.c.isConnected);
  if(!menuArt.length || !overlay.classList.contains('on')){ menuArtRunning = false; menuArt = []; return; }
  for(const a of menuArt){
    a.g.setTransform(a.d, 0, 0, a.d, 0, 0);
    a.g.clearRect(0, 0, a.w, a.h);
    withCtx(a.g, () => a.draw(a.g, a.w, a.h));
  }
  requestAnimationFrame(tickMenuArt);
}

const MAX_SCORES = 10;
function scoreList(m, sp){
  if(m === 'daily'){
    const d = store.get('daily', {});
    return d.date === daily.key ? (d.list || []) : [];
  }
  return store.get('scores:' + (sp || 'normal'), []);
}
function saveScoreList(m, list, sp){
  if(m === 'daily'){ const d = store.get('daily', {}); d.date = daily.key; d.list = list; store.set('daily', d); }
  else store.set('scores:' + (sp || 'normal'), list);
}
function rankFor(list, s){
  if(s <= 0) return -1;
  let i = list.findIndex(e => s > e.s);
  if(i < 0) i = list.length;
  return i < MAX_SCORES ? i : -1;
}
function scoresTable(list, highlight){
  if(!list.length) return '<p class="empty">No scores yet. Be the first!</p>';
  return '<table class="scores">' + list.map((e, i) =>
    '<tr' + (i === highlight ? ' class="me"' : '') + '><td class="n">' + (i + 1) + '</td><td>' + esc(e.n || 'Axolotl') +
    '</td><td class="s">' + e.s.toLocaleString('en-GB') + '</td><td class="t">tank ' + e.t + '</td></tr>').join('') + '</table>';
}

/* --------------------------- movement -------------------------- */
function advance(e, dist, isPlayer){
  let guard = 0;
  while(dist > 1e-6 && guard++ < 64){
    if(e.off === 0){
      if(isPlayer) decidePlayer(e); else decideFish(e);
      const d = DIRS[e.dir];
      const nx = wrapX(e.tx + d.x), ny = e.ty + d.y;
      const ok = isPlayer ? openForPlayer(nx, ny)
                          : openForFish(nx, ny, e.state === 'leaving' || e.state === 'eaten');
      if(!ok){ if(isPlayer) e.moving = false; return; }
      if(isPlayer) e.moving = true;
    }
    const need = TILE - e.off;
    const step = Math.min(dist, need);
    e.off += step; dist -= step;
    if(e.off >= TILE - 1e-9){
      const d = DIRS[e.dir];
      e.tx = wrapX(e.tx + d.x); e.ty += d.y; e.off = 0;
      if(isPlayer) eatHere(e); else arriveFish(e);
    }
  }
}
function reverseEntity(e){
  if(e.off > 0){                       // flip about the tile it was already entering
    const d = DIRS[e.dir];
    e.tx = wrapX(e.tx + d.x); e.ty += d.y;
    e.off = TILE - e.off;
  }
  e.dir = OPPOSITE[e.dir];
}
function decidePlayer(p){
  if(p.next === p.dir) return;
  const d = DIRS[p.next];
  if(openForPlayer(wrapX(p.tx + d.x), p.ty + d.y)) p.dir = p.next;
}
function requestDir(dir){
  if(!DIRS[dir]) return;
  player.next = dir;
  if(state === 'playing' && player.off > 0 && dir === OPPOSITE[player.dir]){
    reverseEntity(player); player.next = dir;
  }
  if(state === 'ready' && stateTimer > 0.35) stateTimer = 0.35;
}
