/* ----------------------------- fish AI ------------------------- */
function currentMode(){ return frightTimer > 0 ? 'fright' : MODE_PLAN[modeIndex].mode; }

function targetFor(f){
  if(f.state === 'eaten') return DEN;
  if(f.state === 'leaving') return GATE;
  if(currentMode() === 'scatter') return f.scatter;
  const pd = DIRS[player.dir];
  switch(f.idx){
    case 0: return {x: player.tx, y: player.ty};
    case 1: return {x: player.tx + pd.x*4, y: player.ty + pd.y*4};
    case 2: {
      const px = player.tx + pd.x*2, py = player.ty + pd.y*2;
      const pike = fish[0];
      return {x: px + (px - pike.tx), y: py + (py - pike.ty)};
    }
    default: {
      const far = dist2(f.tx, f.ty, player.tx, player.ty) > 64;
      return far ? {x: player.tx, y: player.ty} : f.scatter;
    }
  }
}
/* BFS path: returns the first direction an eaten fish should take to reach the den */
const _bfsCache = new Map();
function bfsNextDir(sx, sy, tx, ty){
  const key = sx + ',' + sy;
  if(_bfsCache.has(key)) return _bfsCache.get(key);
  const start = sx + ',' + sy;
  const prev = new Map([[start, null]]);
  const q = [[sx, sy]];
  while(q.length){
    const [x, y] = q.shift();
    if(x === tx && y === ty){
      let cur = x + ',' + y, step = cur;
      while(prev.get(cur) && prev.get(cur) !== start){ step = prev.get(cur); cur = step; }
      const [nx, ny] = step.split(',').map(Number);
      for(const dir of ORDER){
        const d = DIRS[dir];
        if(wrapX(sx + d.x) === nx && sy + d.y === ny){
          _bfsCache.set(key, dir);
          return dir;
        }
      }
      return null;
    }
    for(const dir of ORDER){
      const d = DIRS[dir];
      const nx = wrapX(x + d.x), ny = y + d.y;
      if(!openForFish(nx, ny, true)) continue;
      const nk = nx + ',' + ny;
      if(prev.has(nk)) continue;
      prev.set(nk, x + ',' + y);
      q.push([nx, ny]);
    }
  }
  return null;
}

function decideFish(f){
  if(f.state === 'den') return;
  /* Eaten fish use BFS to navigate reliably back to the den */
  if(f.state === 'eaten'){
    const bd = bfsNextDir(f.tx, f.ty, DEN.x, DEN.y);
    if(bd) f.dir = bd;
    return;
  }
  const allowDoor = (f.state === 'leaving');
  const back = OPPOSITE[f.dir];
  const options = [];
  for(const dir of ORDER){
    if(dir === back && !allowDoor) continue;
    const d = DIRS[dir];
    const nx = wrapX(f.tx + d.x), ny = f.ty + d.y;
    if(!openForFish(nx, ny, allowDoor)) continue;
    if(!allowDoor && f.state === 'hunt' && cellAt(nx, ny) === '-') continue;
    options.push({dir, nx, ny});
  }
  if(!options.length){ f.dir = back; return; }
  if(frightTimer > 0 && f.state === 'hunt'){
    f.dir = options[(rng()*options.length)|0].dir;
    return;
  }
  const t = targetFor(f);
  let bestOpt = options[0], bestD = Infinity;
  for(const o of options){
    const d = dist2(o.nx, o.ny, t.x, t.y);
    if(d < bestD){ bestD = d; bestOpt = o; }
  }
  f.dir = bestOpt.dir;
}
function arriveFish(f){
  if(f.state === 'leaving' && f.tx === GATE.x && f.ty === GATE.y){
    f.state = 'hunt'; f.dir = rng() < 0.5 ? 'left' : 'right';
  } else if(f.state === 'eaten' && f.tx === DEN.x && f.ty === DEN.y){
    f.state = 'den'; f.denTimer = 1.6;
  }
}

/* ---------------------------- collisions ----------------------- */
function checkCatch(){
  const p = posOf(player);
  for(const f of fish){
    if(f.state === 'eaten' || f.state === 'den') continue;
    const q = posOf(f);
    if(dist2(p.x, p.y, q.x, q.y) < (TILE*0.62)*(TILE*0.62)){
      if(frightTimer > 0 && f.state === 'hunt'){
        frightCombo = Math.min(frightCombo + 1, 4);
        stats.modes[mode].bestCombo = Math.max(stats.modes[mode].bestCombo, frightCombo);
        runBestCombo = Math.max(runBestCombo, frightCombo);
        const gain = 200 * Math.pow(2, frightCombo - 1);
        addScore(gain); sfxEat(frightCombo);
        const combos = ['', 'CHOMP!', 'DOUBLE!', 'TRIPLE!', 'FEAST!'];
        const comboCol = ['', '#ffd34d', '#7fd0ff', '#d58bff', '#ffd34d'][frightCombo];
        const comboGrad = [null, ['#fff27a', '#ff9a1f'], ['#d2fbff', '#2f8cff'], ['#ffc6f2', '#b03cff'], ['#fff58a', '#ff6a00']][frightCombo];
        for(const o of popups) if(o.kind === 'combo' || o.kind === 'banner') o.t = Math.min(o.t, 0.12);   // the new word replaces the last
        popups.push({x:q.x, y:q.y + 8*textScale, text:'+' + gain, t:1.2, life:1.2, kind:'score', colour:f.colour});
        if(frightCombo < 4){
          popups.push({x:q.x, y:q.y - 22*textScale, text:combos[frightCombo], t:1.0, life:1.0, kind:'combo', size:22 + frightCombo*4, colour:comboCol, grad:comboGrad});
          catchFlash = 0.12; catchFlashCol = '#ffffff';
        } else {
          // the fourth catch is the big moment: banner, gold flash, confetti
          popups.push({x:W/2, y:H*0.42, text:'FEAST!', t:1.5, life:1.5, kind:'banner', colour:comboCol, grad:comboGrad});
          catchFlash = 0.35; catchFlashCol = '#ffd34d';
          burst(q.x, q.y, 26, '#ffd34d', 260, 1.1, 'star');
          burst(q.x, q.y, 18, '#ff9ac4', 220, 1.0, 'star');
          burst(q.x, q.y, 14, '#9be7ff', 200, 1.0);
        }
        burst(q.x, q.y, 12 + frightCombo*4, f.colour, 170, 0.6);
        burst(q.x, q.y, 5 + frightCombo*2, '#fff6c8', 130, 0.7, 'star');
        fx.push({kind:'catch', x:q.x, y:q.y, idx:f.idx, hs:f.hs, pitch:f.pitch, t:0, dur:0.5});
        fx.push({kind:'ring', x:q.x, y:q.y, r0:5, r1:TILE*(1.3 + frightCombo*0.25), t:0, dur:0.45, colour:'#ffffff'});
        f.state = 'eaten';
        tankFishEaten++;
        bumpStat('fishEaten');
        if(frightCombo === 4){
          const v = bonusValue('mega'); addScore(v);
          bumpStat('megaFeasts');
          popups.push({x:W/2, y:H*0.42 + 52, text:'MEGA FEAST +' + v.toLocaleString('en-GB'), t:1.6, life:1.6, kind:'combo', size:22, colour:'#ff9ac4', rise:0});
          wormPrey = [];
        } else if(wormPrey.length >= 2 && wormPrey.every(w => w.state === 'eaten')){
          const v = bonusValue('predator'); addScore(v);
          popups.push({x:q.x, y:q.y - 46, text:'PREDATOR FEAST +' + v, t:1.4, life:1.4, kind:'combo', size:16, colour:'#ffd34d'});
          wormPrey = [];
        }
        hitStop = 0.28 + frightCombo*0.04;   // freeze-frame so the catch lands
        addShake(4 + frightCombo*2);
        return;
      } else {
        setState('dying', 1.9); sfxDeath();
        addShake(8);
        burst(p.x, p.y, 30, '#ffc3de', 120, 1.0);
        return;
      }
    }
  }
}

/* ------------------------------ loop --------------------------- */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  update(dt);
  render(dt);
  requestAnimationFrame(frame);
}
function update(dt){
  clock += dt;
  stepAmbience(dt);
  stepBubbles(dt);
  stepParticles(dt);
  shake = Math.max(0, shake - dt*30);
  frightFlash = Math.max(0, frightFlash - dt);
  catchFlash = Math.max(0, catchFlash - dt);
  irisOpen = Math.max(0, irisOpen - dt);
  for(let i = popups.length - 1; i >= 0; i--){
    popups[i].t -= dt; popups[i].y -= dt*(popups[i].rise != null ? popups[i].rise : (popups[i].kind === 'banner' ? 0 : 22));
    if(popups[i].t <= 0) popups.splice(i,1);
  }
  stepFx(dt);
  if(hitStop > 0){ hitStop -= dt; return; }   // brief freeze after eating a fish
  animateCharacters(dt);
  stepLoop(dt);
  if(state === 'playing' && Math.random() < dt * 14 && player.moving){
    const p = posOf(player), d = DIRS[player.dir];
    const col = frightTimer > 0 ? '#ff6f9c' : 'rgba(170,235,255,.8)';
    particles.push({x:p.x - d.x*10, y:p.y - d.y*10, vx:(Math.random()-.5)*14, vy:(Math.random()-.5)*14 - 8,
                    t:0.6, life:0.6, colour:col, r:1 + Math.random()*1.6});
  }
  if(state === 'ready'){
    stateTimer -= dt;
    if(stateTimer <= 0) setState('playing', 0);
    return;
  }
  if(state === 'dying'){
    stateTimer -= dt;
    if(stateTimer <= 0) loseLife();
    return;
  }
  if(state === 'cleared'){
    stateTimer -= dt; flashTimer = stateTimer;
    if(stateTimer <= 0) nextLevel();
    return;
  }
  if(state !== 'playing') return;

  // mode cycling
  if(frightTimer > 0){
    frightTimer -= dt;
    if(frightTimer <= 0){ frightTimer = 0; frightCombo = 0; wormPrey = []; }
  } else if(MODE_PLAN[modeIndex].t !== Infinity){
    modeTimer -= dt;
    if(modeTimer <= 0){
      modeIndex = Math.min(modeIndex + 1, MODE_PLAN.length - 1);
      modeTimer = MODE_PLAN[modeIndex].t;
      for(const f of fish) if(f.state === 'hunt') reverseEntity(f);
    }
  }

  advance(player, playerSpeed()*currentMul(player)*dt, true);
  player.mouth += dt * (player.moving ? 11 : 3);

  for(const f of fish){
    if(f.state === 'den'){
      f.denTimer -= dt;
      if(f.denTimer <= 0){ f.state = 'leaving'; f.off = 0; }
      continue;
    }
    advance(f, fishSpeed(f)*currentMul(f)*dt, false);
  }
  checkCatch();

  if(bonus){
    bonus.t -= dt;
    if(bonus.t <= 0) bonus = null;
    else if(player.tx === bonus.x && player.ty === bonus.y && player.off < TILE*0.5){
      addScore(bonus.value); sfxBonus();
      if(++tankPrawns === 2){
        const v = bonusValue('prawns'); addScore(v);
        popups.push({x:centre(bonus.x), y:centre(bonus.y) - 24, text:'SHRIMP MASTER +' + v.toLocaleString('en-GB'), t:1.6, life:1.6, kind:'combo', size:16, colour:'#ffb08a'});
      }
      popups.push({x:centre(bonus.x), y:centre(bonus.y), text:'+'+bonus.value, t:1.3, big:true, colour:'#ffb08a'});
      burst(centre(bonus.x), centre(bonus.y), 16, '#ffb08a', 120, 0.6);
      bonus = null;
    }
  }
}

/* ---------------------------- drawing -------------------------- */
function render(dt){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0,0,W,H);
  if(bgSeparate) ctx.drawImage(bgLayer, 0, 0, W, H);
  if(shake > 0){
    ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
  }
  drawAmbientBack();
  drawBubbles();

  ctx.drawImage(mazeLayer, 0, 0, W, H);
  if(state === 'cleared'){
    // the walls pulse with light (works everywhere, unlike ctx.filter)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = reduceMotion ? 0.3 : 0.25 + 0.25 * Math.sin(clock * 12);
    ctx.drawImage(mazeLayer, 0, 0, W, H);
    ctx.restore();
    clearSparkles();
  }
  drawAnemones();

  drawCurrents();
  drawPellets();
  if(bonus) drawShrimpBonus(centre(bonus.x), centre(bonus.y), bonus.t);

  if(state !== 'dying') for(const f of fish) drawFish(f);
  drawAxolotl();
  drawFx();
  drawParticles();
  drawAmbientFront();
  if(tankDark()){ drawDarkness(dt); drawCaveGlows(dt); }
  drawGlow();
  drawPopups();
  if(frightFlash > 0){
    ctx.fillStyle = 'rgba(255,111,156,' + (frightFlash * (reduceMotion ? 0.2 : 0.45)).toFixed(3) + ')';
    ctx.fillRect(-20, -20, W+40, H+40);
  }
  if(catchFlash > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(1, catchFlash) * (reduceMotion ? 0.35 : 1);
    ctx.fillStyle = catchFlashCol;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillRect(-20, -20, W+40, H+40);
    ctx.restore();
  }
  drawStateText();
  drawIris();
}

/* ---------------- Deep Cave: only the axolotl's glow lights the water ---------------- */
const darkLayer = document.createElement('canvas');
/* a soft round hole, cut out of the dark wherever there is light */
let holeImg = null;
function holeSprite(){
  if(!holeImg){
    holeImg = document.createElement('canvas'); holeImg.width = holeImg.height = 128;
    const g = holeImg.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, 'rgba(0,0,0,1)'); r.addColorStop(0.55, 'rgba(0,0,0,.92)'); r.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  }
  return holeImg;
}
const dctx = darkLayer.getContext('2d');
let lightR = TILE * 12;
function drawDarkness(dt){
  if(darkLayer.width !== cv.width || darkLayer.height !== cv.height){
    darkLayer.width = Math.ceil(cv.width / 2); darkLayer.height = Math.ceil(cv.height / 2);
  }
  // how far the light reaches: wide while the tank is introduced, huge on a bloodworm
  let target = TILE * 4.6;
  if(state === 'ready' || state === 'title') target = TILE * (4.6 + Math.max(0, stateTimer) * 5);
  if(state === 'cleared' || state === 'over') target = TILE * 14;
  if(frightTimer > 0) target = TILE * (4.5 + Math.min(frightTimer, 2) * 6);   // bloodworm: floods the tank with light
  lightR += (target - lightR) * Math.min(1, dt * 4);

  const p = posOf(player);
  // the dark is a soft mask, so half resolution looks the same and costs a quarter
  dctx.setTransform(darkLayer.width / W, 0, 0, darkLayer.height / H, 0, 0);
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, W, H);
  dctx.fillStyle = 'rgba(1,3,8,' + (0.965 * (1 - caveFlash*0.7)).toFixed(3) + ')';   // a bloodworm flashes light through the cave
  dctx.fillRect(0, 0, W, H);
  dctx.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r, a) => {
    dctx.globalAlpha = a;
    dctx.drawImage(holeSprite(), x - r, y - r, r * 2, r * 2);
  };
  hole(p.x, p.y, lightR, 1);
  // bloodworms give off their own red light, so you can always find them
  for(let y = 0; y < ROWS; y++)
    for(let x = 0; x < COLS; x++)
      if(grid[y][x] === 'o') hole(centre(x), centre(y), TILE * (1.1 + Math.sin(clock*4)*0.15), 0.9);
  if(bonus) hole(centre(bonus.x), centre(bonus.y), TILE, 0.8);
  dctx.globalAlpha = 1;
  ctx.drawImage(darkLayer, 0, 0, W, H);

  // what still shows in the dark: faint wall outlines, glowing shrimp, and fish eyes
  ctx.save();
  ctx.globalAlpha = 0.09;
  ctx.drawImage(mazeLayer, 0, 0, W, H);
  ctx.globalAlpha = 0.28 + Math.sin(clock*2)*0.06;
  ctx.fillStyle = '#ffd95a';
  for(let y = 0; y < ROWS; y++)
    for(let x = 0; x < COLS; x++)
      if(grid[y][x] === '.'){ ctx.beginPath(); ctx.arc(centre(x), centre(y), 1.8, 0, Math.PI*2); ctx.fill(); }
  ctx.restore();
  if(state !== 'dying') for(const f of fish) drawGlowingEyes(f);
}
function drawGlowingEyes(f){
  const q = posOf(f);
  const frightened = frightTimer > 0 && f.state === 'hunt';
  const d = {x: f.hs * Math.cos(f.pitch), y: Math.sin(f.pitch)};
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const halo = glowSprite(frightened ? 'rgba(155,231,255,.9)' : f.state === 'eaten' ? 'rgba(255,255,255,.9)' : 'rgba(255,51,85,.9)');
  ctx.fillStyle = frightened ? '#bff1ff' : f.state === 'eaten' ? '#e8fbff' : '#ff5a70';
  // two eyes, sat just ahead of the fish's centre, each with a soft halo
  const ox = q.x + d.x * 6, oy = q.y + d.y * 6;
  const px = -d.y * 4, py = d.x * 4, lift = Math.abs(d.y) < 0.5 ? 3 : 0;
  for(let s = -1; s <= 1; s += 2){
    const ex = ox + px*s, ey = oy + py*s - lift;
    ctx.globalAlpha = 0.8; ctx.drawImage(halo, ex - 9, ey - 9, 18, 18);
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(ex, ey, 2.2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* shrimp: glowing golden morsels. bloodworms: wriggling red worms */
function drawPellets(){
  const pulse = 0.55 + 0.45*Math.sin(clock*4);
  const glow = glowSprite('rgba(255,200,70,.9)');
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.5;
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++)
    if(grid[y][x] === '.') ctx.drawImage(glow, centre(x) - 8, centre(y) - 8, 16, 16);
  ctx.restore();
  ctx.fillStyle = '#ffd95a';
  ctx.beginPath();
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++)
    if(grid[y][x] === '.'){ ctx.moveTo(centre(x) + 3.4, centre(y)); ctx.arc(centre(x), centre(y), 3.4, 0, Math.PI*2); }
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,230,.9)';
  ctx.beginPath();
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++)
    if(grid[y][x] === '.'){ ctx.moveTo(centre(x) - 0.2, centre(y) - 1.2); ctx.arc(centre(x) - 1.2, centre(y) - 1.2, 1, 0, Math.PI*2); }
  ctx.fill();

  const wglow = glowSprite('rgba(255,60,80,.9)');
  for(let y = 0; y < ROWS; y++){
    for(let x = 0; x < COLS; x++){
      if(grid[y][x] !== 'o') continue;
      const cx = centre(x), cy = centre(y);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.55 + pulse*0.35;
      const gs = 34 + pulse*6;
      ctx.drawImage(wglow, cx - gs/2, cy - gs/2, gs, gs);
      ctx.restore();
      drawWorm(cx, cy, x);
    }
  }
}
/* a bloodworm: a thick wriggling curve with a highlight */
function drawWorm(cx, cy, phase){
  const pts = [];
  for(let i = 0; i <= 10; i++){
    const t = i / 10;
    pts.push([cx + (t - .5)*15, cy + Math.sin(t*Math.PI*1.6 + clock*5 + phase)*4 - (t - .5)*5]);
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const trace = () => { ctx.beginPath(); pts.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); };
  ctx.strokeStyle = '#7a0d18'; ctx.lineWidth = 6.5; trace(); ctx.stroke();
  ctx.strokeStyle = '#e8303e'; ctx.lineWidth = 4.8; trace(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,160,160,.85)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); pts.forEach(([px, py], i) => i ? ctx.lineTo(px, py - 1.2) : ctx.moveTo(px, py - 1.2)); ctx.stroke();
  ctx.fillStyle = '#1a0508';
  ctx.beginPath(); ctx.arc(pts[10][0] + 0.5, pts[10][1] - 0.8, 0.9, 0, Math.PI*2); ctx.fill();
}

/* ---------------- characters ----------------
   Everything below is presentation only. Movement, AI and collisions read
   tx/ty/off/dir; the drawing reads its own visual state (hs, pitch, swim...)
   which is eased towards the real direction so turns look like swimming. */
function faceVisual(e, dt){
  if(e.dir === 'left') e.lastH = -1; else if(e.dir === 'right') e.lastH = 1;
  const pitch = e.dir === 'up' ? -Math.PI/2 : e.dir === 'down' ? Math.PI/2 : 0;
  const k = Math.min(1, dt * 16);
  e.pitch += (pitch - e.pitch) * k;
  e.hs += (e.lastH - e.hs) * k;
}
function snapVisual(e){
  e.lastH = e.dir === 'right' ? 1 : e.dir === 'left' ? -1 : (e.lastH || -1);
  e.hs = e.lastH;
  e.pitch = e.dir === 'up' ? -Math.PI/2 : e.dir === 'down' ? Math.PI/2 : 0;
}
/* a point in a character's own frame (facing +x) to tank coordinates */
function toWorld(e, pos, lx, ly){
  const c = Math.cos(e.pitch), s = Math.sin(e.pitch);
  return {x: pos.x + e.hs * (lx*c - ly*s), y: pos.y + lx*s + ly*c};
}
function bubble(x, y){
  particles.push({x, y, vx:(Math.random() - .5)*10, vy:-14 - Math.random()*10, t:1.3, life:1.3,
                  colour:'rgba(190,240,255,.8)', r:1.4 + Math.random()*1.4, ring:true});
}

const FISH_STYLE = [                       // tail-beat speed and how far the tail swings
  {rate:1.0, amp:0.30},                    // Pike: steady, purposeful
  {rate:0.7, amp:0.16},                    // Barracuda: glides
  {rate:1.7, amp:0.38},                    // Piranha: frantic
  {rate:0.6, amp:0.26}                     // Catfish: lazy
];
function animateCharacters(dt){
  const p = player;
  faceVisual(p, dt);
  const moving = p.moving && state === 'playing';
  p.swim += dt * (moving ? 10 : 2.4);
  p.happy = Math.max(0, p.happy - dt);
  p.pop = Math.max(0, p.pop - dt);

  // how close is the nearest hungry fish? (feeds the worried face, nothing else)
  let near = Infinity;
  if(state === 'playing' && frightTimer <= 0){
    const a = posOf(p);
    for(const f of fish){
      if(f.state !== 'hunt') continue;
      const q = posOf(f);
      near = Math.min(near, dist2(a.x, a.y, q.x, q.y));
    }
  }
  const d = Math.sqrt(near) / TILE;
  const want = d < 1.6 ? 1 : d > 3.6 ? 0 : (3.6 - d) / 2;
  p.danger += (want - p.danger) * Math.min(1, dt * 6);

  // resting: the odd tiny bubble
  if(!moving && (state === 'playing' || state === 'ready')){
    p.bubbleT -= dt;
    if(p.bubbleT <= 0){
      p.bubbleT = 1.8 + Math.random() * 2.4;
      const m = toWorld(p, posOf(p), TILE*0.45, -TILE*0.05);
      bubble(m.x, m.y);
    }
  }
  for(const f of fish){
    faceVisual(f, dt);
    const st = FISH_STYLE[f.idx];
    const scared = frightTimer > 0 && f.state === 'hunt';
    f.wag += dt * 11 * st.rate * (scared ? 1.5 : 1);
    f.bob += dt * 2.6;
    if(f.surprise > 0) f.surprise -= dt;
  }
}

/* one-off effects: catch puffs and shockwave rings */
const fx = [];
function stepFx(dt){
  for(let i = fx.length - 1; i >= 0; i--){
    fx[i].t += dt;
    if(fx[i].t >= fx[i].dur) fx.splice(i, 1);
  }
}
function drawFx(){
  for(const e of fx){
    if(e.t < 0) continue;                    // delayed start
    const u = e.t / e.dur;
    if(e.kind === 'ring'){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - u) * 0.8;
      ctx.strokeStyle = e.colour; ctx.lineWidth = 3 * (1 - u) + 0.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r0 + (e.r1 - e.r0) * (1 - (1 - u) * (1 - u)), 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    } else if(e.kind === 'catch'){
      // the caught fish squashes, then puffs out and vanishes. Cartoon, never gory.
      const R = TILE*0.45;
      let sx, sy;
      if(u < 0.25){ const a = u / 0.25; sx = 1 + 0.45*a; sy = 1 - 0.45*a; }
      else { const a = (u - 0.25) / 0.75; sx = 1.45 + 0.3*a; sy = 0.55 + 1.0*a; }
      ctx.save();
      ctx.globalAlpha = u < 0.25 ? 1 : Math.max(0, 1 - (u - 0.25) / 0.75);
      ctx.translate(e.x, e.y);
      ctx.scale(e.hs, 1); ctx.rotate(e.pitch); ctx.scale(sx, sy);
      FISH_DRAW[e.idx]({wag:0, idx:e.idx, bob:0}, R, '#e8fbff', true, 0, true);
      ctx.restore();
    }
  }
}

/* --------------------------- the axolotl --------------------------- */
/* the axolotl, drawn onto any canvas (the tank, or a preview in the
   collection). p: pose (hs, pitch, swim, happy, pop, danger, mouth),
   o: {R, k, dying, powered, moving, calm, celebrate, sx, sy, grow, pal, still} */
const skinCache = new Map();
function drawAxoFigure(ctx, x, y, p, o){
  const {R, k, dying, powered, moving, calm, celebrate, sx, sy, grow, pal} = o;
  const chunk = o.chunk || 1;                     // fuller body and fin for big portraits
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(p.hs, 1);
  ctx.rotate(p.pitch);
  ctx.scale(k * sx * grow, k * sy * grow);
  if(dying) ctx.rotate((1 - k) * Math.PI * 1.2);
  ctx.globalAlpha = dying ? Math.max(0.15, k) : 1;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  let skin = ctx === mainCtx && skinCache.get(pal);
  if(!skin){
    skin = ctx.createLinearGradient(0, -R*0.7, 0, R*0.7);
    skin.addColorStop(0, pal.body); skin.addColorStop(0.55, pal.mid); skin.addColorStop(1, pal.light);
    if(ctx === mainCtx) skinCache.set(pal, skin);
  }

  // spine: a travelling wave that grows towards the tail
  const amp = R * (moving ? 0.24 : 0.09) * calm;
  const N = 9, XH = R*0.1, XT = -R*1.7;
  const sp = [];
  for(let i = 0; i <= N; i++){
    const s = i / N;
    const x = XH + (XT - XH) * s;
    const y = Math.sin(p.swim - s*3.4) * amp * s * s;
    const w = (s < 0.15 ? R*0.36 : R*(0.04 + 0.32 * Math.pow(1 - (s - 0.15)/0.85, 1.25 / chunk))) * (chunk > 1 ? 1 + (chunk - 1) * s : 1);
    sp.push({x, y, w, s});
  }

  // tail fin frill
  ctx.fillStyle = pal.fin;
  ctx.beginPath();
  for(let i = 3; i <= N; i++){ const q = sp[i], h = R*(0.04 + 0.3*(q.s - 0.3)/0.7) * chunk; ctx.lineTo(q.x, q.y - q.w - h); }
  const tip = sp[N];
  ctx.quadraticCurveTo(tip.x - R*0.45, tip.y, tip.x, tip.y + tip.w + R*0.24);
  for(let i = N; i >= 3; i--){ const q = sp[i], h = R*(0.03 + 0.22*(q.s - 0.3)/0.7) * chunk; ctx.lineTo(q.x, q.y + q.w + h); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = pal.finLine; ctx.lineWidth = 1; ctx.stroke();

  // little legs with round toes, paddling while swimming
  const paddle = moving ? 0.6 : 0.12;
  for(const [i, ph, far] of [[2, Math.PI, true], [6, Math.PI + 2, true], [1, 0, false], [5, 2, false]]){
    const q = sp[i];
    const a = 1.95 + Math.sin(p.swim*0.9 + ph) * paddle;
    const lx = q.x + Math.cos(a)*R*0.36, ly = q.y + q.w*0.6 + Math.sin(a)*R*0.36;
    ctx.strokeStyle = far ? pal.deep : pal.body; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(q.x, q.y + q.w*0.5); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.fillStyle = far ? pal.deep : pal.light;
    ctx.beginPath(); ctx.arc(lx, ly, 1.6, 0, Math.PI*2); ctx.fill();
  }

  // body
  ctx.fillStyle = skin;
  ctx.beginPath();
  for(let i = 0; i <= N; i++) ctx.lineTo(sp[i].x, sp[i].y - sp[i].w);
  for(let i = N; i >= 0; i--) ctx.lineTo(sp[i].x, sp[i].y + sp[i].w);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = pal.line; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = pal.freckle;                                    // freckles
  for(const [i, o] of [[3, -0.4], [5, -0.25]]){
    ctx.beginPath(); ctx.arc(sp[i].x, sp[i].y + o*sp[i].w, 1.1, 0, Math.PI*2); ctx.fill();
  }
  if(pal.speckle){                                                // speckled and wild types
    ctx.fillStyle = pal.speckle;
    for(let i = 1; i < N - 1; i++) for(const o of [-0.55, -0.1, 0.4]){
      ctx.beginPath(); ctx.arc(sp[i].x + ((i*7) % 3 - 1)*1.2, sp[i].y + (o + ((i*5) % 3 - 1)*0.12)*sp[i].w, 0.9 + (i % 2)*0.4, 0, Math.PI*2); ctx.fill();
    }
  }

  // feathery gills: three fluffy fronds above and below the head
  const flare = p.danger * 0.35 + (powered ? 0.12 : 0);
  const flutterRate = moving ? 9 : 4 + p.danger * 6;
  const gillLen = powered ? 1.12 : 1;
  for(const side of [-1, 1]){
    for(let i = 0; i < 3; i++){
      const flutter = Math.sin(clock*flutterRate + i*1.1 + (side > 0 ? 1.7 : 0)) * 0.14 * calm;
      const a = side * (1.85 + i*0.4 + flare + flutter);
      const len = R * [0.72, 0.82, 0.66][i] * gillLen;
      const bx = R*0.22, by = side*R*0.42;
      const ex = bx + Math.cos(a)*len, ey = by + Math.sin(a)*len;
      // the stalk
      ctx.strokeStyle = pal.gill; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex, ey); ctx.stroke();
      // fluffy filaments along it
      ctx.strokeStyle = pal.gillTip; ctx.lineWidth = 1.3;
      ctx.beginPath();
      for(let j = 1; j <= 3; j++){
        const u = j / 3.6, fx = bx + (ex - bx)*u, fy = by + (ey - by)*u;
        const nx = -Math.sin(a), ny = Math.cos(a), fl = 2.4 + j*0.4;
        ctx.moveTo(fx, fy); ctx.lineTo(fx + (nx + Math.cos(a)*0.6)*fl, fy + (ny + Math.sin(a)*0.6)*fl);
        ctx.moveTo(fx, fy); ctx.lineTo(fx + (-nx + Math.cos(a)*0.6)*fl, fy + (-ny + Math.sin(a)*0.6)*fl);
      }
      ctx.stroke();
      ctx.fillStyle = pal.gill;
      ctx.beginPath(); ctx.arc(ex, ey, 2.2, 0, Math.PI*2); ctx.fill();
    }
  }

  // the big round head
  const hx = R*0.52, hy = sp[0].y*0.5;
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.ellipse(hx, hy, R*0.74, R*0.66, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = pal.line; ctx.lineWidth = 1.2; ctx.stroke();
  if(pal.speckle){
    ctx.fillStyle = pal.speckle;
    for(const [dx, dy] of [[-0.1, -0.35], [0.2, -0.45], [0.05, 0.3], [-0.2, 0.05], [0.35, 0.4]]){
      ctx.beginPath(); ctx.arc(hx + R*dx, hy + R*dy, 1, 0, Math.PI*2); ctx.fill();
    }
  }
  if(pal.stars){                                                  // galaxy: twinkling stars across the skin
    ctx.fillStyle = '#ffffff';
    const tw = o.still ? 1 : 0.6 + 0.4*Math.sin(clock*3);
    for(const [i, dy, r0] of [[2, -0.3, 1.1], [4, 0.2, 0.9], [6, -0.1, 0.8], [3, 0.4, 0.7], [7, 0.1, 0.6]]){
      ctx.globalAlpha *= tw; ctx.beginPath(); ctx.arc(sp[i].x, sp[i].y + dy*sp[i].w, r0, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha /= tw;
    }
    for(const [dx, dy] of [[-0.25, -0.3], [0.1, 0.35], [0.4, -0.45]]){
      ctx.beginPath(); ctx.arc(hx + R*dx, hy + R*dy, 0.8, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,.35)';                        // sheen
  ctx.beginPath(); ctx.ellipse(hx - R*0.1, hy - R*0.36, R*0.32, R*0.13, -0.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = pal.blush;                                      // blush
  for(const bx of [R*0.42, R*1.08]){ ctx.beginPath(); ctx.ellipse(bx, hy + R*0.16, R*0.14, R*0.08, 0, 0, Math.PI*2); ctx.fill(); }

  // two big shiny eyes (the far one a little smaller)
  const eyes = [[R*0.64, hy - R*0.1, R*0.2], [R*1.0, hy - R*0.08, R*0.16]];
  if(celebrate){                                                  // happy closed eyes: ^ ^
    ctx.strokeStyle = pal.eye; ctx.lineWidth = 1.7;
    for(const [ex, ey, er] of eyes){ ctx.beginPath(); ctx.arc(ex, ey + er*0.5, er, Math.PI*1.15, Math.PI*1.85); ctx.stroke(); }
  } else {
    const wide = 1 + p.danger * 0.3;
    for(const [ex, ey, er] of eyes){
      if(p.danger > 0.05){
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ex, ey, er*wide + 1, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = pal.eye;
      ctx.beginPath(); ctx.arc(ex, ey, er * (1 - p.danger*0.15), 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex - er*0.32, ey - er*0.35, er*0.38, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + er*0.35, ey + er*0.3, er*0.16, 0, Math.PI*2); ctx.fill();
    }
  }

  // mouth: a little smile that gobbles as it swims and opens wide to eat
  const open = Math.max(p.happy > 0 ? Math.sin((p.happy/0.2) * Math.PI) : 0,
                        moving ? Math.abs(Math.sin(p.mouth)) * 0.45 : 0, p.pop > 0 ? 0.8 : 0, celebrate ? 0.7 : 0);
  if(open > 0.15){
    ctx.fillStyle = '#8a2350';
    ctx.beginPath(); ctx.ellipse(R*0.84, hy + R*0.24, R*0.13, R*0.13*open + 0.6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff7aa8';
    ctx.beginPath(); ctx.ellipse(R*0.84, hy + R*0.24 + R*0.06*open, R*0.07, R*0.05*open, 0, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.strokeStyle = pal.eye; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(R*0.84, hy + R*0.12, R*0.14, 0.2*Math.PI, 0.8*Math.PI); ctx.stroke();
  }
  ctx.restore();
}

function drawAxolotl(){
  const p = player, pos = posOf(p);
  const R = TILE*0.46;
  const dying = state === 'dying';
  const k = dying ? Math.max(0, stateTimer/1.9) : 1;
  const powered = frightTimer > 0;
  const moving = p.moving && state === 'playing';
  const calm = reduceMotion ? 0.35 : 1;
  const celebrate = state === 'cleared';

  // soft pink glow around the axolotl, brighter in power mode
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = (powered ? 0.75 : 0.4) * k;
  const gs = TILE * (powered ? 3.2 : 2.4);
  ctx.drawImage(glowSprite(axoVariant.pal.glow), pos.x - gs/2, pos.y - gs/2, gs, gs);
  ctx.restore();

  // breathing and bobbing at rest; squash and stretch for a gulp or a bloodworm
  const breathe = moving ? 0 : Math.sin(clock*2.4) * 0.035 * calm;
  const bobY = celebrate ? -Math.abs(Math.sin(clock*7)) * 6 * calm
             : moving || dying ? 0 : Math.sin(clock*1.7) * 1.2 * calm;
  let sx = 1 + breathe, sy = 1 - breathe*0.6, grow = 1;
  if(p.happy > 0){ const s = Math.sin((p.happy / 0.2) * Math.PI) * 0.13 * calm; sx += s; sy -= s*0.7; }
  if(p.pop > 0){
    const t = 1 - p.pop / 0.6;
    if(t < 0.25) grow = 1 - 0.18 * (t / 0.25);
    else { const u = (t - 0.25) / 0.75; grow = 1 - 0.18 * Math.cos(u * Math.PI * 2.5) * (1 - u) * (1 - u); }
    grow = 1 + (grow - 1) * calm;
  }

  drawAxoFigure(ctx, pos.x, pos.y + bobY, p,
    {R, k, dying, powered, moving, calm, celebrate, sx, sy, grow, pal:axoVariant.pal});

  // power mode: golden glitter
  if(powered && !reduceMotion && Math.random() < 0.5){
    particles.push({x:pos.x + (Math.random() - .5)*TILE*1.2, y:pos.y + (Math.random() - .5)*TILE, vx:0, vy:-12,
                    t:0.6, life:0.6, colour:Math.random() < 0.5 ? '#ffd34d' : '#fff3b0', r:0.8 + Math.random(), star:true});
  }

  // bloodworm timer: a ring that drains, blinking as it runs out
  if(powered && state === 'playing'){
    const left = Math.min(1, frightTimer / frightMax);
    if(!(frightTimer < 2 && Math.floor(frightTimer*BLINK_HZ) % 2 === 0)){
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, TILE*0.78, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = '#ff6f9c'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, TILE*0.78, -Math.PI/2, -Math.PI/2 + Math.PI*2*left); ctx.stroke();
      ctx.restore();
    }
  }
}

/* ----------------------------- the fish ----------------------------- */
/* Each fish is drawn facing +x inside its own frame.
   f: the fish (wag, idx), R: size, col: body colour, scared: frightened face,
   wag: tail swing in radians, ghost: silhouette only (catch puff) */
function fishTail(x, wag, draw){
  ctx.save(); ctx.translate(x, 0); ctx.rotate(wag); draw(); ctx.restore();
}
/* colour sets: a dark back, the body, a pale belly, fins and an ink outline */
const FISH_PAL = [
  {back:'#3f5a24', body:'#7fa152', belly:'#e3e9a6', fin:'#5f7d36', line:'#1f2c12', mark:'rgba(240,236,140,.85)'},   // Pike: olive
  {back:'#2f4b6e', body:'#8fb0d4', belly:'#eef4fa', fin:'#56789f', line:'#18263a', mark:'rgba(28,44,72,.5)'},       // Barracuda: steel
  {back:'#7d1414', body:'#dd3f33', belly:'#ff9b55', fin:'#a82721', line:'#3e0808', mark:'rgba(255,220,170,.5)'},    // Piranha: red
  {back:'#36425a', body:'#6b7d9b', belly:'#c3cddd', fin:'#4c5a75', line:'#1c2230', mark:'rgba(20,26,40,.35)'}       // Catfish: slate
];
const PAL_SCARED = {back:'#3f8fc4', body:'#93dcff', belly:'#eafcff', fin:'#6cc0ec', line:'#1d5677', mark:'rgba(255,255,255,.35)'};
const PAL_BLINK  = {back:'#d8eef8', body:'#ffffff', belly:'#ffffff', fin:'#e8f6fc', line:'#7fa8bd', mark:'rgba(150,190,210,.4)'};
function flatPal(c){ return {back:c, body:c, belly:c, fin:c, line:null, mark:null}; }
/* body gradients are built once per colour set and reused: a gradient is
   read in the current transform, so the same object fits every fish */
const fishGrads = new Map();
function bodyFill(pal, R){
  if(pal.back === pal.belly) return pal.body;
  if(ctx !== mainCtx){                         // an illustration: build it fresh
    const g = ctx.createLinearGradient(0, -R*0.8, 0, R*0.8);
    g.addColorStop(0, pal.back); g.addColorStop(0.42, pal.body); g.addColorStop(1, pal.belly);
    return g;
  }
  const key = pal.back + R;
  let g = fishGrads.get(key);
  if(!g){
    g = ctx.createLinearGradient(0, -R*0.8, 0, R*0.8);
    g.addColorStop(0, pal.back); g.addColorStop(0.42, pal.body); g.addColorStop(1, pal.belly);
    fishGrads.set(key, g);
  }
  return g;
}
function inked(pal, w){                       // fill the current path, then outline it
  ctx.fill();
  if(pal.line){ ctx.strokeStyle = pal.line; ctx.lineWidth = w || 1.2; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function fishEye(x, y, r, scared, look, lid){
  ctx.fillStyle = scared ? '#ffffff' : '#ffd84a';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(20,10,0,.6)'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = '#120a06';
  const pr = scared ? r*0.32 : r*0.5;
  ctx.beginPath(); ctx.arc(x + (look || 0)*r*0.35, y, pr, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.35, r*0.22, 0, Math.PI*2); ctx.fill();
  if(lid){                                     // heavy upper lid
    ctx.fillStyle = lid;
    ctx.beginPath(); ctx.arc(x, y, r + 0.5, Math.PI*1.05, Math.PI*1.95); ctx.closePath(); ctx.fill();
  }
}
function brow(x0, y0, x1, y1, scared){
  ctx.strokeStyle = scared ? 'rgba(20,60,90,.85)' : '#140c06'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath();
  if(scared){ ctx.moveTo(x0, y1); ctx.lineTo(x1, y0); } else { ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); }
  ctx.stroke();
}
function wobblyMouth(x0, x1, y){                // frightened: a nervous squiggle
  ctx.strokeStyle = 'rgba(13,58,77,.9)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath();
  for(let i = 0; i <= 4; i++) ctx.lineTo(x0 + (x1 - x0)*i/4, y + (i % 2 ? -1.2 : 1.2));
  ctx.stroke();
}
function teeth(x0, x1, y, n, up, size){
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  for(let i = 0; i < n; i++){
    const tx = x0 + (x1 - x0) * (i + 0.5) / n;
    ctx.moveTo(tx - size*0.5, y); ctx.lineTo(tx + size*0.5, y); ctx.lineTo(tx, y + (up ? -size : size)); ctx.closePath();
  }
  ctx.fill();
}
/* an open mouth: dark inside, teeth on both jaws */
function mouth(pts, upper, lower){
  ctx.fillStyle = '#3a0a10';
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
  if(upper) teeth(upper[0], upper[1], upper[2], upper[3], false, upper[4]);
  if(lower) teeth(lower[0], lower[1], lower[2], lower[3], true, lower[4]);
}

/* Each fish is drawn facing +x inside its own frame.
   f: the fish, R: size, pal: colour set (or a single colour for a silhouette),
   scared: frightened face, wag: tail swing in radians, ghost: silhouette only */
const FISH_DRAW = [
  /* PIKE: long olive torpedo, duck-bill jaws full of teeth, fin set far back, a glare */
  function(f, R, pal, scared, wag, ghost){
    if(typeof pal === 'string') pal = flatPal(pal);
    ctx.fillStyle = pal.fin;
    fishTail(-R*1.08, wag, () => {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-R*0.4, -R*0.2, -R*0.62, -R*0.55); ctx.lineTo(-R*0.42, 0); ctx.lineTo(-R*0.62, R*0.55); ctx.quadraticCurveTo(-R*0.4, R*0.2, 0, 0); inked(pal);
    });
    ctx.fillStyle = pal.fin;
    ctx.beginPath(); ctx.moveTo(-R*0.9, -R*0.3); ctx.quadraticCurveTo(-R*0.72, -R*0.85, -R*0.4, -R*0.38); inked(pal);
    ctx.beginPath(); ctx.moveTo(-R*0.85, R*0.28); ctx.quadraticCurveTo(-R*0.7, R*0.7, -R*0.45, R*0.34); inked(pal);
    ctx.fillStyle = bodyFill(pal, R);
    ctx.beginPath();
    ctx.moveTo(R*1.52, -R*0.12);
    ctx.quadraticCurveTo(R*0.6, -R*0.6, -R*0.4, -R*0.44);
    ctx.quadraticCurveTo(-R*0.95, -R*0.32, -R*1.12, 0);
    ctx.quadraticCurveTo(-R*0.95, R*0.34, -R*0.4, R*0.44);
    ctx.quadraticCurveTo(R*0.6, R*0.56, R*1.46, R*0.16);
    ctx.closePath(); inked(pal, 1.3);
    if(ghost) return;
    ctx.fillStyle = pal.mark;                                      // pale spots
    for(const [x, y] of [[-0.75, -0.05], [-0.45, 0.12], [-0.15, -0.08], [0.15, 0.1], [-0.3, -0.25], [-0.6, 0.22]]){
      ctx.beginPath(); ctx.ellipse(R*x, R*y, R*0.1, R*0.055, 0.3, 0, Math.PI*2); ctx.fill();
    }
    if(scared) wobblyMouth(R*0.85, R*1.35, R*0.06);
    else mouth([[R*0.62, R*0.04], [R*1.56, -R*0.13], [R*1.5, R*0.24]],
               [R*0.8, R*1.45, -R*0.02, 4, 3], [R*0.8, R*1.4, R*0.17, 4, 3]);
    fishEye(R*0.48, -R*0.2, R*0.18, scared, 0.8);
    brow(R*0.26, -R*0.47, R*0.68, -R*0.3, scared);
  },
  /* BARRACUDA: slim and silver, a long toothy grin, two dorsal fins, forked tail, heavy lids */
  function(f, R, pal, scared, wag, ghost){
    if(typeof pal === 'string') pal = flatPal(pal);
    ctx.fillStyle = pal.fin;
    fishTail(-R*1.18, wag, () => {
      ctx.beginPath(); ctx.moveTo(R*0.05, 0); ctx.lineTo(-R*0.55, -R*0.62); ctx.lineTo(-R*0.3, 0); ctx.lineTo(-R*0.55, R*0.62); ctx.closePath(); inked(pal);
    });
    for(const x of [-0.75, 0.05]){
      ctx.beginPath(); ctx.moveTo(R*(x - 0.2), -R*0.28); ctx.lineTo(R*(x - 0.08), -R*0.66); ctx.lineTo(R*(x + 0.14), -R*0.3); ctx.closePath(); inked(pal);
    }
    ctx.fillStyle = bodyFill(pal, R);
    ctx.beginPath();
    ctx.moveTo(R*1.62, -R*0.02);
    ctx.quadraticCurveTo(R*0.6, -R*0.44, -R*0.6, -R*0.34);
    ctx.quadraticCurveTo(-R*1.05, -R*0.2, -R*1.2, 0);
    ctx.quadraticCurveTo(-R*1.05, R*0.2, -R*0.6, R*0.32);
    ctx.quadraticCurveTo(R*0.6, R*0.42, R*1.66, R*0.1);
    ctx.closePath(); inked(pal, 1.3);
    if(ghost) return;
    ctx.strokeStyle = pal.mark; ctx.lineWidth = 2; ctx.lineCap = 'round';      // dark bars
    ctx.beginPath();
    for(let i = 0; i < 5; i++){ const x = R*(-0.95 + i*0.32); ctx.moveTo(x - R*0.08, -R*0.28); ctx.lineTo(x + R*0.05, -R*0.04); }
    ctx.stroke();
    if(scared) wobblyMouth(R*0.95, R*1.45, R*0.06);
    else mouth([[R*0.82, R*0.06], [R*1.66, -R*0.03], [R*1.62, R*0.15]],
               [R*0.95, R*1.55, -R*0.0, 5, 2.6], [R*0.95, R*1.5, R*0.12, 5, 2.6]);
    fishEye(R*0.62, -R*0.1, R*0.16, scared, 1, scared ? null : pal.back);
  },
  /* PIRANHA: round and red, a huge snapping underbite, never sits still */
  function(f, R, pal, scared, wag, ghost){
    if(typeof pal === 'string') pal = flatPal(pal);
    ctx.fillStyle = pal.fin;
    fishTail(-R*0.72, wag, () => {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-R*0.5, -R*0.75, -R*0.62, -R*0.48); ctx.lineTo(-R*0.44, 0); ctx.lineTo(-R*0.62, R*0.48); ctx.quadraticCurveTo(-R*0.5, R*0.75, 0, 0); inked(pal);
    });
    ctx.beginPath(); ctx.moveTo(-R*0.4, -R*0.6); ctx.lineTo(-R*0.12, -R*1.02); ctx.lineTo(R*0.14, -R*0.66); ctx.closePath(); inked(pal);
    ctx.beginPath(); ctx.moveTo(-R*0.42, R*0.58); ctx.lineTo(-R*0.26, R*0.9); ctx.lineTo(-R*0.02, R*0.64); ctx.closePath(); inked(pal);
    const snap = scared || ghost ? 0.2 : 0.5 + 0.5*Math.sin(clock*13 + f.idx);
    ctx.fillStyle = bodyFill(pal, R);
    ctx.beginPath();
    ctx.moveTo(R*0.98, -R*0.06);
    ctx.quadraticCurveTo(R*0.55, -R*0.95, -R*0.35, -R*0.72);
    ctx.quadraticCurveTo(-R*0.8, -R*0.45, -R*0.76, 0);
    ctx.quadraticCurveTo(-R*0.8, R*0.5, -R*0.3, R*0.72);
    ctx.quadraticCurveTo(R*0.4, R*0.92, R*1.08, R*(0.42 + snap*0.08));      // jutting lower jaw
    ctx.lineTo(R*1.0, R*(0.18 + snap*0.1));
    ctx.closePath(); inked(pal, 1.3);
    if(ghost) return;
    ctx.fillStyle = pal.mark;                                                  // glinting scales
    for(const [x, y] of [[-0.45, -0.25], [-0.15, -0.4], [-0.3, 0.02], [0.05, -0.15], [-0.5, 0.25]]){
      ctx.beginPath(); ctx.arc(R*x, R*y, 1.1, 0, Math.PI*2); ctx.fill();
    }
    if(scared) wobblyMouth(R*0.5, R*0.95, R*0.3);
    else mouth([[R*0.42, R*0.18], [R*1.0, R*(0.0 + snap*0.06)], [R*1.04, R*(0.38 + snap*0.08)], [R*0.42, R*0.42]],
               [R*0.5, R*0.98, R*(0.02 + snap*0.04), 4, 3.6], [R*0.5, R*1.0, R*(0.4 + snap*0.06), 4, 3.8]);
    fishEye(R*0.4, -R*0.28, R*0.22, scared, 0.4);
    brow(R*0.16, -R*0.6, R*0.62, -R*0.42, scared);
  },
  /* CATFISH: chunky slate body, broad flat head, wide goofy grin and long barbels */
  function(f, R, pal, scared, wag, ghost){
    if(typeof pal === 'string') pal = flatPal(pal);
    ctx.fillStyle = pal.fin;
    fishTail(-R*0.95, wag, () => {
      ctx.beginPath(); ctx.moveTo(R*0.05, -R*0.12);
      ctx.quadraticCurveTo(-R*0.35, -R*0.6, -R*0.62, -R*0.42); ctx.quadraticCurveTo(-R*0.5, 0, -R*0.62, R*0.42);
      ctx.quadraticCurveTo(-R*0.35, R*0.6, R*0.05, R*0.12); ctx.closePath(); inked(pal);
    });
    ctx.beginPath(); ctx.moveTo(-R*0.35, -R*0.4); ctx.lineTo(-R*0.12, -R*0.78); ctx.lineTo(R*0.08, -R*0.45); ctx.closePath(); inked(pal);
    ctx.fillStyle = bodyFill(pal, R);
    ctx.beginPath();
    ctx.moveTo(-R*1.0, -R*0.22);
    ctx.quadraticCurveTo(-R*0.3, -R*0.6, R*0.4, -R*0.58);
    ctx.quadraticCurveTo(R*1.18, -R*0.5, R*1.16, R*0.12);
    ctx.quadraticCurveTo(R*1.08, R*0.62, R*0.3, R*0.6);
    ctx.quadraticCurveTo(-R*0.4, R*0.52, -R*1.0, R*0.22);
    ctx.closePath(); inked(pal, 1.3);
    if(ghost) return;
    ctx.fillStyle = pal.mark;                                                  // spots
    for(const [x, y, r] of [[-0.55, -0.1, 0.12], [-0.2, 0.15, 0.09], [0.05, -0.3, 0.1], [-0.75, 0.1, 0.07]]){
      ctx.beginPath(); ctx.arc(R*x, R*y, R*r, 0, Math.PI*2); ctx.fill();
    }
    // barbels: two long from the lip, two short from the chin
    ctx.strokeStyle = scared ? 'rgba(255,255,255,.85)' : pal.line || '#1c2230'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for(const [len, drop, ph] of [[1.85, 0.55, 0], [1.7, 0.95, 1.2], [1.3, 0.75, 2.1], [1.22, 1.05, 0.6]]){
      const w = Math.sin(f.wag*0.5 + ph) * 2.4;
      ctx.beginPath(); ctx.moveTo(R*1.08, R*0.14);
      ctx.quadraticCurveTo(R*(len - 0.1), R*(drop*0.3), R*(len - 0.3) + w, R*drop); ctx.stroke();
    }
    // wide goofy grin
    if(scared) wobblyMouth(R*0.7, R*1.12, R*0.24);
    else {
      ctx.fillStyle = '#2a1018';
      ctx.beginPath(); ctx.moveTo(R*0.6, R*0.18); ctx.quadraticCurveTo(R*0.9, R*0.42, R*1.16, R*0.14); ctx.quadraticCurveTo(R*0.9, R*0.28, R*0.6, R*0.18); ctx.fill();
      teeth(R*0.72, R*1.06, R*0.2, 3, false, 2);
    }
    // two googly eyes perched on top, pupils wandering independently
    const g1 = Math.sin(clock*1.3 + f.idx), g2 = Math.sin(clock*1.7 + 2);
    fishEye(R*0.45, -R*0.46, R*0.19, scared, g1);
    fishEye(R*0.8, -R*0.4, R*0.16, scared, g2);
  }
];

function drawFish(f){
  const q = posOf(f);
  // tank cleared: the fish slip away
  const away = state === 'cleared' ? Math.max(0, (stateTimer - 1.8) / 0.8) : 1;
  if(away <= 0) return;
  const R = TILE*0.45;
  const frightened = frightTimer > 0 && f.state === 'hunt';
  const blinking = frightened && frightTimer < 2 && Math.floor(frightTimer*BLINK_HZ) % 2 === 0;
  const calm = reduceMotion ? 0.35 : 1;
  const body = frightened ? (blinking ? PAL_BLINK : PAL_SCARED) : FISH_PAL[f.idx];

  let bobY = f.state === 'den' ? Math.sin(f.bob)*3 : Math.sin(f.bob)*0.8*calm;
  let jx = 0;
  if(frightened && !reduceMotion) jx = Math.sin(clock*55 + f.idx)*1.4;            // trembling
  else if(f.idx === 2 && !reduceMotion){ jx = Math.sin(clock*23)*0.6; bobY += Math.sin(clock*17)*0.7; }   // piranha jitters

  ctx.save();
  ctx.globalAlpha = away;
  ctx.translate(q.x + jx, q.y + bobY);
  ctx.scale(f.hs, 1);
  ctx.rotate(f.pitch);

  if(f.state === 'eaten'){
    // swimming home: a faint ghost of the fish behind a pair of eyes
    ctx.globalAlpha = 0.16;
    FISH_DRAW[f.idx](f, R, '#bfeefa', false, 0, true);
    ctx.globalAlpha = 1;
    for(const s of [-1, 1]){
      const ex = R*0.35 + s*R*0.3;
      ctx.fillStyle = 'rgba(220,246,255,.95)';
      ctx.beginPath(); ctx.arc(ex, -R*0.12, R*0.26, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#10222c';
      ctx.beginPath(); ctx.arc(ex + R*0.09, -R*0.12, R*0.12, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    return;
  }
  if(frightened){
    // a pale halo marks edible fish by brightness as well as colour
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = blinking ? 0.25 : 0.5;
    ctx.drawImage(glowSprite('rgba(220,248,255,.9)'), -TILE*1.1, -TILE*0.9, TILE*2.2, TILE*1.8);
    ctx.restore();
  }
  const st = FISH_STYLE[f.idx];
  const wag = Math.sin(f.wag) * st.amp * (0.4 + 0.6*calm);
  FISH_DRAW[f.idx](f, R, body, frightened, wag, false);
  ctx.restore();
  if(f.surprise > 0) drawSurprise(q.x, q.y - TILE*0.75, f.surprise);
}
/* "!" pops up over a fish the moment a bloodworm turns the tables */
function drawSurprise(x, y, t){
  const age = 0.8 - t;
  const k = reduceMotion ? 1 : (age < 0.12 ? 0.4 + age / 0.12 * 0.8 : 1.2 - Math.min(0.2, (age - 0.12)));
  ctx.save();
  ctx.globalAlpha = Math.min(1, t / 0.25);
  ctx.translate(x, y - (reduceMotion ? 0 : Math.sin(Math.min(1, age / 0.3) * Math.PI) * 4));
  ctx.scale(k * textScale, k * textScale);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 16px Fredoka, sans-serif';
  ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(3,10,18,.9)';
  ctx.strokeText('!', 0, 0);
  ctx.fillStyle = '#ffffff'; ctx.fillText('!', 0, 0);
  ctx.fillStyle = '#9be7ff';                                   // a nervous sweat drop
  ctx.beginPath(); ctx.moveTo(9, -4); ctx.quadraticCurveTo(12, 1, 9, 3); ctx.quadraticCurveTo(6, 1, 9, -4); ctx.fill();
  ctx.restore();
}

function drawShrimpBonus(x, y, t){
  const fade = t < 2 ? (Math.floor(t*6)%2 ? 0.35 : 1) : 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = fade;
  ctx.rotate(Math.sin(clock*2)*0.25);
  ctx.strokeStyle = '#ffb08a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 6, Math.PI*0.15, Math.PI*1.5); ctx.stroke();
  ctx.strokeStyle = '#ff8f66'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-4, -5); ctx.lineTo(-9, -8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, -5); ctx.lineTo(-9, -2); ctx.stroke();
  ctx.fillStyle = '#2a1420';
  ctx.beginPath(); ctx.arc(4.5, -3.5, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* floating text. kinds: tiny (shrimp), score, combo, banner (centre of the tank).
   An outline instead of a blur keeps it crisp and readable on small screens. */
function drawPopups(){
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for(const p of popups){
    const kind = p.kind || (p.big ? 'score' : 'small');
    const life = p.life || p.t, age = life - p.t;
    let size = 13, font = '"Lilita One", Fredoka, sans-serif', weight = 400, grow = 0.5;
    if(kind === 'tiny'){ size = 12; font = 'Fredoka, sans-serif'; weight = 600; grow = 0; }
    else if(kind === 'score') size = 19;
    else if(kind === 'combo') size = p.size || 20;
    else if(kind === 'banner'){ size = 72; grow = 1.2; }
    else { font = 'Fredoka, sans-serif'; weight = 600; size = 12; }
    let k = 1;
    if(grow && !reduceMotion && age < 0.18) k = 1 + (1 - age / 0.18) * grow;     // pop in
    ctx.globalAlpha = Math.min(1, p.t / (kind === 'tiny' ? 0.2 : 0.4)) * (kind === 'tiny' ? 0.85 : 1);
    size = Math.round(size * (kind === 'banner' ? Math.min(textScale, 1.25) : textScale));
    ctx.font = weight + ' ' + size + 'px ' + font;
    const half = ctx.measureText(p.text).width / 2 + 8;
    const x = kind === 'banner' ? p.x : Math.max(half, Math.min(W - half, p.x));
    ctx.save();
    ctx.translate(x, p.y);
    if(kind === 'banner' && !reduceMotion) ctx.rotate(Math.sin(age * 9) * 0.04);
    ctx.scale(k, k);
    if(kind === 'banner'){
      ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(255,120,40,.5)'; ctx.strokeText(p.text, 0, 0);
    }
    ctx.lineWidth = Math.max(3, size * 0.22); ctx.strokeStyle = 'rgba(30,8,20,.92)';
    ctx.strokeText(p.text, 0, 0);
    if(p.grad){                                    // a glossy top-to-bottom fill, like the combo art
      const g = ctx.createLinearGradient(0, -size*0.45, 0, size*0.45);
      g.addColorStop(0, p.grad[0]); g.addColorStop(1, p.grad[1]);
      ctx.fillStyle = g;
    } else ctx.fillStyle = p.colour || '#ffe4a8';
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

/* tank clear: a sweep of sparkles crosses the tank */
function clearSparkles(){
  const u = 1 - stateTimer / stateTotal;             // 0 → 1 across the celebration
  if(u > 0.55 || reduceMotion) return;
  const sweep = (u / 0.55) * (W + H);
  for(let i = 0; i < 3; i++){
    const along = Math.random() * H;
    const x = sweep - along, y = along;
    if(x < 0 || x > W) continue;
    particles.push({x, y, vx:(Math.random() - .5)*30, vy:-20 - Math.random()*30, t:0.8, life:0.8,
                    colour:pick(Math.random, ['#fff6c8', '#ffd1e3', '#bff1ff']), r:1.4 + Math.random()*1.4, star:true});
  }
}
/* between tanks: an iris closes on the axolotl, then opens on the new habitat */
function drawIris(){
  let open = 1;
  if(state === 'cleared' && stateTimer < 0.45) open = stateTimer / 0.45;
  if(irisOpen > 0) open = 1 - irisOpen / 0.5;
  if(open >= 1) return;
  if(reduceMotion){                                // a gentle fade instead of a closing circle
    ctx.save(); ctx.globalAlpha = 1 - open; ctx.fillStyle = '#02070c'; ctx.fillRect(-30, -30, W + 60, H + 60); ctx.restore();
    return;
  }
  const p = posOf(player);
  const far = Math.hypot(Math.max(p.x, W - p.x), Math.max(p.y, H - p.y)) + 20;
  const r = Math.max(0, far * open * open);
  ctx.save();
  ctx.fillStyle = '#02070c';
  ctx.beginPath();
  ctx.rect(-30, -30, W + 60, H + 60);
  ctx.arc(p.x, p.y, r, 0, Math.PI*2, true);
  ctx.fill('evenodd');
  ctx.restore();
}

/* the signature: the axolotl carries its own light through dark water */
function drawGlow(){
  const p = posOf(player);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const r = TILE*4.6*(1 + Math.sin(clock*2.2)*0.06);
  ctx.globalAlpha = frightTimer > 0 ? 0.33 : 0.22;
  ctx.drawImage(glowSprite(frightTimer > 0 ? 'rgba(255,90,120,.9)' : 'rgba(150,235,255,.9)'), p.x - r, p.y - r, r*2, r*2);
  ctx.restore();
}

/* pick a font size that fits the width, starting from px */
function fitFont(text, px, weight, family, maxW){
  let size = Math.round(px);
  ctx.font = weight + ' ' + size + 'px ' + family;
  while(size > 9 && ctx.measureText(text).width > maxW){ size--; ctx.font = weight + ' ' + size + 'px ' + family; }
  return size;
}
const DISPLAY = '"Lilita One", Fredoka, sans-serif', BODY = 'Fredoka, sans-serif';
/* a dark card with centred lines: [{text, px, weight, family, colour, wobble}] */
function drawCard(lines, cy, maxW){
  const T = textScale, gap = 8*T;
  const w = Math.min(W - 24, maxW * Math.min(T, 1.25));
  const sizes = lines.map(l => fitFont(l.text, l.px * T, l.weight, l.family, w - 28));
  const h = sizes.reduce((a, b) => a + b, 0) + gap * (lines.length - 1) + 28*T;
  ctx.fillStyle = 'rgba(2,8,14,.8)';
  roundRect(ctx, W/2 - w/2, cy - h/2, w, h, 14*T);
  let y = cy - h/2 + 14*T;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.lineJoin = 'round';
  lines.forEach((l, i) => {
    ctx.font = l.weight + ' ' + sizes[i] + 'px ' + l.family;
    ctx.save();
    if(l.wobble){ const k = 1 + Math.sin(clock*8)*0.04; ctx.translate(W/2, y + sizes[i]/2); ctx.scale(k, k); ctx.translate(-W/2, -(y + sizes[i]/2)); }
    if(l.stroke){ ctx.lineWidth = sizes[i] * 0.18; ctx.strokeStyle = 'rgba(3,10,18,.9)'; ctx.strokeText(l.text, W/2, y); }
    ctx.fillStyle = l.colour; ctx.fillText(l.text, W/2, y);
    ctx.restore();
    y += sizes[i] + gap;
  });
}
function drawStateText(){
  const T = textScale;
  if(state === 'ready'){
    ctx.save();
    // habitat title card, easing in
    const age = stateTotal - stateTimer;
    const ease = reduceMotion ? 1 : Math.min(1, age / 0.35);
    const pop = 1 - Math.pow(1 - ease, 3);
    ctx.globalAlpha = ease;
    ctx.translate(W/2, centre(13)); ctx.scale(0.85 + 0.15*pop, 0.85 + 0.15*pop); ctx.translate(-W/2, -centre(13));
    const lines = [
      {text:'TANK ' + level + ' · ' + hab.name.toUpperCase(), px:22, weight:400, family:DISPLAY, colour:'#ffc3de', wobble:true},
      {text:hab.hint, px:15, weight:500, family:BODY, colour:hab.edge}];
    if(mode === 'daily') lines.push(
      {text:'DAILY · ' + daily.rule.name.toUpperCase(), px:22, weight:400, family:DISPLAY, colour:'#ffd34d'},
      {text:daily.rule.desc, px:15, weight:500, family:BODY, colour:'#ffffff'});
    drawCard(lines, centre(13) + 20*T, 540);
    // on the first tank, introduce the fish by name
    if(level === 1){
      ctx.font = '700 ' + Math.round(12*T) + 'px ' + BODY;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      for(const f of fish){
        const q = posOf(f);
        const y = q.y + (f.idx < 2 ? -18*T : 20*T);
        ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(3,10,18,.9)'; ctx.strokeText(f.name, q.x, y);
        ctx.fillStyle = f.colour; ctx.fillText(f.name, q.x, y);
      }
    }
    ctx.restore();
  }
  if(state === 'dying'){
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.font = '400 ' + Math.round(17*T) + 'px ' + DISPLAY;
    ctx.globalAlpha = Math.min(1, (1.9 - stateTimer));
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(3,10,18,.9)'; ctx.strokeText('REGENERATING', W/2, centre(13));
    ctx.fillStyle = '#9be7ff'; ctx.fillText('REGENERATING', W/2, centre(13));
    ctx.restore();
  }
  if(state === 'cleared'){
    const age = stateTotal - stateTimer;
    const pop = reduceMotion ? 1 : Math.min(1, age / 0.25);
    const k = reduceMotion ? 1 : 1 + (1 - pop) * 0.6;
    const shown = Math.round(clearBonusShown * Math.min(1, Math.max(0, (age - 0.2) / 0.8)));
    ctx.save();
    ctx.globalAlpha = pop;
    ctx.translate(W/2, centre(13)); ctx.scale(k, k); ctx.translate(-W/2, -centre(13));
    const lines = [
      {text:'TANK CLEARED!', px:38, weight:400, family:DISPLAY, colour:'#ffe4a8', stroke:true},
      {text:'BONUS +' + shown.toLocaleString('en-GB'), px:22, weight:400, family:DISPLAY, colour:'#ff9ac4', stroke:true}];
    // skill bonuses appear one after another (their space is kept from the start)
    clearBonuses.forEach((b, i) => {
      const on = age - 0.9 - i*0.35 > 0;
      lines.push({text:b.name + ' +' + b.value.toLocaleString('en-GB'), px:19, weight:400, family:DISPLAY,
                  colour:on ? '#ffd34d' : 'rgba(0,0,0,0)', stroke:on});
    });
    drawCard(lines, centre(13) + 10*T, 420);
    ctx.restore();
  }
}

/* ---------------------------- controls ------------------------- */
const KEYMAP = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', a:'left', s:'down', d:'right', W:'up', A:'left', S:'down', D:'right'
};
window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT') return;                              // typing a name, not steering
  const dir = KEYMAP[e.key];
  if(dir && (state === 'playing' || state === 'ready')){ e.preventDefault(); requestDir(dir); return; }
  if(e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ e.preventDefault(); togglePause(); return; }
  if((e.key === ' ' || e.key === 'Enter') && overlay.classList.contains('on') && tag !== 'BUTTON'){
    const first = overlay.querySelector('[data-default]') || ovActions.querySelector('button');
    if(first){ e.preventDefault(); first.click(); }
  }
}, {passive:false});

document.querySelectorAll('.pad button').forEach(b => {
  const fire = e => { e.preventDefault(); requestDir(b.dataset.dir); };
  b.addEventListener('pointerdown', fire);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* swipe anywhere in the play area (not just on the tank). A short swipe
   steers; keep the finger down and swipe again to turn again. Menus are
   left alone so their buttons and scrolling still work. */
let touchStart = null;
const SWIPE = 16;
stageEl.addEventListener('pointerdown', e => {
  if(overlay.classList.contains('on')) return;
  touchStart = {x:e.clientX, y:e.clientY};
  if(e.pointerType !== 'mouse') e.preventDefault();
}, {passive:false});
stageEl.addEventListener('pointermove', e => {
  if(!touchStart || overlay.classList.contains('on')) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
  if(Math.abs(dx) < SWIPE && Math.abs(dy) < SWIPE) return;
  requestDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  touchStart = {x:e.clientX, y:e.clientY};
  e.preventDefault();
}, {passive:false});
for(const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, () => { touchStart = null; });
stageEl.addEventListener('touchmove', e => { if(!overlay.classList.contains('on')) e.preventDefault(); }, {passive:false});

function togglePause(){
  if(state === 'playing'){
    setState('paused', 0);
    showOverlay('Paused', 'The tank holds its breath.', [{label:'Keep swimming', fn:togglePause, primary:true}]);
    pauseBtn.textContent = 'Resume';
  } else if(state === 'paused'){
    setState('playing', 0);
    pauseBtn.textContent = 'Pause';
  }
}
pauseBtn.addEventListener('click', () => {
  if(state === 'title') swim(); else if(state === 'over') startGame(); else togglePause();
  pauseBtn.blur();
});
function refreshSpeedBtn(){
  const locked = mode === 'daily' && state !== 'title';
  speedBtn.textContent = locked ? 'Speed: daily' : SPEEDS[speedChoice].label;
  speedBtn.title = locked ? 'Daily challenges are always played at Normal speed so scores are fair' : '';
}
function cycleSpeed(){
  if(mode === 'daily' && state !== 'over' && state !== 'title'){ refreshSpeedBtn(); return; }
  if(state === 'over') mode = 'classic';
  speedChoice = (speedChoice + 1) % SPEEDS.length;
  if(mode === 'classic' && state !== 'over' && state !== 'title') runSpeed = Math.min(runSpeed, speedChoice);
  refreshSpeedBtn(); updateHud();
  try{ localStorage.setItem('axolotl-chase:speed', String(speedChoice)); }catch(e){}
}
speedBtn.addEventListener('click', cycleSpeed);
soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
soundBtn.setAttribute('aria-pressed', String(soundOn));
if(window.matchMedia('(pointer: coarse)').matches){
  const keys = document.querySelector('.keys');
  if(keys) keys.textContent = 'Swipe anywhere to steer \u00b7 or use the pad';
}
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  store.set('sound', soundOn);
  soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  if(!soundOn){ silenceAmbience(); if(actx && actx.suspend) actx.suspend(); }
  else { ambWant = -1; sfxClick(); }
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ saveStats(); silenceAmbience(); }
  if(document.hidden && state === 'playing') togglePause();
});

/* ----------------------------- boot ---------------------------- */
resetGrid(); placeActors(); drawLives(); updateHud();
refreshSpeedBtn();
pauseBtn.textContent = 'Play';                    // the game opens on the title screen
showTitle();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
