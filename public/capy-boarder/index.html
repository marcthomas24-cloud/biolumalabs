      this.reward('perfect', VIEW_WIDTH / 2, 300, 'CHAOS MODE!', { sub: 'MORE OF EVERYTHING!', colours: ['#ff5fa2', COLOR.gold, '#ffffff'], haptic: 'major' });
      this.boost.need = CHAOS.boostStreak;
      this.capy.play('hype');
      sfxChaos();
      this.quips.quip('chaos');
    }
  }

  /* ── the ghost ────────────────────────────────────────────────────────── */

  /** What he is doing now, as the ghost's one digit (ghost.js STATE). */
  _ghostState() {
    const r = this.runner, E = this.trickEngine;
    if (this.stumble > 0) return GHOST.stumble;
    if (E.manual) return GHOST.manual;
    if (r.surface) return GHOST.grind;
    if (E.active) return E.active.trick.grab ? GHOST.grab : GHOST.flip;
    if (r.airborne) return GHOST.air;
    return this.boost.active ? GHOST.boost : GHOST.ride;
  }

  /** Records this run, moves the ghost on, and notices overtaking it and beating its score. */
  _ghost(dt) {
    const r = this.runner;
    this.recorder.sample(this.elapsed, r.distance, r.y, this._ghostState());
    if (!this.ghost) return;
    const g = this.ghostNow = this.ghost.at(this.elapsed);
    if (g.state !== this.ghostState) {
      this.ghostState = g.state;
      this.ghostCapy.play(POSE[g.state] ?? 'idle');
    }
    this.ghostCapy.update(dt);
    // Passing the ghost on the track: a small cheer (not more than every few seconds, as you swap places).
    const ahead = r.distance > g.distance + 12;
    if (ahead && !this.ghostAhead && this.elapsed > 2 && this.t - this.overtakeAt > 4) {
      this.overtakeAt = this.t;
      this.float(RIDER_X + 70, GROUND_Y - r.y - 170, 'OVERTAKE!', '#bfe9ff', 26);
      sfx.sfxChirp();
      buzz('light');
    }
    this.ghostAhead = ahead;
    // Beating the ghost's score: the big moment, once, mid-run.
    if (!this.ghostBeaten && !this.course.endless && this.hud.score > this.ghost.score) {
      this.ghostBeaten = true;
      // The shared reactions call a new best the moment the score passes the stored one, usually this
      // very step (the ghost is the best run): then that is the celebration, and this is only the quip.
      this.quips.quip('ghost');
      if (this.reactions.beatenBest) return;
      this.reward('perfect', VIEW_WIDTH / 2, 300, 'BEST BEATEN!', { colours: [COLOR.gold, '#ffffff', '#bfe9ff'] });
      this.burst(RIDER_X, GROUND_Y - r.y - 60, { n: 36, colours: [COLOR.gold, '#ffffff', '#bfe9ff'], speed: 300 });
      this.capy.play('celebrate');
      sfx.sfxNewBest();
      buzz('major');
    }
  }

  /** At the end: this run becomes the ghost if it beat the old one (score; distance in an endless run). */
  _keepGhost(metres = 0) {
    const c = this.course;
    const old = this.ghost?.trace;
    const better = c.endless ? metres > (old?.metres ?? 0) : this.hud.score > (old?.score ?? -1);
    if (!better) return false;
    keepGhost(c.id, this.recorder.trace(this.hud.score, this.elapsed, c.endless ? { metres } : {}));
    return true;
  }

  /** The trail, then the ghost, then Capy: the ghost rides behind him. */
  _drawRider(ctx) {
    this._drawGhost(ctx);
    super._drawRider(ctx);
  }

  /**
   * The ghost: Capy on a plain board, drawn whole to a small canvas and laid
   * down see-through and pale blue (drawn straight onto the scene, each of his
   * overlapping parts would show through the next), with BEST over his head.
   * Off the screen ahead, a marker at the edge says how far ahead he is. In an
   * endless run the course is new each time, so he is a pacer on the floor.
   */
  _drawGhost(ctx) {
    const g = this.ghostNow;
    if (!g || this.phase === 'results') return;
    const x = this._sx(g.distance);
    const y = GROUND_Y - (this.course.endless ? 0 : g.y);
    const { right } = getBounds();
    if (DEV.ghost) this._drawGhostTrace(ctx);
    if (x > right + 40) {
      // Out of sight ahead: how far, at the edge of the play area.
      const m = Math.max(1, Math.round((g.distance - this.runner.distance) / DIST_UNIT));
      this.pill(ctx, VIEW_WIDTH - 82, GROUND_Y - 210, `BEST ${m} m \u25b6`, { size: 16, tone: 'ink' });
      return;
    }
    if (x < getBounds().left - 60) return;
    const off = this.ghostArt?.[POSE[this.ghostState] ?? 'idle'] ?? this.ghostArt?.idle;
    if (off) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.drawImage(off, x - GHOST_W / 2, y - GHOST_FEET, GHOST_W, GHOST_H);
      ctx.restore();
    }
    // BEST over his head, once he is far enough from Capy to be told apart.
    const apart = Math.abs(x - RIDER_X);
    if (apart > 30) {
      ctx.save();
      ctx.globalAlpha = 0.85 * Math.min(1, (apart - 30) / 40);
      this.pill(ctx, x, y - 168, 'BEST', { size: 14, tone: 'ink' });
      ctx.restore();
    }
  }

  /**
   * The ghost's pictures: Capy on a plain board in each pose he can be in,
   * drawn whole to its own small canvas and washed pale blue (drawn straight
   * onto the scene, see-through, each of his overlapping parts would show
   * through the next). Drawn once, before GO; the run only lays them down.
   */
  _bakeGhost() {
    if (typeof document === 'undefined') return;
    if (ghostArtCache) {
      this.ghostArt = ghostArtCache;
      return;
    }
    const art = {};
    const capy = this.ghostCapy;
    for (const pose of new Set(POSE)) {
      const canvas = document.createElement('canvas');
      canvas.width = GHOST_W * GHOST_RES;
      canvas.height = GHOST_H * GHOST_RES;
      const o = canvas.getContext('2d');
      capy.play(pose);
      for (let i = 0; i < 30; i++) capy.update(1 / 60);
      o.setTransform(GHOST_RES, 0, 0, GHOST_RES, (GHOST_W / 2) * GHOST_RES, GHOST_FEET * GHOST_RES);
      o.scale(RIDER_DRAW, RIDER_DRAW);
      o.save();
      o.translate(0, -8);
      drawBoard(o, this.ghostSkin, 0);
      o.restore();
      capy.draw(o, 0, -12, { scale: CAPY_SCALE, facing: 'front', holdingProp: false });
      o.setTransform(1, 0, 0, 1, 0, 0);
      o.globalCompositeOperation = 'source-atop';
      o.fillStyle = 'rgba(170,225,255,0.55)';
      o.fillRect(0, 0, canvas.width, canvas.height);
      art[pose] = canvas;
    }
    capy.play('idle');
    this.ghostArt = ghostArtCache = art;
  }

  /** Developer mode: where the ghost will be over the next three seconds. */
  _drawGhostTrace(ctx) {
    ctx.save();
    ctx.strokeStyle = '#bfe9ff';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    for (let i = 0; i <= 30; i++) {
      const p = this.ghost.at(this.elapsed + i * 0.1);
      const px = this._sx(p.distance), py = GROUND_Y - (this.course.endless ? 0 : p.y);
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }

  /** Developer mode: the ghost's numbers. */
  devLines() {
    if (!DEV.ghost) return [];
    if (!this.ghost) return ['ghost: none yet (finish a run)'];
    const g = this.ghostNow;
    return [`ghost score ${this.ghost.score}  ${g ? `${Math.round(this.runner.distance - g.distance)} px ${this.ghostAhead ? 'ahead' : 'behind'}  state ${g.state}` : ''}`,
      `ghost samples ${this.ghost.dist.length}  beaten ${this.ghostBeaten}`];
  }

  /** A set piece coming up gets its name called, a couple of seconds before it arrives. */
  _setPieces(dt) {
    if (this.setCall) {
      this.setCall.t -= dt;
      if (this.setCall.t <= 0) this.setCall = null;
    }
    const next = this.sets[0];
    if (!next) return;
    const r = this.runner;
    if ((next.x - r.distance) / Math.max(1, r.speed || this.course.speed) <= SET_CALL_LEAD) {
      this.sets.shift();
      this.setCall = { text: next.set, t: SET_CALL_TIME };
      sfx.sfxCall();
    }
  }

  /**
   * An ollie on a ramp is the ramp's launch, not a small hop off it: a child
   * who taps on the way up still gets the big air the ramp promises.
   */
  _ollieBoost() {
    const r = this.runner;
    const ramp = r.obstacles.find((o) => o.kind === 'ramp' && !o.used && r.distance >= o.x && r.distance <= o.x + o.w + 12);
    if (!ramp) return 1;
    ramp.used = true;
    // Launched off a ramp is something done: the trick on the way pays in full.
    this.trickEngine.noteClear();
    return TUNING.ramp.boost;
  }

  /**
   * The cue: a "now!" before the next thing to jump, timed so that a child who
   * reacts in TUNING.prompt.reaction jumps in the middle of that piece's
   * window (courses.js jumpWindow): a wide puddle wants a later jump than a
   * cone, a rail an earlier one. Worked out at the speed he is going, so a
   * boost or a stumble moves it too.
   */
  _cue() {
    const r = this.runner;
    this.cue = null;
    if (!this.course.cues || r.airborne || r.surface) return;
    const speed = Math.max(this.course.speed * 0.5, r.speed || this.course.speed);
    for (const o of r.obstacles) {
      if (o.hit || o.overRamp || !JUMP_PIECES.includes(o.kind)) continue;
      const tta = (o.x - r.distance - RIDER_W / 2) / speed;
      if (tta < 0) continue;
      if (tta <= this._cueLead(o, speed)) this.cue = this._cueOf(o, tta, false);
      break;
    }
    if (this.cue) return;
    // A stretch for a manual coming up: "press and hold", early enough to ollie in and land on it.
    for (const o of r.obstacles) {
      if (o.kind !== 'pad' || o.x + o.w < r.distance + 200) continue;
      const tta = (o.x - r.distance) / speed;
      if (tta <= TUNING.cue.manualLead && !this.trickEngine.manual) this.cue = this._cueOf(o, tta, true);
      break;
    }
  }

  /** The cue, one object reused every frame it shows. */
  _cueOf(piece, tta, hold) {
    const c = this._cueObj ?? (this._cueObj = {});
    c.piece = piece;
    c.tta = tta;
    c.hold = hold;
    return c;
  }

  /** Seconds before a piece that its cue shows: the middle of its jump window, plus a child's reaction. */
  _cueLead(o, speed) {
    const win = jumpWindow(o.kind, o.w, speed);
    if (!win) return TUNING.cue.lead;
    return Math.max(0.45, (win[0] + win[1]) / 2 + TUNING.prompt.reaction);
  }

  /** What the goals say right now. */
  _state(finished = false) {
    return state({
      engineStats: this.trickEngine.stats,
      score: this.hud.score,
      collected: this.collected,
      distance: this.runner.distance / this.finishAt,
      finished,
    });
  }

  /** A goal completing mid-run gets its moment. */
  _goals(dt) {
    for (const f of this.starFlights) f.t += dt;
    keepIf(this.starFlights, (f) => f.t < STAR_FLIGHT);
    const st = this._state(false);
    this.course.stars.forEach((g, i) => {
      if (this.goalPop[i] > 0) this.goalPop[i] = Math.max(0, this.goalPop[i] - dt * 1.6);
      if (g.kind === 'finish' || this.goalDone[i] || progress(g, st) < 1) return;
      this.goalDone[i] = true;
      this.goalPop[i] = 1;
      this.reward('great', VIEW_WIDTH / 2, 230, 'STAR!', { colours: [COLOR.gold, '#ffffff', '#ffe066'], haptic: null });
      // A star flies from Capy up to its place in the row of goals; the run carries on underneath.
      this.starFlights.push({ i, t: 0, x: RIDER_X, y: GROUND_Y - this.runner.y - 90 });
      this.capy.play('celebrate');
      sfxStar();
      feel('star');
      this.quips.quip('star');
    });
  }

  /* ── the run's challenge ──────────────────────────────────────────────── */

  /** What the challenges count, from this run. */
  _challengeStats() {
    const s = this.trickEngine.stats, by = s.byTrick;
    return {
      flips: (by.flip ?? 0) + (by.doubleFlip ?? 0), doubles: by.doubleFlip ?? 0,
      grabs: (by.noseGrab ?? 0) + (by.tailGrab ?? 0), combo: s.bestBanked, oranges: this.collected,
      grinds: s.grinds, boosts: this.boostsUsed, manual: s.manualTime, score: this.hud.score,
    };
  }

  /** Done: a cheer and its coins (paid at the finish), and on with the run. */
  _challenge(dt) {
    if (this.challengePop > 0) this.challengePop = Math.max(0, this.challengePop - dt * 1.4);
    if (this.challengeDone || !challengeProgress(this.challenge, this._challengeStats()).done) return;
    this.challengeDone = true;
    this.challengePop = 1;
    track('challenge_done', { course: this.course.id, challenge: this.challenge.id });
    this.reward('great', VIEW_WIDTH / 2, 300, 'CHALLENGE COMPLETE!', { colours: [COLOR.gold, '#ffffff', '#7cfc9b'], haptic: 'strong' });
    this.float(VIEW_WIDTH / 2, 350, `+${CHALLENGE_COINS} COINS`, COLOR.gold, 28);
    sfxMission();
  }

  /**
   * The challenge, on the right under the goals' counts: its icon and words and
   * how far along, gold with a tick once done.
   */
  _drawChallenge(ctx) {
    const ch = this.challenge;
    if (!ch) return;
    const { value } = challengeProgress(ch, this._challengeStats());
    const done = this.challengeDone;
    const text = done ? `${ch.text} \u2713` : `${ch.text}  ${Math.min(ch.target, Math.floor(value))}/${ch.target}`;
    const k = 1 + Math.sin(this.challengePop * Math.PI) * 0.25;
    ctx.save();
    ctx.font = font(12, WEIGHT.display);
    // Right of the goals and under their counts (clear of the third goal), out with the HUD corner.
    const w = Math.min(176, ctx.measureText(text).width + 40);
    const right = VIEW_WIDTH - 14 + hudShift();
    ctx.translate(right - w / 2, 196);
    ctx.scale(k, k);
    ctx.fillStyle = done ? 'rgba(199,154,23,0.92)' : 'rgba(10,13,22,0.72)';
    ctx.beginPath();
    ctx.roundRect(-w / 2, -13, w, 26, 13);
    ctx.fill();
    drawGoal(ctx, -w / 2 + 14, 0, 10, { kind: ch.icon }, done ? 1 : 0);
    ctx.fillStyle = done ? COLOR.goldInk : COLOR.ink;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, -w / 2 + 30, 1, w - 38);
    ctx.restore();
  }

  /* ── missions ─────────────────────────────────────────────────────────── */

  /** The run's numbers as the missions count them. */
  _snap(finished = false) {
    const s = this.trickEngine.stats;
    return {
      grinds: s.grinds,
      flips: (s.byTrick.flip ?? 0) + (s.byTrick.doubleFlip ?? 0),
      collect: this.collected,
      manual: s.manualTime,
      combo: s.bestBanked,
      score: this.hud.score,
      finish: finished ? 1 : 0,
      grabs: (s.byTrick.noseGrab ?? 0) + (s.byTrick.tailGrab ?? 0),
      doubles: s.byTrick.doubleFlip ?? 0,
      boosts: this.boostsUsed,
      smashes: this.smashes,
    };
  }

  /** Feeds the missions, celebrates any that finish, and keeps the save up to date. */
  _missions(dt, finished = false) {
    for (let i = 0; i < this.missionPop.length; i++) this.missionPop[i] = Math.max(0, this.missionPop[i] - dt * 1.6);
    // A new mission's reveal waits while a combo is up (the meter and its calls own that bit of sky).
    const busy = (this.trickEngine.meter()?.count ?? 0) >= 2;
    if (this.missionReveal && !busy && (this.missionReveal.t += dt) > REVEAL_TIME + 0.8) this.missionReveal = null;
    const done = this.missions.observe(this._snap(finished));
    for (const { slot, def } of done) {
      this.missionPop[slot] = 1;
      this.missionsDone.push(def);
      track('mission_completed', { mission: def.id, reward: def.reward });
      this.reward('great', VIEW_WIDTH / 2, 300, 'MISSION COMPLETE!', { colours: ['#ffd54a', '#ffffff', '#ffb300'], haptic: 'strong' });
      this.float(VIEW_WIDTH / 2, 350, `+${def.reward} COINS`, COLOR.gold, 28);
      // ...and then what replaced it, in the corner where the missions live.
      this.missionReveal = { slot, t: 0, id: this.missions.state.active[slot].id };
      sfxMission();
    }
    this.missionFlush -= dt;
    if (done.length || (this.missions.dirty && this.missionFlush <= 0)) this._commitMissions();
  }

  _commitMissions() {
    commitMissions(this.missions.state, this.missions.takeCoins());
    this.missions.dirty = false;
    this.missionFlush = 2;
  }

  /** Leaving mid-run keeps what the missions have counted so far. */
  exit() {
    if (this.missions?.dirty) this._commitMissions();
  }

  _clip(o) {
    if (!this.boost.active) this.clips++;
    super._clip(o);
  }

  /* ── the end ──────────────────────────────────────────────────────────── */

  resultLines() {
    const s = this.trickEngine.stats;
    const coins = this.runCoins > 0 ? [['Coins', `+${this.runCoins}`]] : [];
    if (this.course.endless) {
      const e = this.endlessResult;
      return [['Distance', `${e.metres} m`], [e.isNew ? 'New best distance' : 'Best distance', `${Math.max(e.best, e.metres)} m`], ['Tricks landed', s.tricks], ...coins];
    }
    return [...this.courseLines(s), ...coins];
  }

  /** The lines a course's card shows, by what it teaches. */
  courseLines(s) {
    const flips = (s.byTrick.flip ?? 0) + (s.byTrick.doubleFlip ?? 0);
    switch (this.course.teaches) {
      case 'ollie': return [['Cleared', this.cleared], ['Oranges', `${this.collected}/${this.oranges}`]];
      case 'flip': return [['Flips', flips], ['Cleared', this.cleared]];
      case 'manual': return [['Manual', `${s.manualTime.toFixed(1)} s`], ['Cleared', this.cleared]];
      case 'grind': return [['Grinds', s.grinds], ['Cleared', this.cleared]];
      case 'collect': return [['Oranges', `${this.collected}/${this.oranges}`], ['Tricks', s.tricks]];
      default: return [['Combo', s.bestBanked >= 2 ? `x${s.bestBanked}` : '-'], ['Tricks', s.tricks]];
    }
  }

  finish() {
    const c = this.course;
    if (c.endless) return this._finishEndless();
    const before = goalsMet(c.id);
    const ghostBefore = this.ghost?.score ?? null;
    this.results_newGhost = this._keepGhost();
    const st = this._state(true);
    const metNow = met(c, st);
    const fresh = recordGoals(c.id, metNow);
    this.runCoins = coinsForRun({ freshStars: fresh.length, oranges: this.collected }) + (this.challengeDone ? CHALLENGE_COINS : 0);
    addCoins(this.runCoins);
    super.finish();                          // records the score and counts the round
    const next = nextOpen(c.id);
    const earned = goalsMet(c.id);
    this.results.next = next;
    // A fanfare only for a course that has just opened.
    this.results.unlocked = next && !this.nextWasOpen ? next : null;
    this.hud.freshUnlock = this.results.unlocked;
    this.results.strip = {
      goals: c.stars,
      // What the card shows: every star ever earned, so a worse run never shows a star taken away.
      met: earned,
      fresh,
      progress: c.stars.map((g) => progress(g, st)),
      before,
    };
    this.results.stars = earned.filter(Boolean).length;
    this.results.metThisRun = metNow;
    this.hud.courseProgress = 1;
    this._missions(0, true);
    this._commitMissions();
    this._cardExtras(st, earned, ghostBefore);
  }

  /**
   * What the results card needs beyond the score: the course, coins, the
   * missions, a place that has just opened, the ghost, and the reasons to go again.
   */
  _cardExtras(st, earned, ghostBefore, endless = null) {
    const R = this.results;
    this.hud.cardUp = true;
    const c = this.course;
    R.course = c;
    const s = this.trickEngine.stats;
    R.chips = c.endless ? [['Tricks', s.tricks], ['Oranges', this.collected]] : this.courseLines(s);
    R.coins = this.runCoins + this.missionsDone.reduce((n, d) => n + d.reward, 0);
    R.missions = { active: this.missions.state.active.map((a) => ({ ...a })), done: this.missionsDone.slice() };
    R.ghost = { had: ghostBefore, beaten: ghostBefore !== null && this.hud.score > ghostBefore, saved: !!this.results_newGhost };
    // A place that this run opened: the card's biggest news, with a button straight there.
    const opened = LOCATION_ORDER.find((id) => !this.placesOpen.includes(id) && locationOpen(id) && coursesIn(id).length);
    if (opened) {
      R.location = { id: opened, name: LOCATIONS[opened].name, tagline: LOCATIONS[opened].tagline ?? '' };
      R.goTo = coursesIn(opened)[0].id;
    } else {
      // Its stars are in but it waits behind UNLOCK EVERYTHING (unlock.js): still the news, with the way to it.
      const gated = LOCATION_ORDER.find((id) => !this.placesGated.includes(id) && locationGated(id));
      if (gated) {
        R.location = { id: gated, name: LOCATIONS[gated].name, tagline: 'READY! UNLOCK EVERYTHING TO GO', gated: true };
        R.goTo = `unlock:${gated}`;
      }
    }
    R.challenge = { ...this.challenge, done: this.challengeDone };
    this.finishedOnce = true;
    if (!c.endless) {
      track('course_completed', { course: c.id, score: this.hud.score, stars: R.stars, new_stars: R.strip?.fresh?.length ?? 0, seconds: this.elapsed, best: !!R.newBest });
      for (const i of R.strip?.fresh ?? []) track('star_earned', { course: c.id, star: i + 1 });
    }
    if (R.ghost.beaten) track('ghost_beaten', { course: c.id, score: this.hud.score });
    if (R.location) track('location_unlocked', { place: R.location.id });
    R.why = whyAgain({
      course: c, st, earned, score: this.hud.score, best: R.prevBest ?? 0, newBest: !!R.newBest,
      challenge: challengeReason(this.challenge, this._challengeStats()),
      missions: this.missions.state, data: load(), endless,
    });
  }

  /** An endless run's end: score and distance, and whether either is a best. No stars, no next. */
  _finishEndless() {
    const c = this.course;
    const metres = Math.round(this.runner.distance / DIST_UNIT);
    const best = bestDistanceOf(c.id);
    this._keepGhost(metres);
    const medalBefore = medalOf(c.id);
    const medalNew = recordMedal(c.id, this.medalsReached);
    this.endlessResult = { metres, best, isNew: recordDistance(c.id, metres) };
    this.runCoins = coinsForRun({ oranges: this.collected }) + (this.challengeDone ? CHALLENGE_COINS : 0);
    addCoins(this.runCoins);
    super.finish();
    this.results.next = null;
    this.results.distance = metres;
    this.hud.courseProgress = 1;
    this._missions(0, true);
    this._commitMissions();
    this._cardExtras(this._state(true), [true, true, true], null, { metres, best, next: nextMedal(c.id, metres) });
    const won = this.medals[this.medalsReached - 1];
    this.results.medal = won ? { ...won, isNew: medalNew, before: medalBefore } : null;

/**
 * CapyBoarder's courses, as data. A course is a list of pieces placed along a
 * track, how fast it runs, and its three star goals. Nothing in here draws or
 * plays: course-run.js lays the pieces out and plays them, goals.js judges the
 * stars, and tools/check-courses.mjs checks every course against the rules.
 *
 *   {
 *     id, location, name,
 *     teaches,          what the course is about: 'ollie' | 'flip' | 'grind' | 'manual' | 'combo' | 'collect'
 *     fantasy,          the course's idea in a few words ("Big-air challenge")
 *     finale,           true for a place's last course: the mastery run, allowed to be longer
 *     speed,            px of track per second (base speed: stumbles slow it, the boost speeds it)
 *     seconds,          how long it runs at base speed; the finish line is speed * seconds along
 *                       (worked out from the layout: the last piece, then RUN_OUT)
 *     cues,             show the "now!" cue before things to jump (the early courses)
 *     prompts,          false: no flip prompt in the air (the course hasn't introduced flips yet)
 *     demo,             the ghost-hand gesture for the one thing the course introduces:
 *                       { until: 'ollie'|'flip'|'grind'|'grab', gesture: { kind, from, to? } }
 *     pieces,           [{ at, kind, set?, ...}] along the track, `at` in px from the start;
 *                       `set` names a set piece, called out as it comes
 *     stars,            exactly three goals (goals.js): the first is always { kind: 'finish' }
 *   }
 *
 * PIECES (`kind`)
 *   cone | bench | puddle   obstacles: jump them, or it is a stumble (never a fail)
 *   gap                     a hole in the floor: be in the air over it
 *   rail | ledge            land on top and grind, all by itself
 *   ramp                    roll over it and it launches you, for tricks
 *   orange                  a collectible, centred `y` px above the floor (high ones are for jumping)
 *   pad                     a clear stretch painted for a manual: keep a finger down on it
 * Any piece's `w` can be overridden (a long boardwalk rail), and a gap is drawn by its
 * place: steps in City Streets, missing planks over water on the boardwalk.
 *   (flat is the track between pieces)
 * The finish line is added at `speed * seconds`; a course always reaches it.
 *
 * SHAPE. Every course is written as sections (see "authoring" below): an
 * opening rhythm, a learning section, a set piece, a recovery, a second set
 * piece, a final challenge, and the run-out to the finish. Standard courses
 * run 45–60 s at base speed, a place's finale 60–75 s (COURSE_SECONDS), and
 * endless runs 90 s. tools/check-courses.mjs checks every rule below, and
 * tools/sim-courses.mjs plays every course as four kinds of player.
 */

const { TUNING } = __require('boarder/tricks.js');

/** How long a course may run at base speed, by kind. */
const COURSE_SECONDS = { standard: [45, 60], finale: [60, 75], endless: [90, 90] };

/** Seconds of empty track before the first piece, after GO. */
const LEAD_IN = 5.5;
/** Seconds of clear track between the last piece and the finish line. */
const RUN_OUT = 2.2;

/** Size of each piece, in track px (and height above the floor, for what can be landed on). */
const PIECE = {
  cone: { w: 34, h: 46 },
  bench: { w: 84, h: 50 },
  puddle: { w: 96, h: 10 },
  gap: { w: 130, h: 1 },
  rail: { w: 300, h: 64, rideable: true },
  ledge: { w: 240, h: 42, rideable: true },
  ramp: { w: 150, h: 0, scenery: true },
  orange: { w: 28, h: 0, scenery: true },
  pad: { w: 700, h: 0, scenery: true },
  bestflag: { w: 30, h: 0, scenery: true },
};

/** The pieces a rider has to jump or land on: what the "now!" cue is for. */
const JUMP_PIECES = ['cone', 'bench', 'puddle', 'gap', 'rail', 'ledge'];

/* ── the physics a course is laid out against ─────────────────────────────── */

/** Half the rider's width: what of him has to be clear of a piece (core/skate-run.js RIDER_W). */
const RIDER_HALF = 22;
const G = TUNING.jump.gravity;
const OLLIE = TUNING.jump.speed;
/** A ramp's launch speed: harder than an ollie. */
const RAMP_SPEED = OLLIE * TUNING.ramp.boost;
/** How far along a ramp it launches you, as a fraction of its width (course-run.js). */
const RAMP_LAUNCH = 0.78;
/** How far past a ramp's start the launch carries you: pieces within it are flown over, not jumped. */
const RAMP_REACH = 520;

/** Height after `t` seconds of a jump that left at `v0` (up) from the floor. */
const heightAt = (v0, t, h0 = 0) => h0 + v0 * t - (G * t * t) / 2;
/** Seconds until a jump that left at `v0` from height `h0` comes back down to height `h`. */
const flight = (v0, h = 0, h0 = 0) => (v0 + Math.sqrt(v0 * v0 + 2 * G * (h0 - h))) / G;
/** Seconds until a jump that left at `v0` from `h0` rises past height `h` (0 if it starts above it). */
const rise = (v0, h, h0 = 0) => (h0 >= h ? 0 : (v0 - Math.sqrt(Math.max(0, v0 * v0 - 2 * G * (h - h0)))) / G);
/** The top of an ollie, and of a ramp's launch. */
const OLLIE_TOP = (OLLIE * OLLIE) / (2 * G);
const RAMP_TOP = (RAMP_SPEED * RAMP_SPEED) / (2 * G);

/**
 * When to ollie for a piece: [earliest, latest] seconds before the rider's
 * front edge reaches it, at `v` px/s, for a clean clear (an obstacle or a gap)
 * or a landing on top (a rail or ledge). Null if there is no such moment.
 * The "now!" cue is timed from the middle of this (course-run.js), and the
 * simulated players aim for it (tools/boarder-bot.js).
 */
function jumpWindow(kind, w, v) {
  const h = Math.max(1, PIECE[kind].h);
  const up = rise(OLLIE, h), down = flight(OLLIE, h);
  const R = 2 * RIDER_HALF;
  if (PIECE[kind].rideable) {
    // Above its top by the time the rider is a quarter of the way onto it (or it is a clip),
    // and coming down through its top with his middle at least 20 px inside it.
    const lo = Math.max(up - RIDER_HALF / 2 / v, down - (w + RIDER_HALF - 20) / v, 0);
    const hi = down - (RIDER_HALF + 20) / v;
    return hi > lo ? [lo, hi] : null;
  }
  const lo = up;
  const hi = down - (w + R) / v;
  return hi > lo ? [lo, hi] : null;
}

const width = (kind, extra) => extra?.w ?? PIECE[kind].w;
const finishAt = (c) => c.speed * c.seconds;

/* ── authoring: sections and set pieces ───────────────────────────────────── */

/**
 * A course is written as sections laid end to end. A section is
 *   { rest, parts: [[dx, kind, extra?]], set? }
 * `rest` is seconds of clear track before it (from the end of the section
 * before); `parts` are pieces at `dx` px from the section's start; `set` names
 * a set piece, which the run calls out as it comes (course-run.js).
 * The builders below return sections; most take the course's speed `v`,
 * because what a jump reaches depends on how fast you are going.
 */

/** The far end of a section's pieces, in px from its start. */
const span = (parts) => Math.max(...parts.map(([dx, kind, extra]) => dx + width(kind, extra)));

/** An orange hung over the middle of a piece `w` wide that starts at `dx`. */
const over = (dx, w, y = 175) => [dx + w / 2 - PIECE.orange.w / 2, 'orange', { y }];

/** One piece, after `rest` seconds. */
const one = (kind, rest = 1.6, extra = undefined) => ({ rest, parts: [[0, kind, extra]] });

/** One piece with an orange over it, where a jump reaches. */
const juicy = (kind, rest = 1.6, y = 175) => ({ rest, parts: [[0, kind], over(0, PIECE[kind].w, y)] });

/** A ramp, and a cone after it to ollie (the flip course's beat). */
const rampCone = (rest = 1.8) => ({ rest, parts: [[0, 'ramp'], [640, 'cone']] });

/** Pieces in a row, `gap` seconds apart (end of one to the start of the next), each with an orange if `oranges`. */
function beats(v, kinds, gap, { rest = 1.6, oranges = false, set } = {}) {
  const parts = [];
  let at = 0;
  for (const kind of kinds) {
    const k = typeof kind === 'string' ? [kind] : kind;
    parts.push([at, k[0], k[1]]);
    if (oranges && k[0] !== 'gap') parts.push(over(at, width(k[0], k[1])));
    at += width(k[0], k[1]) + gap * v;
  }
  return { rest, parts, set };
}

/** Where a ramp's launch takes you `t` seconds later: [dx from the ramp's start, height]. */
const rampArc = (v, t) => [PIECE.ramp.w * RAMP_LAUNCH + v * t, heightAt(RAMP_SPEED, t)];

/** BIG HOP: a ramp with three oranges strung along the arc it throws you on. Nothing to hit. */
function bigHop(v, { rest = 2, set = 'BIG HOP!' } = {}) {
  const parts = [[0, 'ramp']];
  for (const t of [0.3, 0.55, 0.8]) {
    const [x, y] = rampArc(v, t);
    parts.push([Math.round(x - PIECE.orange.w / 2), 'orange', { y: Math.round(y + 20) }]);
  }
  return { rest, parts, set };
}

/** A ramp over a hole: steps in the city, missing planks on the boardwalk. `w` is checked against the launch. */
const rampGap = (w, { rest = 1.8, set } = {}) => ({ rest, parts: [[0, 'ramp'], [162, 'gap', { w }]], set });

/**
 * A ramp that drops you onto a rail or ledge: placed so the launch comes down
 * a third of the way along it, ready for a flip on the way.
 */
function rampTo(v, kind, w, { rest = 1.8, set, oranges = 0 } = {}) {
  const h = PIECE[kind].h;
  const land = PIECE.ramp.w * RAMP_LAUNCH + flight(RAMP_SPEED, h) * v;
  const x = Math.round(land - w * 0.3);
  const parts = [[0, 'ramp'], [x, kind, { w }]];
  for (let i = 0; i < oranges; i++) parts.push([Math.round(x + w * (0.4 + (0.5 * i) / Math.max(1, oranges - 1)) - 14), 'orange', { y: h + 50 }]);
  return { rest, parts, set };
}

/** A long rail or ledge with oranges along it, picked up just by grinding it. */
function long(kind, w, n, { rest = 1.8, set } = {}) {
  const h = PIECE[kind].h;
  const parts = [[0, kind, { w }]];
  for (let i = 0; i < n; i++) parts.push([Math.round(60 + ((w - 120) * i) / Math.max(1, n - 1)), 'orange', { y: h + 50 }]);
  return { rest, parts, set };
}

/**
 * Rails and ledges in a line, CHAIN_GAP seconds apart: pop off near the end of
 * one (TUNING.grind.pop, a bigger jump than an ollie) and you come down on the
 * next, the combo still going. Ride off the end instead and there is still
 * time to land, see the cue and jump.
 */
function chain(v, items, { rest = 1.8, set } = {}) {
  const parts = [];
  let at = 0;
  for (const [kind, w] of items) {
    parts.push([at, kind, { w }]);
    at += w + CHAIN_GAP * v;
  }
  return { rest, parts, set };
}

/** Seconds of track between the rails and ledges of a chain. */
const CHAIN_GAP = 0.78;

/** A stretch painted for a manual, with oranges along it if `n`. */
function pad(w, { rest = 1.2, n = 0, set } = {}) {
  const parts = [[0, 'pad', { w }]];
  for (let i = 0; i < n; i++) parts.push([Math.round(120 + ((w - 240) * i) / Math.max(1, n - 1)), 'orange', { y: 40 }]);
  return { rest, parts, set };
}

/**
 * A course from its sections: the pieces laid out, and how long it runs (the
 * last piece, then RUN_OUT seconds to the finish line).
 */
function course(meta, sections) {
  const v = meta.speed;
  const pieces = [];
  let at = LEAD_IN * v;
  sections.forEach((sec, i) => {
    if (i > 0) at += sec.rest * v;
    sec.parts.forEach(([dx, kind, extra], j) => {
      pieces.push({ at: Math.round(at + dx), kind, ...extra, ...(j === 0 && sec.set ? { set: sec.set } : {}) });
    });
    at += span(sec.parts);
  });
  pieces.sort((a, b) => a.at - b.at);
  const seconds = Math.ceil(at / v + RUN_OUT);
  return { cues: true, ...meta, seconds, pieces };
}

    juicy('cone', 1.8), juicy('puddle', 1.8), one('bench', 1.8), juicy('cone', 1.8), one('puddle', 1.6), juicy('bench', 1.8),

    beats(v, ['cone', 'puddle', 'cone', 'bench', 'cone'], 1.15, { rest: 2.2, set: 'FINAL STRETCH!' }),

})();

/** 4. Combo Park: the first serious combo. Ramp, flip, grind, ollie off, flip: link them without touching the floor. */
const COMBO_PARK = (() => {
  const v = 280;
  return course({
    id: 'park-4', location: 'park', name: 'Combo Park', teaches: 'combo', fantasy: 'First serious combo challenge',
    speed: v, finale: true,
    demo: { until: 'grab', gesture: { kind: 'swipe', from: { x: 200, y: 780 }, to: { x: 340, y: 780 } } },
    stars: [{ kind: 'finish' }, { kind: 'score', target: 140 }, { kind: 'combo', target: 6 }],
  }, [

    rampTo(v, 'ledge', 300, { rest: 1.8 }), one('cone', 1.6), rampTo(v, 'rail', 340, { rest: 1.8 }), one('cone', 1.6),
    // Set piece: ramp onto a ledge, ollie off onto a rail.
    chainAfter(rampTo(v, 'ledge', 300, { rest: 2.2, set: 'COMBO LINE!' }), v, [['rail', 360]]),
    one('cone', 2.4), one('puddle', 1.6), rampCone(1.8), one('rail', 1.8),
    // Set piece: a long rail full of oranges, launched onto from a ramp.
    rampTo(v, 'rail', 640, { rest: 2.2, set: 'BIG AIR!', oranges: 4 }),
    one('bench', 2.0), juicy('cone', 1.6),
    // Final challenge: everything at once.
    chainAfter(rampTo(v, 'ledge', 300, { rest: 2.2, set: 'FINAL COMBO!' }), v, [['rail', 340], ['ledge', 300]]),
    beats(v, ['cone', 'puddle', 'cone'], 1.0, { rest: 1.4 }),
    rampGap(180, { rest: 1.4 }),
  ]);
})();

/** A ramp-onto-a-rail section with more rails chained after it. */
function chainAfter(sec, v, items) {
  const parts = [...sec.parts];
  const last = sec.parts.filter(([, k]) => k === 'rail' || k === 'ledge').at(-1);
  let at = last[0] + width(last[1], last[2]) + CHAIN_GAP * v;
  for (const [kind, w] of items) {
    parts.push([Math.round(at), kind, { w }]);
    at += w + CHAIN_GAP * v;
  }
  return { ...sec, parts };
}

/** A place's courses, in play order (none yet for the places still to be built). */
function coursesIn(locationId) {

/** Every course, in play order. */

  FIRST_ROLL, FLIP_TIME, RAIL_RIDER, COMBO_PARK,
  SIDEWALK_MANUAL, LEDGE_HOP, STAIR_GAPS, DOWNTOWN_RUN,

const COURSE_IDS = COURSES.map((c) => c.id);

/* ── Endless: a place's own pieces, laid out as the run goes ─────────────── */

/** Metres are track px over this (the same unit the free run shows). */
const DIST_UNIT = 40;

/** How long an endless run lasts, and how fast it rolls (px/s), per place. */
const ENDLESS_SECONDS = 90;
const ENDLESS_SPEED = { park: 270, city: 300, beach: 320 };

const ENDLESS_NAMES = { park: 'Endless Skatepark', city: 'Endless City', beach: 'Endless Beach' };

/** The id of a place's endless mode, and the other way round. */

const ENDLESS_IDS = Object.keys(ENDLESS_SPEED).map(endlessId);
const isEndlessId = (id) => ENDLESS_IDS.includes(id);

/**

 * pieces the courses use, laid out the way those courses are known to be
 * landable (a ramp's launch comes down on what follows it; every jump has room
 * to react after the one before). `tier` is how far into the run it may appear:
 * 0 from the start, 1 from a third of the way in, 2 from two thirds. `parts` is
 * [offset, kind, width?]; `orange` marks where an orange hangs, [offset, height].
 */
const CHUNKS = {
  park: [
    { tier: 0, parts: [[0, 'cone']], orange: [[3, 175]] },
    { tier: 0, parts: [[0, 'bench']], orange: [[20, 170]] },
    { tier: 0, parts: [[0, 'puddle']] },

    { tier: 1, parts: [[0, 'ramp'], [250, 'gap', 150], [720, 'rail', 360], [1400, 'cone']], orange: [[900, 140], [1403, 175]] },
    { tier: 1, parts: [[0, 'ramp'], [760, 'rail', 400], [1500, 'cone']], orange: [[950, 130], [1503, 175]] },
    { tier: 2, parts: [[0, 'ramp'], [340, 'rail', 520], [1500, 'gap', 140], [1950, 'cone']], orange: [[600, 140]] },

/**
 * CHAOS MODE: the last stretch of an endless run (from CHAOS_AT of the way in).
 * Not just faster: the blocks change to the set pieces, built for combos and
 * stuffed with oranges, the rests between them tighten a little, the track
 * speeds up a touch (CHAOS.speed) and the boost comes round sooner and pays
 * more (course-run.js). A run builds to it rather than simply ending.
 */
const CHAOS_AT = 0.78;
const CHAOS = { speed: 1.08, boostStreak: 3, clearPay: 1.5, rest: 1.15 };

/** The set pieces CHAOS MODE is made of, per place, at speed `v`. */
const CHAOS_BLOCKS = {
  park: (v) => [
    chainAfter(rampTo(v, 'ledge', 300, { oranges: 2 }), v, [['rail', 340]]),
    bigHop(v),
    beats(v, ['cone', 'cone', 'cone'], 1.1, { oranges: true }),
    long('rail', 700, 4),
  ],
  city: (v) => [
    chainAfter(rampTo(v, 'ledge', 300, { oranges: 2 }), v, [['rail', 360]]),
    bigHop(v),
    beats(v, ['bench', 'ledge', 'bench'], 1.1, { oranges: true }),
    long('ledge', 600, 4),
    rampGap(200),
  ],
  beach: (v) => [
    chainAfter(rampTo(v, 'rail', 460, { oranges: 3 }), v, [['ledge', 300]]),
    bigHop(v),
    long('rail', 900, 5),
    beats(v, ['gap', 'gap', 'cone'], 1.1),
  ],
};

/** A small seeded random, so an endless run can be rebuilt (and checked) from its seed. */
function seeded(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/**
 * An endless run for a place, as a course (so the same scene plays it): pieces
 * from the place's blocks, calm at first, then closer together and busier.
 * Everything is laid out up front from `seed`. It lasts 90 s and ends on the
 * clock, never on a clip; there are no stars (`stars` is empty).
 */
function endlessCourse(locationId, seed = 1) {
  const speed = ENDLESS_SPEED[locationId];
  const blocks = CHUNKS[locationId];
  const rand = seeded(seed * 2654435761 + 12345);
  const end = speed * ENDLESS_SECONDS;
  const pieces = [];
  let at = LEAD_IN * speed;
  let lastBlock = -1;
  const chaosFrom = end * CHAOS_AT;
  const chaos = CHAOS_BLOCKS[locationId](speed);
  let lastChaos = -1;
  for (;;) {
    // How far into the run this is, 0..1: the ramp of difficulty. Rests shrink from 2.4 s of track to 1.1 s.
    const u = Math.min(1, at / end);
    if (at >= chaosFrom) {
      // CHAOS MODE: set pieces back to back, every orange hung.
      let i = Math.floor(rand() * chaos.length);
      if (i === lastChaos) i = (i + 1) % chaos.length;
      const sec = chaos[i];
      const length = span(sec.parts);
      if (at + length > end - speed * 2) break;
      for (const [dx, kind, extra] of sec.parts) pieces.push({ at: Math.round(at + dx), kind, ...extra });
      lastChaos = i;
      at += length + speed * CHAOS.rest;
      continue;
    }
    const tier = u < 1 / 3 ? 0 : u < 2 / 3 ? 1 : 2;
    const pool = blocks.map((b, i) => [b, i]).filter(([b, i]) => b.tier <= tier && b.tier >= tier - 1 && i !== lastBlock);
    const [block, index] = pool[Math.floor(rand() * pool.length)];
    const last = block.parts[block.parts.length - 1];
    const length = last[0] + (last[2] ?? PIECE[last[1]].w);
    if (at + length > end - speed * 2) break;
    for (const [dx, kind, w] of block.parts) pieces.push({ at: at + dx, kind, ...(w ? { w } : {}) });
    for (const [dx, y] of block.orange ?? []) if (rand() < 0.7) pieces.push({ at: at + dx, kind: 'orange', y });
    lastBlock = index;
    at += length + speed * (2.4 - 1.3 * u);
  }
  pieces.sort((a, b) => a.at - b.at);
  return {
    id: endlessId(locationId), location: locationId, name: ENDLESS_NAMES[locationId], teaches: 'endless',
    endless: true, speed, seconds: ENDLESS_SECONDS, cues: true, seed, chaosFrom,
    demo: null,
    pieces,
    stars: [],
  };
}

/** A course by id, an endless one made fresh (from `seed`, or a random one). */
function courseFor(id, seed = Math.floor(Math.random() * 1e9)) {
  if (BY_ID[id]) return BY_ID[id];
  const place = ENDLESS_IDS.includes(id) ? id.slice(0, -'-endless'.length) : null;
  return place ? endlessCourse(place, seed) : null;
}

/** Where a course's finish line is, in track px. */
function finishLine(course) {
  return finishAt(course);
}

/** The course after this one in its location, or null at the end. */
function courseAfter(id) {
  const i = COURSE_IDS.indexOf(id);
  if (i < 0) return null;
  const next = COURSES[i + 1];
  return next && next.location === COURSES[i].location ? next : null;
}

/** The shortest moment to jump for anything ollied, in seconds: room for a child's timing (about ±0.1 s). */
const MIN_WINDOW = 0.22;

/** The gestures a course's first-visit demo can show, and what each one teaches (boarder-run.js _gestureDone). */
const DEMOS = { tap2: ['ollie', 'grind'], swipe: ['flip', 'grab'], hold: ['manual'] };

/** Where in the safe zone a demo hand may move: below the HUD, clear of the back button and the boost handle. */
const DEMO_AREA = { x0: 120, x1: 520, y0: 560, y1: 900 };

/**
 * Checks a course against the rules; returns a list of problems (empty if it
 * is fine). Run over every course and many endless seeds by tools/check-courses.mjs.
 *
 *   duration       COURSE_SECONDS by kind; speed 150–400 px/s
 *   ordering       known pieces, in order, inside the run (after the lead-in, before the finish)
 *   spacing        0.9 s of clear track after anything jumped or landed, before the next
 *                  (a ramp may lead straight into what it launches you at)
 *   jumps          an ollie clears every gap with room to spare; a ramp's launch clears
 *                  every gap and piece it flies over and comes down past them
 *   grinds         a ramp onto a rail or ledge comes down on it, not short or past it
 *   manuals        a pad is long enough, clear of anything to jump, and gives the finger
 *                  0.9 s to come off the screen before the next jump
 *   oranges        each hangs where some jump reaches; a collect star has enough of them
 *   stars          three goals, finish first, each target within what the course offers
 *   demos          a known gesture, inside the play area, teaching what the course teaches
 *   finish         the run-out after the last piece is at least a second
 */
function validateCourse(c) {
  const bad = [];
  const where = c.id;
  const v = c.speed;
  if (!c.id || !c.name || !LOCATIONS[c.location]) bad.push(`${where}: needs id, name and a known location`);
  const [lo, hi] = COURSE_SECONDS[c.endless ? 'endless' : c.finale ? 'finale' : 'standard'];
  if (!(c.seconds >= lo && c.seconds <= hi)) bad.push(`${where}: ${c.seconds} s is outside ${lo}–${hi} s`);
  if (!(v >= 150 && v <= 400)) bad.push(`${where}: speed ${v}`);
  if (c.endless) { if (c.stars.length) bad.push(`${where}: an endless run has no stars`); }
  else if (!Array.isArray(c.stars) || c.stars.length !== 3) bad.push(`${where}: needs exactly three star goals`);
  else if (c.stars[0].kind !== 'finish') bad.push(`${where}: the first star is the finish`);
  const end = finishAt(c);
  const size = (p) => ({ ...PIECE[p.kind], ...(p.w ? { w: p.w } : {}) });

  // Ordering and spacing.
  let last = -Infinity, lastEnd = -Infinity, lastKind = null;
  for (const p of c.pieces) {
    if (!PIECE[p.kind]) { bad.push(`${where}: unknown piece ${p.kind} at ${p.at}`); continue; }
    const w = size(p).w;
    if (p.at < v * LEAD_IN - 1) bad.push(`${where}: ${p.kind} at ${p.at} is inside the lead-in`);
    if (p.at + w > end - v * 1.0) bad.push(`${where}: ${p.kind} at ${p.at} is too close to the finish`);
    if (p.at < last) bad.push(`${where}: pieces are out of order at ${p.at}`);
    last = p.at;
    if (JUMP_PIECES.includes(p.kind)) {
      // After a rail or ledge the rider is already up there: dropping off its end takes a moment,
      // so a chain's gap (CHAIN_GAP) is enough to land, see the cue and jump.
      const need = PIECE[lastKind]?.rideable ? CHAIN_GAP - 0.01 : 0.9;
      if (p.at - lastEnd < v * need && lastEnd > -Infinity && lastKind !== 'ramp') bad.push(`${where}: ${p.kind} at ${p.at} is only ${Math.round(p.at - lastEnd)} px after the last piece`);
    }
    if (JUMP_PIECES.includes(p.kind) || p.kind === 'ramp') {
      lastEnd = p.at + w;
      lastKind = p.kind;
    }
  }

  // Jumps and grinds: what a ramp launches you over and onto, and what an ollie has to clear.
  const launchFrom = (ramp) => ramp.at + PIECE.ramp.w * RAMP_LAUNCH;
  const rampBefore = (p) => c.pieces.find((q) => q.kind === 'ramp' && q.at < p.at && p.at - q.at <= RAMP_REACH);
  for (const p of c.pieces) {
    if (!JUMP_PIECES.includes(p.kind)) continue;
    const { w, h } = size(p);
    const ramp = rampBefore(p);
    if (ramp) {
      const x0 = launchFrom(ramp);
      if (PIECE[p.kind].rideable) {
        // Rising past its top before reaching it, and coming down on it.
        const up = x0 + rise(RAMP_SPEED, h) * v;
        const down = x0 + flight(RAMP_SPEED, h) * v;
        if (p.at < up + RIDER_HALF) bad.push(`${where}: the ramp at ${ramp.at} hits the side of the ${p.kind} at ${p.at}`);
        if (down < p.at + 20 || down > p.at + w - 20) bad.push(`${where}: the ramp at ${ramp.at} comes down at ${Math.round(down)}, not on the ${p.kind} at ${p.at}–${p.at + w}`);
      } else {
        // Clear it all the way: above its top from its near edge to its far edge.
        const tIn = (p.at - RIDER_HALF - x0) / v, tOut = (p.at + w + RIDER_HALF - x0) / v;
        if (tIn < 0 || heightAt(RAMP_SPEED, tIn) < h + 8 || heightAt(RAMP_SPEED, tOut) < h + 8) bad.push(`${where}: the ramp at ${ramp.at} does not clear the ${p.kind} at ${p.at} (w ${w})`);
      }
    } else {
      // Ollied: the moment to jump has to be wide enough for a child's timing.
      const win = jumpWindow(p.kind, w, v);
      if (!win || win[1] - win[0] < MIN_WINDOW) bad.push(`${where}: the ${p.kind} at ${p.at} (w ${w}) leaves ${win ? Math.round((win[1] - win[0]) * 1000) : 0} ms to jump at ${v} px/s (needs ${MIN_WINDOW * 1000})`);
    }
  }

  // Manual pads.
  for (const pad of c.pieces.filter((p) => p.kind === 'pad')) {
    const padEnd = pad.at + (pad.w ?? PIECE.pad.w);
    for (const p of c.pieces) {
      if (!JUMP_PIECES.includes(p.kind) && p.kind !== 'ramp') continue;
      if (p.at + size(p).w > pad.at && p.at < padEnd) bad.push(`${where}: ${p.kind} at ${p.at} is on the manual pad at ${pad.at}`);
      // A finger has to come off the screen before it can tap: nothing to jump for 0.9 s after the pad.
      if (JUMP_PIECES.includes(p.kind) && p.at >= padEnd && p.at < padEnd + v * 0.9) bad.push(`${where}: ${p.kind} at ${p.at} is only ${Math.round(p.at - padEnd)} px after the manual pad at ${pad.at}`);
    }
    if ((pad.w ?? PIECE.pad.w) < v * 1.5) bad.push(`${where}: the pad at ${pad.at} is too short for a manual`);
  }

  // Oranges: each where some jump reaches it.
  const oranges = c.pieces.filter((p) => p.kind === 'orange');
  for (const o of oranges) {
    const mid = o.at + PIECE.orange.w / 2;
    const ramp = rampBefore(o);
    const under = c.pieces.find((p) => PIECE[p.kind]?.rideable && p.at <= mid && p.at + size(p).w >= mid);
    const top = Math.max(OLLIE_TOP, ramp ? RAMP_TOP : 0, under ? size(under).h + OLLIE_TOP : 0);
    // The rider's feet reach `top`; an orange is picked up with the feet from 110 below it to 40 above.
    if (o.y > top + 105 || o.y < -30) bad.push(`${where}: the orange at ${o.at} (y ${o.y}) is out of reach (the highest jump there reaches ${Math.round(top)})`);
  }

  // Star targets within what the course offers.
  const count = (kinds) => c.pieces.filter((p) => kinds.includes(p.kind)).length;
  // The longest combo on offer: in each line of rails and ledges a chain apart, a flip and a grab in
  // every jump (onto the first, between them, off the last) and a grind on each.
  let longest = 2, run = 0, runEnd = -Infinity;
  for (const p of c.pieces.filter((q) => PIECE[q.kind]?.rideable)) {
    run = p.at - runEnd <= (CHAIN_GAP + 0.05) * v ? run + 1 : 1;
    runEnd = p.at + size(p).w;
    longest = Math.max(longest, 3 * run + 2);
  }
  const padSeconds = c.pieces.filter((p) => p.kind === 'pad').reduce((n, p) => n + (p.w ?? PIECE.pad.w) / v, 0);
  for (const [i, g] of (c.stars ?? []).entries()) {
    const offer = {
      collect: oranges.length,

      ctx.lineTo(-2, -22);
      ctx.lineTo(26, 22);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.moveTo(-2, -22);
      ctx.lineTo(-11, -4);
      ctx.lineTo(-2, -8);
      ctx.lineTo(6, -3);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'bay': {
      // A curling wave.
      ctx.beginPath();
      ctx.moveTo(-26, 20);
      ctx.quadraticCurveTo(-24, -20, 8, -20);
      ctx.quadraticCurveTo(26, -20, 22, -2);
      ctx.quadraticCurveTo(18, -10, 8, -6);
      ctx.quadraticCurveTo(0, 6, 22, 20);
      ctx.closePath();
      ctx.fill();
      break;
    }
    default:
  }
  ctx.restore();
}

class Hub {
  /**
   * @param {object} opts
   * @param {(courseId: string, focus?: {x:number,y:number}) => void} opts.onPlay  start a course
   * @param {() => void} [opts.onTitle]  back to the title screen
   * @param {(focus?: {x:number,y:number}) => void} [opts.onShop]  into the board shop
   */
  constructor({ onPlay, onTitle, onShop, unlock = null }) {
    this.onShop = onShop;
    this.onPlay = onPlay;
    this.onTitle = onTitle;
    /** Draws its own side margins on a wide screen (core/view.js). */
    this.wide = true;
    this.capy = new Character();
    this.capy.sport = RUN;
    this.t = 0;
    this.data = load();
    /** The place whose card is open, or null. */
    this.open = null;
    /** The mission noticeboard's card is open. */
    this.board = false;
    this.floaters = [];
    /** The UNLOCK EVERYTHING card: { place, gate, busy } or null; opened straight away if asked for. */
    this.unlock = unlock ? { place: unlock, gate: null, busy: false } : null;
  }

  enter() {
    this.t = 0;
    this.data = load();
    this.open = null;
    this.board = false;
    this.floaters = [];
    if (this.unlock) this.unlock = { ...this.unlock, gate: null, busy: false };
    this.capy.changeKit(RUN);
    this.capy.play('idle');
    music.play('hub');
    warmUp(this);
  }

  exit() {}

  /** For tests: the rectangles taps land on. */
  get layout() {
    return { MAP, HUT, NOTICE, PLAY, HOME, CARD, CLOSE, BUY, RESTORE, signRect, rowRect, missionRect, answerRect };
  }

  /* ── input ────────────────────────────────────────────────────────────── */

  update(dt, input) {
    this.t += dt;
    this.capy.update(dt);
    for (const f of this.floaters) { f.t -= dt; f.y -= 28 * dt; }
    this.floaters = this.floaters.filter((f) => f.t > 0);
    if (this.t < 0.35) return;
    const tap = tapPoint(input);
    if (!tap) return;
    if (this.unlock) this._tapUnlock(tap);
    else if (this.open) this._tapCard(tap);
    else if (this.board) this._tapBoard(tap);
    else this._tapMap(tap);
  }

  _tapMap(p) {
    const sh = hudShift();
    if (hitDisc({ x: HOME.x + sh, y: HOME.y, r: HOME.r }, p)) {
      sfx.sfxTap();
      this.onTitle?.();
      return;
    }
    if (hit(PLAY, p)) {
      sfx.sfxTap();
      this.onPlay(nextToPlay(this.data), { x: PLAY.x + PLAY.w / 2, y: PLAY.y + PLAY.h / 2 });
      return;
    }
    for (const id of LOCATION_ORDER) {
      if (hit(signRect(id), p)) {
        sfx.sfxOpen();
        if (placeState(id, this.data) === 'paywall') {
          this.unlock = { place: id, gate: null, busy: false };
          return;
        }
        this.open = id;
        if (placeState(id, this.data) === 'open' && !placeSeen(id, this.data)) {
          markPlaceSeen(id);
          this.data = load();
        }
        return;
      }
    }
    if (hit(NOTICE, p)) {
      sfx.sfxOpen();
      this.board = true;
      return;
    }
    if (hit(HUT, p)) {
      sfx.sfxTap();
      this.onShop?.({ x: HUT.x + HUT.w / 2, y: HUT.y + HUT.h / 2 });
    }
  }

  /* ── UNLOCK EVERYTHING ──────────────────────────────────────────────── */

  /**
   * The unlock card: BUY (behind a grown-up check), RESTORE, or close. With no
   * store (unlock.js: not live yet) BUY says COMING SOON and does nothing else.
   */
  _tapUnlock(p) {
    const u = this.unlock;
    if (u.busy) return;
    if (u.gate) {
      const i = u.gate.choices.findIndex((_, k) => hit(answerRect(k, u.gate.choices.length), p));
      if (i < 0) {
        u.gate = null;
        sfx.sfxClose();
        return;
      }
      if (u.gate.choices[i] !== u.gate.answer) {
        u.gate = null;
        sfx.sfxNear();
        this.floaters.push({ x: VIEW_WIDTH / 2, y: BUY.y - 20, t: 1.4, text: 'ASK A GROWN-UP!' });
        return;
      }
      u.gate = null;
      u.busy = true;
      buyEverything().then((r) => this._unlockDone(r));
      return;
    }
    if (hitDisc(CLOSE, p) || !hit(CARD, p)) {
      sfx.sfxClose();
      this.unlock = null;
      return;
    }
    if (hit(BUY, p)) {
      if (!unlockStore().available()) {
        sfx.sfxNear();
        this.floaters.push({ x: VIEW_WIDTH / 2, y: BUY.y - 20, t: 1.4, text: 'COMING SOON!' });
        return;
      }
      sfx.sfxTap();
      u.gate = grownUpCheck();
      return;
    }
    if (hit(RESTORE, p)) {
      sfx.sfxTap();
      u.busy = true;
      restoreEverything().then((ok) => this._unlockDone(ok ? 'ok' : 'nothing'));
    }
  }

  /** The store's answer. Unlocked: the card closes on a cheer and the place is open. */
  _unlockDone(result) {
    const u = this.unlock;
    if (!u) return;
    u.busy = false;
    this.data = load();
    if (result === 'ok') {
      sfx.sfxUnlock();
      buzz('celebrate');
      this.capy.play('victory');
      this.floaters.push({ x: VIEW_WIDTH / 2, y: 400, t: 2, text: 'EVERYTHING UNLOCKED!' });
      this.unlock = null;
      this.open = u.place;
      return;
    }
    sfx.sfxNear();
    const say = { cancelled: 'MAYBE LATER!', unavailable: 'COMING SOON!', failed: 'TRY AGAIN LATER', nothing: 'NOTHING TO RESTORE' }[result] ?? 'TRY AGAIN LATER';
    this.floaters.push({ x: VIEW_WIDTH / 2, y: BUY.y - 20, t: 1.6, text: say });
  }

  /** The unlock card: what it opens, the price, RESTORE; and the grown-up check over it. */
  _drawUnlock(ctx) {
    const u = this.unlock;
    const s = unlockStore();
    const live = s.available();
    ctx.save();
    ctx.fillStyle = COLOR.scrim;
    fillScreen(ctx);
    panel(ctx, CARD.x, CARD.y, CARD.w, CARD.h, { band: 84, bandColour: COLOR.goldDeep, accent: true });
    ctx.fillStyle = COLOR.goldInk;
    ctx.textBaseline = 'middle';
    fitText(ctx, 'UNLOCK EVERYTHING', CARD.x + CARD.w / 2 - 20, CARD.y + 44, CARD.w - 150, TYPE.title, WEIGHT.display, 'center');
    discButton(ctx, CLOSE.x, CLOSE.y, CLOSE.r);
    ctx.strokeStyle = COLOR.ink;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(CLOSE.x - 10, CLOSE.y - 10);
    ctx.lineTo(CLOSE.x + 10, CLOSE.y + 10);
    ctx.moveTo(CLOSE.x + 10, CLOSE.y - 10);
    ctx.lineTo(CLOSE.x - 10, CLOSE.y + 10);
    ctx.stroke();
    // What it opens: the places beyond the free one, as their pictures.
    const places = LOCATION_ORDER.filter((id) => !LOCATIONS[id].later && id !== 'park');
    places.forEach((id, i) => {
      const x = CARD.x + CARD.w / 2 + (i - (places.length - 1) / 2) * 150;
      ctx.save();
      ctx.translate(x, CARD.y + 170);
      ctx.fillStyle = ACCENT_DARK;
      ctx.beginPath();
      ctx.roundRect(-62, -48, 124, 96, 18);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();
      placeIcon(ctx, id, '#ffffff');
      ctx.restore();
      ctx.fillStyle = COLOR.ink;
      fitText(ctx, LOCATIONS[id].name.toUpperCase(), x, CARD.y + 240, 140, TYPE.label, WEIGHT.display, 'center');
    });
    const courses = places.reduce((n, id) => n + coursesIn(id).length, 0);
    ctx.fillStyle = COLOR.ink;
    fitText(ctx, `${courses} MORE COURSES \u00b7 ${places.length} ENDLESS MODES`, CARD.x + CARD.w / 2, CARD.y + 300, CARD.w - 60, TYPE.body, WEIGHT.display, 'center');
    ctx.fillStyle = COLOR.inkDim;
    fitText(ctx, 'ONE PAYMENT. NO ADS. NOTHING ELSE TO BUY.', CARD.x + CARD.w / 2, CARD.y + 340, CARD.w - 60, TYPE.label, WEIGHT.display, 'center');
    fitText(ctx, 'CAPY SKATEPARK STAYS FREE FOR EVER', CARD.x + CARD.w / 2, CARD.y + 372, CARD.w - 60, TYPE.label, WEIGHT.display, 'center');
    // BUY: the price when there is a store; COMING SOON until there is.
    ctx.save();
    if (!live) ctx.globalAlpha = 0.6;
    button(ctx, BUY, live ? `UNLOCK ${s.price() ?? ''}`.trim() : 'COMING SOON', { primary: live, size: 30 });
    ctx.restore();
    button(ctx, RESTORE, 'RESTORE', { primary: false, size: TYPE.label + 2 });
    if (u.busy) {
      ctx.fillStyle = COLOR.ink;
      fitText(ctx, 'ONE MOMENT...', CARD.x + CARD.w / 2, BUY.y - 24, CARD.w - 60, TYPE.label, WEIGHT.display, 'center');
    }
    if (u.gate) this._drawGate(ctx, u.gate);
    this._drawFloaters(ctx);
    ctx.restore();
  }

  /** ASK A GROWN-UP: the sum, and three answers to choose from. */
  _drawGate(ctx, gate) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    fillScreen(ctx);
    panel(ctx, CARD.x + 20, CARD.y + 220, CARD.w - 40, 320, { band: 70, bandColour: COLOR.slateBand });
    ctx.fillStyle = COLOR.ink;
    ctx.textBaseline = 'middle';
    fitText(ctx, 'ASK A GROWN-UP', VIEW_WIDTH / 2, CARD.y + 255, CARD.w - 100, TYPE.title - 4, WEIGHT.display, 'center');
    ctx.font = font(46, WEIGHT.display);
    ctx.textAlign = 'center';
    ctx.fillText(gate.question, VIEW_WIDTH / 2, CARD.y + 350);
    gate.choices.forEach((v, i) => button(ctx, answerRect(i, gate.choices.length), String(v), { size: TYPE.title }));
    ctx.restore();
  }

  /** The noticeboard's card only closes: the missions are for looking at. */
  _tapBoard(p) {
    if (hitDisc(CLOSE, p) || !hit(CARD, p)) {
      sfx.sfxClose();
      this.board = false;
    }
  }

  _tapCard(p) {
    if (hitDisc(CLOSE, p) || !hit(CARD, p)) {
      sfx.sfxClose();
      this.open = null;
      return;
    }
    const courses = coursesIn(this.open);
    for (let i = 0; i < courses.length; i++) {
      const r = rowRect(i);
      if (hit(r, p)) {
        if (isOpen(courses[i].id, this.data)) {
          sfx.sfxTap();
          this.onPlay(courses[i].id, { x: r.x + r.w / 2, y: r.y + r.h / 2 });
        } else {
          // Shut: shake it, and say what it needs.
          sfx.sfxNear();
          this.floaters.push({ x: r.x + r.w - 60, y: r.y + 24, t: 1.2, text: 'LOCKED' });
        }
        return;
      }
    }
    // Endless sits under the courses.
    const e = rowRect(courses.length);
    if (hit(e, p)) {
      if (endlessOpen(this.open, this.data)) {
        sfx.sfxTap();
        this.onPlay(endlessId(this.open), { x: e.x + e.w / 2, y: e.y + e.h / 2 });
      } else {
        sfx.sfxNear();
        this.floaters.push({ x: e.x + e.w - 60, y: e.y + 24, t: 1.2, text: 'LOCKED' });
      }
    }
  }

  /* ── drawing ──────────────────────────────────────────────────────────── */

  draw(ctx) {
    const d = this.t * 26;
    drawParkBackdrop(ctx, d);
    drawParkGround(ctx, d);
    this._drawMap(ctx);
    this._drawFloorThings(ctx);
    this._drawCapy(ctx);
    edgeVignette(ctx, { strength: 0.45 });
    vignette(ctx, VIEW_WIDTH, VIEW_HEIGHT, 0.16);
    // The world is down: from here on it is the interface, which reaches every edge.
    beginOverlays(ctx);
    this._drawPlay(ctx);
    this._drawCorners(ctx);
    this._drawFloaters(ctx);
    if (this.open) this._drawCard(ctx);
    if (this.board) this._drawBoardCard(ctx);
    if (this.unlock) this._drawUnlock(ctx);
  }

  /** The paper map, its trail, and a signpost for every place. */
  _drawMap(ctx) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.roundRect(MAP.x + 5, MAP.y + 9, MAP.w, MAP.h, 26);
    ctx.fill();
    const g = ctx.createLinearGradient(0, MAP.y, 0, MAP.y + MAP.h);
    g.addColorStop(0, '#f6ead0');
    g.addColorStop(1, '#ecd9ae');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(MAP.x, MAP.y, MAP.w, MAP.h, 26);
    ctx.fill();
    ctx.strokeStyle = '#b98f55';
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.restore();

    // The trail winding up from the park: dashes, and the part already open drawn solid.
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = 7;
    for (let i = 0; i < LOCATION_ORDER.length - 1; i++) {
      const a = SIGN_AT[LOCATION_ORDER[i]], b = SIGN_AT[LOCATION_ORDER[i + 1]];
      const reachable = placeState(LOCATION_ORDER[i + 1], this.data) !== 'locked' && placeState(LOCATION_ORDER[i + 1], this.data) !== 'later';
      ctx.strokeStyle = reachable ? ACCENT_DARK : 'rgba(150,118,70,0.55)';
      ctx.setLineDash(reachable ? [] : [4, 14]);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1] + 60);
      ctx.bezierCurveTo(a[0] + (b[0] > a[0] ? 130 : -130), a[1] + 10, b[0] + (b[0] > a[0] ? -130 : 130), b[1] + 80, b[0], b[1] + 78);
      ctx.stroke();
    }
    ctx.restore();
    for (const id of LOCATION_ORDER) this._drawSign(ctx, id);
  }

  /** One place: a post, a board with its picture, and its stars or its padlock. */
  _drawSign(ctx, id) {
    const state = placeState(id, this.data);
    const [cx, cy] = SIGN_AT[id];
    const calm = reducedMotion();
    const bob = calm ? 0 : Math.sin(this.t * 2 + cx) * 1.5;
    const next = COURSE_BY_ID[nextToPlay(this.data)];
    const here = next?.location === id && state === 'open';
    ctx.save();
    ctx.translate(cx, cy + bob);
    if (here) {
      // Where PLAY goes: a warm glow behind the sign and an arrow bouncing over it.
      const glow = ctx.createRadialGradient(0, 0, 20, 0, 0, 110);
      glow.addColorStop(0, `rgba(255,217,61,${calm ? 0.35 : 0.28 + 0.12 * Math.sin(this.t * 4)})`);
      glow.addColorStop(1, 'rgba(255,217,61,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 110, 0, Math.PI * 2);
      ctx.fill();
      const ay = -SIGN.h / 2 - 24 - (calm ? 0 : Math.abs(Math.sin(this.t * 3.2)) * 12);
      ctx.fillStyle = COLOR.gold;
      ctx.strokeStyle = 'rgba(42,28,0,0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-16, ay - 18);
      ctx.lineTo(16, ay - 18);
      ctx.lineTo(16, ay - 4);
      ctx.lineTo(26, ay - 4);
      ctx.lineTo(0, ay + 16);
      ctx.lineTo(-26, ay - 4);
      ctx.lineTo(-16, ay - 4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    // The post.
    ctx.fillStyle = '#8a5a34';
    ctx.fillRect(-6, SIGN.h / 2 - 4, 12, 56);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, SIGN.h / 2 + 54, 26, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    // The board.
    const open = state === 'open';
    const pay = state === 'paywall';
    const top = open ? ACCENT : pay ? '#e8c04a' : state === 'soon' ? '#c9b48a' : state === 'later' ? '#7d8597' : '#8a93a8';
    const low = open ? ACCENT_DARK : pay ? '#b2861a' : state === 'soon' ? '#a38a5c' : state === 'later' ? '#5b6377' : '#5d667a';
    const bg = ctx.createLinearGradient(0, -SIGN.h / 2, 0, SIGN.h / 2);
    bg.addColorStop(0, top);
    bg.addColorStop(1, low);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.roundRect(-SIGN.w / 2 + 3, -SIGN.h / 2 + 6, SIGN.w, SIGN.h, 18);
    ctx.fill();
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(-SIGN.w / 2, -SIGN.h / 2, SIGN.w, SIGN.h, 18);
    ctx.fill();
    ctx.strokeStyle = open ? '#ffffff' : 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 4;
    ctx.stroke();
    // The picture: white on an open sign, a dark silhouette on the ones still to come.
    ctx.save();
    ctx.translate(0, -2);
    ctx.scale(1.05, 1.05);
    placeIcon(ctx, id, state === 'later' ? 'rgba(20,24,36,0.7)' : open ? '#ffffff' : 'rgba(255,255,255,0.85)');
    ctx.restore();
    if (pay) {
      // Its stars are in, and it waits for UNLOCK EVERYTHING: a gold key over the corner.
      ctx.fillStyle = 'rgba(10,13,22,0.85)';
      ctx.beginPath();
      ctx.arc(SIGN.w / 2 - 14, -SIGN.h / 2 + 14, 22, 0, Math.PI * 2);
      ctx.fill();
      keyGlyph(ctx, SIGN.w / 2 - 14, -SIGN.h / 2 + 14, 24, COLOR.gold);
    }
    if (state === 'locked') {
      // Shut: a padlock over a corner of the board.
      ctx.fillStyle = 'rgba(10,13,22,0.8)';
      ctx.beginPath();
      ctx.arc(SIGN.w / 2 - 14, -SIGN.h / 2 + 14, 22, 0, Math.PI * 2);
      ctx.fill();
      lockGlyph(ctx, SIGN.w / 2 - 14, -SIGN.h / 2 + 14, 26, COLOR.gold);
    }
    // Under it: its stars, or the stars it needs.
    this._drawCounter(ctx, id, state);
    // Just opened and not yet visited: a NEW! ribbon across the corner.
    if (state === 'open' && !placeSeen(id, this.data)) {
      ctx.save();
      ctx.translate(-SIGN.w / 2 + 18, -SIGN.h / 2 + 12);
      ctx.rotate(-0.35);
      const pop = calm ? 1 : 1 + 0.08 * Math.sin(this.t * 6);
      ctx.scale(pop, pop);
      ctx.fillStyle = '#ff5fa2';
      ctx.beginPath();
      ctx.roundRect(-34, -14, 68, 28, 14);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = font(TYPE.label, WEIGHT.display);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('NEW!', 0, 1);
      ctx.restore();
    }
    ctx.restore();
  }

  _drawCounter(ctx, id, state) {
    const y = SIGN.h / 2 + 22;
    ctx.save();
    ctx.fillStyle = 'rgba(10,13,22,0.82)';
    ctx.beginPath();
    ctx.roundRect(-46, y - 15, 92, 30, 15);
    ctx.fill();
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    if (state === 'open') {
      const { earned, max } = locationStars(id, this.data);
      star(ctx, -28, y, 11, COLOR.gold);
      ctx.fillStyle = COLOR.ink;
      ctx.font = font(TYPE.label, WEIGHT.display);
      ctx.fillText(`${earned}/${max}`, -12, y + 1);
    } else if (state === 'paywall') {
      ctx.fillStyle = COLOR.gold;
      ctx.font = font(TYPE.label, WEIGHT.display);
      ctx.textAlign = 'center';
      ctx.fillText('UNLOCK', 0, y + 1);
    } else if (state === 'soon') {
      ctx.fillStyle = COLOR.gold;
      ctx.font = font(TYPE.label, WEIGHT.display);
      ctx.textAlign = 'center';
      ctx.fillText('SOON', 0, y + 1);
    } else if (state === 'locked') {
      lockGlyph(ctx, -28, y, 18, COLOR.gold);
      star(ctx, -2, y, 10, COLOR.gold);
      ctx.fillStyle = COLOR.ink;
      ctx.font = font(TYPE.label, WEIGHT.display);
      ctx.fillText(String(LOCATIONS[id].starsToOpen ?? ''), 12, y + 1);
    } else {
      ctx.fillStyle = 'rgba(247,245,240,0.6)';
      ctx.font = font(TYPE.label, WEIGHT.display);
      ctx.textAlign = 'center';
      ctx.fillText('?', 0, y + 1);
    }
    ctx.restore();
  }

  /** The board-shop hut and the mission noticeboard. */
  _drawFloorThings(ctx) {
    // The hut: a striped awning over a counter, with a board on the roof.
    ctx.save();
    ctx.translate(HUT.x, HUT.y);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(HUT.w / 2, HUT.h + 4, HUT.w * 0.5, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e9d3a3';
    ctx.fillRect(10, 36, HUT.w - 20, HUT.h - 36);
    ctx.fillStyle = '#6b4a2e';
    ctx.fillRect(HUT.w / 2 - 22, 58, 44, HUT.h - 58);
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = i % 2 ? '#ffffff' : ACCENT;
      ctx.beginPath();
      ctx.moveTo(4 + i * ((HUT.w - 8) / 6), 20);
      ctx.lineTo(4 + (i + 1) * ((HUT.w - 8) / 6), 20);
      ctx.lineTo(4 + (i + 1) * ((HUT.w - 8) / 6) + 3, 44);
      ctx.lineTo(4 + i * ((HUT.w - 8) / 6) - 3, 44);
      ctx.fill();
    }
    // A skateboard on the roof.
    ctx.fillStyle = '#6b3fa0';
    ctx.beginPath();
    ctx.roundRect(HUT.w / 2 - 30, 8, 60, 9, 4.5);
    ctx.fill();
    ctx.fillStyle = COLOR.gold;
    for (const x of [-18, 18]) {
      ctx.beginPath();
      ctx.arc(HUT.w / 2 + x, 22, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
