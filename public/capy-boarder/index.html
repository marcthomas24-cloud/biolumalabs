    this._drawHaunches(ctx, p);                  // hips, breaking the outline
    const farArm = this._drawArm(ctx, p, -1, true);   // far arm, behind the body
    this._drawKitLayer(ctx, 'band', { ...outfit, arm: farArm, far: true });
    this._drawBody(ctx, p, back);
    this._drawKitLayer(ctx, 'lower', outfit);    // under the paws, which sit on it
    this._drawPaws(ctx, p, back);                // feet: toes to camera, or heels
    this._drawKitLayer(ctx, 'top', outfit);
    this._drawKitLayer(ctx, 'footwear', outfit);
    if (look.back && back) look.back.draw(ctx, wear);
    this._drawHead(ctx, p, outfit, back);
    const arm = this._drawArm(ctx, p, 1, false);  // near arm, over the body
    this._drawKitLayer(ctx, 'band', { ...outfit, arm, far: false });

    if (holdingProp) this._drawProp(ctx, p, outfit.prop);
    if (SPARKLY.has(this.state)) this._drawSparkles(ctx, this.state === 'hype' ? 1.5 : 1);
    if (this.kitChange) this._drawChangePuff(ctx);

    ctx.restore();
  }

  /* ── posing ─────────────────────────────────────────────────────────────── */

  /**
   * Every animated number for this frame in one place, so the drawing code
   * below stays a straight read of the rig.
   */
  _pose() {
    const t = this.t;
    const u = this.progress;
    const breath = Math.sin(t * 2.1);

    const p = {
      bodyDy: 0,
      lean: 0,
      squash: 1 + breath * 0.012,
      stretch: 1 - breath * 0.010,
      headDx: 0,
      headDy: breath * 1.4,
      headTilt: 0,
      earLift: Math.sin(t * 1.35) * 0.05,
      armBack: 0.16,          // radians from straight down, far arm
      armFront: 0.16,         // near arm
      footLift: 0,
      eyeOpen: 1,
      eye: 'normal',          // normal | happy | squint | sad | wide
      mouth: 'smile',         // smile | flat | open | frown | grit
      blush: 0.35,
      propLift: 0,
      lookX: 0,               // pupil offset, for glances
      lookY: 0,
      brow: 'neutral',        // neutral | up | high | focus | sad | none
      earFlick: 0,            // extra lift on one ear, for twitches
    };
    const e = this.stateAge;
    // The crouch before a happy leap: 0 → 1 → 0 over ANTICIPATE seconds.
    const crouch = e < ANTICIPATE ? Math.sin((e / ANTICIPATE) * Math.PI) : 0;
    const hopClock = Math.max(0, e - ANTICIPATE);

    // Blink on the free clock so it never syncs with the animation states.
    const sinceBlink = t - (this.blinkAt - 0.001);
    if (sinceBlink > -0.16 && sinceBlink < 0) {
      p.eyeOpen = Math.abs(sinceBlink + 0.08) / 0.08;
    }

    switch (this.state) {
      case 'prepare': {
        // Coiled: knees bent, weight back, ball cradled, eyes on the target.
        const shiver = Math.sin(t * 16) * 0.5;
        p.bodyDy = 7;
        p.squash = 1.07;
        p.stretch = 0.92;
        p.lean = -0.06;
        p.headDy = 2 + shiver * 0.4;
        p.armBack = 0.62;
        p.armFront = 1.05 + shiver * 0.02;
        p.earLift = -0.12 + Math.sin(t * 2.4) * 0.04;
        p.eye = 'squint';
        p.brow = 'focus';
        p.mouth = 'flat';
        p.propLift = 12;
        p.lookY = -1.5;
        Object.assign(p, PREPARE_POSE[this.sport] ?? {});
        break;
      }
      case 'shoot': {
        // Snap up and through, then float back down over the tail of the shot.
        const k = u < 0.32 ? easeOut(u / 0.32) : 1 - easeOut((u - 0.32) / 0.68);
        const g = k * (SHOOT_GAIN[this.sport] ?? 1);
        p.bodyDy = -14 * g;
        p.squash = 1 - 0.10 * g;
        p.stretch = 1 + 0.15 * g;
        p.lean = 0.10 * g;
        p.headDy = -3 * k;
        p.headTilt = -0.06 * k;
        p.armBack = 0.5 + 1.1 * k;
        p.armFront = 0.6 + 1.9 * k;
        p.footLift = 5 * k;
        p.earLift = 0.34 * k;
        p.eye = k > 0.5 ? 'wide' : 'squint';
        p.brow = 'focus';
        p.mouth = 'open';
        break;
      }
      case 'celebrate': {
        // Little hops, arms punching alternately.
        const hop = Math.abs(Math.sin(hopClock * 7.4));
        const land = 1 - hop;
        p.bodyDy = -19 * hop + 7 * crouch;
        p.squash = 1 + 0.10 * land * land - 0.05 * hop + 0.06 * crouch;
        p.stretch = 1 - 0.10 * land * land + 0.07 * hop;
        p.headDy = -2 * hop;
        p.headTilt = Math.sin(t * 3.7) * 0.07;
        p.armBack = 1.4 + Math.sin(t * 7.4) * 0.7;
        p.armFront = 1.4 - Math.sin(t * 7.4) * 0.7;
        p.earLift = 0.10 + hop * 0.30;
        p.eye = 'happy';
        p.brow = 'up';
        p.mouth = 'open';
        p.blush = 0.9;
        break;
      }
      case 'victory': {
        // Same idea, bigger: both arms in a V, a proud sway, sparkles.
        const hop = Math.abs(Math.sin(hopClock * 5.6));
        const land = 1 - hop;
        p.bodyDy = -26 * hop + 9 * crouch;
        p.squash = 1 + 0.12 * land * land - 0.06 * hop + 0.08 * crouch;
        p.stretch = 1 - 0.12 * land * land + 0.09 * hop;
        p.lean = Math.sin(t * 2.8) * 0.05;
        p.headDy = -3 * hop;
        p.headTilt = Math.sin(t * 2.8) * 0.10;
        p.armBack = 2.35 + Math.sin(t * 5.6) * 0.14;
        p.armFront = 2.35 - Math.sin(t * 5.6) * 0.14;
        p.earLift = 0.24 + hop * 0.34;
        p.eye = 'happy';
        p.brow = 'up';
        p.mouth = 'open';
        p.blush = 1;
        break;
      }
      case 'miss': {
        // The slump: shoulders drop, ears fold, a slow head shake.
        const k = easeOut(clamp01(u * 2.4));
        p.bodyDy = 8 * k;
        p.squash = 1 + 0.07 * k;
        p.stretch = 1 - 0.09 * k;
        p.headDy = 6 * k;
        p.headDx = Math.sin(t * 4.4) * 3 * k;
        p.headTilt = 0.10 * k + Math.sin(t * 4.4) * 0.05 * k;
        p.armBack = 0.06;
        p.armFront = 0.02;
        p.earLift = -0.62 * k;
        p.eye = 'sad';
        p.brow = 'sad';
        p.mouth = 'frown';
        p.blush = 0.15;
        break;
      }
      case 'surprise': {
        // The near miss. A jolt up and back with paws flying to his cheeks
        // and an "O" of disbelief — then it sinks in, and he sags.
        const jolt = easeOut(clamp01(u / 0.12));
        const sink = easeOut(clamp01((u - 0.55) / 0.3));
        const hold = jolt * (1 - sink);
        p.bodyDy = -9 * hold + 6 * sink;
        p.lean = -0.13 * hold;
        p.squash = 1 - 0.06 * hold + 0.05 * sink;
        p.stretch = 1 + 0.12 * hold - 0.06 * sink;
        p.headDy = -3 * hold + 5 * sink;
        p.headTilt = 0.06 * sink + Math.sin(t * 30) * 0.015 * hold;
        p.armBack = 0.1 + 2.1 * hold;
        p.armFront = 0.1 + 2.2 * hold;
        p.earLift = 0.6 * hold - 0.5 * sink;
        p.eye = sink > 0.5 ? 'sad' : 'wide';
        p.brow = sink > 0.5 ? 'sad' : 'high';
        p.mouth = sink > 0.5 ? 'frown' : 'o';
        p.blush = 0.2;
        break;
      }
      case 'hype': {
        // Off the rails. Faster and higher than `victory`, arms windmilling
        // out of phase with the hops, and a whole-body wobble either side of
        // the lean — the pose the fourth basket in a row has earned.
        const hop = Math.abs(Math.sin(hopClock * 8.2));
        const land = 1 - hop;
        p.bodyDy = -34 * hop + 11 * crouch;
        p.squash = 1 + 0.16 * land * land - 0.09 * hop + 0.1 * crouch;
        p.stretch = 1 - 0.16 * land * land + 0.13 * hop;
        p.lean = Math.sin(t * 8.2) * 0.16;
        p.headDx = Math.sin(t * 8.2) * 4;
        p.headDy = -5 * hop;
        p.headTilt = Math.sin(t * 6.1) * 0.20;
        // A full turn each, half a cycle apart, so the arms never line up.
        p.armBack = 1.6 + Math.sin(t * 11) * 1.5;
        p.armFront = 1.6 + Math.sin(t * 11 + Math.PI) * 1.5;
        p.footLift = 10 * hop;
        p.earLift = 0.3 + hop * 0.55;
        p.eye = 'happy';
        p.brow = 'up';
        p.mouth = 'open';
        p.blush = 1;
        break;
      }
      case 'shrug': {
        // A beat of "well, that happened": paws turned out, one shoulder up,
        // head cocked, held still long enough to read before he shakes it
        // off. The stillness is the joke — everything else in the rig moves.
        const k = easeOut(clamp01(u * 3.4));
        const settle = 1 - clamp01((u - 0.78) / 0.22);   // drop the pose at the end
        const a = k * settle;
        p.bodyDy = 3 * a;
        p.squash = 1 + 0.05 * a;
        p.stretch = 1 - 0.05 * a;
        p.lean = -0.07 * a;
        p.headDx = -4 * a;
        p.headTilt = -0.24 * a;
        p.armBack = 1.05 * a;
        p.armFront = 1.35 * a;
        p.earLift = -0.30 * a;
        p.eye = 'squint';
        p.brow = 'up';
        p.mouth = 'flat';
        p.blush = 0.5;
        p.lookX = -1.5;   // side-eye at the player
        break;
      }
      case 'dunk': {
        // Airborne and committed: tucked legs, one paw slamming overhead.
        const flap = Math.sin(t * 9);
        p.bodyDy = -30;
        p.lean = 0.24;
        p.squash = 0.92;
        p.stretch = 1.16;
        p.headDy = -4;
        p.headTilt = 0.14;
        p.armBack = -0.55 + flap * 0.06;
        p.armFront = 2.75 + flap * 0.08;
        p.footLift = 16;
        p.earLift = 0.5 + flap * 0.08;
        p.eye = 'wide';
        p.brow = 'focus';
        p.mouth = 'grit';
        break;
      }
      default: {
        // idle: breathing, a lazy arm sway, the odd ear twitch.
        const sway = Math.sin(t * 1.7);
        p.armBack = 0.16 + sway * 0.07;
        p.armFront = 0.16 - sway * 0.07;
        if (t < this.lookUntil) p.lookX = this.lookAt * 2.2;
        if (this.yawnT > 0) {
          // Up, stretch, big "O", eyes screwed shut — then back to it.
          const y = Math.sin((1 - this.yawnT / 1.7) * Math.PI);
          p.stretch += 0.06 * y;
          p.squash -= 0.04 * y;
          p.headTilt = -0.12 * y;
          p.armBack += 1.2 * y;
          p.armFront += 0.9 * y;
          p.earLift -= 0.25 * y;
          if (y > 0.3) {
            p.eye = 'squint';
            p.eyeOpen = 0.1;
            p.mouth = 'yawn';
            p.brow = 'up';
          }
        }
      }
    }

    // An ear twitch, one side at a time, whatever else is happening.
    if (this.flickT > 0) p.earFlick = this.flickSide * Math.sin((this.flickT / 0.28) * Math.PI) * 0.5;

    // Blend in from the previous pose, overshooting a touch as it lands.
    if (this.blendT > 0 && this.blendFrom) {
      const k = easeOutBack(1 - this.blendT / BLEND_TIME);
      for (const key of BLENDED) {
        const from = this.blendFrom[key];
        if (from !== undefined) p[key] = from + (p[key] - from) * k;
      }
    }
    return p;
  }

  /* ── body parts ─────────────────────────────────────────────────────────── */

  /** Hips, poking out either side so the silhouette isn't a plain egg. */
  _drawHaunches(ctx, p) {
    for (const side of [-1, 1]) {
      ctx.fillStyle = PALETTE.furShade;
      ellipse(ctx, side * 56, -26 + p.footLift * 0.3, 22, 26, side * 0.2);
      ctx.fill();
      outline(ctx, 3);
    }
  }

  /** Front paws, sat proud of the belly — the bottom of the silhouette. */
  _drawPaws(ctx, p, back = false) {
    const y = -9 + p.footLift * -0.35;
    if (back) return this._drawHeels(ctx, y);
    for (const side of [-1, 1]) {
      ctx.fillStyle = furFill(ctx, side * 34, y, 26);
      blob(ctx, [
        [side * 10, y - 11], [side * 40, y - 13], [side * 60, y - 4],
        [side * 58, y + 9], [side * 30, y + 13], [side * 9, y + 6],
      ]);
      ctx.fill();
      outline(ctx, 3);
      // Three soft toe splits.
      ctx.strokeStyle = 'rgba(120,80,44,0.5)';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const tx = side * (24 + i * 12);
        ctx.beginPath();
        ctx.moveTo(tx, y - 7);
        ctx.lineTo(tx + side * 2, y + 6);
        ctx.stroke();
      }
    }
  }

  /**
   * Seen from behind, the toes point away from the camera, so what shows is
   * the back of each foot: a rounded heel with its sole pad, and no toes.
   */
  _drawHeels(ctx, y) {
    for (const side of [-1, 1]) {
      const cx = side * 30;
      ctx.fillStyle = furFill(ctx, cx, y, 20);
      blob(ctx, [
        [cx - 18, y - 8], [cx, y - 12], [cx + 18, y - 8],
        [cx + 20, y + 6], [cx, y + 12], [cx - 20, y + 6],
      ]);
      ctx.fill();
      outline(ctx, 3);
      ctx.fillStyle = 'rgba(92,58,33,0.45)';
      ellipse(ctx, cx, y + 4, 11, 6);
      ctx.fill();
    }
  }

  _drawBody(ctx, p, back = false) {
    // Pear-shaped and hand-wobbled: heavy at the hips, narrower at the
    // shoulders, with no straight edges anywhere.
    ctx.fillStyle = furFill(ctx, -14, -78, 96);
    blob(ctx, [
      [-64, -16], [-71, -50], [-66, -84], [-49, -110], [-22, -122],
      [10, -123], [40, -114], [59, -92], [69, -58], [65, -20],
      [42, -4], [0, -1], [-42, -5],
    ]);
    ctx.fill();
    outline(ctx, 3.2);

    // Belly light, keeping the volume reading round rather than flat. From
    // behind there is no belly, so the light goes across the shoulders.
    if (back) {
      const sh = ctx.createRadialGradient(-10, -100, 4, -10, -100, 60);
      sh.addColorStop(0, 'rgba(240,214,182,0.35)');
      sh.addColorStop(1, 'rgba(240,214,182,0)');
      ctx.fillStyle = sh;
      ellipse(ctx, -10, -100, 50, 30);
      ctx.fill();
    }
    const belly = ctx.createRadialGradient(-6, -44, 4, -6, -44, 62);
    belly.addColorStop(0, 'rgba(240,214,182,0.55)');
    belly.addColorStop(1, 'rgba(240,214,182,0)');
    if (!back) {
      ctx.fillStyle = belly;
      ellipse(ctx, -6, -44, 46, 40);
      ctx.fill();
    }

    // Rim shadow down the right, away from the key light.
    ctx.save();
    blob(ctx, [
      [-64, -16], [-71, -50], [-66, -84], [-49, -110], [-22, -122],
      [10, -123], [40, -114], [59, -92], [69, -58], [65, -20],
      [42, -4], [0, -1], [-42, -5],
    ]);
    ctx.clip();
    ctx.fillStyle = 'rgba(122,80,44,0.28)';
    ellipse(ctx, 96, -62, 52, 74);
    ctx.fill();
    ctx.restore();
  }

  /* ── the kit ────────────────────────────────────────────────────────────── */

  /**
   * Everything the kit layers need this frame: the kit's slots, its colours,
   * and the base rig's shapes, so kits.js never reaches into this file.
   */
  _outfit(colourOverride, back, p) {
    const kit = KITS[this.kit] ?? KITS[DEFAULT_KIT];
    const colour = colourOverride ?? mainColour(this.kit);
    const red = colour === PALETTE.kitRed;
    return {
      kit,
      colour,
      light: red ? PALETTE.kitRedHi : colour,
      dark: red ? PALETTE.kitRedDark : 'rgba(0,0,0,0.28)',
      darkBand: red ? PALETTE.kitRedDark : colour,
      accent: kit.accent,
      stripe: CAPY_ACCENT_STRIPE,
      prop: kit.prop,
      goggles: this.gogglesT > 0,
      back,
      p,
      rig: RIG,
    };
  }

  _drawKitLayer(ctx, slot, outfit) {
    const draw = garment(slot, outfit.kit[slot]);
    if (!draw) return;
    ctx.save();
    draw(ctx, outfit);
    ctx.restore();
  }

  /** The quick change's squash: down, the swap, and a springy pop back up. */
  _squashForChange(p) {
    const c = this.kitChange;
    if (!c) return;
    const u = c.t / KIT_CHANGE_TIME;
    const k = u < KIT_SWAP_AT / KIT_CHANGE_TIME
      ? Math.sin((u / (KIT_SWAP_AT / KIT_CHANGE_TIME)) * Math.PI / 2)
      : Math.cos(((u - KIT_SWAP_AT / KIT_CHANGE_TIME) / (1 - KIT_SWAP_AT / KIT_CHANGE_TIME)) * Math.PI * 1.5);
    p.squash *= 1 + 0.2 * k;
    p.stretch *= 1 - 0.18 * k;
  }

  /** A puff of cloud and sparkles around him as the kit swaps. */
  _drawChangePuff(ctx) {
    const c = this.kitChange;
    const u = (c.t - KIT_SWAP_AT * 0.6) / (KIT_CHANGE_TIME - KIT_SWAP_AT * 0.6);
    if (u <= 0 || u >= 1) return;
    ctx.save();
    ctx.globalAlpha = 1 - u;
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2 + 0.3;
      const r = 40 + 55 * u;
      ctx.fillStyle = i % 3 ? 'rgba(255,255,255,0.9)' : 'rgba(255,236,190,0.95)';
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r * 1.1, -90 + Math.sin(a) * r * 0.85, 16 * (1 - u * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    const effect = this._look?.effect;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + u * 2;
      effect?.draw(ctx, { x: Math.cos(a) * (60 + 50 * u), y: -100 + Math.sin(a) * (50 + 40 * u), s: 7 * (1 - u * 0.5), i });
    }
    ctx.restore();
  }

  /**
   * One arm. `side` is -1 for the far arm (drawn behind the body) and 1 for
   * the near one. Angle 0 hangs straight down, positive swings it up.
   */
  _drawArm(ctx, p, side, far) {
    const ang = far ? p.armBack : p.armFront;
    // Rooted inside the body outline, so a raised arm swings out of the
    // shoulder rather than floating alongside it.
    const sx = side * 56;
    const sy = -92;
    const len = 38;
    const ex = sx + side * Math.sin(ang) * len;
    const ey = sy + Math.cos(ang) * len;

    ctx.save();
    ctx.lineCap = 'round';
    // Fur sleeve.
    ctx.strokeStyle = far ? PALETTE.furShade : PALETTE.furMid;
    ctx.lineWidth = 27;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    if (!far) {
      ctx.strokeStyle = 'rgba(240,214,182,0.32)';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(sx - 5, sy + 2);
      ctx.lineTo(ex - 5, ey - 2);
      ctx.stroke();
    }
    // Paw.
    ctx.fillStyle = far ? PALETTE.furShade : furFill(ctx, ex, ey, 16);
    ellipse(ctx, ex, ey, 15, 13, side * ang * 0.4);
    ctx.fill();
    ctx.restore();
    return { sx, sy, ex, ey, ang };
  }

  _drawHead(ctx, p, outfit, back) {
    ctx.save();
    ctx.translate(p.headDx, -126 + p.headDy);
    ctx.rotate(p.headTilt);
    ctx.scale(0.95, 0.95);

    // Head: broad and blocky-soft, heavier along the jaw. Same spline
    // language as the body, so nothing in the rig has a straight edge.
    ctx.fillStyle = furFill(ctx, -16, -14, 62);
    blob(ctx, HEAD);
    ctx.fill();
    outline(ctx, 3.2);

    // Cheek shadow on the side away from the key light.
    ctx.save();
    blob(ctx, HEAD);
    ctx.clip();
    ctx.fillStyle = 'rgba(122,80,44,0.22)';
    ellipse(ctx, 76, 4, 40, 52);
    ctx.fill();
    ctx.restore();

    if (back) this._drawBackOfHead(ctx);
    else {
      this._drawFace(ctx, p);
      // Wardrobe: glasses, masks and patches, over the face.
      if (this._look?.face) this._look.face.draw(ctx, this._wear);
    }

    // The wardrobe's hat replaces the kit's headwear; without one, the kit's.
    // Mid hat flip, it rides a curve up off the crown, round once and back.
    ctx.save();
    if (this.hatFlip) {
      const u = Math.min(1, this.hatFlip.t / this.hatFlip.dur);
      ctx.translate(0, -44 - Math.sin(u * Math.PI) * 70);
      ctx.rotate(u * Math.PI * 2);
      ctx.translate(0, 44);
    }
    if (this._look?.hat) this._look.hat.draw(ctx, this._wear);
    else this._drawKitLayer(ctx, 'headwear', outfit);
    ctx.restore();
    // Ears last, so no headwear ever hides them (CAPY_IDENTITY.md §3).
    this._drawEars(ctx, p);
    ctx.restore();
  }

  /**
   * Small rounded ears set high on the crown, the inner-ear cup showing.
   * Only what pokes out past the head outline is drawn — which is all that
   * would show behind the head anyway — and they're drawn last, over any
   * headwear, so every hat has ear cut-outs.
   */
  _drawEars(ctx, p) {
    ctx.save();
    const outside = new Path2D();
    outside.rect(-200, -200, 400, 400);
    outside.addPath(blobPath(HEAD));
    ctx.clip(outside, 'evenodd');
    for (const side of [-1, 1]) {
      ctx.save();
      const lift = p.earLift + (Math.sign(p.earFlick) === side ? Math.abs(p.earFlick) : 0);
      ctx.translate(side * EAR_X, EAR_Y - lift * 6);
      ctx.rotate(side * (EAR_TILT + lift * 0.45));
      ctx.scale(EAR_SCALE, EAR_SCALE);
      ctx.fillStyle = PALETTE.furMid;
      blob(ctx, [[-16, -6], [-11, -17], [2, -21], [15, -13], [18, 2], [8, 14], [-8, 12]]);
      ctx.fill();
      outline(ctx, 3 / EAR_SCALE);
      ctx.fillStyle = PALETTE.innerEar;
      ellipse(ctx, side * 1, 0, 9.5, 8, side * 0.3);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,236,214,0.30)';
      ellipse(ctx, side * -2, -4, 5.5, 4, side * 0.5);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

const { app } = __require('core/app.js');
const { load } = __require('core/save-data.js');
const { VIEW_WIDTH, VIEW_HEIGHT, getBounds, beginOverlays } = __require('core/view.js');
const { withAlpha, rng } = __require('core/scenery.js');
const { phaseAt, curve, isFinal } = __require('core/difficulty.js');
const { drawMedal } = __require('core/medals.js');
const { reducedMotion } = __require('core/accessibility.js');
const sfx = __require('core/audio.js');
const { music } = __require('core/music.js');
const { UNLOCK_AT, MEDAL_AT } = __require('core/round-flow.js');
const { getSettings } = __require('core/settings.js');
const { COLOR, TYPE, WEIGHT, STROKE, BUTTON_MIN_H, font, panel, plate, pill, button, discButton, fitText, star, fillScreen } = __require('core/ui.js');

const INK = COLOR.ink;
const INK_DIM = COLOR.inkDim;
const ACCENT = COLOR.gold;

/** Every button on the results and pause cards is at least this tall —
 *  comfortably more than a small child's fingertip. */
const BUTTON_H = BUTTON_MIN_H;
/** The results card's hero tile (a newly opened sport), score block and rows. */
const HERO_H = 128;
const SCORE_H = 130;
const ROW_H = 38;
const XP_H = 46;
/** The locked-next-sport tile on the results card. */
const TEASER_H = 88;

/** Countdown turns red and pulses under this many seconds. */
const URGENT_SECONDS = 10;

/** What the HUD calls out as each phase of the round begins. */
const PHASE_CALLS = { master: 'GAME ON!', chaos: 'TURN IT UP!' };
const FINAL_CALL = 'FINAL 10!';
/** Seconds a phase call stays up. */
const CALL_TIME = 1.3;

/**
 * Back button, bottom-left. Deliberately away from the bottom-centre where
 * the aim gesture starts, and only ever fires on a tap, so a swipe that
 * happens to begin here still takes the shot. Mid-round it pauses rather
 * than leaving (round-flow.js), since small hands rest on corners.
 */
const BACK_BUTTON = { x: 48, y: VIEW_HEIGHT - 48, r: 32 };

/**
 * Camera toggle, bottom-right. Carries its label rather than relying on an
 * icon: an unmarked disc in a corner is not something a player finds, and
 * the choice of angle matters too much to hide.
 */
const VIEW_BUTTON = { x: VIEW_WIDTH - 168, y: VIEW_HEIGHT - 68, w: 152, h: 44 };

/**
 * On a wide screen the corner readouts and buttons (score, attempts, back,
 * camera) slide out into the margins by up to this much, which clears the
 * middle of the screen for play. The clock stays centred. 0 on a phone.
 */
const HUD_MAX_SHIFT = 160;

/** How far the corners sit out from the safe zone right now. */
function hudShift() {
  return Math.min(getBounds().marginX, HUD_MAX_SHIFT);
}

let cornersFor = -1;
let backAt = BACK_BUTTON;
let viewAt = VIEW_BUTTON;

function corners() {
  const b = getBounds();
  if (b.version === cornersFor) return;
  cornersFor = b.version;
  const s = hudShift();
  const base = app().layout?.back ?? BACK_BUTTON;
  backAt = s ? { ...base, x: base.x - s } : base;
  viewAt = s ? { ...VIEW_BUTTON, x: VIEW_BUTTON.x + s } : VIEW_BUTTON;
}

/** The back button where it's drawn and hit-tested on this screen. */
function backButton() {
  corners();
  return backAt;
}

/** The camera toggle where it's drawn and hit-tested on this screen. */
function viewButton() {
  corners();
  return viewAt;
}

class Hud {
  /**
   * @param {string} sport  sport id, e.g. 'bowling'
   * @param {object} [opts]
   * @param {() => void} [opts.onTimeUp]  fired once as the clock hits zero
   * @param {string} [opts.attemptsLabel] right-hand readout caption
   */
  constructor(sport, { onTimeUp, attemptsLabel = 'SHOTS', view = 'behind', viewToggle = true } = {}) {
    this.sport = sport;
    this.view = view;
    /** Sports with a single fixed camera leave the toggle off entirely. */
    this.viewToggle = viewToggle;
    this.duration = app().rounds.seconds(sport);
    this.onTimeUp = onTimeUp;
    this.attemptsLabel = attemptsLabel;
    this.score = 0;
    /** Counts down after popScore(); swells and warms the score readout. */
    this.scorePop = 0;
    this.timeLeft = this.duration;
    this.attempts = 0;
    this.expired = false;
  }

  reset() {
    this.score = 0;
    this.scorePop = 0;
    this.timeLeft = this.duration;
    this.attempts = 0;
    this.expired = false;
    this.phase = 'learn';
    this.finalCalled = false;
    this._setGoal();
    /** The phase call on screen: { text, t } counting down, or null. */
    this.call = null;
  }

  /** The countdown, top-centre. An app whose rounds aren't timed draws its own here. */
  _drawClock(ctx) {
    // Countdown, top-centre. Pulses once a second down the closing stretch.
    const urgent = this.timeLeft <= URGENT_SECONDS;
    const pulse = urgent ? 1 + 0.08 * Math.abs(Math.sin(this.timeLeft * Math.PI)) : 1;
    const secs = Math.ceil(this.timeLeft);
    const clock = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    ctx.textAlign = 'center';
    ctx.font = font(TYPE.clock * pulse, WEIGHT.bold);
    this._plate(ctx, VIEW_WIDTH / 2 - ctx.measureText(clock).width / 2 - 18, 14, ctx.measureText(clock).width + 36, 62);
    ctx.fillStyle = urgent ? COLOR.fail : INK;
    ctx.fillText(clock, VIEW_WIDTH / 2, 20);
  }

  /* ── what an app adds to the HUD and the results card ─────────────────────
   * These are the places the club (sports-club/hud.js) has its own progression
   * to show; each is a no-op here, so a plain app gets a plain card.
   */

  /**
   * What this round is playing for, shown as a bar in the score plate: here,
   * just the player's own best.
   */
  _setGoal() {
    const best = load().highScores[this.sport] ?? 0;
    this.goal = best > 0 ? { score: best, reward: null, hit: false, isBest: true } : null;
  }

  /** Called every step the clock runs, with the score as it stands. */
  _noteScore() {}

  /** An extra chip under the corner readouts (the club's daily challenge). */
  _drawDaily() {}

  /** The results card's headline. */
  _headline(passed, newBest) {
    return passed ? 'UNLOCKED!' : newBest ? 'NEW PERSONAL BEST!' : "TIME'S UP!";
  }

  /** True when the results card shows a locked next level (_teaser). */
  _hasTeaser() { return false; }

  /** Height of the progress strip above the buttons (_xpStrip), 0 for none. */
  _xpHeight() { return 0; }

  /** The pause card's big answer and its small one. */
  _resumeLabel() { return 'KEEP PLAYING'; }
  _homeLabel() { return 'QUIT TO MENU'; }

  /** The AGAIN button's words. */
  _againLabel() { return 'PLAY AGAIN'; }

  /** The locked-next-level strip. */
  _teaser() {}

  /** The big tile for the level that just opened (stats.unlocked). */
  _nextButton() {}

  /** Progress earned this round (stats.xp). */
  _xpStrip() {}

  /** An opt-in bonus button (stats.adOffer). */
  _adButton() {}

  /** Seconds since the round's clock started. */
  get elapsed() {
    return this.duration - this.timeLeft;
  }

  /** The shaped difficulty dial (difficulty.js), 0..1 — what sports ramp on. */
  get curve() {
    return curve(this.elapsed, this.duration);
  }

  /** True in the closing FINAL 10. */
  get final() {
    return isFinal(this.timeLeft, this.duration);
  }

  /** Fraction of the round already spent, 0..1 — sports ramp difficulty on it. */
  get progress() {
    return 1 - this.timeLeft / this.duration;
  }

  update(dt) {
    this.scorePop = Math.max(0, this.scorePop - dt * 2.4);
    if (this.call) {
      this.call.t -= dt;
      if (this.call.t <= 0) this.call = null;
    }
    if (this.expired) return;
    const before = Math.ceil(this.timeLeft);
    this.timeLeft = Math.max(0, this.timeLeft - dt);

    // Phase changes are called out, so the round's shape is something the
    // player feels *and* is told about.
    this._noteScore();

    // The goal reached mid-round: called out, the moment it happens. (The
    // unlock itself is written at the buzzer, like everything else.) A new
    // best has its own celebration in reactions.js, so that one is silent.
    if (this.goal && !this.goal.hit && this.score >= this.goal.score) {
      this.goal.hit = true;
      if (this.goal.reward) {
        this._callOut(this.goal.reward);
        sfx.sfxUnlock();
      }
    }

    const phase = phaseAt(this.elapsed, this.duration);
    // The band builds with the round: see music.js.
    music.setIntensity(this.final ? 3 : { learn: 0, master: 1, chaos: 2 }[phase]);
    if (phase !== this.phase) {
      this.phase = phase;
      this._callOut(PHASE_CALLS[phase]);
    }
    if (this.final && this.timeLeft > 0) {
      if (!this.finalCalled) {
        this.finalCalled = true;
        this._callOut(FINAL_CALL);
      }
      // A tick on every second of the closing stretch.
      if (Math.ceil(this.timeLeft) < before) sfx.sfxTick();
    }
    if (this.timeLeft === 0) {
      this.expired = true;
      this.onTimeUp?.();
    }
  }

  _callOut(text) {
    if (!text) return;
    this.call = { text, t: CALL_TIME };
    sfx.sfxCall();
  }

  /**
   * Flags that the score just changed, so the readout can react. Optional:
   * a sport that never calls it simply gets a score that sits still.
   */
  popScore() {
    this.scorePop = 1;
  }

  /** @param {CanvasRenderingContext2D} ctx */
  draw(ctx) {
    // Everything from here up is over the world (view.js).
    beginOverlays(ctx);
    ctx.save();
    ctx.textBaseline = 'top';
    const b = getBounds();
    const shift = hudShift();

    // A soft wash behind the top row, under the plates below.
    const scrim = ctx.createLinearGradient(0, 0, 0, 130);
    scrim.addColorStop(0, 'rgba(8,10,16,0.5)');
    scrim.addColorStop(1, 'rgba(8,10,16,0)');
    ctx.fillStyle = scrim;
    ctx.fillRect(b.left, 0, b.width, 130);

    // Score, top-left. Swells and goes gold for a moment after it changes —
    // the HUD never shakes with the rest of the frame, so this is the one
    // thing telling the player their number moved.
    this._stat(ctx, 20 - shift, 22, 'left', 'SCORE', String(this.score), this.scorePop, this.goal);

    // Attempts, top-right.
    this._stat(ctx, VIEW_WIDTH - 20 + shift, 22, 'right', this.attemptsLabel, String(this.attempts));

    this._drawClock(ctx);

    this._drawDaily(ctx);
    this._drawBack(ctx);
    if (this.viewToggle) this._drawViewToggle(ctx);
    if (this.final && !this.expired) this._drawFinalEdge(ctx);
    if (this.call) this._drawCall(ctx);

    ctx.restore();
  }

  /** The closing stretch: a warm pulse round the edges, on the second. */
  _drawFinalEdge(ctx) {
    const beat = Math.pow(1 - (this.timeLeft % 1), 3);
    const b = getBounds();
    // Out to the screen's own edges: on a wide screen the pulse sits round
    // the whole frame, not round the middle strip.
    const reach = Math.max(VIEW_HEIGHT * 0.75, Math.hypot(b.width / 2, VIEW_HEIGHT / 2) * 0.9);
    const g = ctx.createRadialGradient(VIEW_WIDTH / 2, VIEW_HEIGHT / 2, VIEW_HEIGHT * 0.35, VIEW_WIDTH / 2, VIEW_HEIGHT / 2, reach);
    g.addColorStop(0, 'rgba(255,107,107,0)');
    g.addColorStop(1, `rgba(255,107,107,${0.12 + 0.18 * beat})`);
    ctx.fillStyle = g;
    ctx.fillRect(b.left, 0, b.width, VIEW_HEIGHT);
  }

  /** A phase call: pops in under the clock, holds, and lifts away. */
  _drawCall(ctx) {
    const age = CALL_TIME - this.call.t;
    const pop = age < 0.14 ? 0.5 + (age / 0.14) * 0.62 : 1.12 - Math.min(0.12, (age - 0.14) * 0.9);
    const fade = Math.min(1, this.call.t / 0.3);
    const finalCall = this.call.text === FINAL_CALL;
    ctx.save();
    ctx.globalAlpha = fade;
    // Tucked straight under the clock it belongs to, and kept compact: the
    // hoop, the pins and the goal all live just below it.
    ctx.translate(VIEW_WIDTH / 2, 98 - (1 - fade) * 10);
    ctx.scale(pop, pop);
    pill(ctx, 0, 0, this.call.text, { size: TYPE.button, weight: WEIGHT.display, tone: finalCall ? 'alert' : 'gold' });
    ctx.restore();
  }

  /**
   * Back to the club.
   *
   * Drawn as a solid disc with a lip and a bright chevron rather than the
   * translucent ghost it used to be: on a bright lane the old one all but
   * vanished, and a six-year-old will not go hunting for the way out.
   */
  _drawBack(ctx) {
    const { x, y, r } = backButton();
    discButton(ctx, x, y, r);

    ctx.strokeStyle = INK;
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x + 6, y - 11);
    ctx.lineTo(x - 7, y);
    ctx.lineTo(x + 6, y + 11);
    ctx.stroke();

    ctx.lineCap = 'butt';
  }

  /** Just the back button, for redrawing it above anything laid over the HUD. */
  drawBackButton(ctx) {
    ctx.save();
    this._drawBack(ctx);
    ctx.restore();
  }

  /** The live view, named, with a swap arrow to say it can be changed. */
  _drawViewToggle(ctx) {
    const { x, y, w, h } = viewButton();

    ctx.fillStyle = COLOR.shadow;
    ctx.beginPath();
    ctx.roundRect(x, y + 3, w, h, h / 2);
    ctx.fill();

    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, COLOR.slateTop);
    g.addColorStop(1, COLOR.slateLow);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, h / 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(247,245,240,0.5)';
    ctx.lineWidth = STROKE.ui;
    ctx.stroke();

    this._drawViewGlyph(ctx, x + 26, y + h / 2);

    ctx.fillStyle = INK;
    ctx.font = font(TYPE.label, WEIGHT.bold);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.view === 'side' ? 'SIDE  \u21c4' : 'BEHIND  \u21c4', x + 44, y + h / 2 + 1);
  }

  /** Tiny diagram of the angle currently in use. */
  _drawViewGlyph(ctx, x, y) {
    ctx.strokeStyle = INK_DIM;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (this.view === 'side') {
      // Ground line with the target standing off to one side.
      ctx.moveTo(x - 9, y + 5);
      ctx.lineTo(x + 9, y + 5);
      ctx.moveTo(x + 5, y + 5);
      ctx.lineTo(x + 5, y - 7);
    } else {
      // Rails running away from you.
      ctx.moveTo(x - 9, y + 7);
      ctx.lineTo(x - 2, y - 7);
      ctx.moveTo(x + 9, y + 7);
      ctx.lineTo(x + 2, y - 7);
    }
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  /** True if a logical point falls on the back button. */
  hitsBack(point) {
    if (!point) return false;
    const { x, y, r } = backButton();
    return Math.hypot(point.x - x, point.y - y) <= r;
  }

  /** True if a logical point falls on the camera toggle. */
  hitsViewToggle(point) {
    if (!point || !this.viewToggle) return false;
    const { x, y, w, h } = viewButton();
    // Hit area reaches past the drawn button so small fingers don't miss it.
    const m = 10;
    return point.x >= x - m && point.x <= x + w + m && point.y >= y - m && point.y <= y + h + m;
  }

  /**
   * A rounded plate behind a readout.
   *
   * The HUD has to stay legible over whatever the venue puts behind it, and
   * the alley's ceiling is a rig of saturated coloured lights. A wash alone
   * wasn't enough there; a plate per readout always is, and it reads as a
   * deliberate scoreboard rather than text floating on the picture.
   */
  _plate(ctx, x, y, w, h) {
    plate(ctx, x, y, w, h);
  }

  _stat(ctx, x, y, align, label, value, pop = 0, goal = null) {
    // A short overshoot rather than a linear fade: it lands, then settles.
    const swell = pop > 0 ? Math.sin(pop * Math.PI) * 0.24 : 0;
    const valueFont = font(TYPE.score * (1 + swell), WEIGHT.bold);

    ctx.font = font(TYPE.label, WEIGHT.label);
    const labelW = ctx.measureText(label).width;
    const goalText = goal ? (this.score >= goal.score ? '\u2713' : `${goal.isBest ? 'BEST ' : '/'}${goal.score}`) : '';
    ctx.font = font(TYPE.min, WEIGHT.display);
    const goalW = goal ? ctx.measureText(goalText).width + 10 : 0;
    ctx.font = valueFont;
    const w = Math.max(labelW + goalW, ctx.measureText(value).width, goal ? 96 : 0) + 32;
    const px = align === 'left' ? x - 12 : x + 12 - w;
    this._plate(ctx, px, 14, w, 62);

    // The goal: a slim bar along the plate's foot, and the number it's
    // heading for beside the label. Gold and ticked once it's reached.
    if (goal) {
      const frac = Math.max(0, Math.min(1, this.score / goal.score));
      const done = this.score >= goal.score;
      const bx = px + 10, bw = w - 20, by = 14 + 62 - 10;
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, 5, 2.5);
      ctx.fill();
      ctx.fillStyle = done ? ACCENT : goal.medal ? goal.medal.colour : goal.isBest ? '#8fe3ff' : COLOR.success;
      ctx.beginPath();
      ctx.roundRect(bx, by, Math.max(5, bw * frac), 5, 2.5);
      ctx.fill();
      ctx.textAlign = 'right';
      ctx.font = font(TYPE.min, WEIGHT.display);
      ctx.fillStyle = done ? ACCENT : INK_DIM;
      ctx.fillText(goalText, px + w - 10, y + 1);
    }

    ctx.textAlign = align;
    ctx.fillStyle = INK_DIM;
    ctx.font = font(TYPE.label, WEIGHT.label);
    ctx.fillText(label, x, y);
    ctx.fillStyle = pop > 0.05 ? ACCENT : INK;
    ctx.font = valueFont;
    ctx.fillText(value, x, y + 20 - swell * 10);
  }

  /**
   * Where everything on the results card sits. Shared by the drawing and the
   * hit-testing, so a button is always exactly where it looks.
   *
   * Buttons: PLAY AGAIN and HOME every time, plus a big tile for the sport
   * that just opened — the round's real prize, so it's the biggest thing on
   * the card.
   */
  resultsLayout(stats) {
    const { lines = [], unlocked = null } = stats;
    // The big tile at the top: the level that just opened, or an app's NEXT (stats.next).
    const hero = stats.next ?? unlocked;
    const w = 440;
    const x = (VIEW_WIDTH - w) / 2;
    // A locked next level to show off, when the app has one (_hasTeaser).
    const hint = this._hasTeaser(stats);
    const bx = x + 40, bw = w - 80;
    const buttons = {};

    // Laid out from the card's top, then the whole card is centred.
    //   band · [hero: the sport that just opened] · score · rows · [teaser] · buttons
    let by = 76 + 18;
    if (hero) {
      buttons.next = { x: bx - 10, y: by, w: bw + 20, h: HERO_H };
      by += HERO_H + 16;
    }
    const scoreTop = by;
    by += SCORE_H;
    const rowsTop = by + 14;
    by += lines.length * ROW_H + 10;
    // The next sport, still locked: shown as itself, so it's something to
    // want rather than a sentence to read.
    let teaser = null;
    if (hint) {
      teaser = { x: bx, y: by, w: bw, h: TEASER_H };
      by += TEASER_H + 18;
    }
    // The round's XP, just above the buttons — and, if an ad is on offer,
    // the button to double it.
    const xpTop = by;
    by += this._xpHeight(stats);
    if (stats.adOffer) {
      buttons.bonus = { x: bx + 30, y: by, w: bw - 60, h: 52 };
      by += 52 + 12;
    }
    const homeW = 132;
    buttons.again = { x: bx, y: by, w: bw - homeW - 14, h: BUTTON_H };
    buttons.home = { x: bx + bw - homeW, y: by, w: homeW, h: BUTTON_H };
    // An app's own promo (stats.promo: { label }), a full-width button under the pair.
    if (stats.promo) {
      by += BUTTON_H + 12;
      buttons.promo = { x: bx, y: by, w: bw, h: BUTTON_H };
    }
    const h = by + BUTTON_H + 30;

    const y = Math.round((VIEW_HEIGHT - h) / 2);
    for (const b of Object.values(buttons)) b.y += y;
    if (teaser) teaser.y += y;
    return { x, y, w, h, rowsTop: y + rowsTop, scoreTop: y + scoreTop, xpTop: y + xpTop, hint, teaser, buttons };
  }

  /** Where the grown-up check's panel and its answer buttons sit (stats.gate: { question, choices }). */
  gateLayout(gate) {
    const w = 400, h = 300, x = (VIEW_WIDTH - w) / 2, y = (VIEW_HEIGHT - h) / 2;
    const cw = 104, gap = 14, total = gate.choices.length * cw + (gate.choices.length - 1) * gap;
    const x0 = (VIEW_WIDTH - total) / 2;
    return { x, y, w, h, choices: gate.choices.map((v, i) => ({ value: v, x: x0 + i * (cw + gap), y: y + h - 110, w: cw, h: 76 })) };
  }

  /** The grown-up check, over the results card. */
  _drawGate(ctx, gate) {
    const L = this.gateLayout(gate);
    ctx.save();
    ctx.fillStyle = COLOR.scrim;
    fillScreen(ctx);
    panel(ctx, L.x, L.y, L.w, L.h, { band: 76, bandColour: COLOR.slateBand });
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = INK;
    this._fitText(ctx, 'ASK A GROWN-UP', VIEW_WIDTH / 2, L.y + 39, L.w - 40, TYPE.title, WEIGHT.display);
    ctx.font = font(44, WEIGHT.display);
    ctx.fillText(gate.question, VIEW_WIDTH / 2, L.y + 128);
    for (const c of L.choices) this._button(ctx, c, String(c.value), { size: TYPE.title });
    ctx.restore();
  }

  /** Which results button, if any, a point falls on: 'again' | 'home' | 'next' | 'bonus' | 'promo'. */
  hitResults(point, stats) {
    if (!point) return null;
    // A grown-up check (stats.gate) on top of the card: only its answers count, and a tap anywhere else closes it.
    if (stats.gate) {
      const i = this.gateLayout(stats.gate).choices.findIndex((r) => point.x >= r.x && point.x <= r.x + r.w && point.y >= r.y && point.y <= r.y + r.h);
      return i >= 0 ? `gate${i}` : 'gate';
    }
    const { buttons } = this.resultsLayout(stats);
    for (const [id, r] of Object.entries(buttons)) {
      if (point.x >= r.x && point.x <= r.x + r.w && point.y >= r.y && point.y <= r.y + r.h) return id;
    }
    return null;
  }

  /**
   * End-of-round panel: per-sport stat breakdown + unlock state.
   *
   * @param {CanvasRenderingContext2D} ctx
   * @param {object} stats
   * @param {[string, string|number][]} stats.lines  label/value rows
   * @param {number} stats.score      final score
   * @param {boolean} [stats.newBest]
   * @param {string|null} [stats.unlocked]  sport id newly unlocked, if any
   * @param {object} [opts]
   * @param {number} [opts.live]  0..1, how awake the buttons are; they sit
   *        greyed while the card is still ignoring taps

 * Head units: head centre (0, 0), flat crown at about y = -44, ears at
 * (±40, -47) (drawn last, so headwear never hides them), eyes at (±30, -20),
 * brows up to about y = -35: keep headwear above that. Body units: feet (0, 0), shoulders about y = -110,
 * half width about 64.
 */

const { app } = __require('core/app.js');

/** Capy's signature accent (CAPY_IDENTITY.md §2): tangerine, with a white
 *  centre stripe, in every kit of his. */
const CAPY_ACCENT = '#ff9f1c';
const CAPY_ACCENT_STRIPE = '#f2f0ea';

/** Slots, in drawing order. */
const KIT_SLOTS = ['lower', 'top', 'footwear', 'headwear', 'band', 'prop'];

/** Capy's everyday kit: the red vest and headband, and his wristband. */
const DEFAULT_KIT = 'classic';

/** How long a quick change takes, and when in it the new kit appears. */
const KIT_CHANGE_TIME = 0.4;
const KIT_SWAP_AT = 0.18;

const WHITE = '#f2f0ea';

const CLASSIC = {
  label: 'Classic',
  colour: '#c8322b',      // the main colour, unless the player chose one (xp.js)
  second: WHITE,          // shorts, panels, bibs
  trim: WHITE,            // collars, cuffs, stripes
  lower: null,
  top: 'vest',
  style: {},              // how the top is cut: see GARMENTS.top.shirt
  footwear: null,
  headwear: 'headband',
  band: 'arm',
  arm: ['wristband'],     // pieces on the arms, in drawing order
  prop: null,             // null: the sport's own prop (character.js PROPS)
  accent: CAPY_ACCENT,
};

/**
 * The kits, keyed by id: the classic look and the rival's, plus whatever the
 * app registers (registerKits). The club has one kit per sport (Prompt 6 of
 * the rename and kits prompts; CAPY_IDENTITY.md rules). Each has its own main
 * colour, and every one of Capy's has the tangerine wristband and the "C" mark.
 */
const KITS = {
  classic: CLASSIC,

  /** A capybara who isn't Capy (the keeper, the goalie): no signature. */
  rival: { ...CLASSIC, label: 'Rival', colour: null, band: null, arm: [], accent: null },
};

/**
 * Adds an app's kits. Call it from the app's config, which runs before
 * anything draws; the table's order is the order the kit sheet shows them.
 */
function registerKits(table) {
  Object.assign(KITS, table);
}

/** A kit id that exists: a sport's own, or the classic look. */
function kitId(id) {
  return KITS[id] ? id : DEFAULT_KIT;
}

/**
 * The kit's main colour as worn. The player's chosen kit colour (the app's
 * `kits.chosenColour`: in the club, a levelling reward) wins; left at the default, each kit shows its own.
 */
function mainColour(id) {
  const { chosenColour, defaultColour } = app().kits;
  const chosen = chosenColour();
  if (chosen !== defaultColour) return chosen;
  return KITS[kitId(id)].colour ?? chosen;
}

/**
 * The wardrobe override layer (cosmetics.js), by what it may replace. The
 * base rig is never on this list. Only hat, accessory and celebration are
 * worn today; `trail` is kept free for later.
 */
const WARDROBE_OVERRIDES = {
  hat: { cosmetics: ['hat'], replaces: 'headwear' },
  accessory: { cosmetics: ['face', 'back'], replaces: null },
  trail: { cosmetics: [], replaces: null },
  celebration: { cosmetics: ['effect'], replaces: null },
};


/* ── garments ──────────────────────────────────────────────────────────────
 * Each is draw(ctx, o), where o carries:
 *   kit                   the kit (its colours, style and pieces)
 *   colour, light, dark   the main colour as worn, and its two shades
 *   accent, stripe        the signature accent and its stripe
 *   back                  seen from behind
 *   p                     the pose (character.js _pose())
 *   rig                   the base rig's shapes and helpers: blob, ellipse,
 *                         outline, HEAD, PALETTE, artFont
 *   arm, far              for `band`: an arm { sx, sy, ex, ey, ang }, and
 *                         whether it's the far one (drawn behind the body)
 *   goggles               swim goggles pulled down (a dive)
 */

/** The vest's outline, shared by the fill and the clip. */
const VEST = [
  [-58, -100], [-40, -112], [0, -116], [40, -112], [58, -100],
  [62, -74], [58, -48], [30, -38], [0, -35], [-30, -38], [-58, -48], [-62, -74],
];

/** A shirt covers the shoulders too; `long` drops the hem for a jersey. */
function shirtShape(long) {
  const hem = long ? -26 : -33;
  return [
    [-63, -98], [-42, -115], [0, -119], [42, -115], [63, -98],
    [67, -72], [63, -44], [34, hem], [0, hem + 3], [-34, hem], [-63, -44], [-67, -72],
  ];
}

/** The athletics vest: narrow straps, deep armholes. */
const ATH_VEST = [
  [-36, -116], [-18, -112], [0, -104], [18, -112], [36, -116],
  [50, -92], [60, -70], [58, -44], [30, -36], [0, -34], [-30, -36], [-58, -44], [-60, -70], [-50, -92],
];

/** Hips to thighs, over the haunches; the paws sit on top of it. */
const SHORTS = [
  [-64, -48], [0, -45], [64, -48], [76, -34], [70, -15], [40, -13], [0, -11], [-40, -13], [-70, -15], [-76, -34],
];

const outlined = (ctx, o, w = 2.4) => {
  ctx.strokeStyle = o.rig.PALETTE.outline;
  ctx.lineWidth = w;
  ctx.lineJoin = 'round';
  ctx.stroke();
};

/** The main colour as a soft top-left-lit gradient over a shape's box. */
function cloth(ctx, o, x0, y0, x1, y1, colour = o.colour) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, colour === o.colour ? o.light : colour);
  g.addColorStop(0.45, colour);
  g.addColorStop(1, colour === o.colour ? o.dark : 'rgba(0,0,0,0.28)');
  return g;
}

/** A shade laid over whatever was just filled, clipped to the same path. */
function shade(ctx, alpha = 0.22) {
  ctx.save();
  ctx.clip();
  ctx.fillStyle = `rgba(0,0,0,${alpha})`;
  ctx.fillRect(-200, -200, 400, 400);
  ctx.restore();
}

/**
 * White roundel with Capy's mark; the back gets the same mark bigger. On
 * Capy (not a rival) it wears the accent as a ring, so the signature shows
 * even when a held ball hides his wristband.
 */
function drawMark(ctx, o, x, y, r = o.back ? 20 : 15) {
  const { ellipse, PALETTE, artFont } = o.rig;
  if (o.accent) {
    ellipse(ctx, x, y, r + 3.5, (r + 3.5) * 0.95);
    ctx.fillStyle = o.accent;
    ctx.fill();
    ctx.strokeStyle = ACCENT_EDGE;
    ctx.lineWidth = 1.8;
    ctx.stroke();
  }
  ctx.fillStyle = PALETTE.kitTrim;
  ellipse(ctx, x, y, r, r * 0.94);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ellipse(ctx, x, y + r * 0.16, r * 0.98, r * 0.8);
  ctx.fill();
  ctx.fillStyle = PALETTE.kitTrim;
  ellipse(ctx, x, y - r * 0.06, r * 0.92, r * 0.86);
  ctx.fill();

  ctx.fillStyle = PALETTE.kitRedDark;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = artFont(Math.round(r * 1.15), 800);
  ctx.fillText(app().brand.MARK, x, y + 1);
}

/** A big shirt number, for the back. */
function drawNumber(ctx, o, text, x, y, size = 40) {
  ctx.font = o.rig.artFont(size, 900);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 5;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = o.kit.trim;
  ctx.fillText(text, x, y);
}

/** The pieces of a shoe's outline, front (toes) or back (heel), per side. */
function shoeShape(o, side, y) {
  if (o.back) {
    const cx = side * 30;
    return [[cx - 20, y - 9], [cx, y - 13], [cx + 20, y - 9], [cx + 22, y + 7], [cx, y + 14], [cx - 22, y + 7]];
  }
  return [
    [side * 8, y - 12], [side * 40, y - 15], [side * 62, y - 5],
    [side * 60, y + 10], [side * 30, y + 15], [side * 7, y + 7],
  ];
}

/** Where the paws are this frame (character.js _drawPaws). */
const pawY = (o) => -9 + o.p.footLift * -0.35;

/**
 * A pair of shoes. `upper` and `sole` colours; `toe` a second colour over
 * the toe half (bowling, golf saddles); `laces` draws lace bars; `blade` an
 * ice-skate blade under the sole.
 */
function shoes(ctx, o, { upper, sole = WHITE, toe = null, laces = true, blade = false, flash = null }) {
  const { blob } = o.rig;
  const y = pawY(o);
  for (const side of [-1, 1]) {
    const shape = shoeShape(o, side, y);
    if (blade) {
      ctx.fillStyle = '#c9d2dc';
      const cx = o.back ? side * 30 : side * 34;
      ctx.beginPath();
      ctx.roundRect(cx - 22, y + 14, 44, 5, 2.5);
      ctx.fill();
      ctx.fillStyle = '#6f7787';
      ctx.fillRect(cx - 14, y + 11, 3, 5);
      ctx.fillRect(cx + 11, y + 11, 3, 5);
    }
    blob(ctx, shape);
    ctx.fillStyle = upper;
    ctx.fill();
    outlined(ctx, o, 2.6);
    ctx.save();
    blob(ctx, shape);
    ctx.clip();
    if (toe && !o.back) {
      ctx.fillStyle = toe;
      ctx.beginPath();
      ctx.ellipse(side * 50, y + 2, 18, 18, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (flash) {
      // A stripe along the side, in the kit colour.
      ctx.strokeStyle = flash;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(side * (o.back ? 14 : 16), y + 4);
      ctx.quadraticCurveTo(side * (o.back ? 30 : 40), y - 4, side * (o.back ? 46 : 58), y - 6);
      ctx.stroke();
    }
    ctx.fillStyle = sole;
    ctx.fillRect(-90, y + 8, 180, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(-90, y - 16, 180, 5);
    ctx.restore();
    if (laces && !o.back) {
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (let i = 0; i < 2; i++) {
        const lx = side * (22 + i * 8);
        ctx.beginPath();
        ctx.moveTo(lx - 4, y - 8);
        ctx.lineTo(lx + 4, y - 8);
        ctx.stroke();
      }
    }
  }
}

/** A point `u` of the way along an arm, and the arm's direction there. */
function along(arm, u) {
  return {
    x: arm.sx + (arm.ex - arm.sx) * u,
    y: arm.sy + (arm.ey - arm.sy) * u,
    a: Math.atan2(arm.ey - arm.sy, arm.ex - arm.sx),
  };
}

/**
 * Accent pieces are edged in solid dark brown: tangerine is close to the fur
 * in greyscale, so it's the dark-light-dark of edge, band and stripe that
 * keeps the signature readable without colour (CAPY_IDENTITY.md §5).
 */
const ACCENT_EDGE = '#5c3a21';

/** A band round an arm at `u`: `w` across the arm, `h` along it. */
function armBand(ctx, o, u, fill, { h = 9, w = 31, stripe = null, edge = null } = {}) {
  const { x, y, a } = along(o.arm, u);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  ctx.beginPath();
  ctx.roundRect(-h / 2, -w / 2, h, w, 3.5);
  ctx.fillStyle = fill;
  ctx.fill();
  if (edge) {
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2.2;
    ctx.stroke();
  } else outlined(ctx, o, 2);
  if (stripe) {
    ctx.fillStyle = stripe;
    ctx.fillRect(-1.3, -w / 2 + 1.5, 2.6, w - 3);
  }
  ctx.restore();
}

/** Something worn over a paw (a glove), in the paw's own place. */
function overPaw(ctx, o, fill, r = 17) {
  const { ellipse } = o.rig;
  const { ex, ey, ang } = o.arm;
  const side = o.far ? -1 : 1;
  ellipse(ctx, ex, ey, r, r * 0.88, side * ang * 0.4);
  ctx.fillStyle = fill;
  ctx.fill();
  outlined(ctx, o, 2.2);
}

const GARMENTS = {
  top: {
    /** The classic sleeveless vest: shoulder trim, side panel, hem stripe. */
    vest(ctx, o) {
      const { blob, PALETTE } = o.rig;
      // Cut round the shoulders, dipping to a soft hem. Same blob language
      // as the body so it sits on him rather than beside him.
      ctx.save();
      blob(ctx, VEST);
      const g = ctx.createLinearGradient(-50, -116, 60, -36);
      g.addColorStop(0, o.light);
      g.addColorStop(0.45, o.colour);
      g.addColorStop(1, o.dark);
      ctx.fillStyle = g;
      ctx.fill();

      // Side panel + hem trim, clipped to the vest so nothing overhangs.
      ctx.clip();
      ctx.fillStyle = o.dark;
      ctx.beginPath();
      ctx.moveTo(34, -118); ctx.lineTo(52, -118); ctx.lineTo(68, -32); ctx.lineTo(48, -32);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = PALETTE.kitTrim;
      ctx.fillRect(-70, -46, 140, 7);
      ctx.restore();

      // Shoulder trim, following the neckline rather than cutting across it.
      ctx.strokeStyle = PALETTE.kitTrim;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-56, -96);
      ctx.quadraticCurveTo(-28, -114, 0, -114);
      ctx.quadraticCurveTo(28, -114, 56, -96);
      ctx.stroke();

      // Neckline shadow, so the head reads as sitting in the collar.
      ctx.strokeStyle = 'rgba(0,0,0,0.16)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-34, -110);
      ctx.quadraticCurveTo(0, -96, 34, -110);
      ctx.stroke();

      drawMark(ctx, o, o.back ? -2 : 3, -70);
    },

    /**
     * Shirts, polos and jerseys, from one pattern. o.kit.style:
     *   collar   'crew' | 'polo' | 'camp' (bowling) | 'v'
     *   panels   two-tone side panels in `second` (bowling)
     *   hem      'long' for a jersey
     *   stripes  two bands in `trim` above the hem (hockey)
     *   number   on the back
     *   strap    a quiver strap across the chest (archery)
     */
    shirt(ctx, o) {
      const { blob } = o.rig;
      const st = o.kit.style ?? {};
      const shape = shirtShape(st.hem === 'long');
      const hem = st.hem === 'long' ? -26 : -33;
      ctx.save();
      blob(ctx, shape);
      ctx.fillStyle = cloth(ctx, o, -60, -119, 64, hem);
      ctx.fill();
      outlined(ctx, o, 2.4);
      ctx.clip();
      if (st.panels) {
        ctx.fillStyle = o.kit.second;
        for (const side of [-1, 1]) ctx.fillRect(side > 0 ? 24 : -44, -130, 20, 110);
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fillRect(40, -130, 30, 110);
      }
      if (st.stripes) {
        ctx.fillStyle = o.kit.trim;
        ctx.fillRect(-80, hem - 22, 160, 6);
        ctx.fillRect(-80, hem - 12, 160, 6);
      }
      // Shade down the side away from the light.
      ctx.fillStyle = 'rgba(0,0,0,0.14)';
      ctx.beginPath();
      ctx.ellipse(76, -70, 22, 60, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Collar.
      if (!o.back) collar(ctx, o, st.collar);
      else {
        ctx.strokeStyle = o.kit.trim;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-30, -114);
        ctx.quadraticCurveTo(0, -106, 30, -114);
        ctx.stroke();
      }

      if (st.strap) {
        // A quiver strap from the far shoulder to the near hip.
        ctx.strokeStyle = o.kit.second;
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(o.back ? 44 : -44, -110);
        ctx.lineTo(o.back ? -50 : 50, -42);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,230,190,0.5)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (o.back && st.number) drawNumber(ctx, o, st.number, -2, -62, 32);
      else drawMark(ctx, o, o.back ? -2 : st.strap ? -14 : 3, o.back ? -74 : -72);
    },

    /** The athletics vest, with a race bib pinned on below the mark. */
    athVest(ctx, o) {
      const { blob } = o.rig;
      blob(ctx, ATH_VEST);
      ctx.fillStyle = cloth(ctx, o, -60, -116, 60, -34);
      ctx.fill();
      outlined(ctx, o, 2.4);
      ctx.save();
      ctx.clip();
      ctx.fillStyle = o.kit.trim;
      ctx.fillRect(-80, -46, 160, 5);
      ctx.restore();
      if (o.back) {
        drawMark(ctx, o, -2, -76);
        return;
      }
      drawMark(ctx, o, 3, -73, 9);
      // The bib: white card, four pins, a number.
      ctx.save();
      ctx.translate(3, -50);
      ctx.rotate(-0.04);
      ctx.fillStyle = WHITE;
      ctx.beginPath();
      ctx.roundRect(-24, -12, 48, 24, 3);
      ctx.fill();
      outlined(ctx, o, 1.6);
      ctx.fillStyle = '#20242f';
      ctx.font = o.rig.artFont(19, 900);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(o.kit.style?.bib ?? '1', 0, 1);
      ctx.fillStyle = '#9aa3b2';
      for (const [px, py] of [[-20, -8], [20, -8], [-20, 8], [20, 8]]) ctx.fillRect(px - 1, py - 1, 2, 2);
      ctx.restore();
    },

    /** A one-piece swimsuit: straps over the shoulders, scooped neck. */
    swimsuit(ctx, o) {
      const { blob } = o.rig;
      const suit = [
        [-50, -104], [-36, -106], [-24, -92], [0, -86], [24, -92], [36, -106], [50, -104],
        [62, -74], [62, -44], [46, -22], [0, -18], [-46, -22], [-62, -44], [-62, -74],
      ];
      blob(ctx, suit);
      ctx.fillStyle = cloth(ctx, o, -60, -106, 60, -18);
      ctx.fill();
      outlined(ctx, o, 2.4);
      ctx.save();
      ctx.clip();
      // A contrast stripe down each side.
      ctx.fillStyle = o.kit.second;
      ctx.fillRect(46, -110, 8, 100);
      ctx.fillRect(-54, -110, 8, 100);
      ctx.restore();
      drawMark(ctx, o, o.back ? -2 : 3, -64, o.back ? 18 : 14);
    },
  },

  lower: {
    /** Shorts over the hips and thighs, with a side stripe. */
    shorts(ctx, o) {
      const { blob } = o.rig;
      blob(ctx, SHORTS);
      ctx.fillStyle = o.kit.second;
      ctx.fill();
      outlined(ctx, o, 2.4);
      ctx.save();
      ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,0.14)';
      ctx.fillRect(-4, -46, 8, 44);
      ctx.fillStyle = o.kit.second === WHITE ? o.colour : WHITE;
      for (const side of [-1, 1]) ctx.fillRect(side * 66 - 3, -50, 6, 50);
      ctx.restore();
    },

    /** Hockey breezers: padded, dark, with a stripe in the main colour. */
    breezers(ctx, o) {
      const { blob } = o.rig;
      blob(ctx, SHORTS);
      ctx.fillStyle = o.kit.second;
      ctx.fill();
      outlined(ctx, o, 2.4);
      ctx.save();
      ctx.clip();
      ctx.fillStyle = o.colour;
      for (const side of [-1, 1]) ctx.fillRect(side * 66 - 5, -50, 10, 50);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(-80, -48, 160, 6);
      ctx.restore();
    },
  },

  footwear: {
    trainers(ctx, o) {
      shoes(ctx, o, { upper: WHITE, sole: '#c9ced6', flash: o.colour });
      GARMENTS.footwear.pads(ctx, o);
    },
    bowlingShoes(ctx, o) {
      shoes(ctx, o, { upper: '#f2e3c6', sole: '#5c3a21', toe: '#b3342c' });
    },
    golfShoes(ctx, o) {
      shoes(ctx, o, { upper: WHITE, sole: '#2c3038', toe: '#7a4a26' });
    },
    boots(ctx, o) {
      if (o.kit.lower === 'shorts') socks(ctx, o);   // football: socks up to the shorts
      shoes(ctx, o, { upper: o.kit.top === 'shirt' && o.kit.style?.strap ? '#6a4024' : '#20242f', sole: '#f2f0ea' });
    },
    skates(ctx, o) {
      shoes(ctx, o, { upper: '#20242f', sole: '#3a3f4b', blade: true });
    },
    skateShoes(ctx, o) {
      shoes(ctx, o, { upper: '#2c3038', sole: WHITE });
      GARMENTS.footwear.pads(ctx, o);
    },
    /** Knee pads, over the haunches (skateboarding). */
    pads(ctx, o) {
      if (!o.kit.pads) return;
      const { ellipse } = o.rig;
      for (const side of [-1, 1]) {
        const py = -34 + o.p.footLift * 0.3;
        ctx.save();
        ctx.translate(side * 60, py);
        ctx.rotate(side * 0.25);
        // Strap round the leg, then the hard cap over the knee.
        ctx.fillStyle = '#20242f';
        ctx.fillRect(-15, -3, 30, 6);
        ctx.beginPath();
        ctx.roundRect(-11, -12, 22, 22, 7);
        ctx.fillStyle = '#d7dbe2';
        ctx.fill();
        outlined(ctx, o, 2);
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.fillRect(-11, 3, 22, 3);
        ctx.restore();
      }
    },
  },

  headwear: {
    /** The classic headband: a white stripe, and a knot at the temple. */
    headband(ctx, o) {
      const { blob, HEAD, PALETTE } = o.rig;
      const top = -46;
      const h = 11;
      ctx.save();
      // Clipped to the head, so the band wraps it instead of floating past.
      blob(ctx, HEAD);
      ctx.clip();
      const g = ctx.createLinearGradient(-56, top, 56, top + h);
      g.addColorStop(0, o.light);
      g.addColorStop(0.5, o.colour);
      g.addColorStop(1, o.darkBand);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-62, top + 4);
      ctx.quadraticCurveTo(0, top - 6, 62, top + 4);
      ctx.lineTo(62, top + h + 4);
      ctx.quadraticCurveTo(0, top + h - 6, -62, top + h + 4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = PALETTE.kitTrim;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(-62, top + 8);
      ctx.quadraticCurveTo(0, top - 2, 62, top + 8);
      ctx.stroke();
      ctx.restore();

      // Knot, tucked against the temple, with a tail that flicks with the ears.
