  /**
   * Where Capy's feet are drawn. At either end the ring sits across his
   * chest; mirroring his feet as well would stand him under the scoreboard.
   */
  get _capyY() {
    // From the far end he stands back toward the baseline, feet just behind
    // the ring's centre. In front of it (as at the near end) the ball's last
    // stretch into the ring ran through his body and hid the ring.
    if (this.swapped) return this._sy(HIT_Y) - FAR_END_STEP_BACK;
    return this._sy(HIT_Y) + (CAPY_Y - HIT_Y);
  }

  /**
   * A swipe in court terms. From the far end "toward the net" is down the
   * screen, so the vertical is flipped. Only the swipe's length and its
   * sideways lean steer a return, and neither changes, but anything that
   * reads its direction gets the court's.
   */
  _toCourt(shot) {
    if (!this.swapped || shot === TAP_SHOT) return shot;
    return { ...shot, dy: -shot.dy, angle: Math.atan2(-shot.dy, shot.dx) };
  }

  _hitsEnds(point) {
    if (!point) return false;
    const { x, y, w, h } = ENDS_BUTTON;
    // Reaches past the drawn button, as the HUD's own buttons do.
    const m = 10;
    return point.x >= x - m && point.x <= x + w + m && point.y >= y - m && point.y <= y + h + m;
  }

  /** A press on the ends button is never a swing. */
  onBack(point) {
    return super.onBack(point) || this._hitsEnds(point);
  }

  /**
   * SWAP ENDS. Works through the 3-2-1, which is when it's meant to be
   * chosen, and during play too; a ball already in play finishes at the end
   * it started at, and the court swaps before the next feed.
   */
  handleTap(point) {
    if (!this._hitsEnds(point)) return false;
    this.wantSwapped = !this.wantSwapped;
    saveTennisSwapEnds(this.wantSwapped);
    sfx.sfxTap();
    if (!this.ball) this.swapped = this.wantSwapped;
    return true;
  }

  resultLines() {
    return [
      ['Balls faced', this.faced],
      ['Returns', this.returns],
      ['Best streak', this.bestStreak ? `×${this.bestStreak}` : '—'],
    ];
  }

  _moveZone() {
    this.zone = {
      x: COURT.left + SINGLES_INSET + 20 + Math.random() * (COURT.right - COURT.left - SINGLES_INSET * 2 - 40 - ZONE_W),
      y: COURT.top + 110 + Math.random() * (NET_Y - COURT.top - 150 - ZONE_H),
      w: ZONE_W,
      h: ZONE_H,
    };
  }

  /* ── feeding ──────────────────────────────────────────────────────────── */

  _feed() {
    let t = this.lerp(FEED_TIME, FEED_TIME_LATE);
    // A ball coming toward a camera-facing player is harder to judge.
    if (this.swapped) t *= FAR_END_TIME;
    const spread = this.lerp(FEED_SPREAD, FEED_SPREAD_LATE);
    const targetX = MID_X + (Math.random() * 2 - 1) * spread;

    // Bounce somewhere in the near half; lobs and drops change the rhythm.
    let kind = 'drive';
    const changeUps = this.hud.phase === 'chaos' ? CHANGE_UP_CHANCE_CHAOS : CHANGE_UP_CHANCE;
    if (this.elapsed >= CHANGE_UP_AFTER && Math.random() < changeUps) {
      kind = Math.random() < 0.5 ? 'lob' : 'drop';
    }
    let bounceY = 640 + Math.random() * 50;
    let peak1 = 70, peak2 = 60, split = 0.72;
    if (kind === 'lob') { t *= 1.55; peak1 = 300; peak2 = 150; bounceY = 690; split = 0.8; }
    if (kind === 'drop') { t *= 1.35; peak1 = 60; peak2 = 22; bounceY = 575; split = 0.45; }

    const from = { x: MID_X, y: MACHINE_Y };
    const bounceX = from.x + (targetX - from.x) * ((bounceY - from.y) / (HIT_Y - from.y));
    this.ball = {
      mode: 'feed', kind, s: 0,
      from, bounce: { x: bounceX, y: bounceY }, to: { x: targetX, y: HIT_Y },
      t1: t * split, t2: t * (1 - split), peak1, peak2,
      x: from.x, y: from.y, h: 20, swung: false,
    };
    this.trail = [];
    this.faced++;
    this.hud.attempts = this.faced;
    this.machineKick = 1;
    sfx.sfxPock();
    buzz('impact');
  }

  /** Where a feed is, `s` seconds after leaving the machine. */
  _feedAt(b, s) {
    if (s < b.t1) {
      const u = s / b.t1;
      return {
        x: b.from.x + (b.bounce.x - b.from.x) * u,
        y: b.from.y + (b.bounce.y - b.from.y) * u,
        h: 20 * (1 - u) + 4 * b.peak1 * u * (1 - u),
      };
    }
    // After the bounce it keeps coming at the same rate, straight through the
    // ring and off the bottom if nobody hits it.
    const u = (s - b.t1) / b.t2;
    return {
      x: b.bounce.x + (b.to.x - b.bounce.x) * u,
      y: b.bounce.y + (b.to.y - b.bounce.y) * u,
      h: b.peak2 * Math.sin(Math.min(u, 1.6) * Math.PI / 2.2),
    };
  }

  /* ── step ─────────────────────────────────────────────────────────────── */

  step(dt, input) {
    this.zoneFlash = Math.max(0, this.zoneFlash - dt * 2);
    this.machineKick = Math.max(0, this.machineKick - dt * 4);

    const b = this.ball;
    if (!b) {
      this.swapped = this.wantSwapped;
      this.waitT -= dt;
      if (this.waitT <= 0) this._feed();
      this._runTo(MID_X, dt);
      return;
    }

    if (b.mode === 'feed') {
      b.s += dt;
      Object.assign(b, this._feedAt(b, b.s));
      this._pushTrail(b, b.t1 + b.t2 < 1.0);
      // He runs to where the ball will be when it reaches the ring.
      this._runTo(b.to.x, dt);

      // Timing is read from where the ball was when the swipe began, not
      // where it is when the finger lifts. A swipe takes a fifth of a second
      // or so; judged on release, a well-timed swing on a quick feed landed
      // after the ball had already left the ring and counted as a miss.
      if (input.pressed && !this.onBack(input.start)) b.pressAt = { x: b.x, y: b.y };

      const shot = this.swipe.release(input) ?? (tapPoint(input, SWIPE_MIN) ? TAP_SHOT : null);
      if (shot && !this.onBack(input.start)) this._swing(this._toCourt(shot));

      // Past the ring is a miss — unless a swing that started in reach is
      // still coming through, in which case it gets to finish.
      const swinging = input.active && b.pressAt && this._reachOf(b.pressAt) <= REACH;
      const gone = b.y > HIT_Y + RING_R * (swinging ? 2.4 : 1);
      // `this.ball === b`: a swing this step has already replaced the feed
      // with the return, and the old feed must not then be missed on top of
      // it — that wiped out good late hits on the quick feeds.
      if (this.ball === b && gone) this._miss();
      return;
    }

    // Return in flight, or a ball dying in the net / out wide.
    b.s += dt;
    const u = Math.min(1, b.s / b.dur);
    b.x = b.from.x + (b.to.x - b.from.x) * u;
    b.y = b.from.y + (b.to.y - b.from.y) * u;
    b.h = 16 + 4 * b.peak * u * (1 - u) - (b.mode === 'net' ? 16 * u : 0);
    this._pushTrail(b, b.fast);
    this._runTo(MID_X, dt * 0.5);
    if (u >= 1) this._land(b);
  }

  _runTo(x, dt) {
    const gap = x - this.capyX;
    const step = RUN_SPEED * dt;
    this.capyX += Math.abs(gap) <= step ? gap : Math.sign(gap) * step;
  }

  /** Distance from the ball to the ring's centre, in ring radii. */
  _ringDistance(b) {
    return Math.hypot(b.x - this.capyX, b.y - HIT_Y) / RING_R;
  }

  /** Ring distance of a remembered ball position, in ring radii. */
  _reachOf(at) {
    return Math.hypot(at.x - this.capyX, at.y - HIT_Y) / RING_R;
  }

  _swing(shot) {
    const b = this.ball;
    if (b.swung) return;
    const at = b.pressAt ?? { x: b.x, y: b.y };
    b.pressAt = null;
    // Out of reach: that was this ball's swing. Free swings let a steady
    // stream of swipes beat actual timing, so a whiff counts — and says so,
    // and the ring greys out until the next feed.
    b.swung = true;
    if (this._reachOf(at) > REACH) {
      b.whiffed = true;
      this.capy.play('shoot');
      this.reward('miss', this.capyX, this._sy(HIT_Y - 130), at.y < HIT_Y ? 'TOO EARLY!' : 'TOO LATE!');
      return;
    }
    this.demoDone();
    this.capy.play('shoot');

    sfx.sfxPock();

    buzz('impact');
    const timing = (at.y - HIT_Y) / RING_R; // < 0 early, > 0 late
    const depth = Math.min(1, shot.len / DEPTH_SPAN);
    const aimX = MID_X + shot.lateral * (COURT.right - COURT.left) / 2 * 0.72;
    const aimY = NET_Y - 70 - depth * (NET_Y - COURT.top - 110);
    // The return leaves from wherever the ball actually is now.
    const from = { x: b.x, y: Math.min(b.y, HIT_Y + RING_R) };

    let mode = 'return', to = { x: aimX, y: aimY }, peak = 110;
    if (timing < -EARLY_WINDOW) {
      // Early: the face is still open, and it sprays off a sideline.
      mode = 'wide';
      const side = Math.sign(aimX - MID_X) || (Math.random() < 0.5 ? -1 : 1);
      to = { x: side > 0 ? COURT.right + 40 + Math.random() * 40 : COURT.left - 40 - Math.random() * 40, y: aimY };
    } else if (timing > LATE_WINDOW) {
      // Late: it's behind him, and all he can do is push it into the net.
      mode = 'net';
      to = { x: from.x + (aimX - from.x) * 0.4, y: NET_Y + 6 };
      peak = 40;
    }

    this.ball = {
      mode, s: 0, dur: RETURN_TIME * (mode === 'net' ? 0.8 : 1),
      from, to, peak, fast: depth > 0.6, x: from.x, y: from.y, h: 16,
    };
    this.trail = [];
  }

  _land(b) {
    const cx = b.to.x, cy = b.to.y;
    if (b.mode === 'return') {
      this.returns++;
      this.streak++;
      this.bestStreak = Math.max(this.bestStreak, this.streak);
      let pts = RETURN_POINTS;
      const z = this.zone;
      const inZone = cx >= z.x && cx <= z.x + z.w && cy >= z.y && cy <= z.y + z.h;
      if (inZone) {
        pts += ZONE_BONUS;
        this.zoneFlash = 1;
      }
      const streakHit = this.streak % STREAK_EVERY === 0;
      if (streakHit) pts += STREAK_BONUS;
      this.addScore(pts);
      // Tiers (feedback.js): a return is normal, the target is good, a
      // streak bonus is great.
      this.reactions.report({ scored: true, quality: streakHit ? 'great' : 'good' });
      if (streakHit) {
        achieve('onTarget');
        // The racquet twirl: `hype` spins the racquet in character.js.
        this.capy.play('hype');
        this.reward('great', MID_X, this._sy(NET_Y - 30), `${this.streak} IN A ROW! +${STREAK_BONUS}`);
        sfx.sfxCheer();
      }
      this.reward(inZone ? 'good' : 'normal', cx, this._sy(cy) - 30, inZone ? `TARGET! +${pts}` : `+${pts}`,
        { colours: inZone ? [COLOR.gold, '#d8f050', '#ffffff'] : ['#d8f050', '#ffffff'] });
      if (inZone) sfx.sfxAce();
      this._moveZone();
    } else {
      this.streak = 0;
      this.reactions.report({ scored: false, quality: 'near' });
      this.reward('miss', MID_X, this._sy(NET_Y - 30), b.mode === 'net' ? 'NET! (LATE)' : 'WIDE! (EARLY)');
      if (b.mode === 'net') sfx.sfxNet();
    }
    this.ball = null;
    this.waitT = 0.35;
  }

  _miss() {
    this.streak = 0;
    this.reactions.report({ scored: false, quality: this.ball.swung ? 'near' : 'bad' });
    this.ball = null;
    // Straight into the next one — there's no rally to lose.
    this.waitT = 0.15;
  }

  _pushTrail(b, fast) {
    if (!fast) { this.trail = []; return; }
    // Court position and height; _drawBall puts it on screen.
    this.trail.push({ x: b.x, y: b.y, h: b.h });
    if (this.trail.length > 9) this.trail.shift();
  }

  /* ── draw ─────────────────────────────────────────────────────────────── */

  drawWorld(ctx) {
    this._drawCourt(ctx);
    this._drawZone(ctx);
    const b = this.ball;
    // A ball beyond the net is drawn before the net, a near one after it.
    const far = b && this._sy(b.y) < NET_Y;
    if (this.swapped) {
      // Capy is the far figure now, standing back behind his ring. The ring
      // and a ball coming at him are between him and the camera, so both go
      // over him: the ball's last stretch into the ring stays in sight.
      this._drawCapy(ctx);
      this._drawRing(ctx);
      if (far) this._drawBall(ctx, b);
      this._drawNet(ctx);
      this._drawMachine(ctx);
    } else {
      this._drawMachine(ctx);
      if (far) this._drawBall(ctx, b);
      this._drawNet(ctx);
      this._drawRing(ctx);
      this._drawCapy(ctx);
    }
    if (b && !far) this._drawBall(ctx, b);
  }

  _drawCapy(ctx) {
    const y = this._capyY;
    // From the far end he faces the camera, and us.
    this.capy.draw(ctx, this.capyX, y, { scale: CAPY_SCALE, facing: this.swapped ? 'front' : 'back', holdingProp: true });
    this.reactions.anchor(this.capyX, y, CAPY_SCALE);
  }

  drawOverlay(ctx) {
    const b = this.ball;
    if (b?.mode === 'feed' && !b.swung && this._ringDistance(b) < REACH) {
      // On the net side of the ring, at either end.
      this.pill(ctx, this.capyX, this._sy(HIT_Y - RING_R - 40), 'SWIPE!', { size: 22 });
    }
    this._drawEndsButton(ctx);
    if (this.streak >= 2) {
    }
  }

  _drawCourt(ctx) {
    // Everything here is static, so it's painted once and reused.
    baked(ctx, 'tennis-court', 0, 0, VIEW_WIDTH, 960, (c) => this._paintCourt(c));
  }

  /** The venue: hard-court surround, windbreak, bench and umpire's chair. */
  _paintCourt(ctx) {
    const { left, right, top, bottom } = COURT;
    // Surround: the darker green acrylic outside the lines, with grain.
    ctx.fillStyle = '#2f7a4f';
    ctx.fillRect(0, 0, VIEW_WIDTH, 960);
    speckle(ctx, 0, 0, VIEW_WIDTH, 960, { n: 900, alpha: 0.06, seed: 21 });

    // Windbreak along the back: a dark screen with a banner, so the far end
    // reads as the edge of a real court and not the edge of the screen.
    const wb = ctx.createLinearGradient(0, 0, 0, 112);
    wb.addColorStop(0, '#173826');
    wb.addColorStop(1, '#1f4a33');
    ctx.fillStyle = wb;
    ctx.fillRect(0, 0, VIEW_WIDTH, 112);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let x = 0; x < VIEW_WIDTH; x += 12) ctx.fillRect(x, 0, 2, 112);
    banner(ctx, { x: MID_X - 90, y: 84, w: 180, h: 24, text: 'CAPY OPEN', bg: '#2b5f9e' });
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 112, VIEW_WIDTH, 6);

    // The court itself: lit from the far end, darker toward the player.
    const cx = left - 20, cy = top - 30, cw = right - left + 40, ch = bottom - top + 60;
    ctx.fillStyle = '#3f7fc4';
    ctx.fillRect(cx, cy, cw, ch);
    speckle(ctx, cx, cy, cw, ch, { n: 700, alpha: 0.05, seed: 22 });
    lightWash(ctx, cx, cy, cw, ch, { alpha: 0.14 });
    // A hard edge where the court paint meets the surround.
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 3;
    ctx.strokeRect(cx, cy, cw, ch);

    // Lines, with a faint shadow under each so they sit on the surface.
    const lines = () => {
      ctx.beginPath();
      ctx.rect(left, top, right - left, bottom - top);
      ctx.moveTo(left + SINGLES_INSET, top); ctx.lineTo(left + SINGLES_INSET, bottom);
      ctx.moveTo(right - SINGLES_INSET, top); ctx.lineTo(right - SINGLES_INSET, bottom);
      // Service lines and the centre line between them.
      const sTop = NET_Y - 190, sBot = NET_Y + 190;
      ctx.moveTo(left + SINGLES_INSET, sTop); ctx.lineTo(right - SINGLES_INSET, sTop);
      ctx.moveTo(left + SINGLES_INSET, sBot); ctx.lineTo(right - SINGLES_INSET, sBot);
      ctx.moveTo(MID_X, sTop); ctx.lineTo(MID_X, sBot);
      // Centre marks on the baselines.
      ctx.moveTo(MID_X, top); ctx.lineTo(MID_X, top + 12);
      ctx.moveTo(MID_X, bottom); ctx.lineTo(MID_X, bottom - 12);
    };
    ctx.save();
    ctx.translate(1, 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 4;
    lines();
    ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = '#f2f6ee';
    ctx.lineWidth = 3.5;
    lines();
    ctx.stroke();

    // Scuffs behind the near baseline, where every rally starts.
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.ellipse(MID_X - 90 + i * 36, bottom - 26 + (i % 2) * 8, 26, 7, 0.2 * (i - 3), 0, Math.PI * 2);
      ctx.fill();
    }

    // Umpire's chair at the net, on the right margin.
    groundShadow(ctx, right + 40, NET_Y + 22, 22, 7, 0.3);
    ctx.strokeStyle = '#e9e4d8';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(right + 30, NET_Y + 20); ctx.lineTo(right + 34, NET_Y - 30);
    ctx.moveTo(right + 50, NET_Y + 20); ctx.lineTo(right + 46, NET_Y - 30);
    ctx.moveTo(right + 31, NET_Y); ctx.lineTo(right + 49, NET_Y);
    ctx.stroke();
    chunk(ctx, right + 26, NET_Y - 44, 28, 16, 4, '#2b5f9e');
    chunk(ctx, right + 26, NET_Y - 62, 6, 20, 3, '#2b5f9e');

    // Players' bench on the left, with a towel and a tube of balls.
    groundShadow(ctx, left - 44, NET_Y + 132, 22, 60, 0.28);
    chunk(ctx, left - 64, NET_Y + 70, 36, 120, 6, '#2b5f9e');
    chunk(ctx, left - 60, NET_Y + 74, 28, 112, 4, '#3b72b3');
    chunk(ctx, left - 58, NET_Y + 96, 24, 30, 4, '#f7f5f0');
    chunk(ctx, left - 52, NET_Y + 146, 12, 30, 5, '#d8f050');

    vignette(ctx, VIEW_WIDTH, 960, 0.22);
  }

  _drawZone(ctx) {
    const z = { ...this.zone, y: Math.min(this._sy(this.zone.y), this._sy(this.zone.y + this.zone.h)) };
    const pulse = 0.5 + 0.5 * Math.sin(this.t * 5);
    ctx.save();
    ctx.fillStyle = withAlpha(COLOR.gold, 0.16 + 0.1 * pulse + this.zoneFlash * 0.5);
    ctx.fillRect(z.x, z.y, z.w, z.h);
    ctx.strokeStyle = withAlpha(COLOR.gold, 0.7 + this.zoneFlash * 0.3);
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 7]);
    ctx.strokeRect(z.x, z.y, z.w, z.h);
    ctx.setLineDash([]);
    ctx.fillStyle = COLOR.gold;
    ctx.font = font(14, 800);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+2', z.x + z.w / 2, z.y + z.h / 2);
    ctx.restore();
  }

  _drawMachine(ctx) {
    const my = this._sy(MACHINE_Y);
    // It kicks back away from Capy, whichever end that is.
    const kick = this.machineKick * 4 * (this.swapped ? -1 : 1);
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(MID_X, my + 34, 44, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2c3038';
    ctx.beginPath();
    ctx.roundRect(MID_X - 36, my - 20 - kick, 72, 50, 10);
    ctx.fill();
    ctx.fillStyle = COLOR.fail;
    ctx.beginPath();
    ctx.roundRect(MID_X - 30, my - 14 - kick, 60, 16, 6);
    ctx.fill();
    // Hopper full of balls.
    ctx.fillStyle = BALL_COLOUR;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(MID_X - 20 + i * 10, my - 26 - kick - (i % 2) * 5, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    // The chute faces Capy. From the near end we see the machine's back,
    // so there's no chute to show.
    if (!this.swapped) {
      ctx.fillStyle = '#6f7787';
      ctx.fillRect(MID_X - 9, my + 22 - kick, 18, 18);
    }
    ctx.restore();
  }

  _drawNet(ctx) {
    const { left, right } = COURT;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(left - 18, NET_Y + 4, right - left + 36, 10);
    ctx.strokeStyle = 'rgba(247,245,240,0.55)';
    ctx.lineWidth = 1;
    for (let x = left - 18; x <= right + 18; x += 8) {
      ctx.beginPath(); ctx.moveTo(x, NET_Y - 14); ctx.lineTo(x, NET_Y + 4); ctx.stroke();
    }
    ctx.fillStyle = COLOR.ink;
    ctx.fillRect(left - 18, NET_Y - 18, right - left + 36, 6);
    ctx.fillStyle = '#2c3038';
    ctx.fillRect(left - 24, NET_Y - 26, 8, 32);
    ctx.fillRect(right + 16, NET_Y - 26, 8, 32);
    ctx.restore();
  }

  /** The hit zone: a glowing ring that brightens as the ball arrives. */
  _drawRing(ctx) {
    const b = this.ball;
    // A ball whose swing was spent on a whiff greys the ring out, so the
    // player can see this one's gone and the next one is the one to watch.
    const spent = b?.mode === 'feed' && b.whiffed;
    const near = b?.mode === 'feed' && !spent ? Math.max(0, 1 - this._ringDistance(b) / 2.2) : 0;
    const ring = spent ? '#9aa3b2' : COLOR.gold;
    const hy = this._sy(HIT_Y);
    // The clean band's edges: early on the side the ball comes from.
    const earlyY = this._sy(HIT_Y - RING_R * EARLY_WINDOW);
    const lateY = this._sy(HIT_Y + RING_R * LATE_WINDOW);
    ctx.save();
    const g = ctx.createRadialGradient(this.capyX, hy, RING_R * 0.6, this.capyX, hy, RING_R * 1.15);
    g.addColorStop(0, withAlpha(ring, 0));
    g.addColorStop(0.8, withAlpha(ring, 0.12 + near * 0.3));
    g.addColorStop(1, withAlpha(ring, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
