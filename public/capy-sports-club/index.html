    // menu to browse and points at the one thing to do.
    this.firstVisit = Object.values(this.save.rounds).every((n) => !n);
    if (this.firstVisit) this.scroll = 0;
  }

  exit() {}

  /**
   * The Cup: bronze, silver and gold for 3, 6 and all 10 sports won to
   * their trophy scores. Opens with the bronze. Read-only: this reports
   * progress, it never grants any.
   */
  _layoutCup() {
    const won = trophiesWon(this.save);
    // Always open: before any Cup it's the cabinet to fill, after it's the
    // record of what's been won.
    const open = this.available.has('capyCup');
    const next = nextCupTier(this.save);
    const tier = cupTier(this.save);
    const tiers = tier ? CUP_TIERS.indexOf(tier) + 1 : 0;
    return {
      id: 'capyCup',
      label: CUP_NAME.toUpperCase(),
      accent: ACCENT,
      rect: CUP_RECT,
      state: open ? 'ready' : 'locked',
      won,
      tier,
      held: !!tier,
      // A Cup reached but not yet celebrated on the Cup screen.
      pending: tiers > (this.save.cupSeen ?? 0),
      requirement: next ? `WIN ${next.trophies} SPORTS` : null,
    };
  }

  /** Builds the plot rects and their per-plot state, top to bottom. */
  _layout() {
    return AREAS.map((area, i) => {
      const y = PLOT_TOP + i * (PLOT_H + PLOT_GAP);
      const rect = { x: PLOT_X, y, w: PLOT_W, h: PLOT_H };

      const unlocked = this.save.unlocked[area.id];
      const built = this.available.has(area.id);
      const state = !unlocked ? 'locked' : built ? 'ready' : 'unbuilt';

      return {
        ...area,
        rect,
        state,
        best: this.save.highScores[area.id] ?? 0,
        target: UNLOCK_THRESHOLDS[area.id] ?? 0,
        requirement: unlocked ? null : this._requirement(area.id),
        // Open but never played: worth a NEW! badge.
        fresh: state === 'ready' && !(this.save.rounds[area.id] > 0),
      };
    }).map((plot, i, all) => {
      // The one locked plot the player is working toward gets the full tease.
      const next = plot.state === 'locked' && all.slice(0, i).every((p) => p.state !== 'locked');
      if (!next) return plot;
      const prev = AREAS[i - 1];
      return {
        ...plot,
        next: {
          from: prev.label,
          best: this.save.highScores[prev.id] ?? 0,
          target: UNLOCK_THRESHOLDS[prev.id],
          goes: roundsToUnlock(prev.id, this.save),
        },
      };
    });
  }

  get _maxScroll() {
    const last = this.plots[this.plots.length - 1];
    if (!last) return 0;
    return Math.max(0, last.rect.y + PLOT_H + 24 - YARD_BOTTOM);
  }

  _clampScroll(v) {
    return Math.max(0, Math.min(this._maxScroll, v));
  }

  /** A plot's rect where it's actually drawn, with the scroll applied. */
  _onScreen(rect) {
    return { ...rect, y: rect.y - this.scroll };
  }

  /**
   * "SCORE 15 AT BASKETBALL — OR 2 MORE GOES": what it takes to open a
   * locked plot. Either one does it; the second is there so a sport a child
   * can't yet beat never walls off the rest.
   */
  _requirement(sportId) {
    const i = AREAS.findIndex((a) => a.id === sportId);
    const prev = AREAS[i - 1];
    if (!prev) return null;
    const goes = roundsToUnlock(prev.id, this.save);
    return `SCORE ${UNLOCK_THRESHOLDS[prev.id]} AT ${prev.label} \u2014 OR ${goes} MORE GO${goes === 1 ? '' : 'ES'}`;
  }

  /* ── input ──────────────────────────────────────────────────────────────── */

  update(dt, input) {
    this.t += dt;
    this.enterT += dt;
    this.capy.update(dt);
    this._stepSparks(dt);

    // The tap celebration owns the screen until it hands over to the sport.
    // Nothing else is allowed to run while it does, or a second tap could
    // start a different sport out from under the one already leaving.
    if (this.launch) {
      this.launch.t -= dt;
      if (this.launch.t <= 0) {
        const { id, rect } = this.launch;
        this.launch = null;
        // The iris closes onto the plot that was tapped.
        this.onSelect?.(id, { x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 });
      }
      return;
    }

    // The settings card, when it's up, has the whole screen.
    if (this.settings.update(dt, input)) return;
    if (this.trophies.update(dt, input)) return;
    if (this.daily.update(dt, input)) return;
    if (this.profile.update(dt, input)) return;

    if (this.bubble && (this.bubble.t -= dt) <= 0) this.bubble = null;
    this.trickCool = Math.max(0, this.trickCool - dt);
    // Every so often, if nobody's touching anything, he suggests something.
    if (input.active) this.suggestT = SUGGEST_EVERY;
    else if ((this.suggestT -= dt) <= 0) {
      this.suggestT = SUGGEST_EVERY;
      this._suggest();
    }

    if (this.nudge) {
      this.nudge.t -= dt;
      if (this.nudge.t <= 0) this.nudge = null;
    }

    // The club owner is the shop window, so he doesn't just stand there —
    // every few seconds he cheers at whoever's deciding.
    this.flourishT -= dt;
    if (this.flourishT <= 0) {
      this.flourishT = FLOURISH_EVERY;
      this.capy.play('celebrate');
    }

    // Scrolling the yard. A press that has moved further than a tap allows
    // is a drag, and from then on it only scrolls.
    if (input.pressed) {
      this.dragFrom = this.scroll;
      this.scrollV = 0;
      this.dragging = false;
    }
    if (input.active && this.dragFrom !== null) {
      const dy = input.current.y - input.start.y;
      if (Math.abs(dy) > TAP_MAX_DRAG) this.dragging = true;
      if (this.dragging) {
        this.scrollTo = null;
        const next = this._clampScroll(this.dragFrom - dy);
        this.scrollV = (next - this.scroll) / Math.max(dt, 1e-3);
        this.scroll = next;
      }
    } else {
      this.dragFrom = null;
      if (Math.abs(this.scrollV) > 5) {
        this.scroll = this._clampScroll(this.scroll + this.scrollV * dt);
        this.scrollV *= Math.max(0, 1 - 5 * dt);
      } else this.scrollV = 0;
    }
    // Easing toward a chevron tap's destination.
    if (this.scrollTo != null) {
      this.scroll += (this.scrollTo - this.scroll) * Math.min(1, dt * 12);
      if (Math.abs(this.scrollTo - this.scroll) < 0.5) {
        this.scroll = this.scrollTo;
        this.scrollTo = null;
      }
    }

    // Highlight whatever the finger is currently down on, and hand him the
    // right ball and kit while it is — the prop is the fastest preview there is.
    this.pressedId = null;
    if (input.active && !this.dragging) {
      const hit = this._hit(input.start);
      if (hit?.state === 'ready') {
        this.pressedId = hit.id;
        if (PROPS[hit.id]) {
          this.capy.sport = hit.id;
          this.capy.changeKit(hit.id);   // dressed for whatever you're pressing
        }
      }
      // He looks at whatever you're touching.
      if (hit) this.capy.glance(1, 0.5);
    }

    // Mouse wheel and two-finger trackpad scroll, for desktop.
    if (input.wheel) {
      this.scrollTo = null;
      this.scroll = this._clampScroll(this.scroll + input.wheel);
      this.scrollV = 0;
    }

    const tap = tapPoint(input);
    if (!tap) return;
    if (Math.hypot(tap.x - GEAR.x, tap.y - GEAR.y) <= GEAR.r + 6) {
      this.settings.show();
      return;
    }
    if ((tap.x >= PURSE.x && tap.x <= PURSE.x + (this._purseW ?? 90) && tap.y >= PURSE.y - 6 && tap.y <= PURSE.y + 50)
      || (tap.x >= LEVEL_BADGE.x && tap.x <= LEVEL_BADGE.x + 140 && tap.y >= LEVEL_BADGE.y - 6 && tap.y <= LEVEL_BADGE.y + 50)) {
      this.profile.show();
      return;
    }
    if (Math.hypot(tap.x - DAILY_BTN.x, tap.y - DAILY_BTN.y) <= DAILY_BTN.r + 6) {
      this.daily.show();
      return;
    }
    if (Math.hypot(tap.x - STAR_BTN.x, tap.y - STAR_BTN.y) <= STAR_BTN.r + 6) {
      this.trophies.show();
      return;
    }
    if (Math.hypot(tap.x - CAPY_HIT.x, tap.y - CAPY_HIT.y) <= CAPY_HIT.r) {
      this._poke();
      return;
    }
    // The chevrons are buttons: each tap moves the yard one plot.
    const arrow = this._hitArrow(tap);
    if (arrow) {
      this.scrollV = 0;
      this.scrollTo = this._clampScroll(this.scroll + arrow * (PLOT_H + PLOT_GAP));
      sfx.sfxClack();
      return;
    }
    const hit = this._hit(tap);
    if (!hit) return;
    if (hit.state === 'ready') this._launch(hit);
    else if (hit.state === 'locked') this._refuse(hit);
  }

  /**
   * First launch: a glowing ring round basketball and a ghost finger tapping
   * it — the whole instruction manual, in one glance.
   */
  _drawFirstVisit(ctx) {
    const plot = this.plots.find((p) => p.id === 'basketball');
    if (!plot) return;
    const r = this._onScreen(plot.rect);
    if (r.y + r.h < YARD_TOP || r.y > YARD_BOTTOM) return;
    const pulse = 0.5 + 0.5 * Math.sin(this.t * 5);
    ctx.save();
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 4 + pulse * 3;
    ctx.globalAlpha = 0.55 + pulse * 0.45;
    roundRect(ctx, r.x - 6, r.y - 6, r.w + 12, r.h + 12, 26);
    ctx.stroke();
    ctx.restore();

    // The finger taps once a second, just right of the middle of the plot.
    const u = (this.t % 1.1) / 1.1;
    const press = u > 0.35 && u < 0.55;
    const hx = r.x + r.w * 0.62, hy = r.y + r.h * 0.5;
    if (press) {
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(hx, hy, 24, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = 0.92;
    drawHand(ctx, hx, hy + (press ? 0 : 10));
    ctx.restore();
  }

  /** The coin balance, beside the level badge; opens the wardrobe to spend. */
  _drawPurse(ctx) {
    const { x, y } = PURSE;
    const purse = coinBalance();
    ctx.save();
    ctx.font = font(TYPE.label, WEIGHT.display);
    const w = ctx.measureText(String(purse)).width + 50;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    roundRect(ctx, x, y + 3, w, 44, 22);
    ctx.fill();
    ctx.fillStyle = COLOR.slateLow;
    roundRect(ctx, x, y, w, 44, 22);
    ctx.fill();
    ctx.strokeStyle = 'rgba(247,245,240,0.55)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    coinGlyph(ctx, x + 22, y + 22, 12);
    ctx.fillStyle = COLOR.gold;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(purse), x + 40, y + 23);
    ctx.restore();
    this._purseW = w;
  }

  /** Tapped Capy: a trick and a word, because he's the owner and he's pleased to see you. */
  _poke() {
    if (this.trickCool > 0) return;
    this.trickCool = 0.8;
    const tricks = ['hype', 'victory', 'celebrate', 'surprise'];
    this.capy.play(tricks[(Math.random() * tricks.length) | 0]);
    this._say(TAP_LINES[(Math.random() * TAP_LINES.length) | 0]);
    this.flourishT = FLOURISH_EVERY;
    sfx.sfxCheer();
    buzz('light');
  }

  /** What he'd point you at right now: a new sport, the next unlock, or the Cup. */
  _suggest() {
    const fresh = this.plots.find((p) => p.fresh);
    const next = this.plots.find((p) => p.next);
    if (fresh) this._say(`Try ${fresh.label}!`);
    else if (next) {
      const need = Math.max(0, next.next.target - next.next.best);
      this._say(need > 0 ? `${next.label} next!` : `Nearly ${next.label}!`);
    } else if (this.cup.state === 'ready') this._say('To the Cup!');
    else this._say("Let's play!");
    this.capy.play('celebrate');
  }

  _say(text) {
    this.bubble = { text, t: 2.2 };
    sfx.sfxChirp();
  }

  /** His speech bubble, above his head, pointing down at him. */
  _drawBubble(ctx) {
    const b = this.bubble;
    if (!b) return;
    const age = 2.2 - b.t;
    const grow = age < 0.14 ? 0.6 + 0.4 * (age / 0.14) : 1;
    // In the strip between the yard and his ears, so it never covers a plot.
    const x = CAPY_HIT.x + 16, y = YARD_BOTTOM + 30;
    ctx.save();
    ctx.globalAlpha = Math.min(1, b.t * 3);
    ctx.translate(x, y);
    ctx.scale(grow, grow);
    ctx.beginPath();
    ctx.moveTo(-26, 12); ctx.lineTo(-34, 26); ctx.lineTo(-12, 14);
    ctx.fillStyle = 'rgba(10,13,22,0.66)';
    ctx.fill();
    pill(ctx, 0, 0, b.text, { size: TYPE.label + 2, tone: 'gold', weight: WEIGHT.display });
    ctx.restore();
  }

  /** Tapped a plot that's open: a flash, a cheer, then the sport. */
  _launch(plot) {
    const rect = plot.id === 'capyCup' ? plot.rect : this._onScreen(plot.rect);
    this.launch = { id: plot.id, t: LAUNCH_TIME, rect, accent: plot.accent };
    // The Cup isn't a sport and has no prop, so he keeps whatever he's holding.
    if (PROPS[plot.id]) {
      this.capy.sport = plot.id;
      this.capy.changeKit(plot.id);
    }
    this.capy.play('hype');
    this._spark(rect, plot.accent);
    sfx.sfxCheer();
  }

  /** Tapped a plot that's shut: it rattles, and he looks at you about it. */
  _refuse(plot) {
    this.nudge = { id: plot.id, t: NUDGE_TIME };
    this.capy.play('shrug');
    sfx.sfxClank();
  }

  /** Chevron positions, shared by the drawing and the hit test. */
  _arrows() {
    const out = [];
    if (this.scroll < this._maxScroll - 4) out.push({ dir: 1, x: VIEW_WIDTH - 26, y: YARD_BOTTOM - 22 });
    if (this.scroll > 4) out.push({ dir: -1, x: VIEW_WIDTH - 26, y: YARD_TOP + 4 });
    return out;
  }

  /** +1 / -1 if a tap landed on a chevron (with a generous margin), else 0. */
  _hitArrow(point) {
    const a = this._arrows().find((a) => Math.hypot(point.x - a.x, point.y - a.y) < 32);
    return a ? a.dir : 0;
  }

  _hit(point) {
    const inside = (r) => point.x >= r.x && point.x <= r.x + r.w && point.y >= r.y && point.y <= r.y + r.h;
    if (this.cup && inside(this.cup.rect)) return this.cup;
    // Plots only count inside the yard window; one scrolled under the
    // clubhouse or the hedge can't be tapped through them.
    if (point.y < YARD_TOP || point.y > YARD_BOTTOM) return null;
    return this.plots.find(({ rect }) => inside(this._onScreen(rect)));
  }

  /* ── tap sparkles ───────────────────────────────────────────────────────── */

  /** A puff of confetti off the plot that was just chosen. */
  _spark(rect, accent) {
    const colours = [accent, ACCENT, '#ffffff', ...FESTIVE];
    for (let i = 0; i < 34; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 90 + Math.random() * 260;
      this.sparks.push({
        x: rect.x + Math.random() * rect.w,
        y: rect.y + Math.random() * rect.h,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed - 120,
        r: 3 + Math.random() * 4,
        col: colours[Math.floor(Math.random() * colours.length)],
        age: 0,
        life: 0.5 + Math.random() * 0.4,
      });
    }
  }

  _stepSparks(dt) {
    for (const s of this.sparks) {
      s.age += dt;
      s.vy += 900 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
    }
    this.sparks = this.sparks.filter((s) => s.age < s.life);
  }

  /* ── draw ───────────────────────────────────────────────────────────────── */

  /** @param {CanvasRenderingContext2D} ctx */
  draw(ctx) {
    this._drawSky(ctx);
    this._drawSkyline(ctx);
    this._drawGround(ctx);
    this._drawClubhouse(ctx);

    this._drawYard(ctx);

    this._drawForecourt(ctx);
    this._drawCupPlot(ctx);
    this._drawCapy(ctx);
    this._drawBubble(ctx);
    this._drawSparks(ctx);
    if (this.firstVisit && !this.launch) this._drawFirstVisit(ctx);
    this._drawLaunchFlash(ctx);

    motes(ctx, {
      x: 0, y: 0, w: VIEW_WIDTH, h: VIEW_HEIGHT,
      t: this.t, n: 16, seed: 107, colour: '#fffbe8', alpha: 0.22,
    });
    vignette(ctx, VIEW_WIDTH, VIEW_HEIGHT, 0.22);
    drawGear(ctx, GEAR.x, GEAR.y, GEAR.r);
    drawAchievementsButton(ctx, STAR_BTN.x, STAR_BTN.y, STAR_BTN.r, this.achieved.got, this.achieved.total);
    drawDailyButton(ctx, DAILY_BTN.x, DAILY_BTN.y, DAILY_BTN.r, this.dailyOpen, this.t);
    drawLevelBadge(ctx, LEVEL_BADGE.x, LEVEL_BADGE.y, this.level);
    this._drawPurse(ctx);
    this.settings.draw(ctx);
    this.trophies.draw(ctx);
    this.daily.draw(ctx);
    this.profile.draw(ctx);
  }

  /**
   * The plots, through the yard window. Signs overhang the top of their plot,
   * so the clip starts a little above YARD_TOP; the forecourt hedge is drawn
   * afterwards and covers the bottom edge.
   */
  _drawYard(ctx) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, YARD_TOP - 18, VIEW_WIDTH, YARD_BOTTOM - YARD_TOP + 26);
    ctx.clip();
    ctx.translate(0, -this.scroll);
    let shown = 0;
    for (const plot of this.plots) {
      const y = plot.rect.y - this.scroll;
      if (y > YARD_BOTTOM + 30 || y + PLOT_H < YARD_TOP - 40) continue;
      // On arrival the plots slide in from the right one after another,
      // overshooting a touch, like cards being dealt.
      const u = reducedMotion() ? 1 : Math.max(0, Math.min(1, (this.enterT - 0.05 - shown++ * 0.07) / 0.34));
      if (u < 1) {
        const c = 1.3, k = 1 + (c + 1) * (u - 1) ** 3 + c * (u - 1) ** 2;
        ctx.save();
        ctx.translate((1 - k) * VIEW_WIDTH * 0.7, 0);
        this._drawPlot(ctx, plot);
        ctx.restore();
      } else {
        this._drawPlot(ctx, plot);
      }
    }
    ctx.restore();

    // Scroll hints: a chevron at whichever end has more sports past it.
    const bob = Math.sin(this.t * 4) * 3;
    ctx.save();
    ctx.fillStyle = 'rgba(14,20,34,0.55)';
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const hint = (y, dir) => {
      ctx.beginPath();
      ctx.arc(VIEW_WIDTH - 26, y, 17, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(VIEW_WIDTH - 34, y - dir * 4);
      ctx.lineTo(VIEW_WIDTH - 26, y + dir * 4);
      ctx.lineTo(VIEW_WIDTH - 18, y - dir * 4);
      ctx.stroke();
    };
    for (const a of this._arrows()) hint(a.y + bob * a.dir, a.dir);
    ctx.restore();
  }

  /* ── sky ────────────────────────────────────────────────────────────────── */

  _drawSky(ctx) {
    const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
    g.addColorStop(0, SKY_TOP);
    g.addColorStop(1, SKY_LOW);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VIEW_WIDTH, HORIZON);

    // Sun, top-right, clear of both the bunting and the club's roof.
    const sx = 462, sy = 74;
    const glow = ctx.createRadialGradient(sx, sy, 8, sx, sy, 96);
    glow.addColorStop(0, 'rgba(255,244,190,0.95)');
    glow.addColorStop(1, 'rgba(255,244,190,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sx, sy, 96, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff2b8';
    ctx.beginPath();
    ctx.arc(sx, sy, 30, 0, Math.PI * 2);
    ctx.fill();

    this._drawClouds(ctx);
    this._drawBirds(ctx);
  }

  /**
   * Clouds drift across and wrap around. Positions come off a fixed seed so
   * the sky is the same sky every time the hub is opened — a layout that
   * reshuffles on entry reads as a different screen, not a living one.
   */
  _drawClouds(ctx) {
    const r = rng(21);
    ctx.save();
    for (let i = 0; i < 6; i++) {
      const y = 34 + r() * 190;
      const s = 0.55 + r() * 0.75;
      const speed = 5 + r() * 9;
      const span = VIEW_WIDTH + 260;
      const x = ((r() * span + this.t * speed) % span) - 130;

      ctx.globalAlpha = 0.55 + 0.35 * (s - 0.55);
      ctx.fillStyle = '#ffffff';
      // Three overlapping lobes and a flat base: the cheapest cloud that
      // still reads as a cloud rather than a row of circles.
      ctx.beginPath();
      ctx.arc(x, y, 26 * s, Math.PI, Math.PI * 2);
      ctx.arc(x + 30 * s, y - 12 * s, 34 * s, Math.PI, Math.PI * 2);
      ctx.arc(x + 66 * s, y, 24 * s, Math.PI, Math.PI * 2);
      ctx.lineTo(x + 90 * s, y);
      ctx.lineTo(x - 26 * s, y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  /** Two birds, because an empty sky is a still sky. */
  _drawBirds(ctx) {
    ctx.save();
    ctx.strokeStyle = 'rgba(38,52,74,0.5)';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    for (let i = 0; i < 2; i++) {
      const span = VIEW_WIDTH + 120;
      const x = ((this.t * 16 + i * 150) % span) - 60;
      const y = 128 + i * 26 + Math.sin(this.t * 1.4 + i) * 6;
      const flap = Math.sin(this.t * 6 + i * 2) * 4;
      ctx.beginPath();
      ctx.moveTo(x - 9, y + flap);
      ctx.quadraticCurveTo(x, y - 4, x + 9, y + flap);
      ctx.stroke();
    }
    ctx.restore();
  }

  /** Hills and treetops behind the club, sitting on the horizon line. */
  _drawSkyline(ctx) {
    ctx.save();
    // Two hills, the far one paler, so there's depth behind the building.
    for (const [cx, r, col] of [[120, 150, '#8ecb7a'], [430, 175, '#7dc069']]) {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.ellipse(cx, HORIZON + 20, r, 78, 0, Math.PI, Math.PI * 2);
      ctx.fill();
    }

    const r = rng(43);
    for (let i = 0; i < 9; i++) {
      const x = 14 + r() * (VIEW_WIDTH - 28);
      const h = 34 + r() * 26;
      const w = 16 + r() * 10;
      ctx.fillStyle = '#6b4a2c';
      ctx.fillRect(x - 3, HORIZON - h * 0.35, 6, h * 0.4);
      ctx.fillStyle = i % 2 ? '#3f8b46' : '#4b9c50';
      ctx.beginPath();
      ctx.ellipse(x, HORIZON - h * 0.55, w, h * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /** The yard itself: grass, mown stripes, and the path to the door. */
  _drawGround(ctx) {
    const g = ctx.createLinearGradient(0, HORIZON, 0, VIEW_HEIGHT);
    g.addColorStop(0, GRASS_DARK);
    g.addColorStop(0.3, GRASS);
    g.addColorStop(1, '#569c3e');
    ctx.fillStyle = g;
    ctx.fillRect(0, HORIZON, VIEW_WIDTH, VIEW_HEIGHT - HORIZON);

    // Mown stripes, widening as they come forward so the yard has depth.
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 7; i++) {
      const u = i / 7;
      const y = HORIZON + u * u * (VIEW_HEIGHT - HORIZON);
      ctx.fillRect(0, y, VIEW_WIDTH, 6 + u * 26);
    }
    ctx.restore();

    // A path from the clubhouse door down to where Capy is standing. Drawn
    // as a widening ribbon, which is all the perspective this screen needs.
    ctx.fillStyle = PATH;
    ctx.beginPath();
    ctx.moveTo(VIEW_WIDTH / 2 - 26, HORIZON - 4);
    ctx.lineTo(VIEW_WIDTH / 2 + 26, HORIZON - 4);
    ctx.lineTo(VIEW_WIDTH / 2 + 132, VIEW_HEIGHT);
    ctx.lineTo(VIEW_WIDTH / 2 - 132, VIEW_HEIGHT);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fill();
  }

  /* ── clubhouse ──────────────────────────────────────────────────────────── */

  _drawClubhouse(ctx) {
    const t = this.t;
    const cx = VIEW_WIDTH / 2;
    const base = HORIZON;
    const left = 84, right = 456, top = 164;

    // Body.
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    roundRect(ctx, left + 6, top + 8, right - left, base - top, 10);
    ctx.fill();
    chunk(ctx, left, top, right - left, base - top, 10, '#f0e2c8');
    topHighlight(ctx, left, top, right - left, base - top, 0.4);

    // Roof: a broad slab with a deep overhang, red like the kit.
    ctx.fillStyle = PALETTE.kitRed;
    ctx.beginPath();
    ctx.moveTo(left - 30, top + 6);
    ctx.lineTo(cx - 118, 110);
    ctx.lineTo(cx + 118, 110);
    ctx.lineTo(right + 30, top + 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath();
    ctx.moveTo(left - 30, top + 6);
    ctx.lineTo(cx - 118, 110);
    ctx.lineTo(cx + 118, 110);
    ctx.lineTo(cx, top + 6);
    ctx.closePath();
    ctx.fill();
    chunk(ctx, left - 34, top, right - left + 68, 12, 6, PALETTE.kitRedDark);

    // Roof flags, one per sport colour, out of phase so they don't march.
    AREAS.slice(0, 3).forEach((area, i) => {
      wavingFlag(ctx, {
        x: cx - 96 + i * 96, y: 70, w: 42, h: 26,
        t, colour: FESTIVE[i * 2 % FESTIVE.length], phase: i * 1.7, poleH: 42,
      });
    });

    // One bunting run, strung high across the sky. A second run under the
    // eaves crossed both the roof flags and the sign, and read as clutter.
    bunting(ctx, { x0: -12, y0: 22, x1: VIEW_WIDTH + 12, y1: 32, sag: 16, count: 13, t, seed: 103 });

    // The name over the door. This is the screen's title — there is no
    // separate wordmark, because a real place puts its name on the building.
    banner(ctx, {
      x: cx - 182, y: top + 14, w: 364, h: 40,
      text: GAME_NAME.toUpperCase(), bg: '#1d5c8f', fg: '#fff6dd', accent: '#2f7cb8',
    });

    // Door and windows, warmly lit — someone is in.
    chunk(ctx, cx - 30, base - 52, 60, 52, 8, '#8a5a34');
    chunk(ctx, cx - 24, base - 46, 48, 46, 6, '#a97046');
    ctx.fillStyle = ACCENT;
    ctx.beginPath();
    ctx.arc(cx + 14, base - 24, 3.5, 0, Math.PI * 2);
    ctx.fill();
    for (const wx of [cx - 108, cx + 108]) {
      chunk(ctx, wx - 30, base - 54, 60, 42, 7, '#7fc4e8');
      ctx.fillStyle = 'rgba(255,244,200,0.55)';
      ctx.fillRect(wx - 24, base - 48, 22, 30);
      ctx.strokeStyle = '#f0e2c8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(wx, base - 54); ctx.lineTo(wx, base - 12);
      ctx.moveTo(wx - 30, base - 33); ctx.lineTo(wx + 30, base - 33);
      ctx.stroke();
    }

    // Planters either side of the door, so the frontage isn't bare.
    for (const bx of [cx - 62, cx + 62]) {
      ctx.fillStyle = '#3f8b46';
      ctx.beginPath();
      ctx.ellipse(bx, base - 16, 17, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      chunk(ctx, bx - 13, base - 14, 26, 16, 4, '#c8703b');
    }

    // The one line of instruction on the whole screen. Out on the grass
    // below the building, on its own plate — over the mown stripes, plain
    // text of any colour loses half its letters.
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = font(19, 800);
    const label = 'PICK YOUR SPORT!';
    const lw = ctx.measureText(label).width + 40;
    ctx.fillStyle = 'rgba(14,20,34,0.55)';
    roundRect(ctx, cx - lw / 2, HORIZON + 14, lw, 30, 15);
    ctx.fill();
    ctx.fillStyle = ACCENT;
    ctx.fillText(label, cx, HORIZON + 30);
  }

  /* ── the three plots ────────────────────────────────────────────────────── */

  _drawPlot(ctx, plot) {
    const { rect } = plot;
    const ready = plot.state === 'ready';
    const locked = plot.state === 'locked';
    const pressed = this.pressedId === plot.id;
    const launching = this.launch?.id === plot.id;

    ctx.save();

    // A tapped plot sinks; a refused one rattles. Both are done with a
    // transform so nothing below has to know it's being animated.
    if (pressed) ctx.translate(0, 3);
    if (this.nudge?.id === plot.id) {
      const u = this.nudge.t / NUDGE_TIME;
      ctx.translate(Math.sin(this.nudge.t * 46) * 9 * u, 0);
    }

    const { x, y, w, h } = rect;

    // Ground shadow under the plot, so it sits on the grass rather than
    // floating over it.
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    roundRect(ctx, x + 5, y + 9, w, h, 20);
    ctx.fill();

    // The surface itself, and its markings, clipped to the plot.
    ctx.save();
    roundRect(ctx, x, y, w, h, 20);
    ctx.clip();
    this._drawPlotArt(ctx, rect, plot);

    // A locked plot keeps every one of those shapes and drops them into
    // shadow: you can see there's a real place in there, you just can't get
    // to it yet. That's a tease. Grey text is not.
    if (locked) {
      // Drained of colour and dimmed — but the scene still shows through.
      // The next one to open is dimmed least: it's the one to want.
      ctx.save();
      ctx.globalCompositeOperation = 'saturation';
      ctx.fillStyle = `rgba(128,128,128,${plot.next ? 0.55 : 0.9})`;
      ctx.fillRect(x, y, w, h);
      ctx.restore();
      ctx.fillStyle = `rgba(14,20,34,${plot.next ? 0.28 : 0.5})`;
      ctx.fillRect(x, y, w, h);
      if (!plot.next) {
        ctx.fillStyle = 'rgba(255,255,255,0.13)';
        ctx.font = font(84, 900);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + w * 0.70, y + h / 2 - 4);
      }
      this._hazardStripes(ctx, x, y + h - 16, w, 16);
    }

    // A ready plot catches the light along its top edge.
    if (ready) topHighlight(ctx, x, y, w, h, 0.22);
    if (pressed || launching) {
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(x, y, w, h);
    }
    ctx.restore();

    // Fence rail around the plot: gold and lit when open, plain when shut,
    // and a slow gold pulse round the next one to open.
    const pulse = plot.next ? 0.45 + 0.4 * Math.sin(this.t * 3) : 0;
    ctx.strokeStyle = ready ? withAlpha(ACCENT, 0.9) : plot.next ? withAlpha(ACCENT, pulse) : 'rgba(224,230,240,0.35)';
    ctx.lineWidth = plot.next ? 4 : 3;
    roundRect(ctx, x, y, w, h, 20);
    ctx.stroke();

    this._drawPlotSign(ctx, plot);
    if (plot.next) this._drawNextUp(ctx, plot);
    else this._drawPlotStatus(ctx, plot);
    if (locked) this._drawPadlock(ctx, x + w - 54, y + h / 2 - 6, 1.15);
    // Not on the very first visit, where the finger already says it.
    if (plot.fresh && !this.firstVisit) this._drawNewBadge(ctx, x + w - 34, y + 20);

    ctx.restore();
  }

  /** A plot's surface, markings and kit, unclipped. */
  _drawPlotArt(ctx, rect, plot) {
    const { x, y, w, h } = rect;
    ctx.fillStyle = plot.surface;
    ctx.fillRect(x, y, w, h);
    if (plot.id === 'basketball') this._paintCourt(ctx, rect, plot);
    else if (plot.id === 'bowling') this._paintLane(ctx, rect, plot);
    else if (plot.id === 'football') this._paintPitch(ctx, rect, plot);
    else this._paintNewPlot(ctx, rect, plot);

    // Equipment stands on the right-hand two-thirds; the left is where the
    // sign and the status text live, so they never collide.
    if (plot.id === 'basketball') this._drawHoopKit(ctx, rect);
    else if (plot.id === 'bowling') this._drawPinKit(ctx, rect);
    else if (plot.id === 'football') this._drawGoalKit(ctx, rect);
    else this._drawNewKit(ctx, rect, plot);
  }

  /** Basketball: a key, a centre arc, and worn boards. */
  _paintCourt(ctx, { x, y, w, h }, plot) {
    ctx.strokeStyle = withAlpha(plot.line, 0.75);
    ctx.lineWidth = 3;
    ctx.strokeRect(x + w * 0.60, y + h * 0.22, w * 0.26, h * 0.56);
    ctx.beginPath();
    ctx.arc(x + w * 0.60, y + h / 2, h * 0.22, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();
    ctx.fillStyle = withAlpha(plot.surfaceDark, 0.5);
    ctx.fillRect(x, y + h * 0.78, w, h * 0.22);
  }

  /** Bowling: boards running away, gutters top and bottom, aiming arrows. */
  _paintLane(ctx, { x, y, w, h }, plot) {
    ctx.fillStyle = plot.surfaceDark;
    ctx.fillRect(x, y, w, h * 0.16);
    ctx.fillRect(x, y + h * 0.84, w, h * 0.16);
    ctx.strokeStyle = withAlpha(plot.line, 0.22);
    ctx.lineWidth = 2;
    for (let i = 1; i < 8; i++) {
      const ly = y + h * 0.16 + (h * 0.68 * i) / 8;
      ctx.beginPath();
      ctx.moveTo(x, ly);
      ctx.lineTo(x + w, ly);
      ctx.stroke();
    }
    ctx.fillStyle = withAlpha(plot.line, 0.6);
    for (let i = 0; i < 3; i++) {
      const ax = x + w * 0.34 + i * 16;
      ctx.beginPath();
      ctx.moveTo(ax, y + h / 2);
      ctx.lineTo(ax + 12, y + h / 2 - 9 + i * 4);
      ctx.lineTo(ax + 12, y + h / 2 + 9 - i * 4);
      ctx.closePath();
      ctx.fill();
    }
  }

  /** Football: mown bands and the arc of a penalty box. */
  _paintPitch(ctx, { x, y, w, h }, plot) {
    ctx.fillStyle = withAlpha('#ffffff', 0.07);
    for (let i = 0; i < 4; i++) ctx.fillRect(x + (w / 8) * (i * 2 + 1), y, w / 8, h);
    ctx.strokeStyle = withAlpha(plot.line, 0.8);
    ctx.lineWidth = 3;
    ctx.strokeRect(x + w * 0.66, y + h * 0.14, w * 0.34, h * 0.72);
    ctx.beginPath();
    ctx.arc(x + w * 0.66, y + h / 2, h * 0.2, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();
  }

  /** Sports 4–10: the surface markings for each plot. */
  _paintNewPlot(ctx, { x, y, w, h }, plot) {
    ctx.strokeStyle = withAlpha(plot.line, 0.75);
    ctx.lineWidth = 3;
    switch (plot.id) {
      case 'tennis':
        ctx.strokeRect(x + w * 0.44, y + h * 0.16, w * 0.52, h * 0.68);
        ctx.beginPath();
        ctx.moveTo(x + w * 0.70, y + h * 0.1); ctx.lineTo(x + w * 0.70, y + h * 0.9);
        ctx.stroke();
        break;
      case 'golf':
        ctx.fillStyle = withAlpha('#ffffff', 0.08);
        for (let i = 0; i < 5; i++) ctx.fillRect(x, y + (h / 5) * i, w, h / 10);
        break;
      case 'swimming':
        for (let i = 1; i < 4; i++) {
          const ly = y + (h * i) / 4;
          ctx.setLineDash([8, 6]);
          ctx.strokeStyle = i % 2 ? '#ff6b6b' : '#f7f5f0';
          ctx.beginPath(); ctx.moveTo(x, ly); ctx.lineTo(x + w, ly); ctx.stroke();
        }
        ctx.setLineDash([]);
        break;
      case 'hockey':
        ctx.strokeStyle = withAlpha('#2b5f9e', 0.6);
        ctx.beginPath(); ctx.moveTo(x + w * 0.5, y); ctx.lineTo(x + w * 0.5, y + h); ctx.stroke();
        ctx.strokeStyle = withAlpha('#c8322b', 0.7);
        ctx.beginPath(); ctx.moveTo(x + w * 0.86, y); ctx.lineTo(x + w * 0.86, y + h); ctx.stroke();
        break;
      case 'archery':
        ctx.fillStyle = withAlpha(plot.surfaceDark, 0.6);
        ctx.fillRect(x, y + h * 0.7, w, h * 0.3);
        break;
      case 'javelin':
        for (let i = 1; i < 4; i++) {
          ctx.beginPath(); ctx.moveTo(x, y + (h * i) / 4); ctx.lineTo(x + w, y + (h * i) / 4); ctx.stroke();
        }
        break;
      case 'skateboarding':
        ctx.strokeStyle = withAlpha('#000000', 0.12);
        for (let i = 1; i < 6; i++) {
          ctx.beginPath(); ctx.moveTo(x + (w * i) / 6, y); ctx.lineTo(x + (w * i) / 6, y + h); ctx.stroke();
        }
        break;
    }
  }

  /** Sports 4–10: one piece of kit per plot, animated like the first three. */
  _drawNewKit(ctx, { x, y, w, h }, plot) {
    const t = this.t;
    const cx = x + w * 0.72;
    const cy = y + h / 2;
    ctx.save();
    ctx.lineCap = 'round';
    switch (plot.id) {
      case 'tennis': {
        const u = (t * 0.7) % 1;
        const bx = x + w * 0.48 + u * w * 0.44;
        const by = cy - Math.sin(u * Math.PI) * 30;
        groundShadow(ctx, bx, cy + 12, 8, 3, 0.25);
        ctx.fillStyle = '#d8f050';
        ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI * 2); ctx.fill();
        break;
      }
      case 'golf': {
        ctx.fillStyle = '#20242f';
        ctx.beginPath(); ctx.ellipse(cx + 40, cy + 16, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#f7f5f0'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(cx + 40, cy + 16); ctx.lineTo(cx + 40, cy - 38); ctx.stroke();
        const wave = Math.sin(t * 4) * 4;
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath(); ctx.moveTo(cx + 40, cy - 38); ctx.lineTo(cx + 68, cy - 30 + wave); ctx.lineTo(cx + 40, cy - 22); ctx.fill();
        const u = (t * 0.4) % 1.3;
        if (u < 1) {
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(x + w * 0.46 + u * (cx + 40 - x - w * 0.46), cy + 14, 6, 0, Math.PI * 2); ctx.fill();
        }
        break;
      }
      case 'swimming': {
        const u = (t * 0.25) % 1;
        const sx = x + w * 0.45 + Math.sin(u * Math.PI * 2) * w * 0.22;
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath(); ctx.arc(sx - 20 - i * 10, cy + h / 8 + Math.sin(t * 8 + i) * 3, 4 - i * 0.6, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#c8322b';
        ctx.beginPath(); ctx.arc(sx, cy + h / 8, 11, 0, Math.PI * 2); ctx.fill();
        break;
      }
      case 'hockey': {
        ctx.strokeStyle = '#c8322b'; ctx.lineWidth = 5;
        ctx.strokeRect(x + w - 44, cy - 24, 30, 48);
        const u = (t * 0.6) % 1.2;
        if (u < 1) {
          ctx.fillStyle = '#20242f';
          ctx.beginPath(); ctx.ellipse(x + w * 0.45 + u * (w * 0.42), cy, 9, 5, 0, 0, Math.PI * 2); ctx.fill();
        }
        break;
      }
      case 'archery': {
        const rings = ['#f7f5f0', '#20242f', '#3f7fc4', '#c8322b', '#ffd93d'];
        chunk(ctx, cx + 6, cy + 8, 8, 34, 3, '#8a5a34');
        rings.forEach((c, i) => {
          ctx.fillStyle = c;
          ctx.beginPath(); ctx.arc(cx + 10, cy - 4, 34 - i * 7, 0, Math.PI * 2); ctx.fill();
        });
        break;
      }
      case 'javelin': {
        const u = (t * 0.45) % 1;
        const jx = x + w * 0.42 + u * w * 0.5;
        const jy = cy + 10 - Math.sin(u * Math.PI) * 34;
        const a = Math.cos(u * Math.PI) * -0.5;
        ctx.translate(jx, jy);
        ctx.rotate(a);
        ctx.strokeStyle = '#f7f5f0'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(34, 0); ctx.stroke();
        ctx.fillStyle = '#6f7787';
        ctx.beginPath(); ctx.moveTo(34, -3); ctx.lineTo(44, 0); ctx.lineTo(34, 3); ctx.fill();
        break;
      }
      case 'skateboarding': {
        ctx.fillStyle = '#6f7787';
        ctx.beginPath();
        ctx.moveTo(cx - 20, y + h); ctx.quadraticCurveTo(cx + 50, y + h, cx + 60, y + h * 0.3);
        ctx.lineTo(cx + 70, y + h * 0.3); ctx.lineTo(cx + 70, y + h); ctx.fill();
        const hop = Math.max(0, Math.sin(t * 3)) * 24;
        const bx = x + w * 0.5;
        ctx.fillStyle = '#6b3fa0';
        ctx.beginPath(); ctx.roundRect(bx - 26, cy + 16 - hop, 52, 7, 3); ctx.fill();
        ctx.fillStyle = '#ffd93d';
        for (const d of [-16, 16]) { ctx.beginPath(); ctx.arc(bx + d, cy + 26 - hop, 5, 0, Math.PI * 2); ctx.fill(); }
        break;
      }
    }
    ctx.restore();
  }

  /* ── plot equipment ─────────────────────────────────────────────────────── */

  /** Hoop on a post, plus balls — one of them permanently mid-bounce. */
  _drawHoopKit(ctx, { x, y, w, h }) {
    const t = this.t;
    const groundY = y + h - 14;
    const px = x + w - 62;

    // Post and backboard. Every height here is measured up from the ground
    // line so the whole rig stays inside the plot when PLOT_H changes.
    chunk(ctx, px - 5, groundY - 62, 10, 62, 4, '#6f7787');
    chunk(ctx, px - 42, groundY - 84, 48, 34, 5, '#f4f1e8');
    chunk(ctx, px - 31, groundY - 78, 26, 19, 3, '#d9662b');

    // Rim, seen from the side, with a net hanging off it.
    ctx.strokeStyle = '#e8712f';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px - 44, groundY - 52);
    ctx.lineTo(px - 6, groundY - 52);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.6;
    for (let i = 0; i <= 4; i++) {
      const u = i / 4;
      ctx.beginPath();
      ctx.moveTo(px - 44 + u * 38, groundY - 52);
      ctx.lineTo(px - 36 + u * 22, groundY - 30);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(px - 36, groundY - 30);
    ctx.lineTo(px - 14, groundY - 30);
    ctx.stroke();

    // Two balls on the deck and one bouncing beside them. Kept to the right
    // of the status strip, which owns the bottom-left corner of every plot.
    const bounce = Math.abs(Math.sin(t * 2.4)) * 30;
    this._basketball(ctx, x + w * 0.60, groundY - 12 - bounce, 13);
    this._basketball(ctx, x + w * 0.70, groundY - 10, 11);
    this._basketball(ctx, x + w * 0.76, groundY - 8, 9);
  }

  _basketball(ctx, cx, cy, r) {
    groundShadow(ctx, cx, cy + r, r * 0.9, r * 0.3, 0.2);
    ctx.fillStyle = PALETTE.ballOrange;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = PALETTE.ballSeam;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx, cy, r * 0.42, r, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  /** A rack of pins with a ball rolling at them, on a loop. */
  _drawPinKit(ctx, { x, y, w, h }) {
    const t = this.t;
    const midY = y + h / 2;
    const pins = [[0.90, 0], [0.82, -20], [0.82, 20], [0.74, -10], [0.74, 10]];
    for (const [u, dy] of pins) {
      // A slow sway, so the rack looks like it's waiting rather than pasted on.
      const wob = Math.sin(t * 1.6 + u * 9 + dy) * 0.05;
      this._pin(ctx, x + w * u, midY + dy, 1 + dy * 0.002, wob);
    }

    // The ball runs the length of the lane and starts again.
    const u = (t * 0.28) % 1.6;
    if (u < 1) {
      const bx = x + 26 + u * (w * 0.66);
      const by = midY + Math.sin(u * 3.1) * 8;
      groundShadow(ctx, bx, by + 13, 15, 5, 0.24);
      const g = ctx.createRadialGradient(bx - 5, by - 6, 2, bx, by, 15);
      g.addColorStop(0, '#5aa2e0');
      g.addColorStop(1, '#1b3f6b');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(bx, by, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(8,18,32,0.8)';
      for (let i = 0; i < 3; i++) {
        const a = u * 6 + i * 0.8;
        ctx.beginPath();
        ctx.arc(bx + Math.cos(a) * 5, by + Math.sin(a) * 5 - 2, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

const SCORE_H = 130;
const ROW_H = 38;
const XP_H = 46;
/** The locked-next-sport tile on the results card. */
const TEASER_H = 88;

/** Countdown turns red and pulses under this many seconds. */
const URGENT_SECONDS = 10;

/** What the HUD calls out as each phase of the round begins. */
const PHASE_CALLS = { master: 'GAME ON!', chaos: 'TURN IT UP!' };
const FINAL_CALL = 'FINAL 10!';
/** Seconds a phase call stays up. */
const CALL_TIME = 1.3;

/**
 * Back button, bottom-left. Deliberately away from the bottom-centre where
 * the aim gesture starts, and only ever fires on a tap, so a swipe that
 * happens to begin here still takes the shot. Mid-round it pauses rather
 * than leaving (round-flow.js), since small hands rest on corners.
 */
const BACK_BUTTON = { x: 48, y: VIEW_HEIGHT - 48, r: 32 };

/**
 * Camera toggle, bottom-right. Carries its label rather than relying on an
 * icon: an unmarked disc in a corner is not something a player finds, and
 * the choice of angle matters too much to hide.
 */
const VIEW_BUTTON = { x: VIEW_WIDTH - 168, y: VIEW_HEIGHT - 68, w: 152, h: 44 };

class Hud {
  /**
   * @param {string} sport  sport id, e.g. 'bowling'
   * @param {object} [opts]
   * @param {() => void} [opts.onTimeUp]  fired once as the clock hits zero
   * @param {string} [opts.attemptsLabel] right-hand readout caption
   */
  constructor(sport, { onTimeUp, attemptsLabel = 'SHOTS', view = 'behind', viewToggle = true } = {}) {
    this.sport = sport;
    this.view = view;
    /** Sports with a single fixed camera leave the toggle off entirely. */
    this.viewToggle = viewToggle;
    this.duration = roundSeconds(sport);
    this.onTimeUp = onTimeUp;
    this.attemptsLabel = attemptsLabel;
    this.score = 0;
    /** Counts down after popScore(); swells and warms the score readout. */
    this.scorePop = 0;
    this.timeLeft = this.duration;
    this.attempts = 0;
    this.expired = false;
  }

  reset() {
    this.score = 0;
    this.scorePop = 0;
    this.timeLeft = this.duration;
    this.attempts = 0;
    this.expired = false;
    this.phase = 'learn';
    this.finalCalled = false;
    this._setGoal();
    /** The phase call on screen: { text, t } counting down, or null. */
    this.call = null;
  }

  /**
   * What this round is playing for, shown as a bar in the score plate. Until
   * the sport's target is reached (it both opens the next sport and wins the
   * trophy), that's the target; after, it's the player's own best.
   */
  _setGoal() {
    const save = load();
    const target = trophyTarget(this.sport);
    const best = save.highScores[this.sport] ?? 0;
    const next = nextSport(this.sport);
    if (target > 0 && best < target) {
      this.goal = {
        score: target,
        reward: next && !save.unlocked[next] ? `${sportLabel(next)} OPENS!` : 'TROPHY WON!',
        hit: false,
      };
    } else {
      // Past the target: the next medal is the goal, then just their best.
      const m = nextMedal(this.sport, best);
      if (m) this.goal = { score: m.score, reward: `${m.label} MEDAL!`, hit: false, medal: m };
      else if (best > 0) this.goal = { score: best, reward: null, hit: false, isBest: true };
      else this.goal = null;
    }
  }

  /** Seconds since the round's clock started. */
  get elapsed() {
    return this.duration - this.timeLeft;
  }

  /** The shaped difficulty dial (difficulty.js), 0..1 — what sports ramp on. */
  get curve() {
    return curve(this.elapsed, this.duration);
  }

  /** True in the closing FINAL 10. */
  get final() {
    return isFinal(this.timeLeft, this.duration);
  }

  /** Fraction of the round already spent, 0..1 — sports ramp difficulty on it. */
  get progress() {
    return 1 - this.timeLeft / this.duration;
  }

  update(dt) {
    this.scorePop = Math.max(0, this.scorePop - dt * 2.4);
    if (this.call) {
      this.call.t -= dt;
      if (this.call.t <= 0) this.call = null;
    }
    if (this.expired) return;
    const before = Math.ceil(this.timeLeft);
    this.timeLeft = Math.max(0, this.timeLeft - dt);

    // Phase changes are called out, so the round's shape is something the
    // player feels *and* is told about.
    daily.noteScore(this.score);

    // The goal reached mid-round: called out, the moment it happens. (The
    // unlock itself is written at the buzzer, like everything else.) A new
    // best has its own celebration in reactions.js, so that one is silent.
    if (this.goal && !this.goal.hit && this.score >= this.goal.score) {
      this.goal.hit = true;
      if (this.goal.reward) {
        this._callOut(this.goal.reward);
        sfx.sfxUnlock();
      }
    }

    const phase = phaseAt(this.elapsed, this.duration);
    // The band builds with the round: see music.js.
    music.setIntensity(this.final ? 3 : { learn: 0, master: 1, chaos: 2 }[phase]);
    if (phase !== this.phase) {
      this.phase = phase;
      this._callOut(PHASE_CALLS[phase]);
    }
    if (this.final && this.timeLeft > 0) {
      if (!this.finalCalled) {
        this.finalCalled = true;
        this._callOut(FINAL_CALL);
      }
      // A tick on every second of the closing stretch.
      if (Math.ceil(this.timeLeft) < before) sfx.sfxTick();
    }
    if (this.timeLeft === 0) {
      this.expired = true;
      this.onTimeUp?.();
    }
  }

  _callOut(text) {
    if (!text) return;
    this.call = { text, t: CALL_TIME };
    sfx.sfxCall();
  }

  /**
   * Flags that the score just changed, so the readout can react. Optional:
   * a sport that never calls it simply gets a score that sits still.
   */
  popScore() {
    this.scorePop = 1;
  }

  /** @param {CanvasRenderingContext2D} ctx */
  draw(ctx) {
    ctx.save();
    ctx.textBaseline = 'top';

    // A soft wash behind the top row, under the plates below.
    const scrim = ctx.createLinearGradient(0, 0, 0, 130);
    scrim.addColorStop(0, 'rgba(8,10,16,0.5)');
    scrim.addColorStop(1, 'rgba(8,10,16,0)');
    ctx.fillStyle = scrim;
    ctx.fillRect(0, 0, VIEW_WIDTH, 130);

    // Score, top-left. Swells and goes gold for a moment after it changes —
    // the HUD never shakes with the rest of the frame, so this is the one
    // thing telling the player their number moved.
    this._stat(ctx, 20, 22, 'left', 'SCORE', String(this.score), this.scorePop, this.goal);

    // Attempts, top-right.
    this._stat(ctx, VIEW_WIDTH - 20, 22, 'right', this.attemptsLabel, String(this.attempts));

    // Countdown, top-centre. Pulses once a second down the closing stretch.
    const urgent = this.timeLeft <= URGENT_SECONDS;
    const pulse = urgent ? 1 + 0.08 * Math.abs(Math.sin(this.timeLeft * Math.PI)) : 1;
    const secs = Math.ceil(this.timeLeft);
    const clock = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    ctx.textAlign = 'center';
    ctx.font = font(TYPE.clock * pulse, WEIGHT.bold);
    this._plate(ctx, VIEW_WIDTH / 2 - ctx.measureText(clock).width / 2 - 18, 14, ctx.measureText(clock).width + 36, 62);
    ctx.fillStyle = urgent ? COLOR.fail : INK;
    ctx.fillText(clock, VIEW_WIDTH / 2, 20);

    this._drawDaily(ctx);
    this._drawBack(ctx);
    if (this.viewToggle) this._drawViewToggle(ctx);
    if (this.final && !this.expired) this._drawFinalEdge(ctx);
    if (this.call) this._drawCall(ctx);

    ctx.restore();
  }

  /**
   * Today's daily challenge, when it's this sport: a chip under the
   * streak chip — a calendar, and progress toward the goal. Green and
   * ticked once it's done.
   */
  _drawDaily(ctx) {
    const p = daily.activeProgress();
    if (!p) return;
    const text = p.complete ? 'DAILY \u2713' : `DAILY ${p.now}/${p.goal}`;
    ctx.save();
    ctx.font = font(TYPE.caption, WEIGHT.display);
    const w = ctx.measureText(text).width + 44, h = 30;
    // Left, under the streak chip: the right-hand corner is where archery
    // and javelin show their wind.
    const x = 8, y = 126;
    ctx.fillStyle = 'rgba(10,13,22,0.72)';
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, h / 2);
    ctx.fill();
    ctx.strokeStyle = p.complete ? COLOR.success : 'rgba(247,245,240,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
    calendarGlyph(ctx, x + 17, y + h / 2, p.complete ? COLOR.success : COLOR.gold);
    ctx.fillStyle = p.complete ? COLOR.success : INK;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 32, y + h / 2 + 1);
    ctx.restore();
  }

  /** The closing stretch: a warm pulse round the edges, on the second. */
  _drawFinalEdge(ctx) {
    const beat = Math.pow(1 - (this.timeLeft % 1), 3);
    const g = ctx.createRadialGradient(VIEW_WIDTH / 2, VIEW_HEIGHT / 2, VIEW_HEIGHT * 0.35, VIEW_WIDTH / 2, VIEW_HEIGHT / 2, VIEW_HEIGHT * 0.75);
    g.addColorStop(0, 'rgba(255,107,107,0)');
    g.addColorStop(1, `rgba(255,107,107,${0.12 + 0.18 * beat})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
  }

  /** A phase call: pops in under the clock, holds, and lifts away. */
  _drawCall(ctx) {
    const age = CALL_TIME - this.call.t;
    const pop = age < 0.14 ? 0.5 + (age / 0.14) * 0.62 : 1.12 - Math.min(0.12, (age - 0.14) * 0.9);
    const fade = Math.min(1, this.call.t / 0.3);
    const finalCall = this.call.text === FINAL_CALL;
    ctx.save();
    ctx.globalAlpha = fade;
    // Tucked straight under the clock it belongs to, and kept compact: the
    // hoop, the pins and the goal all live just below it.
    ctx.translate(VIEW_WIDTH / 2, 98 - (1 - fade) * 10);
    ctx.scale(pop, pop);
    pill(ctx, 0, 0, this.call.text, { size: TYPE.button, weight: WEIGHT.display, tone: finalCall ? 'alert' : 'gold' });
    ctx.restore();
  }

  /**
   * Back to the club.
   *
   * Drawn as a solid disc with a lip and a bright chevron rather than the
   * translucent ghost it used to be: on a bright lane the old one all but
   * vanished, and a six-year-old will not go hunting for the way out.
   */
  _drawBack(ctx) {
    const { x, y, r } = BACK_BUTTON;
    discButton(ctx, x, y, r);

    ctx.strokeStyle = INK;
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x + 6, y - 11);
    ctx.lineTo(x - 7, y);
    ctx.lineTo(x + 6, y + 11);
    ctx.stroke();

    ctx.lineCap = 'butt';
  }

  /** Just the back button, for redrawing it above anything laid over the HUD. */
  drawBackButton(ctx) {
    ctx.save();
    this._drawBack(ctx);
    ctx.restore();
  }

  /** The live view, named, with a swap arrow to say it can be changed. */
  _drawViewToggle(ctx) {
    const { x, y, w, h } = VIEW_BUTTON;

    ctx.fillStyle = COLOR.shadow;
    ctx.beginPath();
    ctx.roundRect(x, y + 3, w, h, h / 2);
    ctx.fill();

    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, COLOR.slateTop);
    g.addColorStop(1, COLOR.slateLow);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, h / 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(247,245,240,0.5)';
    ctx.lineWidth = STROKE.ui;
    ctx.stroke();

    this._drawViewGlyph(ctx, x + 26, y + h / 2);

    ctx.fillStyle = INK;
    ctx.font = font(TYPE.label, WEIGHT.bold);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.view === 'side' ? 'SIDE  \u21c4' : 'BEHIND  \u21c4', x + 44, y + h / 2 + 1);
  }

  /** Tiny diagram of the angle currently in use. */
  _drawViewGlyph(ctx, x, y) {
    ctx.strokeStyle = INK_DIM;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (this.view === 'side') {
      // Ground line with the target standing off to one side.
      ctx.moveTo(x - 9, y + 5);
      ctx.lineTo(x + 9, y + 5);
      ctx.moveTo(x + 5, y + 5);
      ctx.lineTo(x + 5, y - 7);
    } else {
      // Rails running away from you.
      ctx.moveTo(x - 9, y + 7);
      ctx.lineTo(x - 2, y - 7);
      ctx.moveTo(x + 9, y + 7);
      ctx.lineTo(x + 2, y - 7);
    }
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  /** True if a logical point falls on the back button. */
  hitsBack(point) {
    if (!point) return false;
    return Math.hypot(point.x - BACK_BUTTON.x, point.y - BACK_BUTTON.y) <= BACK_BUTTON.r;
  }

  /** True if a logical point falls on the camera toggle. */
  hitsViewToggle(point) {
    if (!point || !this.viewToggle) return false;
    const { x, y, w, h } = VIEW_BUTTON;
    // Hit area reaches past the drawn button so small fingers don't miss it.
    const m = 10;
    return point.x >= x - m && point.x <= x + w + m && point.y >= y - m && point.y <= y + h + m;
  }

  /**
   * A rounded plate behind a readout.
   *
   * The HUD has to stay legible over whatever the venue puts behind it, and
   * the alley's ceiling is a rig of saturated coloured lights. A wash alone
   * wasn't enough there; a plate per readout always is, and it reads as a
   * deliberate scoreboard rather than text floating on the picture.
   */
  _plate(ctx, x, y, w, h) {
    plate(ctx, x, y, w, h);
  }

  _stat(ctx, x, y, align, label, value, pop = 0, goal = null) {
    // A short overshoot rather than a linear fade: it lands, then settles.
    const swell = pop > 0 ? Math.sin(pop * Math.PI) * 0.24 : 0;
    const valueFont = font(TYPE.score * (1 + swell), WEIGHT.bold);

    ctx.font = font(TYPE.label, WEIGHT.label);
    const labelW = ctx.measureText(label).width;
    const goalText = goal ? (this.score >= goal.score ? '\u2713' : `${goal.isBest ? 'BEST ' : '/'}${goal.score}`) : '';
    ctx.font = font(TYPE.min, WEIGHT.display);
    const goalW = goal ? ctx.measureText(goalText).width + 10 : 0;
    ctx.font = valueFont;
    const w = Math.max(labelW + goalW, ctx.measureText(value).width, goal ? 96 : 0) + 32;
    const px = align === 'left' ? x - 12 : x + 12 - w;
    this._plate(ctx, px, 14, w, 62);

    // The goal: a slim bar along the plate's foot, and the number it's
    // heading for beside the label. Gold and ticked once it's reached.
    if (goal) {
      const frac = Math.max(0, Math.min(1, this.score / goal.score));
      const done = this.score >= goal.score;
      const bx = px + 10, bw = w - 20, by = 14 + 62 - 10;
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, 5, 2.5);
      ctx.fill();
      ctx.fillStyle = done ? ACCENT : goal.medal ? goal.medal.colour : goal.isBest ? '#8fe3ff' : COLOR.success;
      ctx.beginPath();
      ctx.roundRect(bx, by, Math.max(5, bw * frac), 5, 2.5);
      ctx.fill();
      ctx.textAlign = 'right';
      ctx.font = font(TYPE.min, WEIGHT.display);
      ctx.fillStyle = done ? ACCENT : INK_DIM;
      ctx.fillText(goalText, px + w - 10, y + 1);
    }

    ctx.textAlign = align;
    ctx.fillStyle = INK_DIM;
    ctx.font = font(TYPE.label, WEIGHT.label);
    ctx.fillText(label, x, y);
    ctx.fillStyle = pop > 0.05 ? ACCENT : INK;
    ctx.font = valueFont;
    ctx.fillText(value, x, y + 20 - swell * 10);
  }

  /**
   * Where everything on the results card sits. Shared by the drawing and the
   * hit-testing, so a button is always exactly where it looks.
   *
   * Buttons: PLAY AGAIN and HOME every time, plus a big tile for the sport
   * that just opened — the round's real prize, so it's the biggest thing on
   * the card.
   */
  resultsLayout(stats) {
    const { lines = [], unlocked = null } = stats;
    const w = 440;
    const x = (VIEW_WIDTH - w) / 2;
    const next = nextSport(this.sport);
    const hint = !!(next && !unlocked && !load().unlocked[next]);
    const bx = x + 40, bw = w - 80;
    const buttons = {};

    // Laid out from the card's top, then the whole card is centred.
    //   band · [hero: the sport that just opened] · score · rows · [teaser] · buttons
    let by = 76 + 18;
    if (unlocked) {
      buttons.next = { x: bx - 10, y: by, w: bw + 20, h: HERO_H };
      by += HERO_H + 16;
    }
    const scoreTop = by;
    by += SCORE_H;
    const rowsTop = by + 14;
    by += lines.length * ROW_H + 10;
    // The next sport, still locked: shown as itself, so it's something to
    // want rather than a sentence to read.
    let teaser = null;
    if (hint) {
      teaser = { x: bx, y: by, w: bw, h: TEASER_H };
      by += TEASER_H + 18;
    }
    // The round's XP, just above the buttons — and, if an ad is on offer,
    // the button to double it.
    const xpTop = by;
    by += XP_H + 12;
    if (stats.adOffer) {
      buttons.bonus = { x: bx + 30, y: by, w: bw - 60, h: 52 };
      by += 52 + 12;
    }
    const homeW = 132;
    buttons.again = { x: bx, y: by, w: bw - homeW - 14, h: BUTTON_H };
    buttons.home = { x: bx + bw - homeW, y: by, w: homeW, h: BUTTON_H };
    const h = by + BUTTON_H + 30;

    const y = Math.round((VIEW_HEIGHT - h) / 2);
    for (const b of Object.values(buttons)) b.y += y;
    if (teaser) teaser.y += y;
    return { x, y, w, h, rowsTop: y + rowsTop, scoreTop: y + scoreTop, xpTop: y + xpTop, hint, teaser, buttons };
  }

  /** Which results button, if any, a point falls on: 'again' | 'home' | 'next'. */
  hitResults(point, stats) {
    if (!point) return null;
    const { buttons } = this.resultsLayout(stats);
    for (const [id, r] of Object.entries(buttons)) {
      if (point.x >= r.x && point.x <= r.x + r.w && point.y >= r.y && point.y <= r.y + r.h) return id;
    }
    return null;
  }

  /**
   * End-of-round panel: per-sport stat breakdown + unlock state.
   *
   * @param {CanvasRenderingContext2D} ctx
   * @param {object} stats
   * @param {[string, string|number][]} stats.lines  label/value rows
   * @param {number} stats.score      final score
   * @param {boolean} [stats.newBest]
   * @param {string|null} [stats.unlocked]  sport id newly unlocked, if any
   * @param {object} [opts]
   * @param {number} [opts.live]  0..1, how awake the buttons are; they sit
   *        greyed while the card is still ignoring taps
   * @param {number} [opts.t]     clock, for the unlocked tile's animation
   */
  drawResults(ctx, stats, { live = 1, t = 0, age = 9 } = {}) {
    const { lines = [], score = this.score, newBest = false, unlocked = null } = stats;
    const { medal = null, medalUp = null, prevBest = 0 } = stats;
    const L = this.resultsLayout(stats);
    const { x, y, w, h } = L;
    const passed = unlocked !== null;
    const good = passed || newBest;

    ctx.save();
    // The buzzer beat: the game dims, then the card rises in from below with
    // a little overshoot and its parts follow one by one. The card is locked
    // for far longer than this (round-flow.js), so nothing is tappable while
    // it moves.
    ctx.globalAlpha = Math.min(1, age / 0.25);
    ctx.fillStyle = COLOR.scrim;
    ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
    ctx.globalAlpha = 1;
    const rise = Math.max(0, Math.min(1, (age - 0.1) / 0.4));
    const c = 1.2, k = 1 + (c + 1) * (rise - 1) ** 3 + c * (rise - 1) ** 2;
    ctx.translate(0, (1 - k) * (VIEW_HEIGHT - y + 20));
    const fadeIn = (from) => Math.max(0, Math.min(1, (age - from) / 0.18));

    // The unlock rays burst from behind the card, so they frame it rather
    // than cover what's written on it.
    const { buttons } = L;
    if (buttons.next && age >= UNLOCK_AT) this._unlockBurst(ctx, buttons.next, age - UNLOCK_AT, t);

    // Card, with a coloured cap carrying the headline — gold for good news.
    panel(ctx, x, y, w, h, { band: 76, bandColour: good ? COLOR.goldDeep : COLOR.slateBand, accent: good });
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = good ? COLOR.goldInk : INK;
    const headline = passed ? 'NEW SPORT UNLOCKED!' : newBest ? 'NEW PERSONAL BEST!' : "TIME'S UP!";
    this._fitText(ctx, headline, VIEW_WIDTH / 2, y + 39, w - 48, TYPE.title, WEIGHT.display);

    // THE HERO: the sport that just opened, big, first, with rays behind it.
    if (buttons.next) {
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.65 * live;
      this._nextButton(ctx, buttons.next, unlocked, t, live >= 1);
      ctx.restore();
    }

    // The score block: medal · score · how it compares with their best.
    const scoreY = L.scoreTop + 58;
    ctx.globalAlpha = fadeIn(0.35);
    if (newBest) {
      const glow = ctx.createRadialGradient(VIEW_WIDTH / 2, scoreY, 6, VIEW_WIDTH / 2, scoreY, 130);
      glow.addColorStop(0, withAlpha(ACCENT, 0.34));
      glow.addColorStop(1, withAlpha(ACCENT, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(x, scoreY - 110, w, 220);
      this._star(ctx, VIEW_WIDTH / 2 - 100, scoreY - 4, 13);
      this._star(ctx, VIEW_WIDTH / 2 + 100, scoreY - 4, 13);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = medalUp ? medalUp.colour : INK_DIM;
    ctx.font = font(17, WEIGHT.bold);
    ctx.fillText(medalUp ? `${medalUp.label} MEDAL!` : 'FINAL SCORE', VIEW_WIDTH / 2, L.scoreTop + 10);
    // The score counts up as the card lands.
    const count = Math.round(score * Math.min(1, Math.max(0, (age - 0.35) / 0.6)));
    ctx.fillStyle = newBest ? ACCENT : INK;
    ctx.font = font(TYPE.hero, WEIGHT.display);
    ctx.fillText(String(count), VIEW_WIDTH / 2, scoreY);
    const best = Math.max(prevBest, score);
    ctx.font = font(TYPE.label, WEIGHT.bold);
    ctx.fillStyle = newBest ? ACCENT : INK_DIM;
    ctx.fillText(newBest ? (prevBest > 0 ? `NEW BEST \u00b7 was ${prevBest}` : 'FIRST SCORE ON THE BOARD!') : `PERSONAL BEST ${best}`,
      VIEW_WIDTH / 2, scoreY + 46);
    // The medal held in this sport, beside the score. A new one drops in.
    if (medal) {
      const since = Math.max(0, age - MEDAL_AT);
      const drop = medalUp ? Math.min(1, since / 0.3) : 1;
      if (drop > 0) {
        ctx.save();
        ctx.globalAlpha = drop * fadeIn(0.35);
        drawMedal(ctx, x + 50, scoreY + 6 - (1 - drop) * 60, medalUp ? 22 + Math.sin(drop * Math.PI) * 5 : 20, medal, t);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
