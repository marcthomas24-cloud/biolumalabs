 * Drawing only — nothing in the game collides with the hoop's structure.
 */
const POST_SETBACK = 200;
/** Pulls a falling ball toward the rim centre — widens the make window
 * without drawing a comically large hoop. Shared by the real flight and the
 * aim-guide's dry run, or the guide would show a miss for a shot that
 * actually drops in. */
const ASSIST_K = 6;
const ASSIST_REACH = 320;

/* ── Cameras ─────────────────────────────────────────────────────────────── */
/**
 * Two angles on the same world. Physics never sees these — only the
 * projection changes — so a round plays identically whichever is on.
 *
 * `actor` says where to put Capy. Behind the shoulder he is
 * effectively at the lens, which projects to somewhere below the screen, so
 * that view pins him to fixed screen coordinates; side on he is a figure in
 * the scene like any other and gets projected properly.
 */
const CAMERAS = {
  behind: {
    y: 300, z: -300, focal: 900, horizon: 430,
    actor: { mode: 'screen', x: VIEW_WIDTH / 2, y: VIEW_HEIGHT - 100, scale: 1.1 },
  },
  side: {
    // Lifted off the floor rather than level with it: swung side on, the
    // court's width becomes depth, and an eye at ground height flattens it
    // to a line. The lift turns it back into a band you can read.
    y: 300, z: -1900, focal: 1010, horizon: 677,
    yaw: -Math.PI / 2, pivotZ: 520,
    actor: { mode: 'world', x: 0, z: 0, scale: 0.62 },
    // The whole court has to fit across a portrait screen, which leaves the
    // ball a few pixels across at true scale. Drawn bigger than life so it
    // stays followable; collision still uses BALL_R.
    ballScale: 2.3,
  },
};

/* ── Slam dunk bonus ─────────────────────────────────────────────────────── */
const DUNK_DELAY = 0.55;         // pause after a make before the run starts
const DUNK_RUN_TIME = 1.75;      // seconds to cover the run
const DUNK_LO = 0.72, DUNK_HI = 0.93;              // tap window
const DUNK_PERFECT_LO = 0.80, DUNK_PERFECT_HI = 0.88;
const DUNK_POINTS = 3, DUNK_PERFECT_POINTS = 5;
const DUNK_HOLD = 1.0;           // how long the result sits on screen
/**
 * How much bigger than true perspective the capybara is drawn while he hangs
 * off the rim. Drawing only — the dunk is scored on the tap, not on where he
 * appears to be — and it exists because at honest scale the hero of the game
 * is forty pixels tall at the moment he's meant to be the whole picture.
 */
const SLAM_SCALE = 2.6;
/** How long the drop off the rim takes. The rest of DUNK_HOLD is him
 *  celebrating on the floor, which is the half the player came for. */
const SLAM_DROP = 0.45;

/**
 * The beat between a shot ending and the next one being aimable. Long enough
 * for the ball to bounce away and for a missed shot to register on the
 * capybara's face, short enough that nobody is ever waiting on it.
 */
const DEAD_TIME = 0.75;

/* ── Scoring ─────────────────────────────────────────────────────────────── */
const HOOP_POINTS = 2;

/* ── The big moments ─────────────────────────────────────────────────────── */
/** Frames frozen the instant a perfect slam connects: the hit-stop. */
const SLAM_HITSTOP = 0.11;
/** Slow motion through the hang after a perfect slam: how long, how slow. */
const SLAM_SLOWMO = 0.7, SLAM_SLOWMO_SCALE = 0.4;
/** The "money shot": a make on a hot streak (or in the FINAL 10) drops
 *  through the last stretch above the rim in slow motion. */
const MONEY_STREAK = 2;
const MONEY_RANGE = 150, MONEY_SLOWMO = 0.4, MONEY_SCALE = 0.45;
/** How long the PERFECT SLAM! title stays stamped across the screen. */
const STAMP_TIME = 1.5;
/** The ball's physics step. Fixed, so slow motion never changes a shot. */
const BALL_STEP = 1 / 60;
const SWISH_BONUS = 1;

const SPORT = 'basketball';

class Basketball {
  /** @param {object} deps @param {() => void} [deps.onExit] */
  constructor({ onExit, onPlay } = {}) {
    this.onExit = onExit;
    this.view = loadView();
    this.aim = createAimControl();
    this.hud = new Hud(SPORT, {
      attemptsLabel: 'SHOTS',
      onTimeUp: () => this._finish(),
      view: this.view,
    });
    // Pause and the results card, shared with every other sport.
    this.flow = new RoundFlow(this.hud, { onExit, onPlay, onReplay: () => this.enter() });
    this.capy = new Character();
    this.capy.sport = SPORT;
    this.reactions = new Reactions(this.capy, { sport: SPORT });
    this.intro = new RoundIntro(SPORT);
    this.venue = new BasketballVenue();

    this.ball = { x: 0, y: SHOOT_Y, z: SHOOT_Z, vx: 0, vy: 0, vz: 0, spin: 0, live: false, scored: false, clean: true };
    this.hoop = { rimY: 620, rimZ: 1000 };
    this.trail = [];
    this.particles = [];
    this.floaters = [];
    this.rings = [];
    this.roll = null;

    this.phase = 'aiming'; // aiming | moving | live | dead | dunkPending | dunk | results
    this.deadT = 0;
    /** Capy's spot on the foul line, world x. See CAPY_X_MIN. */
    this.capyX = 0;
    /** The slide to a new spot: { from, to, t } while phase is 'moving'. */
    this.slide = null;
    this.dunkPendingT = 0;
    this.dribbleT = 0;
    this.dunk = { t: 0, result: null, holdT: 0 };

    this.made = 0;
    this.swishes = 0;
    this.dunks = 0;
    /** Closest the live ball has come to the middle of the rim. Feeds the
     *  reaction: a shot that rattled out and an airball are both misses, and
     *  the capybara should not take them the same way. */
    this.nearest = Infinity;
    this.results = null;

    /* ── feel ──────────────────────────────────────────────────────────────
     * None of this is consulted by the rules. It exists so a shot lands with
     * some weight: a shake, a zoom, a net that moves, and a ball that squashes
     * and stretches. Every one of these decays on its own in well under a
     * second — a casual game can't afford to hold the player still.
     */
    this.fx = new ScreenFx();
    this.netWobbleT = 0;      // net swinging after a ball goes through
    this.netPunch = 0;        // how hard it was hit, 1 normal / higher on a slam
    this.rimShakeT = 0;       // rim ringing after a dunk
    this.ballStretch = 0;     // extra stretch along the flight, from the launch
    this.ballSquash = 0;      // flattening from an impact
  }

  enter() {
    this.hud.reset();
    this.flow.reset();
    this.reactions.reset();
    this.intro.reset();
    // Into this sport's kit while the 3-2-1 runs: never once play is on.
    this.capy.changeKit(SPORT);
    this.hitStopT = 0;
    this.slowmoT = 0;
    this.slowmoScale = 1;
    this.stampT = 0;
    this.moneyShot = false;
    this._ballAcc = 0;
    // A brand-new player's first few shots are quietly helped in: the
    // first basket should come in seconds, not after a minute of misses.
    this.assistLeft = load().rounds[SPORT] === 0 ? BEGINNER_SHOTS : 0;
    this.shotsSinceMove = 0;
    this.capyX = 0;
    this.slide = null;
    this.slideHeld = false;
    this.shotsSinceSlide = 0;
    this._rollSlideGap();
    this.made = 0;
    this.swishes = 0;
    this.dunks = 0;
    this.netWobbleT = 0;
    this.netPunch = 0;
    this.rimShakeT = 0;
    this.ballStretch = 0;
    this.ballSquash = 0;
    this.fx.clear();
    this.results = null;
    this.phase = 'aiming';
    this.particles = [];
    this.floaters = [];
    this.rings = [];
    this.hoop.rimY = 620;
    this.hoop.rimZ = 1000;
    this._parkBall();
  }

  exit() {}

  /* ── setup ────────────────────────────────────────────────────────────── */

  _parkBall() {
    const every = this.hud.final ? SHOTS_PER_HOOP_MOVE.final : SHOTS_PER_HOOP_MOVE[this.hud.phase];
    if (this.hud.attempts > 0 && ++this.shotsSinceMove >= every) {
      this.shotsSinceMove = 0;
      this._varyHoop();
    }
    if (this.hud.attempts > 0 && ++this.shotsSinceSlide >= this.slideGap) {
      this.shotsSinceSlide = 0;
      this._rollSlideGap();
      this._startSlide();
    }
    const b = this.ball;
    b.x = this.capyX; b.y = SHOOT_Y; b.z = SHOOT_Z;
    b.vx = 0; b.vy = 0; b.vz = 0; b.spin = 0;
    b.live = false; b.scored = false; b.clean = true;
    this.dribbleT = 0;
    this.trail = [];
    this.roll = null;
  }

  _rollSlideGap() {
    const [lo, hi] = SHOTS_PER_CAPY_MOVE;
    this.slideGap = lo + Math.floor(Math.random() * (hi - lo + 1));
  }

  /** Picks a new spot, far enough from this one to read as a move. */
  _startSlide() {
    let to, tries = 0;
    do {
      to = CAPY_X_MIN + Math.random() * (CAPY_X_MAX - CAPY_X_MIN);
      tries++;
    } while (tries < 12 && Math.abs(to - this.capyX) < CAPY_MOVE_MIN);
    this.slide = { from: this.capyX, to, t: 0 };
    this.phase = 'moving';
    sfx.sfxRun();
    const at = this._capyRest();
    this._puff(at.x, at.y, 5);
  }

  /**
   * The slide itself. Input is ignored throughout, and a press that began
   * during it is ignored until it lifts (see slideHeld), so no shot can
   * leave from a spot he hasn't reached yet.
   */
  _stepSlide(dt, input) {
    const s = this.slide;
    s.t = Math.min(1, s.t + dt / CAPY_SLIDE_TIME);
    const u = s.t * s.t * (3 - 2 * s.t);
    this.capyX = s.from + (s.to - s.from) * u;
    this.ball.x = this.capyX;
    this.dribbleT += dt;
    if (input.active) this.slideHeld = true;
    if (s.t >= 1) {
      this.capyX = s.to;
      this.slide = null;
      this.phase = 'aiming';
      const at = this._capyRest();
      this._puff(at.x, at.y, 4);
    }
  }

  /** Re-rolls until it's a real change, not a nudge — always worth re-reading. */
  _varyHoop() {
    const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
    let y, z, tries = 0;
    do {
      y = rnd(RIM_Y_MIN, RIM_Y_MAX);
      z = rnd(RIM_Z_MIN, RIM_Z_MAX);
      tries++;
    } while (tries < 12 && Math.abs(z - this.hoop.rimZ) < 120 && Math.abs(y - this.hoop.rimY) < 45);
    this.hoop.rimY = y;
    this.hoop.rimZ = z;
    this._float(VIEW_WIDTH / 2, this.cam.horizon - 40, 'HOOP MOVED', '#8fe3ff');
  }

  /* ── update ───────────────────────────────────────────────────────────── */

  update(dt, input) {
    this._input = input;
    this._stepParticles(dt);

    // Back to the hub. Checked before anything else so it works from the
    // results panel too, where a tap would otherwise start a new round.
    const tap = tapPoint(input);
    // The back button pauses mid-round; the results card only answers its
    // own buttons, and only once it has been up a moment.
    const flow = this.flow.update(dt, tap, this.phase === 'results' ? this.results : null);
    if (flow === 'left' || flow === 'paused') return;
    if (this.hud.hitsViewToggle(tap)) {
      this._toggleView();
      return;
    }

    if (this.phase === 'results') {
      return;
    }

    // 3-2-1: the world breathes, but the clock and the ball wait.
    if (this.intro.update(dt)) {
      this.capy.update(dt);
      this.venue.update(dt);
      this.dribbleT += dt;
      return;
    }

    this.hud.update(dt);              // real time: this is the round clock
    this.stampT = Math.max(0, this.stampT - dt);

    // Scene time. A hit-stop freezes everything in the frame for a beat; slow
    // motion stretches it. Only the play slows — the clock never does, so a
    // big moment can't buy the player extra seconds.
    if (this.hitStopT > 0) {
      this.hitStopT -= dt;
      this.fx.update(dt);
      return;
    }
    if (this.slowmoT > 0) {
      this.slowmoT = Math.max(0, this.slowmoT - dt);
      // Eases back up to full speed rather than snapping out of it.
      const u = this.slowmoT / this._slowmoDur;
      dt *= this.slowmoScale + (1 - this.slowmoScale) * (1 - u) ** 2;
    }

    this.capy.update(dt);
    this.reactions.update(dt);
    this.venue.update(dt);
    this.fx.update(dt);
    if (this.netWobbleT > 0) this.netWobbleT = Math.max(0, this.netWobbleT - dt * 2.4);
    this.rimShakeT = Math.max(0, this.rimShakeT - dt * 2.2);
    this.ballStretch = Math.max(0, this.ballStretch - dt * 4.5);
    this.ballSquash = Math.max(0, this.ballSquash - dt * 6);

    if (this.phase === 'dunkPending') {
      this.dunkPendingT -= dt;
      if (this.dunkPendingT <= 0) this._startDunk();
      return;
    }
    if (this.phase === 'dunk') {
      this._stepDunk(dt, input);
      return;
    }
    if (this.phase === 'dead') {
      this.deadT -= dt;
      this._stepRollAway(dt);
      if (this.deadT <= 0) { this.phase = 'aiming'; this._parkBall(); }
      return;
    }
    if (this.phase === 'moving') {
      this.capy.hold('idle');
      this._stepSlide(dt, input);
      return;
    }
    if (this.phase === 'live') {
      // The ball always steps at exactly 1/60 s, whatever the scene clock is
      // doing — slow motion changes how often it steps, never how far, so it
      // can't nudge a shot in or out. Same maths as the aim guide's dry run.
      this._ballAcc += dt;
      while (this._ballAcc >= BALL_STEP - 1e-9 && this.phase === 'live') {
        this._ballAcc -= BALL_STEP;
        this._stepBall(BALL_STEP);
      }
      return;
    }

    // aiming: idle dribble, one thud per bounce.
    // Winding up while the player drags reads as the shot being aimed.
    // A press that began mid-slide is spent: nothing fires until it lifts.
    if (this.slideHeld && !input.active) {
      this.slideHeld = false;
      if (input.released) return;
    }
    this.capy.hold(input.active && !this.slideHeld ? 'prepare' : 'idle');
    const before = this.dribbleT;
    this.dribbleT += dt;
    const period = DRIBBLE_PERIOD;
    if (Math.floor((before / period) * 2) !== Math.floor((this.dribbleT / period) * 2)) sfx.sfxDribble();
    if (this.slideHeld) return;

    const shot = this.aim.release(input);
    if (shot && shot.dy < -MIN_LIFT) {
      this.intro.demoDone();
      this._launch(this._beginnerAim(shot));
    }
  }

  /**
   * The beginner's helping hand. While `assistLeft` lasts, a shot that
   * would miss is swapped for the nearest one that goes in: same flick,
   * a little straighter, a touch more or less power. Found by dry-running
   * the real physics, so nothing about the ball's flight is faked — and a
   * shot that was already going in is left exactly alone.
   */
  _beginnerAim(shot) {
    if (this.assistLeft <= 0) return shot;
    this.assistLeft--;
    if (this._previewPath(shot).good) return shot;
    // Straightened toward the hoop from wherever he stands: off centre, a
    // straight flick needs a lean back toward x = 0 over its ~1 s flight.
    const dx = shot.dx * 0.3 - (this.capyX / LATERAL_MAX) * 420;
    for (let k = 0; k <= 14; k++) {
      for (const sign of k ? [1, -1] : [1]) {
        const power = Math.max(0, Math.min(1, shot.power + sign * k * 0.025));
        if (this._previewPath({ dx, power }).good) return { ...shot, dx, power };
      }
    }
    return shot;
  }

  /** The first-visit gesture: flick up from the ball. */
  _gestureDemo() {
    if (this.phase !== 'aiming') return null;
    // From where a thumb rests, straight up at the hoop. Its length is a shot
    // that goes in: copying the hand exactly should score, not overshoot (a
    // flick to 0.52 of the screen sailed over the rim every time).
    const x = this._capyRest().x;
    return {
      kind: 'swipe', from: { x, y: VIEW_HEIGHT * 0.8 }, to: { x, y: VIEW_HEIGHT * 0.61 },
      caption: 'FLICK UP TO SHOOT!', captionY: VIEW_HEIGHT * 0.34,
    };
  }

  _slowmo(seconds, scale) {
    this.slowmoT = seconds;
    this._slowmoDur = seconds;
    this.slowmoScale = scale;
  }

  /** 0 at the top of the bounce, 1 at the floor — free-fall shaped. */
  _dribbleDrop() {
    const u = (this.dribbleT % DRIBBLE_PERIOD) / DRIBBLE_PERIOD;
    const tau = u < 0.5 ? u * 2 : (1 - u) * 2;
    return tau * tau;
  }

  /** Maps the shared drag reading onto a shot toward the hoop. */
  _launch({ dx, power: t }) {
    const power = MIN_POWER + t * (MAX_POWER - MIN_POWER);
    // Divisor is deliberately large: the hoop sits dead centre, so any
    // sideways component of the swipe is almost pure error. A tighter
    // divisor turned a swipe 15 degrees off vertical into a miss invisible
    // to the player and brutal in practice.
    const lateral = Math.max(-1, Math.min(1, dx / 420)) * LATERAL_MAX;

    const b = this.ball;
    b.x = this.capyX; b.y = SHOOT_Y; b.z = SHOOT_Z;
    b.vx = lateral;
    b.vy = power * Math.sin(SHOT_ELEVATION);
    b.vz = power * Math.cos(SHOT_ELEVATION);
    b.live = true; b.scored = false; b.clean = true;
    this.nearest = Infinity;
    this.trail = [];

    this.hud.attempts++;
    this.phase = 'live';
    this._ballAcc = 0;
    // Worth slowing down for? Only a make, and only when it matters: on a
    // streak, or in the FINAL 10. Decided by the same dry run as the guide.
    this.moneyShot = (this.reactions.streak >= MONEY_STREAK || this.hud.final)
      && this._previewPath({ dx, power: t }).good;
    // Drop the wind-up hold, so the shot animation hands back to idle
    // rather than to the pose he was aiming from.
    this.capy.hold('idle');
    this.capy.play('shoot');
    sfx.sfxShoot();

    // The release: a puff of dust off the floor, a ring where the ball left
    // his paws, and the smallest of knocks to the camera. Harder shots kick
    // harder, so power is legible in the launch as well as in the bar.
    const at = this.project(b.x, b.y, b.z);
    this.ballStretch = 0.16 + t * 0.12;
    this.fx.shake(1.6 + t * 1.6, 0.14);
    this._ring(at.sx, at.sy, 16 + t * 10, '#ffd9a0');
    this._puff(at.sx, at.sy + 30 * at.s, 7);
  }

  _stepBall(dt) {
    const b = this.ball;
    const prevY = b.y, prevZ = b.z, prevX = b.x;

    integrate(b, dt, { drag: AIR_DRAG });
    b.spin += b.vz * dt * 0.012;

    if (!b.scored) {
      const [ax, az] = this._assist(b.x, b.y, b.z, b.vy, dt);
      b.vx += ax; b.vz += az;
    }

    const hx = 0, ry = this.hoop.rimY, rz = this.hoop.rimZ;

    this.nearest = Math.min(this.nearest, Math.hypot(b.x - hx, b.y - ry, b.z - rz));

    // The money shot: dropping toward the rim, the world holds its breath.
    if (this.moneyShot && b.vy < 0 && b.y > ry && Math.hypot(b.x - hx, b.y - ry, b.z - rz) < MONEY_RANGE) {
      this.moneyShot = false;
      this._slowmo(MONEY_SLOWMO, MONEY_SCALE);
      this.fx.zoom(0.04, MONEY_SLOWMO);
    }

    if (!b.scored && prevY > ry && b.y <= ry && b.vy < 0) {
      const d = Math.hypot(b.x - hx, b.z - rz);
      if (d < RIM_R - 8) {
        b.scored = true;
        const p = this.project(hx, ry, rz);
        this._awardBasket(b.clean && d < 20, p.sx, p.sy);
      }
    }

    // Swept against the board plane: at speed the ball can cover more than
    // the board's depth in one step, so a same-step overlap test misses it
    // outright. Interpolate to the exact crossing instead.
    const face = rz + BOARD_DZ - BALL_R;
    if (b.vz > 0 && prevZ <= face && b.z > face) {
      const k = (face - prevZ) / Math.max(1e-6, b.z - prevZ);
      const yHit = prevY + (b.y - prevY) * k;
      const xHit = prevX + (b.x - prevX) * k;
      const hit = circleHitsRect(
        { x: xHit, y: yHit, r: BALL_R },
        { x: hx - BOARD_HALF_W, y: ry - BOARD_BELOW, w: BOARD_HALF_W * 2, h: BOARD_BELOW + BOARD_ABOVE },
      );
      if (hit) {
        // A straight z-axis flip, not a general bounce(): the board's
        // normal only ever points back down the depth axis, so there's no
        // 2D reflection to compute — just kill the incoming z speed and
        // bleed some vertical energy off, the same way the prototype did.
        b.z = face;
        b.vz *= -0.5;
        b.vy *= 0.9;
        b.clean = false;
        this.ballSquash = 0.22;
        this.fx.shake(2.2, 0.16);
        sfx.sfxClank();
        buzz('impact');
      }
    }

    // End of the shot. The ball is stopped at the floor rather than 40 units
    // under it: by this point it is far below the rim and long past the
    // board, so nothing here can change an outcome — it just gives the miss
    // a floor to bounce off.
    if (b.y <= BALL_R || b.z > 1900 || b.z < -200) {
      b.live = false;
      this.phase = 'dead';
      this.deadT = DEAD_TIME;
      this._startRollAway();
      if (!b.scored) {
        this.reactions.report({ scored: false, quality: this._missQuality() });
        this.venue.cheer(0);
      }
    }

    this._pushTrail();
  }

  /**
   * The beat after a shot ends.
   *
   * A ball that vanishes the instant it misses reads as a bug; a ball that
   * bounces twice and rolls off reads as a miss. This is a separate, purely
   * cosmetic integrator — it runs only once the outcome is already decided,
   * it is never consulted by scoring, and it can't reach the rim or the
   * board. The whole thing is over in DEAD_TIME.
   */
  _startRollAway() {
    const b = this.ball;
    this.roll = {
      x: b.x, y: Math.max(BALL_R, b.y), z: b.z,
      // Keeps whatever the shot was doing, so the bounce carries on in the
      // direction the ball was already travelling.
      vx: b.vx * 0.5, vy: Math.min(-160, b.vy * 0.45), vz: b.vz * 0.4,
      spin: b.spin,
      bounces: 0,
    };
  }

  _stepRollAway(dt) {
    const r = this.roll;
    if (!r) return;
    r.vy -= 2400 * dt;
    r.x += r.vx * dt;
    r.y += r.vy * dt;
    r.z += r.vz * dt;
    r.spin += r.vz * dt * 0.02;

    if (r.y <= BALL_R && r.vy < 0) {
      r.y = BALL_R;
      r.vy = -r.vy * 0.52;
      r.vx *= 0.7;
      r.vz *= 0.7;
      r.bounces++;
      if (r.bounces <= 2) {
        // Squash on contact, a puff of floor dust, and a softer thud each time.
        this.ballSquash = 0.3 / r.bounces;
        const at = this.project(r.x, 0, r.z);
        this._puff(at.sx, at.sy, 5);
        sfx.sfxBounce(1 / r.bounces);
        buzz('impact');
      }
      if (r.bounces > 2) r.vy = 0;
    }
  }

  /** Lateral pull toward the rim while the ball drops onto it. */
  _assist(x, y, z, vy, dt) {
    if (vy >= 0) return [0, 0];
    const above = y - this.hoop.rimY;
    const off = Math.hypot(x, z - this.hoop.rimZ);
    if (above <= 0 || above >= ASSIST_REACH || off >= 210) return [0, 0];
    const k = ASSIST_K * (1 - above / ASSIST_REACH) * dt;
    return [-x * k, -(z - this.hoop.rimZ) * k];
  }

  /**
   * On-screen ball radius at perspective scale `s`. It's the ball's size in
   * Capy's paws where he stands (kept in proportion to him), and depth can
   * take no more than BALL_MIN_DEPTH_SCALE off that, however far it goes.
   */
  _ballRadius(s) {
    const s0 = this.project(this.capyX, SHOOT_Y, SHOOT_Z).s;
    const r0 = Math.min(BALL_R * s0 * this._ballScale, BALL_MAX_VS_CAPY * this._capyRestScale());
    const depth = Math.max(0, Math.min(1, s / s0));
    return r0 * (BALL_MIN_DEPTH_SCALE + (1 - BALL_MIN_DEPTH_SCALE) * depth);
  }

  /** How much bigger than life the ball is drawn, for this camera. */
  get _ballScale() {
    return BALL_DRAW_SCALE * (this.cam.ballScale ?? 1);
  }

  _pushTrail() {
    const p = this.project(this.ball.x, this.ball.y, this.ball.z);
    this.trail.push({ x: p.sx, y: p.sy, r: this._ballRadius(p.s) });
    if (this.trail.length > 15) this.trail.shift();
  }

  /* ── scoring ──────────────────────────────────────────────────────────── */

  /**
   * How badly the shot that just ended missed, from how close it ever got to
   * the middle of the rim. The thresholds are in world units: a rim's width
   * out is a rattle, three rims out is a shot that was never on.
   */
  _missQuality() {
    if (this.nearest < RIM_R * 1.8) return 'near';
    if (this.nearest > RIM_R * 3.4) return 'bad';
    return 'miss';
  }

  _awardBasket(swish, fxX, fxY) {
    this.made++;
    this.hud.score += swish ? HOOP_POINTS + SWISH_BONUS : HOOP_POINTS;
    if (swish) {
      this.swishes++;
      achieve('firstSwish');
    }

    // A swish gets more of everything — net, particles, shake, crowd — so
    // the better shot is unmistakably the better moment without needing the
    // player to read the number.
    // Tiers (feedback.js): a make is normal, a swish good, a dunk great and
    // the perfect slam perfect. An ordinary make is kept deliberately small —
    // the net, a nudge, a murmur — so the big moments have somewhere to go.
    const T = TIERS[swish ? 'good' : 'normal'];
    this.netWobbleT = 1;
    this.netPunch = swish ? 1.7 : 1;
    this.hud.popScore();
    this.fx.shake(Math.max(1.5, T.shake), 0.2);
    if (!swish) this.rimShakeT = 0.35;   // off the rim and in: it rattles
    this.venue.cheer(swish ? 0.8 : 0.45);
    buzz(T.haptic);
    this.reactions.report({ scored: true, quality: swish ? 'great' : 'good' });
    this.reactions.noteScore(this.hud.score);
    this._burst(fxX, fxY, swish);
    this._ring(fxX, fxY, swish ? 46 : 32, swish ? COLOR.success : '#ffffff');
    this._float(fxX, fxY - 74, swish ? `SWISH! +${HOOP_POINTS + SWISH_BONUS}` : `+${HOOP_POINTS}`, T.colour, T.size / 30);
    swish ? sfx.sfxSwish() : sfx.sfxScore();

    this.phase = 'dunkPending';
    this.dunkPendingT = DUNK_DELAY;
  }

  /* ── slam dunk ────────────────────────────────────────────────────────── */

  _startDunk() {
    this.phase = 'dunk';
    this.capy.hold('dunk');
    this.venue.cheer(0.5);
    this._landed = false;
    this.dunk.t = 0;
    this.dunk.result = null;
    this.dunk.holdT = 0;
  }

  _stepDunk(dt, input) {
    const d = this.dunk;
    if (d.result) {
      const wasDown = this._landProgress();
      d.holdT -= dt;
      // He touches down partway through the hold. Caught here rather than in
      // the draw, so a dropped frame can't swallow the thump.
      if (!this._landed && wasDown < 1 && this._landProgress() >= 1) {
        this._landed = true;
        const at = this._capyRest();
        this.fx.shake(4, 0.16);
        this._puff(at.x, at.y, 9);
        sfx.sfxBounce(0.9);
        buzz('impact');
      }
      // Release the held zoom over the first stretch of the hold, so the
      // camera settles back before the next shot is ever aimed.
      this.fx.setHold(Math.max(0, d.holdT - DUNK_HOLD * 0.6) * 0.1);
      if (d.holdT <= 0) {
        this.phase = 'aiming';
        this.capy.hold('idle');
        this.fx.setHold(0);
        this._parkBall();
      }
      return;
    }

    const prev = d.t;
    d.t += dt / DUNK_RUN_TIME;
    if (Math.floor(prev * 10) !== Math.floor(d.t * 10)) {
      sfx.sfxRun();
      // Dust off each stride, so the run-up reads as ground being covered.
      const at = this.project(this.capyX * (1 - d.t), 0, this.hoop.rimZ * d.t);
      this._puff(at.sx, at.sy, 3);
    }
    // The camera creeps in over the run-up. Small — a few percent — but it
    // builds, and it makes the tap window feel like the top of something.
    this.fx.setHold(d.t * 0.05);

    if (input.pressed) this._resolveDunk();
    else if (d.t >= 1) {
      d.t = 1;
      d.result = 'miss';
      d.holdT = 0.9;
      this._float(VIEW_WIDTH / 2, this.cam.horizon - 110, 'MISSED IT', TIERS.miss.colour, TIERS.miss.size / 30);
      sfx.sfxDunkMiss();
    }
  }

  /** 0..1 through the drop off the rim; 1 means he's on the floor. */
  _landProgress() {
    const slammed = this.dunk.result === 'perfect' || this.dunk.result === 'hit';
    if (!slammed) return 0;
    return Math.min(1, Math.max(0, (DUNK_HOLD - this.dunk.holdT) / SLAM_DROP));
  }

  /** Where the capybara stands when nothing is happening, in screen coords. */
  _capyRest() {
    const { actor } = this.cam;
    if (actor.mode !== 'world') {
      // Pinned to the screen behind the shoulder, but shifted by exactly
      // what his spot shifts the ball, so it still leaves from his paws.
      const off = this.project(this.capyX, SHOOT_Y, SHOOT_Z).sx - this.project(0, SHOOT_Y, SHOOT_Z).sx;
      return { x: actor.x + off, y: actor.y };
    }
    const at = this.project(actor.x + this.capyX, 0, actor.z);
    return { x: at.sx, y: at.sy };
  }

  /** How big Capy is drawn standing at his spot (side on, his spot is depth). */
  _capyRestScale() {
    const { actor } = this.cam;
    if (actor.mode !== 'world') return actor.scale;
    return actor.scale * this.project(actor.x + this.capyX, 0, actor.z).s / this.project(actor.x, 0, actor.z).s;
  }

  _resolveDunk() {
    const d = this.dunk;
    if (d.result) return;
    const t = d.t;
    if (t >= DUNK_LO && t <= DUNK_HI) {
      const perfect = t >= DUNK_PERFECT_LO && t <= DUNK_PERFECT_HI;
      const pts = perfect ? DUNK_PERFECT_POINTS : DUNK_POINTS;
      d.result = perfect ? 'perfect' : 'hit';
      this.hud.score += pts;
      this.dunks++;

      // The biggest moment the level has, and it gets the loudest version of
      // every effect: the rim rings, the net snaps, the camera jolts and
      // pushes in, confetti comes off the rim and the crowd is on its feet.
      const p = this.project(0, this.hoop.rimY, this.hoop.rimZ);
      this.rimShakeT = 1;
      this.netWobbleT = 1;
      this.netPunch = perfect ? 2.4 : 2;
      this.hud.popScore();
      this.venue.cheer(1);
      if (perfect) {
        // THE moment. Everything the game has, in order: the frame freezes
        // on contact, the camera punches in, gold shockwaves roll off the
        // rim, the hang plays in slow motion while every camera in the stand
        // goes off, and the title is stamped across the screen.
        this.hitStopT = SLAM_HITSTOP;
        this._slowmo(SLAM_SLOWMO + SLAM_HITSTOP, SLAM_SLOWMO_SCALE);
        this.fx.shake(14, 0.4);
        this.fx.zoom(0.14, 0.6);
        this.fx.flash('#fff6d6', 0.42, 0.26);
        this._confetti(p.sx, p.sy, 60);
        for (const [r, c] of [[50, COLOR.gold], [90, '#ffffff'], [140, COLOR.gold], [200, '#fff3c2']]) this._ring(p.sx, p.sy, r, c);
        this.venue.flashbulbs(1.8);
        this.capy.glow(1.8);
        this.stampT = STAMP_TIME;
        achieve('perfectSlam');
        sfx.sfxPerfectSlam();
        buzz('major');
      } else {
        // A dunk is great-tier: loud, but a clear step below the perfect one.
        const T = TIERS.great;
        this.fx.shake(T.shake + 1.5, 0.3);
        this.fx.zoom(T.zoom + 0.02, 0.4);
        this.fx.flash(T.flashColour, T.flash, 0.18);
        this._confetti(p.sx, p.sy, 26);
        this._ring(p.sx, p.sy, 60, COLOR.gold);
        this._float(VIEW_WIDTH / 2, this.cam.horizon - 90, `DUNK! +${pts}`, T.colour, T.size / 30);
        sfx.sfxDunk();
        buzz('major');   // a dunk is a set piece: the multi-stage buzz
      }
        // Outside the streak: the dunk is a timing bonus on top of a basket
      // already made, so fluffing one must not undo a run of good shooting.
      this.reactions.report({ scored: true, quality: perfect ? 'great' : 'good', streaks: false });
      this.reactions.noteScore(this.hud.score);
    } else {
      d.result = 'miss';
      this.reactions.report({ scored: false, quality: 'near', streaks: false });
      this.fx.shake(3, 0.2);
      this._float(VIEW_WIDTH / 2, this.cam.horizon - 110, t < DUNK_LO ? 'TOO EARLY' : 'TOO LATE', TIERS.near.colour, TIERS.near.size / 30);
      sfx.sfxDunkMiss();
    }
    d.holdT = DUNK_HOLD;
  }

  /* ── finish ───────────────────────────────────────────────────────────── */

  _finish() {
    const score = this.hud.score;
    const acc = this.hud.attempts ? Math.round((this.made / this.hud.attempts) * 100) : 0;
    this.phase = 'results';
    this.results = {
      lines: withStreak([
        ['Shots made', this.made],
        ['Accuracy', `${acc}%`],
        ['Swishes', this.swishes],
        ['Slam dunks', this.dunks],
      ], this.reactions.bestStreak),
      score,
      // Medal news first: it compares against the best before this round.
      ...roundMedal(SPORT, score),
      newBest: recordScore(SPORT, score),
      unlocked: checkUnlocks(SPORT, score),
    };
    this.flow.finished();
    sfx.sfxBuzzer();
  }

  /* ── projection ───────────────────────────────────────────────────────── */

  get cam() {
    return CAMERAS[this.view];
  }

  project(x, y, z) {
    return projectWith(this.cam, x, y, z);
  }

  /** Swaps the angle. Purely a camera change — the round carries straight on. */
  _toggleView() {
    this.view = this.view === 'behind' ? 'side' : 'behind';
    this.hud.view = this.view;
    saveView(this.view);
  }

  /* ── fx ───────────────────────────────────────────────────────────────── */

  _burst(x, y, big) {
    const n = big ? 38 : 22;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 130 + Math.random() * (big ? 360 : 230);
      this.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100,
        life: 0.75 + Math.random() * 0.55, age: 0, r: 4 + Math.random() * 5,
        rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 14,
        c: [COLOR.gold, COLOR.fail, '#4ecdc4', COLOR.ink, '#c8322b', '#8fe3ff'][(Math.random() * 6) | 0],
      });
    }
  }

  /**
   * Confetti off the rim: heavier, slower and more colourful than a scoring
   * burst, so a dunk rains rather than pops.
   */
  _confetti(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
      const sp = 220 + Math.random() * 420;
      this.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.85 + Math.random() * 0.5, age: 0, r: 5 + Math.random() * 6,
        rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 22,
        drag: 0.4,
        c: [COLOR.gold, COLOR.fail, '#4ecdc4', COLOR.ink, '#ff9fd6', '#8fe3ff'][(Math.random() * 6) | 0],
      });
    }
  }

  /** A puff of floor dust — the release, and every bounce of a dead ball. */
  _puff(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.8;
      const sp = 40 + Math.random() * 90;
      this.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.4,
        life: 0.3 + Math.random() * 0.22, age: 0, r: 3 + Math.random() * 4,
        rot: 0, vr: 0, round: true, drag: 2.4, gravity: 60,
        c: 'rgba(255,236,206,0.55)',
      });
    }
  }

  /**
   * An expanding ring. One shape, and it does more than a dozen particles to
   * say "something happened right here" — the eye reads the growth instantly.
   */
  _ring(x, y, r, col) {
    this.rings.push({ x, y, r0: r * 0.25, r, col, t: 0, life: 0.4 });
  }

  /**
   * A score pop-up at a point in the world.
   *
   * Held inside the frame: these are anchored to the rim, and side on the
   * rim sits near the edge of the screen, where a centred "SWISH! +3" would
   * run off it. Margin scales with the text so the longer strings pull in
   * further.
   */
  _float(x, y, text, col, scale = 1) {
    const margin = 30 + text.length * 8 * scale;
    this.floaters.push({
      x: Math.min(VIEW_WIDTH - margin, Math.max(margin, x)),
      y: Math.max(70, y),
      t: 1.2, text, col, scale,
    });
  }

  _stepParticles(dt) {
    for (const p of this.particles) {
      p.age += dt;
      p.vy += (p.gravity ?? 900) * dt;
      if (p.drag) {
        const k = Math.max(0, 1 - p.drag * dt);
        p.vx *= k; p.vy *= k;
      }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    for (const r of this.rings) r.t += dt;
    this.rings = this.rings.filter((r) => r.t < r.life);
    this.particles = this.particles.filter((p) => p.age < p.life);
    for (const f of this.floaters) { f.t -= dt; f.y -= 32 * dt; }
    this.floaters = this.floaters.filter((f) => f.t > 0);
  }

  /* ── draw ─────────────────────────────────────────────────────────────── */

  /** @param {CanvasRenderingContext2D} ctx */
  draw(ctx) {
    const world = this._venueWorld();

    // Everything in the world goes through the effects transform; the HUD
    // and the aim guide do not. A score readout that rattles is a score
    // readout nobody can read, and a shaking aim guide would be a lie about
    // where the ball is going.
    const focus = this.project(0, this.hoop.rimY, this.hoop.rimZ);
    ctx.save();
    this.fx.apply(ctx, focus.sx, focus.sy);

    this.venue.drawBackdrop(ctx, world);
    this.venue.drawSurface(ctx, world);
    this.venue.drawMidground(ctx, world);
    this._drawHoop(ctx);

    const ballFar = this.ball.live && this.ball.z > 240;
    if (ballFar) this._drawBall(ctx);
    this._drawCapy(ctx);
    if (!ballFar) this._drawBall(ctx);

    this.venue.drawForeground(ctx, this.view);
    this._drawRings(ctx);
    this._drawParticles(ctx);
    this._drawFloaters(ctx);
    ctx.restore();

    this.fx.drawFlash(ctx, VIEW_WIDTH, VIEW_HEIGHT);

    this._drawAimGuide(ctx);
    this._drawDunkUi(ctx);
    // With the HUD, outside the shake: a word balloon is text, and text that
    // rattles is text nobody reads.
    this.reactions.draw(ctx);
    if (this.stampT > 0) this._drawStamp(ctx);
    this.hud.draw(ctx);
    if (this.phase !== 'results') this.intro.draw(ctx, this._gestureDemo(), this._input);
    if (this.phase === 'results' && this.results) {
      this.flow.draw(ctx, this.results);
    } else {
      this.flow.draw(ctx, null);
    }
  }

  /**
   * The court's dimensions, handed to the venue so the scenery is drawn
   * against the same floor the physics uses. The venue owns no geometry of
   * its own — swap a constant here and the paint follows.
   */
  _venueWorld() {
    return {
      project: this.project.bind(this),
      view: this.view,
      farZ: this.hoop.rimZ + 400,
      nearHalf: COURT_NEAR_HALF,
      farHalf: COURT_FAR_HALF,
      laneHalf: 150,
      freeThrowZ: FREE_THROW_Z,
      hoopZ: this.hoop.rimZ,
    };
  }

  /**
   * The hoop, built the way a real one is: padded post, framed board with a
   * shooter's square, a bracket out to the rim, and a two-way net.
   *
   * Every piece is placed from projected world points, so the glass you see
   * is exactly the glass the ball can hit and the whole assembly stays
   * honest when the camera swings — face on it's a board, side on it's the
   * edge of one.
   */
  _drawHoop(ctx) {
    const { rimY: ry, rimZ: rz } = this.hoop;
    const rim = this.project(0, ry, rz);
    const rx = RIM_R * rim.s, ryr = rx * 0.34;
    const bz = rz + BOARD_DZ;

    this._drawPost(ctx, ry, bz, rim.s);
    this._drawBoard(ctx, ry, bz, rim.s);
    this._drawNet(ctx, rim, rx, ryr);
    this._drawRim(ctx, rim, rx, ryr, ry, bz);
  }

  /**
   * The mounting: two short braces running back from the board.
   *
   * There is no floor post. A head-on camera turns any centred stand into a
   * vertical bar down the middle of the screen — through the crowd, the
   * court, and the exact space the ball is thrown into — and moving it aside
   * only traded that for a bar through the backdrop. A board hung off a
   * gantry, which is what half of real sports halls use, keeps the middle of
   * the picture for the shot and reads as a deliberate piece of kit.
   *
   * All drawing: nothing here has ever carried collision. The ball is tested
   * against the rim and the board, and only those.
   */
  _drawPost(ctx, ry, bz, s) {
    const backZ = bz + POST_SETBACK;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (const side of [-1, 1]) {
      const x = side * BOARD_HALF_W * 0.52;
      const at = this.project(x, ry + BOARD_ABOVE * 0.62, bz);
      const back = this.project(x, ry + BOARD_ABOVE * 1.16, backZ);

      ctx.strokeStyle = '#6f7787';
      ctx.lineWidth = Math.max(3, 12 * s);
      ctx.beginPath();
      ctx.moveTo(at.sx, at.sy);
      ctx.lineTo(back.sx, back.sy);
      ctx.stroke();

      // Lit edge, so the brace is a tube rather than a stroke.
      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      ctx.lineWidth = Math.max(1, 4 * s);
      ctx.beginPath();
      ctx.moveTo(at.sx - 3 * s * 3, at.sy - 2);
      ctx.lineTo(back.sx - 3 * s * 3, back.sy - 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  /** Backboard: framed plate, shooter's square, and a glassy sheen. */
  _drawBoard(ctx, ry, bz, s) {
    const corner = (x, y) => this.project(x, y, bz);
    const outline = (inset, dy) => {
      const c = [
        corner(-BOARD_HALF_W + inset, ry + BOARD_ABOVE - dy),
        corner(BOARD_HALF_W - inset, ry + BOARD_ABOVE - dy),
        corner(BOARD_HALF_W - inset, ry - BOARD_BELOW + dy),
        corner(-BOARD_HALF_W + inset, ry - BOARD_BELOW + dy),
      ];
      ctx.beginPath();
      c.forEach((p, i) => (i ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy)));
      ctx.closePath();
      return c;
    };

    // Drop shadow behind the board, which is most of what lifts it off a
    // bright wall.
    ctx.save();
    ctx.translate(3, 5);
    outline(0, 0);
    ctx.fillStyle = 'rgba(10,20,40,0.30)';
    ctx.fill();
    ctx.restore();

    const box = outline(0, 0);
    const g = ctx.createLinearGradient(box[0].sx, box[0].sy, box[2].sx, box[2].sy);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, '#dfe6ee');
    ctx.fillStyle = g;
    ctx.fill();

    // Frame: a chunky coloured border is what makes the target read at a
    // glance, far more than the white plate does.
    ctx.strokeStyle = PALETTE.kitRed;
    ctx.lineWidth = Math.max(3, 9 * s);
    ctx.lineJoin = 'round';
    outline(0, 0);
    ctx.stroke();

    // Shooter's square, centred over the rim.
    ctx.strokeStyle = '#c8322b';
    ctx.lineWidth = Math.max(2, 5 * s);
    const q = [
      corner(-64, ry + 132), corner(64, ry + 132),
      corner(64, ry + 6), corner(-64, ry + 6),
    ];
    ctx.beginPath();
    q.forEach((p, i) => (i ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy)));
    ctx.closePath();
    ctx.stroke();

    // Diagonal sheen across the glass.
    ctx.save();
    outline(0, 0);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(box[0].sx, box[0].sy);
    ctx.lineTo(box[0].sx + (box[1].sx - box[0].sx) * 0.42, box[0].sy);
    ctx.lineTo(box[3].sx, box[3].sy);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /** Rim, its bracket back to the board, and the shadow it casts on the net. */
  _drawRim(ctx, rim, rx, ryr, ry, bz) {
    const back = this.project(0, ry, bz);
    // A dunked rim bends down and springs back. Applied to the drawing only:
    // the rim the ball is tested against never moves.
    if (this.rimShakeT > 0) {
      ctx.save();
      ctx.translate(0, Math.sin(this.rimShakeT * 42) * this.rimShakeT * 7 * rim.s);
    }
    ctx.strokeStyle = '#8a2a12';
    ctx.lineWidth = Math.max(2, 7 * rim.s);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(rim.sx, rim.sy + ryr * 0.6);
    ctx.lineTo(back.sx, back.sy);
    ctx.stroke();

    // Two rings: a dark one offset down for thickness, a bright one on top.
    ctx.strokeStyle = '#8a2a12';
    ctx.lineWidth = Math.max(3, 9 * rim.s);
    ctx.beginPath();
    ctx.ellipse(rim.sx, rim.sy + 3 * rim.s, rx, ryr, 0, 0, Math.PI * 2);
    ctx.stroke();
    const g = ctx.createLinearGradient(rim.sx - rx, rim.sy, rim.sx + rx, rim.sy);
    g.addColorStop(0, '#ff8a4c');
    g.addColorStop(0.5, '#f2673a');
    g.addColorStop(1, '#c0421d');
    ctx.strokeStyle = g;
    ctx.lineWidth = Math.max(2.5, 7 * rim.s);
    ctx.beginPath();
    ctx.ellipse(rim.sx, rim.sy, rx, ryr, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Highlight on the near lip, so the ring reads as a tube.
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = Math.max(1, 2.5 * rim.s);
    ctx.beginPath();
    ctx.ellipse(rim.sx, rim.sy - rim.s, rx * 0.96, ryr * 0.9, 0, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    if (this.rimShakeT > 0) ctx.restore();
  }

  /** A proper mesh — cords plus the rings that tie them — not just fringe. */
  _drawNet(ctx, rim, rx, ryr) {
    const w = this.netWobbleT;
    const punch = this.netPunch || 1;
    const wob = Math.sin(performance.now() / 45) * w * 4 * punch;
    // A ball through the net drags the skirt down and pushes it open on the
    // way past. Both fade with the same clock, so the net settles as one
    // piece rather than in two separate motions.
    const drop = 64 * rim.s * (1 + w * 0.55 * punch);
    const bulge = w * 0.34 * punch;
    const cords = 14;
    const at = (i, u) => {
      const a = (i / cords) * Math.PI * 2;
      // Cords converge as they fall, and the whole skirt swings on a make.
      const taper = (1 - 0.58 * u) * (1 + bulge * Math.sin(Math.PI * u));
      return {
        x: rim.sx + Math.cos(a) * rx * taper + wob * u,
        y: rim.sy + Math.sin(a) * ryr * taper + drop * u,
      };
    };

    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = Math.max(1, 1.8 * rim.s);
    for (let i = 0; i < cords; i++) {
      ctx.beginPath();
      const a = at(i, 0);
      ctx.moveTo(a.x, a.y);
      for (let k = 1; k <= 4; k++) {
        const p = at(i, k / 4);
        ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    for (let k = 1; k <= 3; k++) {
      const u = k / 4;
      ctx.beginPath();
      for (let i = 0; i <= cords; i++) {
        const p = at(i % cords, u);
        i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
      }
      ctx.stroke();
    }
  }

  /**
   * The ball.
   *
   * Three states share this: idling on the dribble, in flight, and rolling
   * away after a miss. All three get the same shading, the same shadow on
   * the floor, and the same squash and stretch — the deform is the whole
   * reason a shot reads as having weight rather than being a disc sliding
   * up the screen.
   */
  _drawBall(ctx) {
    const b = this.ball;
    let wx, wy, wz, spin;

    if (b.live) {
      ({ x: wx, y: wy, z: wz } = b);
      spin = b.spin;
    } else if (this.phase === 'dead' && this.roll) {
      ({ x: wx, y: wy, z: wz, spin } = this.roll);
    } else if (this.phase === 'aiming' || this.phase === 'moving') {
      // On the side toward the middle, once he's moved left of it.
      wx = this.capyX + (this.capyX < 0 ? -REST_X : REST_X);
      wy = REST_Y - DRIBBLE_H * this._dribbleDrop();
      wz = SHOOT_Z;
      spin = this.dribbleT * 3;
    } else {
      return;
    }

    const p = this.project(wx, wy, wz);
    const r = this._ballRadius(p.s);

    // Shadow: tighter and darker the closer the ball is to the floor, which
    // is most of how the height reads on a flat screen.
    const ground = this.project(wx, 0, wz);
    const lift = Math.max(0, Math.min(1, (wy - BALL_R) / 420));
    ctx.fillStyle = `rgba(0,0,0,${0.30 - lift * 0.16})`;
    ctx.beginPath();
    ctx.ellipse(ground.sx, ground.sy, r * (1.15 - lift * 0.35), r * (0.38 - lift * 0.12), 0, 0, Math.PI * 2);
    ctx.fill();

    if (b.live) this._drawTrail(ctx);

    const d = this._ballDeform(wx, wy, wz);
    ctx.save();
    ctx.translate(p.sx, p.sy);
    // Deform along the direction of travel, then spin inside it, so the
    // stretch follows the flight while the seams keep turning.
    ctx.rotate(d.angle);
    ctx.scale(d.stretch, d.squash);
    ctx.rotate(-d.angle + (spin || 0));

    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#ffb066');
    g.addColorStop(0.55, '#f0913f');
    g.addColorStop(1, '#b8541c');
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = PALETTE.ballSeam;
    ctx.lineWidth = Math.max(1, r * 0.085);
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.5, r, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.36, -r * 0.42, r * 0.26, r * 0.17, -0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /**
   * How much to squash and stretch the ball this frame, and along which
   * screen direction.
   *
   * Volume is preserved — whatever it gains along the flight it loses
   * across it — so the ball never looks like it changed size. Speed does
   * most of the work; the launch adds a kick on top, and an impact
   * (backboard, floor) flattens it the other way for a few frames.
   */
  _ballDeform(wx, wy, wz) {
    const src = this.ball.live ? this.ball : this.roll;
    if (!src) return { angle: 0, stretch: 1, squash: 1 };

    const h = 1 / 60;
    const a = this.project(wx, wy, wz);
    const c = this.project(wx + src.vx * h, wy + src.vy * h, wz + src.vz * h);
    const dx = c.sx - a.sx, dy = c.sy - a.sy;
    const travel = Math.hypot(dx, dy);
    if (travel < 0.001) return { angle: 0, stretch: 1, squash: 1 };

    const k = Math.min(0.24, (travel / h) / 5200) + this.ballStretch - this.ballSquash;
    const stretch = Math.max(0.6, 1 + k);
    return { angle: Math.atan2(dy, dx), stretch, squash: 1 / stretch };
  }

  /**
   * The flight trail: a comet that tapers to nothing behind the ball. Older
   * samples are smaller, cooler and fainter, which reads as motion rather
   * than as a row of copies.
   */
  _drawTrail(ctx) {
    const n = this.trail.length;
    for (let i = 0; i < n; i++) {
      const t = this.trail[i];
      const u = i / n;                 // 0 oldest, 1 newest
      ctx.globalAlpha = u * u * 0.42;
      ctx.fillStyle = u > 0.6 ? '#ffc07a' : '#f0913f';
      const r = t.r * (0.2 + u * 0.72);
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /**
   * The capybara.
   *
   * Behind the shoulder he sits at the lens, which projects to somewhere
   * below the screen, so that camera pins him to fixed coordinates. Side on
   * he is a figure in the scene like any other and gets projected properly.
   * The dunk run has to work in both, so it's expressed as a 0..1 progress
   * and each camera interprets it its own way.
   */
  _drawCapy(ctx) {
    const { actor } = this.cam;
    const dunking = this.phase === 'dunk';
    const slammed = this.dunk.result === 'perfect' || this.dunk.result === 'hit';
    const rim = this.project(0, this.hoop.rimY, this.hoop.rimZ);

    // After a slam he drops off the rim and lands, over the first part of
    // the result hold — measured from the start of the hold, so he is back
    // on the floor with time left to celebrate there. Hanging on the rim
    // until the phase ends reads as a sticker, not a dunk.
    const landing = this._landProgress();
    const ease = landing ** 0.7;

    let x, y, scale;
    // His own spot on the foul line; the run-up closes in on the hoop's line.
    const spot = this._capyRest();
    const restScale = this._capyRestScale();

    if (actor.mode === 'world') {
      const u = dunking ? this.dunk.t : 0;
      const z = dunking ? this.hoop.rimZ * u : actor.z;
      const at = this.project(actor.x + this.capyX * (1 - u), 0, z);
      const base = this.project(actor.x, 0, actor.z);
      x = at.sx;
      y = at.sy;
      scale = actor.scale * (at.s / base.s);
      if (slammed) {
        // Hanging off the rim, then dropped back to where he started.
        const hangX = rim.sx, hangY = rim.sy + 70 * rim.s;
        const hangS = actor.scale * (rim.s / base.s) * SLAM_SCALE;
        x = hangX + (spot.x - hangX) * ease;
        y = hangY + (spot.y - hangY) * ease;
        scale = hangS + (restScale - hangS) * ease;
      }
    } else {
      x = spot.x; y = actor.y; scale = actor.scale;
      if (dunking) {
        const u = this.dunk.t;
        const shrink = 300 / (this.hoop.rimZ + 300);
        const floorEnd = this.project(0, 0, this.hoop.rimZ).sy;
        scale = actor.scale * (1 + (shrink - 1) * u);
        x = spot.x + (rim.sx - spot.x) * u;
        y = actor.y + (floorEnd - 40 - actor.y) * u;
        if (slammed) {
          // Drawn larger than the perspective strictly allows. At true scale
          // he is about forty pixels tall at the rim, which is far too small
          // for the loudest moment in the level to be about him.
          const hangX = rim.sx, hangY = rim.sy + 70 * shrink;
          const hangS = actor.scale * shrink * SLAM_SCALE;
          x = hangX + (spot.x - hangX) * ease;
          y = hangY + (actor.y - hangY) * ease;
          scale = hangS + (actor.scale - hangS) * ease;
        }
      }
    }

    // Squash on touchdown. The landing itself is detected in _stepDunk —
    // drawing decides how things look, never that something has happened.
    const squash = slammed && landing > 0.7
      ? 1 - Math.sin(((landing - 0.7) / 0.3) * Math.PI) * 0.12
      : 1;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1 / squash, squash);
    // Only front and back exist in the rig; side on, the face is the
    // friendlier half to show.
    this.capy.draw(ctx, 0, 0, {
      scale,
      facing: this.view === 'side' ? 'front' : 'back',
      holdingProp: false,
    });
    ctx.restore();
    this.reactions.anchor(x, y, scale);
  }

  /**
   * The aim guide.
   *
   * Built from a dry run of the same integrator the shot uses, so what the
   * guide draws is what the ball does — a guide with its own maths is a
   * guide that lies. Three things, and nothing else, because a six-year-old
   * has to read it in the half second before they let go:
   *
   *   the arc      where the ball goes, thick at the near end and fading out
   *   the target   a ring on the rim plane, green if it drops, amber if not
   *   the power    one chunky bar that fills up
   */
  _drawAimGuide(ctx) {
    if (this.phase !== 'aiming' || this.slideHeld || !this._input) return;
    const preview = this.aim.preview(this._input);
    if (!preview || preview.dy >= -MIN_LIFT) return;

    const path = this._previewPath(preview);
    this._drawArc(ctx, path);
    if (path.mark) this._drawTarget(ctx, path.mark, path.good);
    this._drawPowerBar(ctx, preview.power, path.good);
  }

  /**
   * Dry-runs a shot and returns the screen points it passes through, plus
   * where it crosses the rim plane. Same integrator and same rim assist as
   * the live ball, stepped at the same rate.
   */
  _previewPath(preview) {
    const power = MIN_POWER + preview.power * (MAX_POWER - MIN_POWER);
    const lateral = Math.max(-1, Math.min(1, preview.dx / 420)) * LATERAL_MAX;
    const ghost = {
      x: this.capyX, y: SHOOT_Y, z: SHOOT_Z,
      vx: lateral, vy: power * Math.sin(SHOT_ELEVATION), vz: power * Math.cos(SHOT_ELEVATION),
    };

    const pts = [];
    let mark = null;
    let good = false;
    for (let i = 0; i < 96; i++) {
      const wasY = ghost.y;
      integrate(ghost, 1 / 60, { drag: AIR_DRAG });
      const [ax, az] = this._assist(ghost.x, ghost.y, ghost.z, ghost.vy, 1 / 60);
      ghost.vx += ax; ghost.vz += az;

      if (!mark && ghost.vy < 0 && wasY > this.hoop.rimY && ghost.y <= this.hoop.rimY) {
        const off = Math.hypot(ghost.x, ghost.z - this.hoop.rimZ);
        good = off < RIM_R - 8;
        mark = this.project(ghost.x, this.hoop.rimY, ghost.z);
      }
      if (ghost.y < 0) break;
      pts.push(this.project(ghost.x, ghost.y, ghost.z));
      // Past the hoop the arc is just clutter — it stops where the answer is.
      if (mark && pts.length > 4) break;
    }
    return { pts, mark, good };
  }

  /**
   * The arc, as a tapering ribbon with beads travelling along it. The taper
   * says which end is which without an arrowhead, and the beads flow toward
   * the hoop so the direction reads at a glance even on a still frame.
   */
  _drawArc(ctx, { pts, good }) {
    if (pts.length < 2) return;
    const tint = good ? '#8dfcb0' : '#ffd08a';

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // A soft wide pass under a bright narrow one: reads as a glowing lane
    // rather than a hairline, which matters on a phone in daylight.
    for (const [width, alpha] of [[13, 0.16], [6, 0.34]]) {
      ctx.strokeStyle = good ? `rgba(141,252,176,${alpha})` : `rgba(255,208,138,${alpha})`;
      ctx.lineWidth = width;
      ctx.beginPath();
      pts.forEach((p, i) => (i ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy)));
      ctx.stroke();
    }

    // Beads. Spaced along the path by index, drifting with a shared clock, so
    // the whole line appears to run toward the target.
    const flow = (performance.now() / 1000) % 1;
    const every = 7;
    for (let i = 0; i < pts.length; i++) {
      const u = i / (pts.length - 1);
      const phase = (i / every + flow) % 1;
      if (phase > 0.16) continue;
      const p = pts[i];
      const r = Math.max(2.4, 8 * p.s) * (1 - u * 0.45);
      ctx.globalAlpha = 0.9 * (1 - u * 0.5);
      ctx.fillStyle = tint;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /**
   * The landing ring on the rim plane. Green and closing when the shot
   * drops, amber and open when it doesn't — colour and shape both, so it
   * still reads for a colour-blind player.
   */
  _drawTarget(ctx, mark, good) {
    const r = RIM_R * mark.s;
    const pulse = 1 + Math.sin(performance.now() / 140) * 0.06;
    ctx.save();
    ctx.strokeStyle = good ? COLOR.success : '#ffb26b';
    ctx.lineWidth = Math.max(3, 7 * mark.s);
    ctx.beginPath();
    ctx.ellipse(mark.sx, mark.sy, r * pulse, r * 0.34 * pulse, 0, 0, Math.PI * 2);
    ctx.stroke();

    if (good) {
      // A filled disc as well, so a made shot is unmistakably "in the hole".
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = COLOR.success;
      ctx.beginPath();
      ctx.ellipse(mark.sx, mark.sy, r, r * 0.34, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // A tick either side, pointing at where it went wrong.
      ctx.globalAlpha = 0.8;
      const rim = this.project(0, this.hoop.rimY, this.hoop.rimZ);
      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(mark.sx, mark.sy);
      ctx.lineTo(rim.sx, rim.sy);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  /**
   * Power, as one bar up the left edge.
   *
   * Vertical on purpose: the gesture is a drag upward, so a gauge that fills
   * upward is the same motion the thumb is already making. It carries the
   * arc's green/amber verdict too, which means "how hard" and "will it go
   * in" are one glance rather than two, and it sits out at the edge where it
   * can't crowd the capybara or the hoop.
   */
  _drawPowerBar(ctx, power, good) {
    const w = 18, h = 210;
    const x = 26;
    const y = VIEW_HEIGHT - 150 - h;

    ctx.save();
    plate(ctx, x - 5, y - 5, w + 10, h + 10, { r: (w + 10) / 2 });
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, w / 2);
    ctx.fill();

    const fill = Math.max(w, h * power);
    const g = ctx.createLinearGradient(0, y + h, 0, y);
    g.addColorStop(0, COLOR.success);
    g.addColorStop(0.55, COLOR.gold);
    g.addColorStop(1, '#ff7a5c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(x, y + h - fill, w, fill, w / 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.roundRect(x + 3, y + h - fill + 3, w * 0.34, fill - 6, w * 0.2);
    ctx.fill();

    // Head of the bar, carrying the arc's verdict.
    ctx.fillStyle = good ? COLOR.success : '#ffd08a';
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h - fill + w / 2, w * 0.74, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = font(11, 800);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('POWER', x + w / 2, y + h + 12);
    ctx.restore();
  }

  _drawDunkUi(ctx) {
    if (this.phase !== 'dunk') return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (!this.dunk.result) {
      ctx.fillStyle = '#fff';
      ctx.font = font(30, 700);
      ctx.globalAlpha = 0.75 + Math.sin(performance.now() / 110) * 0.25;
      ctx.fillText('TAP TO SLAM!', VIEW_WIDTH / 2, this.cam.horizon - 60);
      ctx.globalAlpha = 1;
    }
    // Timing meter, with the good/perfect windows marked.
    // Above the corner buttons, not across them.
    const bw = 260, bx = VIEW_WIDTH / 2 - bw / 2, by = VIEW_HEIGHT - 132;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.roundRect(bx - 3, by - 3, bw + 6, 22, 11);
    ctx.fill();
    ctx.fillStyle = 'rgba(124,252,155,0.45)';
    ctx.fillRect(bx + bw * DUNK_LO, by, bw * (DUNK_HI - DUNK_LO), 16);
    ctx.fillStyle = 'rgba(255,217,61,0.75)';
    ctx.fillRect(bx + bw * DUNK_PERFECT_LO, by, bw * (DUNK_PERFECT_HI - DUNK_PERFECT_LO), 16);
    ctx.fillStyle = '#fff';
    ctx.fillRect(bx + bw * Math.min(1, this.dunk.t) - 3, by - 5, 6, 26);
    ctx.restore();
  }

  /** PERFECT SLAM!, stamped across the screen (ui.js stamp()). Mid-screen,
   *  between the rim he's hanging from and the floor he lands on: the title
   *  must never cover the star of the moment. */
  _drawStamp(ctx) {
    stamp(ctx, 'PERFECT SLAM!', `+${DUNK_PERFECT_POINTS}`, STAMP_TIME - this.stampT, STAMP_TIME, VIEW_HEIGHT * 0.47);
  }

  _drawParticles(ctx) {
    for (const p of this.particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      if (p.round) {
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
      }
      ctx.restore();
    }
  }

  /** Expanding shock rings, thinning as they grow. */
  _drawRings(ctx) {
    ctx.save();
    for (const r of this.rings) {
      const u = r.t / r.life;
      ctx.globalAlpha = (1 - u) * 0.8;
      ctx.strokeStyle = r.col;
      ctx.lineWidth = Math.max(1, 7 * (1 - u));
      const rad = r.r0 + (r.r - r.r0) * (1 - (1 - u) ** 2);
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, rad, rad * 0.5, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  /**
   * Score pop-ups. They punch in over the first fifth of their life and
   * drift up after — the overshoot is what makes a "+2" feel earned rather
   * than printed. Outlined, because they land over a bright wall as often
   * as a dark one.
   */
  _drawFloaters(ctx) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    for (const f of this.floaters) {
      const age = 1.2 - f.t;
      const grow = age < 0.18
        ? 0.45 + 0.75 * (age / 0.18) ** 0.5     // snap up past full size
        : 1 + 0.2 * Math.max(0, 1 - (age - 0.18) / 0.16);
      const size = Math.round(30 * (f.scale ?? 1) * grow);
      ctx.globalAlpha = Math.min(1, f.t * 1.6);
      ctx.font = font(size, 800);
      ctx.strokeStyle = 'rgba(14,18,26,0.75)';
      ctx.lineWidth = Math.max(3, size * 0.16);
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.col;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.restore();
  }
}
