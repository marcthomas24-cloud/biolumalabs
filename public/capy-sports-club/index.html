    const cur = pts[i];
    const next = pts[(i + 1) % n];
    path.quadraticCurveTo(cur[0], cur[1], (cur[0] + next[0]) / 2, (cur[1] + next[1]) / 2);
  }
  path.closePath();
  return path;
}

/** Fur fill with the light coming from the upper left. */
function furFill(ctx, cx, cy, r) {
  const g = ctx.createRadialGradient(cx - r * 0.36, cy - r * 0.44, r * 0.1, cx, cy, r * 1.12);
  g.addColorStop(0, PALETTE.furHi);
  g.addColorStop(0.46, PALETTE.furMid);
  g.addColorStop(1, PALETTE.furShade);
  return g;
}

/** Soft warm outline. Thin enough to hold up when the rig is drawn tiny. */
function outline(ctx, w = 3) {
  ctx.strokeStyle = PALETTE.outline;
  ctx.lineWidth = w;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function ellipse(ctx, x, y, rx, ry, rot = 0) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
}

/** Head silhouette, in head-local units. Shared by the fill, the cheek
 *  shadow, the headband clip and the ear cut-outs, so they never drift
 *  apart. Brick-shaped, as capybaras are: a flat crown and straight sides
 *  (CAPY_IDENTITY.md §4 — it used to be round-topped, and read as a bear). */
const HEAD = [
  [-56, -8], [-54, -32], [-32, -44], [0, -44], [32, -44], [54, -32],
  [57, -6], [53, 24], [30, 43], [0, 48], [-30, 43], [-53, 24],
];

/** Muzzle slab, in head-local units: tall and a little narrower at the
 *  top, the long blunt snout that says capybara rather than bear. */
const MUZZLE = [
  [-37, 16], [-31, -2], [-12, -12], [12, -12], [31, -2], [37, 16],
  [34, 34], [16, 46], [-16, 46], [-34, 34],
];

/** The ears: small nubs set high on the crown, only just tilted out. */
const EAR_X = 40, EAR_Y = -47, EAR_SCALE = 0.65, EAR_TILT = 0.15;

/** Where the eyes sit, head-local: high on the face, over a long snout. */
const EYE_X = 30, EYE_Y = -20;

/** The mouth, further down the snout than on a bear. */
const MOUTH_Y = 23;

/** 0..1 ease used for the snappy half of a pose. */
const easeOut = (u) => 1 - (1 - u) * (1 - u);
const clamp01 = (u) => (u < 0 ? 0 : u > 1 ? 1 : u);

/** The base rig's shapes and helpers, lent to the kit layers (kits.js). */
const RIG = { blob, ellipse, outline, HEAD, PALETTE, artFont };

/* ── the character ────────────────────────────────────────────────────────── */

class Character {
  constructor() {
    this.state = 'idle';   // what's on screen right now
    this.base = 'idle';    // what it falls back to
    this.sport = 'basketball';
    this.t = 0;            // free-running clock, for breathing and blinks
    this.stateT = 0;       // time left in a one-shot
    this.stateDur = 0;
    this.blinkAt = 2.4;    // next blink, seconds on the free clock
    this.stateAge = 0;     // seconds since the current state began
    this.blendT = 0;       // counts down while a new pose blends in
    this.blendFrom = null; // the pose being blended away from
    this.lastPose = null;
    // Idle life: where he's glancing, which ear last flicked, a rare yawn.
    this.lookAt = 0;
    this.lookUntil = 0;
    this.nextLook = 3 + Math.random() * 4;
    this.flickSide = 1;
    this.flickT = 0;
    this.nextFlick = 2 + Math.random() * 3;
    this.idleT = 0;
    this.yawnT = 0;
    /** Seconds of gold starburst left behind him — a new personal best. */
    this.glowT = 0;
    this.glowDur = 0;
    /** The kit being worn (kits.js), and a quick change in progress. */
    this.kit = DEFAULT_KIT;
    this.kitChange = null;
    /** Seconds left with swim goggles pulled down over the eyes. */
    this.gogglesT = 0;
  }

  /**
   * Pulls the swim goggles (if the kit has them) down over his eyes for a
   * moment — a dive — then back up onto his forehead. CAPY_IDENTITY.md:
   * nothing covers the eyes except briefly, like this.
   */
  pullGoggles(seconds = 0.6) {
    this.gogglesT = seconds;
  }

  /** Puts a kit on at once. Unknown ids get the classic kit. */
  setKit(id) {
    const done = this.kitChange?.done;
    this.kit = kitId(id);
    this.kitChange = null;
    done?.();
  }

  /**
   * Changes kit with a quick-change: a squash, a puff of sparkles, and he
   * pops back up in the new kit — about KIT_CHANGE_TIME seconds, run off
   * update(), so there's no timer to leak. `done` is called once it's on.
   * Already wearing it, or with reduced motion on, the change is instant.
   */
  changeKit(id, done) {
    id = kitId(id);
    const target = this.kitChange ? this.kitChange.to : this.kit;
    if (id === target) {
      if (this.kitChange && done) {
        const before = this.kitChange.done;
        this.kitChange.done = () => { before?.(); done(); };
      } else if (!this.kitChange) done?.();
      return;
    }
    if (reducedMotion()) {
      this.setKit(id);
      done?.();
      return;
    }
    // Changing again mid-change: aim for the new kit, and keep both promises.
    const before = this.kitChange?.done;
    this.kitChange = {
      to: id,
      t: Math.min(this.kitChange?.t ?? 0, KIT_SWAP_AT * 0.5),
      done: before && done ? () => { before(); done(); } : before ?? done,
    };
  }

  /** Mid quick-change? */
  get changingKit() {
    return !!this.kitChange;
  }

  /** Switches the on-screen state, blending from wherever the rig was. */
  _enter(state) {
    if (state !== this.state && this.lastPose) {
      this.blendFrom = this.lastPose;
      this.blendT = BLEND_TIME;
    }
    this.state = state;
    this.stateAge = 0;
    if (state !== 'idle') this.yawnT = 0;
  }

  /** Looks one way (-1 left, 1 right) for a moment — at what you're touching. */
  glance(dir, seconds = 0.8) {
    this.lookAt = Math.sign(dir) || 1;
    this.lookUntil = this.t + seconds;
  }

  /**
   * The gold starburst behind him, for the biggest moments (a new best).
   * Separate from any pose so it can ride on top of whichever one plays.
   */
  glow(seconds = 2.2) {
    this.glowT = Math.max(this.glowT, seconds);
    this.glowDur = this.glowT;
  }

  /**
   * Plays a state. Looping states (`idle`, `prepare`, `dunk`) become the new
   * resting pose; the rest run once and hand back to it.
   */
  play(state) {
    if (!STATES.includes(state)) return;
    if (LOOPING.has(state)) return this.hold(state);
    this._enter(state);
    this.stateDur = DURATION[state] || 0.7;
    this.stateT = this.stateDur;
  }

  /** Sets the resting pose without interrupting a one-shot that's mid-flight. */
  hold(state) {
    if (!STATES.includes(state)) return;
    this.base = state;
    if (this.stateT <= 0 && this.state !== state) this._enter(state);
  }

  update(dt) {
    this.t += dt;
    this.stateAge += dt;
    this.blendT = Math.max(0, this.blendT - dt);
    this.glowT = Math.max(0, this.glowT - dt);
    this.gogglesT = Math.max(0, this.gogglesT - dt);
    if (this.kitChange) {
      const c = this.kitChange;
      c.t += dt;
      if (c.t >= KIT_SWAP_AT) this.kit = c.to;
      if (c.t >= KIT_CHANGE_TIME) {
        this.kitChange = null;
        c.done?.();
      }
    }
    if (this.t > this.blinkAt) this.blinkAt = this.t + 2.2 + Math.random() * 2.8;
    if (this.stateT > 0) {
      this.stateT -= dt;
      if (this.stateT <= 0) this._enter(this.base);
    }

    // Idle life. Small and infrequent on purpose: it should be noticed on
    // the third look, not the first.
    if (this.t > this.nextLook) {
      this.lookAt = Math.random() < 0.5 ? -1 : 1;
      this.lookUntil = this.t + 0.7 + Math.random() * 0.6;
      this.nextLook = this.t + 4 + Math.random() * 5;
    }
    if (this.t > this.nextFlick) {
      this.flickSide = Math.random() < 0.5 ? -1 : 1;
      this.flickT = 0.28;
      this.nextFlick = this.t + 2.5 + Math.random() * 4;
    }
    this.flickT = Math.max(0, this.flickT - dt);
    this.idleT = this.state === 'idle' ? this.idleT + dt : 0;
    if (this.yawnT > 0) this.yawnT = Math.max(0, this.yawnT - dt);
    // A long wait earns a yawn, once in a while. Rarely — it's a joke.
    else if (this.idleT > 14 && Math.random() < dt / 10) {
      this.yawnT = 1.7;
      this.idleT = 0;
    }
  }

  /** 0 at the start of the current one-shot, 1 at its end. */
  get progress() {
    return this.stateDur > 0 && this.stateT > 0 ? 1 - this.stateT / this.stateDur : 1;
  }

  /**
   * @param {CanvasRenderingContext2D} ctx
   * @param {object} [opts]
   * @param {number} [opts.scale]
   * @param {'front'|'back'} [opts.facing]
   * @param {boolean} [opts.holdingProp]
   * @param {string} [opts.kit]  strip colour, for when two capybaras share
   *        a pitch and have to be told apart — a keeper against a striker.
   *        By default: the player's chosen colour, else the kit's own
   */
  /**
   * @param {object} [opts.look]  wardrobe items by slot (cosmetics.js); the
   *        player's own by default, cosmetics.PLAIN for a Capy who isn't them
   */
  draw(ctx, x, y, { scale = 1, facing = 'front', holdingProp = true, kit, look = currentLook() } = {}) {
    const p = this._pose();
    this._squashForChange(p);
    const outfit = this._outfit(kit, facing === 'back' && this.state !== 'shrug', p);
    this.lastPose = p;
    // A shrug is aimed at the player, so it overrides the camera's choice and
    // glances over the shoulder. Shrugging with your back turned says nothing.
    const back = facing === 'back' && this.state !== 'shrug';

    ctx.save();
    ctx.translate(x, y);

    if (this.glowT > 0) this._drawGlow(ctx, scale);

    // Shadow stays on the ground and shrinks as he leaves it.
    const air = clamp01(-p.bodyDy / 26);
    ctx.fillStyle = `rgba(0,0,0,${0.30 - air * 0.16})`;
    ellipse(ctx, 0, 0, (74 - air * 16) * scale, (16 - air * 4) * scale);
    ctx.fill();

    ctx.scale(scale, scale);
    // Lean pivots at the feet, so he tips rather than slides.
    ctx.translate(0, p.bodyDy);
    ctx.rotate(p.lean);
    ctx.scale(p.squash, p.stretch);

    // Wardrobe, back slot: behind him as he faces us, over his back when
    // he faces away (the camera is then looking at the cape).
    const wear = { kit: outfit.colour, t: this.t, lift: clamp01(-p.bodyDy / 26), back };
    if (look.back && !back) look.back.draw(ctx, wear);
    this._look = look;
    this._wear = wear;

    // The locked base, with the kit's layers over it at fixed points:
    // far-arm band, lower, top, footwear, headwear, near-arm band.
    this._drawHaunches(ctx, p);                  // hips, breaking the outline
    const farArm = this._drawArm(ctx, p, -1, true);   // far arm, behind the body
    this._drawKitLayer(ctx, 'band', { ...outfit, arm: farArm, far: true });
    this._drawBody(ctx, p, back);
    this._drawKitLayer(ctx, 'lower', outfit);    // under the paws, which sit on it
    this._drawPaws(ctx, p, back);                // feet: toes to camera, or heels
    this._drawKitLayer(ctx, 'top', outfit);
    this._drawKitLayer(ctx, 'footwear', outfit);
    if (look.back && back) look.back.draw(ctx, wear);
    this._drawHead(ctx, p, outfit, back);
    const arm = this._drawArm(ctx, p, 1, false);  // near arm, over the body
    this._drawKitLayer(ctx, 'band', { ...outfit, arm, far: false });

    if (holdingProp) this._drawProp(ctx, p, outfit.prop);
    if (SPARKLY.has(this.state)) this._drawSparkles(ctx, this.state === 'hype' ? 1.5 : 1);
    if (this.kitChange) this._drawChangePuff(ctx);

    ctx.restore();
  }

  /* ── posing ─────────────────────────────────────────────────────────────── */

  /**
   * Every animated number for this frame in one place, so the drawing code
   * below stays a straight read of the rig.
   */
  _pose() {
    const t = this.t;
    const u = this.progress;
    const breath = Math.sin(t * 2.1);

    const p = {
      bodyDy: 0,
      lean: 0,
      squash: 1 + breath * 0.012,
      stretch: 1 - breath * 0.010,
      headDx: 0,
      headDy: breath * 1.4,
      headTilt: 0,
      earLift: Math.sin(t * 1.35) * 0.05,
      armBack: 0.16,          // radians from straight down, far arm
      armFront: 0.16,         // near arm
      footLift: 0,
      eyeOpen: 1,
      eye: 'normal',          // normal | happy | squint | sad | wide
      mouth: 'smile',         // smile | flat | open | frown | grit
      blush: 0.35,
      propLift: 0,
      lookX: 0,               // pupil offset, for glances
      lookY: 0,
      brow: 'neutral',        // neutral | up | high | focus | sad | none
      earFlick: 0,            // extra lift on one ear, for twitches
    };
    const e = this.stateAge;
    // The crouch before a happy leap: 0 → 1 → 0 over ANTICIPATE seconds.
    const crouch = e < ANTICIPATE ? Math.sin((e / ANTICIPATE) * Math.PI) : 0;
    const hopClock = Math.max(0, e - ANTICIPATE);

    // Blink on the free clock so it never syncs with the animation states.
    const sinceBlink = t - (this.blinkAt - 0.001);
    if (sinceBlink > -0.16 && sinceBlink < 0) {
      p.eyeOpen = Math.abs(sinceBlink + 0.08) / 0.08;
    }

    switch (this.state) {
      case 'prepare': {
        // Coiled: knees bent, weight back, ball cradled, eyes on the target.
        const shiver = Math.sin(t * 16) * 0.5;
        p.bodyDy = 7;
        p.squash = 1.07;
        p.stretch = 0.92;
        p.lean = -0.06;
        p.headDy = 2 + shiver * 0.4;
        p.armBack = 0.62;
        p.armFront = 1.05 + shiver * 0.02;
        p.earLift = -0.12 + Math.sin(t * 2.4) * 0.04;
        p.eye = 'squint';
        p.brow = 'focus';
        p.mouth = 'flat';
        p.propLift = 12;
        p.lookY = -1.5;
        Object.assign(p, PREPARE_POSE[this.sport] ?? {});
        break;
      }
      case 'shoot': {
        // Snap up and through, then float back down over the tail of the shot.
        const k = u < 0.32 ? easeOut(u / 0.32) : 1 - easeOut((u - 0.32) / 0.68);
        const g = k * (SHOOT_GAIN[this.sport] ?? 1);
        p.bodyDy = -14 * g;
        p.squash = 1 - 0.10 * g;
        p.stretch = 1 + 0.15 * g;
        p.lean = 0.10 * g;
        p.headDy = -3 * k;
        p.headTilt = -0.06 * k;
        p.armBack = 0.5 + 1.1 * k;
        p.armFront = 0.6 + 1.9 * k;
        p.footLift = 5 * k;
        p.earLift = 0.34 * k;
        p.eye = k > 0.5 ? 'wide' : 'squint';
        p.brow = 'focus';
        p.mouth = 'open';
        break;
      }
      case 'celebrate': {
        // Little hops, arms punching alternately.
        const hop = Math.abs(Math.sin(hopClock * 7.4));
        const land = 1 - hop;
        p.bodyDy = -19 * hop + 7 * crouch;
        p.squash = 1 + 0.10 * land * land - 0.05 * hop + 0.06 * crouch;
        p.stretch = 1 - 0.10 * land * land + 0.07 * hop;
        p.headDy = -2 * hop;
        p.headTilt = Math.sin(t * 3.7) * 0.07;
        p.armBack = 1.4 + Math.sin(t * 7.4) * 0.7;
        p.armFront = 1.4 - Math.sin(t * 7.4) * 0.7;
        p.earLift = 0.10 + hop * 0.30;
        p.eye = 'happy';
        p.brow = 'up';
        p.mouth = 'open';
        p.blush = 0.9;
        break;
      }
      case 'victory': {
        // Same idea, bigger: both arms in a V, a proud sway, sparkles.
        const hop = Math.abs(Math.sin(hopClock * 5.6));
        const land = 1 - hop;
        p.bodyDy = -26 * hop + 9 * crouch;
        p.squash = 1 + 0.12 * land * land - 0.06 * hop + 0.08 * crouch;
        p.stretch = 1 - 0.12 * land * land + 0.09 * hop;
        p.lean = Math.sin(t * 2.8) * 0.05;
        p.headDy = -3 * hop;
        p.headTilt = Math.sin(t * 2.8) * 0.10;
        p.armBack = 2.35 + Math.sin(t * 5.6) * 0.14;
        p.armFront = 2.35 - Math.sin(t * 5.6) * 0.14;
        p.earLift = 0.24 + hop * 0.34;
        p.eye = 'happy';
        p.brow = 'up';
        p.mouth = 'open';
        p.blush = 1;
        break;
      }
      case 'miss': {
        // The slump: shoulders drop, ears fold, a slow head shake.
        const k = easeOut(clamp01(u * 2.4));
        p.bodyDy = 8 * k;
        p.squash = 1 + 0.07 * k;
        p.stretch = 1 - 0.09 * k;
        p.headDy = 6 * k;
        p.headDx = Math.sin(t * 4.4) * 3 * k;
        p.headTilt = 0.10 * k + Math.sin(t * 4.4) * 0.05 * k;
        p.armBack = 0.06;
        p.armFront = 0.02;
        p.earLift = -0.62 * k;
        p.eye = 'sad';
        p.brow = 'sad';
        p.mouth = 'frown';
        p.blush = 0.15;
        break;
      }
      case 'surprise': {
        // The near miss. A jolt up and back with paws flying to his cheeks
        // and an "O" of disbelief — then it sinks in, and he sags.
        const jolt = easeOut(clamp01(u / 0.12));
        const sink = easeOut(clamp01((u - 0.55) / 0.3));
        const hold = jolt * (1 - sink);
        p.bodyDy = -9 * hold + 6 * sink;
        p.lean = -0.13 * hold;
        p.squash = 1 - 0.06 * hold + 0.05 * sink;
        p.stretch = 1 + 0.12 * hold - 0.06 * sink;
        p.headDy = -3 * hold + 5 * sink;
        p.headTilt = 0.06 * sink + Math.sin(t * 30) * 0.015 * hold;
        p.armBack = 0.1 + 2.1 * hold;
        p.armFront = 0.1 + 2.2 * hold;
        p.earLift = 0.6 * hold - 0.5 * sink;
        p.eye = sink > 0.5 ? 'sad' : 'wide';
        p.brow = sink > 0.5 ? 'sad' : 'high';
        p.mouth = sink > 0.5 ? 'frown' : 'o';
        p.blush = 0.2;
        break;
      }
      case 'hype': {
        // Off the rails. Faster and higher than `victory`, arms windmilling
        // out of phase with the hops, and a whole-body wobble either side of
        // the lean — the pose the fourth basket in a row has earned.
        const hop = Math.abs(Math.sin(hopClock * 8.2));
        const land = 1 - hop;
        p.bodyDy = -34 * hop + 11 * crouch;
        p.squash = 1 + 0.16 * land * land - 0.09 * hop + 0.1 * crouch;
        p.stretch = 1 - 0.16 * land * land + 0.13 * hop;
        p.lean = Math.sin(t * 8.2) * 0.16;
        p.headDx = Math.sin(t * 8.2) * 4;
        p.headDy = -5 * hop;
        p.headTilt = Math.sin(t * 6.1) * 0.20;
        // A full turn each, half a cycle apart, so the arms never line up.
        p.armBack = 1.6 + Math.sin(t * 11) * 1.5;
        p.armFront = 1.6 + Math.sin(t * 11 + Math.PI) * 1.5;
        p.footLift = 10 * hop;
        p.earLift = 0.3 + hop * 0.55;
        p.eye = 'happy';
        p.brow = 'up';
        p.mouth = 'open';
        p.blush = 1;
        break;
      }
      case 'shrug': {
        // A beat of "well, that happened": paws turned out, one shoulder up,
        // head cocked, held still long enough to read before he shakes it
        // off. The stillness is the joke — everything else in the rig moves.
        const k = easeOut(clamp01(u * 3.4));
        const settle = 1 - clamp01((u - 0.78) / 0.22);   // drop the pose at the end
        const a = k * settle;
        p.bodyDy = 3 * a;
        p.squash = 1 + 0.05 * a;
        p.stretch = 1 - 0.05 * a;
        p.lean = -0.07 * a;
        p.headDx = -4 * a;
        p.headTilt = -0.24 * a;
        p.armBack = 1.05 * a;
        p.armFront = 1.35 * a;
        p.earLift = -0.30 * a;
        p.eye = 'squint';
        p.brow = 'up';
        p.mouth = 'flat';
        p.blush = 0.5;
        p.lookX = -1.5;   // side-eye at the player
        break;
      }
      case 'dunk': {
        // Airborne and committed: tucked legs, one paw slamming overhead.
        const flap = Math.sin(t * 9);
        p.bodyDy = -30;
        p.lean = 0.24;
        p.squash = 0.92;
        p.stretch = 1.16;
        p.headDy = -4;
        p.headTilt = 0.14;
        p.armBack = -0.55 + flap * 0.06;
        p.armFront = 2.75 + flap * 0.08;
        p.footLift = 16;
        p.earLift = 0.5 + flap * 0.08;
        p.eye = 'wide';
        p.brow = 'focus';
        p.mouth = 'grit';
        break;
      }
      default: {
        // idle: breathing, a lazy arm sway, the odd ear twitch.
        const sway = Math.sin(t * 1.7);
        p.armBack = 0.16 + sway * 0.07;
        p.armFront = 0.16 - sway * 0.07;
        if (t < this.lookUntil) p.lookX = this.lookAt * 2.2;
        if (this.yawnT > 0) {
          // Up, stretch, big "O", eyes screwed shut — then back to it.
          const y = Math.sin((1 - this.yawnT / 1.7) * Math.PI);
          p.stretch += 0.06 * y;
          p.squash -= 0.04 * y;
          p.headTilt = -0.12 * y;
          p.armBack += 1.2 * y;
          p.armFront += 0.9 * y;
          p.earLift -= 0.25 * y;
          if (y > 0.3) {
            p.eye = 'squint';
            p.eyeOpen = 0.1;
            p.mouth = 'yawn';
            p.brow = 'up';
          }
        }
      }
    }

    // An ear twitch, one side at a time, whatever else is happening.
    if (this.flickT > 0) p.earFlick = this.flickSide * Math.sin((this.flickT / 0.28) * Math.PI) * 0.5;

    // Blend in from the previous pose, overshooting a touch as it lands.
    if (this.blendT > 0 && this.blendFrom) {
      const k = easeOutBack(1 - this.blendT / BLEND_TIME);
      for (const key of BLENDED) {
        const from = this.blendFrom[key];
        if (from !== undefined) p[key] = from + (p[key] - from) * k;
      }
    }
    return p;
  }

  /* ── body parts ─────────────────────────────────────────────────────────── */

  /** Hips, poking out either side so the silhouette isn't a plain egg. */
  _drawHaunches(ctx, p) {
    for (const side of [-1, 1]) {
      ctx.fillStyle = PALETTE.furShade;
      ellipse(ctx, side * 56, -26 + p.footLift * 0.3, 22, 26, side * 0.2);
      ctx.fill();
      outline(ctx, 3);
    }
  }

  /** Front paws, sat proud of the belly — the bottom of the silhouette. */
  _drawPaws(ctx, p, back = false) {
    const y = -9 + p.footLift * -0.35;
    if (back) return this._drawHeels(ctx, y);
    for (const side of [-1, 1]) {
      ctx.fillStyle = furFill(ctx, side * 34, y, 26);
      blob(ctx, [
        [side * 10, y - 11], [side * 40, y - 13], [side * 60, y - 4],
        [side * 58, y + 9], [side * 30, y + 13], [side * 9, y + 6],
      ]);
      ctx.fill();
      outline(ctx, 3);
      // Three soft toe splits.
      ctx.strokeStyle = 'rgba(120,80,44,0.5)';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const tx = side * (24 + i * 12);
        ctx.beginPath();
        ctx.moveTo(tx, y - 7);
        ctx.lineTo(tx + side * 2, y + 6);
        ctx.stroke();
      }
    }
  }

  /**
   * Seen from behind, the toes point away from the camera, so what shows is
   * the back of each foot: a rounded heel with its sole pad, and no toes.
   */
  _drawHeels(ctx, y) {
    for (const side of [-1, 1]) {
      const cx = side * 30;
      ctx.fillStyle = furFill(ctx, cx, y, 20);
      blob(ctx, [
        [cx - 18, y - 8], [cx, y - 12], [cx + 18, y - 8],
        [cx + 20, y + 6], [cx, y + 12], [cx - 20, y + 6],
      ]);
      ctx.fill();
      outline(ctx, 3);
      ctx.fillStyle = 'rgba(92,58,33,0.45)';
      ellipse(ctx, cx, y + 4, 11, 6);
      ctx.fill();
    }
  }

  _drawBody(ctx, p, back = false) {
    // Pear-shaped and hand-wobbled: heavy at the hips, narrower at the
    // shoulders, with no straight edges anywhere.
    ctx.fillStyle = furFill(ctx, -14, -78, 96);
    blob(ctx, [
      [-64, -16], [-71, -50], [-66, -84], [-49, -110], [-22, -122],
      [10, -123], [40, -114], [59, -92], [69, -58], [65, -20],
      [42, -4], [0, -1], [-42, -5],
    ]);
    ctx.fill();
    outline(ctx, 3.2);

    // Belly light, keeping the volume reading round rather than flat. From
    // behind there is no belly, so the light goes across the shoulders.
    if (back) {
      const sh = ctx.createRadialGradient(-10, -100, 4, -10, -100, 60);
      sh.addColorStop(0, 'rgba(240,214,182,0.35)');
      sh.addColorStop(1, 'rgba(240,214,182,0)');
      ctx.fillStyle = sh;
      ellipse(ctx, -10, -100, 50, 30);
      ctx.fill();
    }
    const belly = ctx.createRadialGradient(-6, -44, 4, -6, -44, 62);
    belly.addColorStop(0, 'rgba(240,214,182,0.55)');
    belly.addColorStop(1, 'rgba(240,214,182,0)');
    if (!back) {
      ctx.fillStyle = belly;
      ellipse(ctx, -6, -44, 46, 40);
      ctx.fill();
    }

    // Rim shadow down the right, away from the key light.
    ctx.save();
    blob(ctx, [
      [-64, -16], [-71, -50], [-66, -84], [-49, -110], [-22, -122],
      [10, -123], [40, -114], [59, -92], [69, -58], [65, -20],
      [42, -4], [0, -1], [-42, -5],
    ]);
    ctx.clip();
    ctx.fillStyle = 'rgba(122,80,44,0.28)';
    ellipse(ctx, 96, -62, 52, 74);
    ctx.fill();
    ctx.restore();
  }

  /* ── the kit ────────────────────────────────────────────────────────────── */

  /**
   * Everything the kit layers need this frame: the kit's slots, its colours,
   * and the base rig's shapes, so kits.js never reaches into this file.
   */
  _outfit(colourOverride, back, p) {
    const kit = KITS[this.kit] ?? KITS[DEFAULT_KIT];
    const colour = colourOverride ?? mainColour(this.kit);
    const red = colour === PALETTE.kitRed;
    return {
      kit,
      colour,
      light: red ? PALETTE.kitRedHi : colour,
      dark: red ? PALETTE.kitRedDark : 'rgba(0,0,0,0.28)',
      darkBand: red ? PALETTE.kitRedDark : colour,
      accent: kit.accent,
      stripe: CAPY_ACCENT_STRIPE,
      prop: kit.prop,
      goggles: this.gogglesT > 0,
      back,
      p,
      rig: RIG,
    };
  }

  _drawKitLayer(ctx, slot, outfit) {
    const draw = garment(slot, outfit.kit[slot]);
    if (!draw) return;
    ctx.save();
    draw(ctx, outfit);
    ctx.restore();
  }

  /** The quick change's squash: down, the swap, and a springy pop back up. */
  _squashForChange(p) {
    const c = this.kitChange;
    if (!c) return;
    const u = c.t / KIT_CHANGE_TIME;
    const k = u < KIT_SWAP_AT / KIT_CHANGE_TIME
      ? Math.sin((u / (KIT_SWAP_AT / KIT_CHANGE_TIME)) * Math.PI / 2)
      : Math.cos(((u - KIT_SWAP_AT / KIT_CHANGE_TIME) / (1 - KIT_SWAP_AT / KIT_CHANGE_TIME)) * Math.PI * 1.5);
    p.squash *= 1 + 0.2 * k;
    p.stretch *= 1 - 0.18 * k;
  }

  /** A puff of cloud and sparkles around him as the kit swaps. */
  _drawChangePuff(ctx) {
    const c = this.kitChange;
    const u = (c.t - KIT_SWAP_AT * 0.6) / (KIT_CHANGE_TIME - KIT_SWAP_AT * 0.6);
    if (u <= 0 || u >= 1) return;
    ctx.save();
    ctx.globalAlpha = 1 - u;
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2 + 0.3;
      const r = 40 + 55 * u;
      ctx.fillStyle = i % 3 ? 'rgba(255,255,255,0.9)' : 'rgba(255,236,190,0.95)';
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r * 1.1, -90 + Math.sin(a) * r * 0.85, 16 * (1 - u * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    const effect = this._look?.effect;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + u * 2;
      effect?.draw(ctx, { x: Math.cos(a) * (60 + 50 * u), y: -100 + Math.sin(a) * (50 + 40 * u), s: 7 * (1 - u * 0.5), i });
    }
    ctx.restore();
  }

  /**
   * One arm. `side` is -1 for the far arm (drawn behind the body) and 1 for
   * the near one. Angle 0 hangs straight down, positive swings it up.
   */
  _drawArm(ctx, p, side, far) {
    const ang = far ? p.armBack : p.armFront;
    // Rooted inside the body outline, so a raised arm swings out of the
    // shoulder rather than floating alongside it.
    const sx = side * 56;
    const sy = -92;
    const len = 38;
    const ex = sx + side * Math.sin(ang) * len;
    const ey = sy + Math.cos(ang) * len;

    ctx.save();
    ctx.lineCap = 'round';
    // Fur sleeve.
    ctx.strokeStyle = far ? PALETTE.furShade : PALETTE.furMid;
    ctx.lineWidth = 27;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    if (!far) {
      ctx.strokeStyle = 'rgba(240,214,182,0.32)';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(sx - 5, sy + 2);
      ctx.lineTo(ex - 5, ey - 2);
      ctx.stroke();
    }
    // Paw.
    ctx.fillStyle = far ? PALETTE.furShade : furFill(ctx, ex, ey, 16);
    ellipse(ctx, ex, ey, 15, 13, side * ang * 0.4);
    ctx.fill();
    ctx.restore();
    return { sx, sy, ex, ey, ang };
  }

  _drawHead(ctx, p, outfit, back) {
    ctx.save();
    ctx.translate(p.headDx, -126 + p.headDy);
    ctx.rotate(p.headTilt);
    ctx.scale(0.95, 0.95);

    // Head: broad and blocky-soft, heavier along the jaw. Same spline
    // language as the body, so nothing in the rig has a straight edge.
    ctx.fillStyle = furFill(ctx, -16, -14, 62);
    blob(ctx, HEAD);
    ctx.fill();
    outline(ctx, 3.2);

    // Cheek shadow on the side away from the key light.
    ctx.save();
    blob(ctx, HEAD);
    ctx.clip();
    ctx.fillStyle = 'rgba(122,80,44,0.22)';
    ellipse(ctx, 76, 4, 40, 52);
    ctx.fill();
    ctx.restore();

    if (back) this._drawBackOfHead(ctx);
    else {
      this._drawFace(ctx, p);
      // Wardrobe: glasses, masks and patches, over the face.
      if (this._look?.face) this._look.face.draw(ctx, this._wear);
    }

    // The wardrobe's hat replaces the kit's headwear; without one, the kit's.
    if (this._look?.hat) this._look.hat.draw(ctx, this._wear);
    else this._drawKitLayer(ctx, 'headwear', outfit);
    // Ears last, so no headwear ever hides them (CAPY_IDENTITY.md §3).
    this._drawEars(ctx, p);
    ctx.restore();
  }

  /**
   * Small rounded ears set high on the crown, the inner-ear cup showing.
   * Only what pokes out past the head outline is drawn — which is all that
   * would show behind the head anyway — and they're drawn last, over any
   * headwear, so every hat has ear cut-outs.
   */
  _drawEars(ctx, p) {
    ctx.save();
    const outside = new Path2D();
    outside.rect(-200, -200, 400, 400);
    outside.addPath(blobPath(HEAD));
    ctx.clip(outside, 'evenodd');
    for (const side of [-1, 1]) {
      ctx.save();
      const lift = p.earLift + (Math.sign(p.earFlick) === side ? Math.abs(p.earFlick) : 0);
      ctx.translate(side * EAR_X, EAR_Y - lift * 6);
      ctx.rotate(side * (EAR_TILT + lift * 0.45));
      ctx.scale(EAR_SCALE, EAR_SCALE);
      ctx.fillStyle = PALETTE.furMid;
      blob(ctx, [[-16, -6], [-11, -17], [2, -21], [15, -13], [18, 2], [8, 14], [-8, 12]]);
      ctx.fill();
      outline(ctx, 3 / EAR_SCALE);
      ctx.fillStyle = PALETTE.innerEar;
      ellipse(ctx, side * 1, 0, 9.5, 8, side * 0.3);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,236,214,0.30)';
      ellipse(ctx, side * -2, -4, 5.5, 4, side * 0.5);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  /** From behind: a soft crown falloff and the nape, no face. */
  _drawBackOfHead(ctx) {
    ctx.save();
    blob(ctx, HEAD);
    ctx.clip();
    const g = ctx.createRadialGradient(-10, -26, 8, 0, 6, 74);
    g.addColorStop(0, 'rgba(240,214,182,0.30)');
    g.addColorStop(0.55, 'rgba(240,214,182,0)');
    g.addColorStop(1, 'rgba(122,80,44,0.26)');
    ctx.fillStyle = g;
    ctx.fillRect(-60, -56, 120, 110);
    ctx.restore();
    // A fur whorl on the crown and a tuft at the nape, so the back of the
    // head isn't a blank plate. (It used to be a single curved crease low on
    // the head, which read as a smile — a mouth on the back of his head.)
    ctx.strokeStyle = 'rgba(122,80,44,0.34)';
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    for (const [x0, y0, x1, y1] of [[-6, -30, -14, -16], [2, -32, 2, -17], [10, -30, 16, -17]]) {
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }
    for (const dx of [-8, 0, 8]) {
      ctx.beginPath();
      ctx.moveTo(dx, 30);
      ctx.lineTo(dx + (dx ? Math.sign(dx) * 3 : 0), 40);
      ctx.stroke();
    }
  }

  _drawFace(ctx, p) {
    // Muzzle: the big soft slab a capybara is mostly made of.
    ctx.fillStyle = PALETTE.furLight;
    blob(ctx, MUZZLE);
    ctx.fill();
    ctx.strokeStyle = 'rgba(122,80,44,0.30)';
    ctx.lineWidth = 2.4;
    ctx.stroke();
    const mg = ctx.createLinearGradient(0, -12, 0, 46);
    mg.addColorStop(0, 'rgba(255,242,224,0.55)');
    mg.addColorStop(1, 'rgba(169,124,79,0.26)');
    ctx.fillStyle = mg;
    blob(ctx, MUZZLE);
    ctx.fill();

    // Nose: a wide, flat pad at the top of the muzzle, with two nostril
    // slits, and a line down the long snout to the mouth.
    ctx.fillStyle = PALETTE.furDark;
    blob(ctx, [[-16, -4], [0, -8], [16, -4], [16, 4], [0, 8], [-16, 4]]);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.24)';
    ellipse(ctx, -5, -4, 5, 1.8, -0.15);
    ctx.fill();
    ctx.strokeStyle = '#2a170c';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 5, -1);
      ctx.quadraticCurveTo(side * 9, -2, side * 11, 1);
      ctx.stroke();
    }
    ctx.strokeStyle = PALETTE.furLine;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(0, 7);
    ctx.lineTo(0, MOUTH_Y - 5);
    ctx.stroke();

    this._drawMouth(ctx, p, MOUTH_Y);
    this._drawEyes(ctx, p, EYE_Y);

    // Blush, low and wide, out on the cheeks.
    ctx.fillStyle = PALETTE.blush;
    ctx.globalAlpha = p.blush;
    for (const side of [-1, 1]) {
      ellipse(ctx, side * 41, -2, 11, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  _drawMouth(ctx, p, y) {
    ctx.strokeStyle = PALETTE.furLine;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    if (p.mouth === 'open') {
      ctx.fillStyle = '#7a3a3a';
      blob(ctx, [[-13, y - 4], [0, y - 6], [13, y - 4], [10, y + 10], [0, y + 14], [-10, y + 10]]);
      ctx.fill();
      ctx.fillStyle = '#e88a86';
      ellipse(ctx, 0, y + 9, 7, 4.5);
      ctx.fill();
      return;
    }
    if (p.mouth === 'o' || p.mouth === 'yawn') {
      const big = p.mouth === 'yawn' ? 1.45 : 1;
      ctx.fillStyle = '#6e3333';
      ellipse(ctx, 0, y + 5, 7 * big, 8.5 * big);
      ctx.fill();
      ctx.fillStyle = '#e88a86';
      ellipse(ctx, 0, y + 9 * big, 4.5 * big, 2.8 * big);
      ctx.fill();
      return;
    }
    if (p.mouth === 'grit') {
      ctx.fillStyle = PALETTE.furDark;
      ctx.beginPath();
      ctx.roundRect(-13, y - 3, 26, 11, 4);
      ctx.fill();
      ctx.fillStyle = PALETTE.kitTrim;
      ctx.fillRect(-11, y - 2, 22, 4);
      return;
    }
    // The capybara "w": two little curves hanging off the base of the nose.
    const drop = p.mouth === 'frown' ? -6 : 6;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, y - 5);
      ctx.quadraticCurveTo(side * 7, y + drop * 0.7, side * 13, y + (p.mouth === 'flat' ? 0 : drop) * 0.4);
      ctx.stroke();
    }
  }

  _drawEyes(ctx, p, ey) {
    for (const side of [-1, 1]) {
      const x = side * EYE_X;
      this._drawBrow(ctx, p, x, ey, side);

      if (p.eye === 'happy') {
        // Upturned arcs — the classic ^ ^.
        ctx.strokeStyle = PALETTE.furDark;
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(x, ey + 3, 6.8, Math.PI * 1.14, Math.PI * 1.86);
        ctx.stroke();
        continue;
      }

      const open = p.eye === 'squint' ? 0.42 : p.eye === 'wide' ? 1.25 : 1;
      const ry = 6.8 * open * p.eyeOpen;
      if (ry < 0.9) {
        // Blinking: a closed lash line, not a vanished eye.
        ctx.strokeStyle = PALETTE.furDark;
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x - 6, ey);
        ctx.lineTo(x + 6, ey);
        ctx.stroke();
        continue;
      }

      // The eye, shifted a touch toward wherever he's looking, with a warm
      // brown iris ring so it reads as an eye and not a hole.
      const lx = x + p.lookX, ly = ey + p.lookY * open;
      ctx.fillStyle = PALETTE.furDark;
      ellipse(ctx, lx, ly, 6, ry);
      ctx.fill();
      ctx.strokeStyle = 'rgba(138,92,51,0.55)';
      ctx.lineWidth = 1.4;
      ellipse(ctx, lx, ly, 4.2, ry * 0.72);
      ctx.stroke();
      // Two catchlights: the big one sells "alive", the small one "wet".
      ctx.fillStyle = PALETTE.eyeWhite;
      ellipse(ctx, lx - 2, ly - ry * 0.36, 2.4, 2.4 * Math.min(1, open));
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ellipse(ctx, lx + 2.2, ly + ry * 0.34, 1.2, 1.2);
      ctx.fill();
    }
  }

  /**
   * Brows carry most of the expression at small sizes, so they are always
   * there (softly, when neutral) and move with the mood.
   */
  _drawBrow(ctx, p, x, ey, side) {
    if (p.brow === 'none') return;
    ctx.save();
    ctx.strokeStyle = PALETTE.furLine;
    ctx.lineCap = 'round';
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    switch (p.brow) {
      case 'sad':
        // Inner ends up: worry.
        ctx.moveTo(x - side * 9, ey - 9);
        ctx.lineTo(x + side * 8, ey - 13);
        break;
      case 'focus':
        // Inner ends down: determination.
        ctx.moveTo(x - side * 9, ey - 13);
        ctx.lineTo(x + side * 8, ey - 10);
        break;
      case 'up':
        ctx.moveTo(x - 9, ey - 13);
        ctx.quadraticCurveTo(x, ey - 19, x + 9, ey - 13);
        break;
      case 'high':
        // Shot right up the forehead: disbelief.
        ctx.moveTo(x - 9, ey - 18);
        ctx.quadraticCurveTo(x, ey - 25, x + 9, ey - 18);
        break;
      default:
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 2.6;
        ctx.moveTo(x - 8, ey - 12);
        ctx.quadraticCurveTo(x, ey - 15, x + 8, ey - 12);
    }
    ctx.stroke();
    ctx.restore();
  }

  /** Gold rays turning slowly behind him, fading in and out. */
  _drawGlow(ctx, scale) {
    // Snaps in over a quarter second, lingers, fades over the last half.
    const a = Math.min(1, (this.glowDur - this.glowT) / 0.25, this.glowT / 0.5);
    ctx.save();
    ctx.translate(0, -100 * scale);
    ctx.globalAlpha = 0.55 * a;
    const r = 150 * scale;
    const g = ctx.createRadialGradient(0, 0, 10 * scale, 0, 0, r);
    g.addColorStop(0, 'rgba(255,217,61,0.9)');
    g.addColorStop(1, 'rgba(255,217,61,0)');
    ctx.fillStyle = g;
    ctx.rotate(this.t * 0.6);
    for (let i = 0; i < 12; i++) {
      ctx.rotate(Math.PI / 6);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(r, -r * 0.13);
      ctx.lineTo(r, r * 0.13);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  /* ── props ──────────────────────────────────────────────────────────────── */

  _drawProp(ctx, p, override) {
    const raised = this.state === 'shoot' || this.state === 'dunk';
    const px = 74 - p.propLift * 0.2 + (raised ? -10 : 0);
    const py = -58 - p.propLift - (raised ? 58 : 0);
    const kind = override ?? PROPS[this.sport];
    if (!kind) return;

    ctx.save();
    ctx.translate(px, py);
    if (kind === 'bowlingBall') this._drawBowlingBall(ctx);
    else if (kind === 'football') this._drawFootball(ctx);
    else if (kind === 'basketball') this._drawBasketball(ctx);
    else this._drawGear(ctx, kind);
    ctx.restore();
  }

  /**
   * Held equipment for sports 4–10: things with a handle rather than balls.
   * Drawn from the paw outward, so they all hang off the same grip point.
   */
  _drawGear(ctx, kind) {
    // A twirl on a streak: the racquet spins in the paw while he celebrates.
    const spin = kind === 'racquet' && (this.state === 'hype' || this.state === 'victory') ? this.t * 14 : 0;
    ctx.rotate(spin);
    ctx.lineCap = 'round';
    if (kind === 'racquet') {
      ctx.strokeStyle = '#2c3038';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -22); ctx.stroke();
      ctx.fillStyle = 'rgba(240,240,230,0.35)';
      ctx.strokeStyle = '#2b5f9e';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(0, -48, 20, 27, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath(); ctx.moveTo(i * 7, -72); ctx.lineTo(i * 7, -24); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-18, -48 + i * 8); ctx.lineTo(18, -48 + i * 8); ctx.stroke();
      }
    } else if (kind === 'putter') {
      ctx.strokeStyle = '#9aa3b2';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(4, 62); ctx.stroke();
      ctx.fillStyle = '#2c3038';
      ctx.fillRect(-4, -26, 9, 18);
      ctx.fillStyle = '#c9ced6';
      ctx.beginPath(); ctx.roundRect(-10, 58, 30, 10, 4); ctx.fill();
    } else if (kind === 'stick') {
      ctx.strokeStyle = '#a9713e';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(8, 60); ctx.stroke();
      ctx.strokeStyle = '#2c3038';
      ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(8, 60); ctx.lineTo(34, 66); ctx.stroke();
    } else if (kind === 'bow') {
      ctx.strokeStyle = '#8a5a34';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(-24, 0, 52, -1.05, 1.05); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 1.5;
      const pull = this.state === 'prepare' ? -26 : 0;
      ctx.beginPath();
      ctx.moveTo(-24 + Math.cos(-1.05) * 52, Math.sin(-1.05) * 52);
